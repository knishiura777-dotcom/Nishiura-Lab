<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆笑！九九お笑い道場 / Funny Multiplication Dojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #fefce8; /* yellow-50 */
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-wiggle { animation: wiggle 0.5s infinite ease-in-out; }
        .animate-spin-slow { animation: spin-slow 4s linear infinite; }
        .animate-bounce-short { animation: bounce-short 0.3s infinite ease-in-out; }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-15%) rotate(10deg); }
            50% { transform: translateY(0) rotate(-10deg); }
        }
        .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }
        .btn-pushable {
            transition: all 0.1s;
            border-bottom-width: 8px;
        }
        .btn-pushable:active {
            transform: translateY(4px);
            border-bottom-width: 4px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div id="app" class="w-full max-w-2xl flex flex-col items-center">
        <!-- Header -->
        <header class="w-full flex justify-between items-center mb-6">
            <h1 id="app-title" class="text-xl md:text-3xl font-black text-purple-600 flex items-center gap-2 transform -rotate-2">
                <i data-lucide="laugh" class="text-yellow-500 animate-bounce"></i>
                九九お笑い道場
            </h1>
            <div class="flex gap-2">
                <button id="lang-toggle" class="px-4 py-2 bg-white rounded-full shadow-lg font-bold text-purple-600 hover:bg-purple-50 transition-colors border-2 border-purple-100">
                    EN / JP
                </button>
                <button id="home-btn" class="hidden p-2 bg-white rounded-full shadow-lg hover:rotate-12 transition-transform border-2 border-purple-100">
                    <i data-lucide="home" class="text-purple-600"></i>
                </button>
            </div>
        </header>

        <!-- Main Card -->
        <main id="main-card" class="w-full bg-white rounded-[40px] shadow-2xl p-6 md:p-10 min-h-[550px] flex flex-col items-center relative border-8 border-purple-100 overflow-hidden">
            <!-- Content will be injected here by JavaScript -->
        </main>

        <footer id="app-footer" class="mt-8 text-purple-400 font-bold flex items-center gap-2">
            <i data-lucide="camera" class="w-4 h-4"></i> 変な写真をコンプリートしよう！
        </footer>
    </div>

    <script>
        // --- Translations ---
        const I18N = {
            ja: {
                title: "九九お笑い道場",
                footer: "変な写真をコンプリートしよう！",
                menuPrompt: "どのネタ（段）で遊ぶ？",
                levelLabel: "ネタNo.",
                miniGame: "ミニゲーム",
                challenge: "ムチャ振り",
                readPrompt: "読んでみて！",
                next: "つぎ！",
                prev: "まえ",
                goPlay: "遊びに行くぜ！",
                stage: "ステージ",
                successTitle: "お笑い大成功！",
                starsLabel: "あつめた星",
                rewardLabel: "🎉 激レア・ヘンテコ写真 ゲット！",
                playAgain: "もう一回！",
                back: "戻る",
                readings: {
                    1: ['いんいちが', 'いんにが', 'いんさんが', 'いんしが', 'いんごが', 'いんろくが', 'いんしちが', 'いんはちが', 'いんくが'],
                    2: ['にいちが', 'ににんが', 'にさんが', 'にしが', 'にご', 'にろく', 'にしち', 'にはち', 'にく'],
                    3: ['さんいちが', 'さんにが', 'さざんが', 'さんし', 'さんご', 'さぶろく', 'さんしち', 'さんぱ', 'さんく'],
                    4: ['しいちが', 'しにが', 'しさんが', 'しし', 'しご', 'しろく', 'ししち', 'しは', 'しく'],
                    5: ['ごいちが', 'ごに', 'ごさん', 'ごし', 'ごご', 'ごろく', 'ごしち', 'ごは', 'ごく'],
                    6: ['ろくいちが', 'ろくに', 'ろくさん', 'ろくし', 'ろくご', 'ろくろく', 'ろくしち', 'ろくは', 'ろっく'],
                    7: ['しちいちが', 'しちに', 'しちさん', 'しちし', 'しちご', 'しちろく', 'しちしち', 'しちは', 'しちく'],
                    8: ['はちいちが', 'はちに', 'はちさん', 'はちし', 'はちご', 'はちろく', 'はちしち', 'はっぱ', 'はっく'],
                    9: ['くいちが', 'くに', 'くさん', 'くし', 'くご', 'くろく', 'くしち', 'くは', 'くく']
                },
                styles: [
                    'ロボットみたいに', '忍者っぽくささやいて', 'オペラ歌手のように', 
                    '怒ってる人みたいに', '赤ちゃん言葉で', 'ヒップホップのリズムで', 
                    'カラスの鳴き声まじりで', '寝起きでボーッとしながら', 'ものすごく格好つけて'
                ],
                feedbacks: {
                    correct: ["ギガ正解！", "脳が震える〜！", "天才すぎて草", "全米が泣いた！", "神の領域！"],
                    wrong: ["ズコーッ！", "おっとっと！", "時空が歪んだ！", "惜しすぎて涙が出るぜ"]
                },
                rewards: [
                    { name: "二足歩行するイカ", emoji: "🦑", desc: "たまにコンビニで見かけるタイプ" },
                    { name: "リーゼントの犬", emoji: "🐕", desc: "夜の公園をパトロールしているよ" },
                    { name: "筋肉ムキムキのウサギ", emoji: "🐰", desc: "にんじんよりプロテインが好き" },
                    { name: "サングラスをかけた大仏", emoji: "🗿", desc: "実はダンスが得意" },
                    { name: "空飛ぶおにぎり", emoji: "🍙", desc: "中身は内緒だよ" }
                ]
            },
            en: {
                title: "Funny Multi-Dojo",
                footer: "Collect all the weird photos!",
                menuPrompt: "Pick a level to start the show!",
                levelLabel: "Level",
                miniGame: "Mini Game",
                challenge: "Random Challenge",
                readPrompt: "Read it out loud!",
                next: "Next!",
                prev: "Back",
                goPlay: "Let's Play!",
                stage: "Stage",
                successTitle: "Comedy Gold!",
                starsLabel: "Stars Collected",
                rewardLabel: "🎉 Rare Funny Photo Unlocked!",
                playAgain: "Try Again!",
                back: "Menu",
                readings: {
                    1: Array(9).fill(""), // English doesn't use "readings" like JP, so we handle it in render
                    2: Array(9).fill(""), 3: Array(9).fill(""), 4: Array(9).fill(""), 5: Array(9).fill(""),
                    6: Array(9).fill(""), 7: Array(9).fill(""), 8: Array(9).fill(""), 9: Array(9).fill("")
                },
                styles: [
                    'Like a Robot', 'Whispering like a Ninja', 'Like an Opera Singer', 
                    'Like you are really ANGRY', 'In Baby Talk', 'With a Hip-hop Beat', 
                    'Like a Crow cawing', 'Like you just woke up', 'Like a Cool Movie Star'
                ],
                feedbacks: {
                    correct: ["Mega Correct!", "Brain Overload!", "Pure Genius!", "Hollywood is Crying!", "God Tier!"],
                    wrong: ["D'oh!", "Oopsie!", "Glitch in Matrix!", "So close it hurts!"]
                },
                rewards: [
                    { name: "Walking Squid", emoji: "🦑", desc: "Often seen at convenience stores" },
                    { name: "Pompadour Dog", emoji: "🐕", desc: "Patrolling the park at night" },
                    { name: "Buff Rabbit", emoji: "🐰", desc: "Loves protein more than carrots" },
                    { name: "Buddha with Shades", emoji: "🗿", desc: "Actually a great dancer" },
                    { name: "Flying Rice Ball", emoji: "🍙", desc: "The filling is a secret" }
                ]
            }
        };

        // --- State ---
        let state = {
            view: 'menu',
            lang: 'ja',
            currentDan: 2,
            currentIndex: 1,
            stars: 0,
            gameQuestion: null,
            options: [],
            feedback: null,
            reward: null
        };

        const mainCard = document.getElementById('main-card');
        const homeBtn = document.getElementById('home-btn');
        const langToggle = document.getElementById('lang-toggle');
        const appTitle = document.getElementById('app-title');
        const appFooter = document.getElementById('app-footer');

        // --- Core Functions ---
        function setView(newView) {
            state.view = newView;
            if (newView === 'menu') {
                homeBtn.classList.add('hidden');
            } else {
                homeBtn.classList.remove('hidden');
            }
            render();
        }

        function toggleLanguage() {
            state.lang = state.lang === 'ja' ? 'en' : 'ja';
            render();
        }

        function startStudy(dan) {
            state.currentDan = dan;
            state.currentIndex = 1;
            setView('study');
        }

        function generateQuestion(dan) {
            const num2 = Math.floor(Math.random() * 9) + 1;
            const correct = dan * num2;
            let choices = new Set([correct]);
            while (choices.size < 4) {
                const offset = Math.floor(Math.random() * 5) - 2;
                const wrong = Math.max(1, correct + (offset * dan) || Math.floor(Math.random() * 81) + 1);
                choices.add(wrong);
            }
            state.gameQuestion = { dan, num2, correct };
            state.options = Array.from(choices).sort((a, b) => a - b);
            state.feedback = null;
        }

        function startGame(dan) {
            state.currentDan = dan;
            state.stars = 0;
            state.currentIndex = 1;
            generateQuestion(dan);
            setView('game');
        }

        function handleAnswer(ans) {
            if (state.feedback) return;
            const t = I18N[state.lang];
            if (ans === state.gameQuestion.correct) {
                state.feedback = { type: 'correct', text: t.feedbacks.correct[Math.floor(Math.random() * t.feedbacks.correct.length)] };
                state.stars++;
            } else {
                state.feedback = { type: 'wrong', text: t.feedbacks.wrong[Math.floor(Math.random() * t.feedbacks.wrong.length)] };
            }
            render();

            setTimeout(() => {
                if (state.currentIndex < 5) {
                    state.currentIndex++;
                    generateQuestion(state.currentDan);
                    render();
                } else {
                    state.reward = t.rewards[Math.floor(Math.random() * t.rewards.length)];
                    setView('result');
                }
            }, 1500);
        }

        // --- Render Helpers ---
        function renderVisualGrid(rows, cols) {
            let gridHtml = `<div class="grid gap-1.5 p-3 bg-white rounded-2xl shadow-inner inline-grid border-4 border-yellow-200">`;
            for (let r = 0; r < 9; r++) {
                gridHtml += `<div class="flex gap-1.5">`;
                for (let c = 0; c < 9; c++) {
                    const isActive = r < rows && c < cols;
                    gridHtml += `
                        <div class="w-6 h-6 md:w-7 md:h-7 rounded-lg transition-all duration-300 flex items-center justify-center text-[10px] 
                            ${isActive ? 'bg-yellow-400 shadow-sm rotate-12 scale-100' : 'bg-gray-100 scale-75 opacity-20'}">
                            ${isActive ? '🍭' : ''}
                        </div>`;
                }
                gridHtml += `</div>`;
            }
            gridHtml += `</div>`;
            return gridHtml;
        }

        function render() {
            const t = I18N[state.lang];
            
            // Update UI Texts
            appTitle.innerHTML = `<i data-lucide="laugh" class="text-yellow-500 animate-bounce"></i> ${t.title}`;
            appFooter.innerHTML = `<i data-lucide="camera" class="w-4 h-4"></i> ${t.footer}`;
            langToggle.innerText = state.lang === 'ja' ? 'EN / 日本語' : '日本語 / EN';

            mainCard.innerHTML = '';
            
            if (state.view === 'menu') {
                let menuHtml = `
                    <div class="w-full text-center">
                        <div class="mb-6 animate-pulse text-gray-500 font-bold italic text-lg">${t.menuPrompt}</div>
                        <div class="grid grid-cols-3 gap-4">`;
                [1, 2, 3, 4, 5, 6, 7, 8, 9].forEach(dan => {
                    menuHtml += `
                        <div class="flex flex-col gap-2">
                            <button onclick="startStudy(${dan})" class="h-24 bg-gradient-to-b from-purple-400 to-purple-600 text-white rounded-3xl text-3xl font-black shadow-[0_8px_0_rgb(126,34,206)] transform active:translate-y-1 active:shadow-none transition-all flex flex-col items-center justify-center">
                                <span class="text-[10px] bg-white text-purple-600 px-2 rounded-full mb-1">${t.levelLabel}</span>
                                ${dan}
                            </button>
                            <button onclick="startGame(${dan})" class="h-10 bg-pink-500 text-white rounded-full text-xs font-bold shadow-md hover:scale-105 transition-transform">
                                ${t.miniGame}
                            </button>
                        </div>`;
                });
                menuHtml += `</div></div>`;
                mainCard.innerHTML = menuHtml;
            }

            else if (state.view === 'study') {
                const styleStr = t.styles[state.currentDan - 1];
                const readingStr = state.lang === 'ja' 
                    ? t.readings[state.currentDan][state.currentIndex - 1] 
                    : `${state.currentDan} times ${state.currentIndex} is `;

                mainCard.innerHTML = `
                    <div class="flex flex-col items-center w-full space-y-6">
                        <div class="bg-purple-50 p-4 rounded-2xl border-2 border-purple-100 text-purple-700 font-bold animate-bounce text-sm">
                            ${t.challenge}: 「${styleStr}」${t.readPrompt}
                        </div>
                        <div class="text-center space-y-4">
                            <div class="flex items-center justify-center gap-4 text-5xl md:text-8xl font-black text-gray-800 drop-shadow-lg">
                                <span>${state.currentDan}</span>
                                <span class="text-pink-500">×</span>
                                <span>${state.currentIndex}</span>
                                <span class="text-gray-300">=</span>
                                <span class="text-purple-600">${state.currentDan * state.currentIndex}</span>
                            </div>
                            <div class="text-2xl md:text-3xl bg-yellow-300 text-purple-900 font-black rounded-2xl px-6 md:px-8 py-4 rotate-1 shadow-lg border-4 border-white inline-block">
                                ${readingStr}
                                <span class="text-red-600 ml-1">${state.currentDan * state.currentIndex}</span>!
                            </div>
                        </div>

                        ${renderVisualGrid(state.currentDan, state.currentIndex)}

                        <div class="flex justify-between w-full pt-4">
                            <button onclick="state.currentIndex--; render()" class="px-6 py-4 rounded-full font-bold transition-all ${state.currentIndex === 1 ? 'invisible' : 'bg-gray-100 hover:bg-gray-200'}">
                                ${t.prev}
                            </button>
                            ${state.currentIndex < 9 ? `
                                <button onclick="state.currentIndex++; render()" class="px-10 py-4 bg-purple-500 text-white rounded-full text-xl font-black shadow-xl hover:scale-105 active:scale-95 transition-all border-b-4 border-purple-700">
                                    ${t.next}
                                </button>
                            ` : `
                                <button onclick="startGame(${state.currentDan})" class="px-10 py-4 bg-pink-500 text-white rounded-full text-xl font-black shadow-xl animate-pulse border-b-4 border-pink-700">
                                    ${t.goPlay}
                                </button>
                            `}
                        </div>
                    </div>`;
            }

            else if (state.view === 'game') {
                mainCard.innerHTML = `
                    <div class="flex flex-col items-center w-full space-y-8">
                        <div class="flex items-center gap-2 text-purple-600 font-black">
                            <i data-lucide="ghost" class="animate-wiggle"></i> ${t.stage} ${state.currentIndex} / 5
                        </div>

                        <div class="text-center">
                            <div class="text-6xl md:text-8xl font-black text-gray-800 p-8 rounded-[50px] bg-yellow-50 border-8 border-dashed border-yellow-200 relative inline-block">
                                ${state.gameQuestion.dan} × ${state.gameQuestion.num2} = <span class="text-pink-500">?</span>
                                <div class="absolute -top-4 -right-4 bg-white p-2 rounded-full border-2 border-yellow-400 animate-spin-slow">❓</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-6 w-full max-w-md">
                            ${state.options.map((opt) => `
                                <button onclick="handleAnswer(${opt})" ${state.feedback ? 'disabled' : ''} 
                                    class="h-24 text-4xl font-black rounded-[30px] shadow-xl transition-all transform active:scale-90 border-b-8
                                    ${state.feedback?.type === 'correct' && opt === state.gameQuestion.correct ? 'bg-green-400 text-white border-green-600 scale-110' :
                                      state.feedback?.type === 'wrong' && opt === state.gameQuestion.correct ? 'bg-green-400 text-white border-green-600' :
                                      state.feedback?.type === 'wrong' && opt !== state.gameQuestion.correct ? 'bg-gray-200 text-gray-400 border-gray-300 grayscale' :
                                      'bg-white text-purple-800 hover:bg-purple-50 border-purple-200'}">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>

                        ${state.feedback ? `
                            <div class="text-4xl font-black animate-bounce-short text-center ${state.feedback.type === 'correct' ? 'text-pink-600' : 'text-gray-500'}">
                                ${state.feedback.text}
                            </div>
                        ` : ''}
                    </div>`;
            }

            else if (state.view === 'result') {
                mainCard.innerHTML = `
                    <div class="flex flex-col items-center w-full space-y-6 text-center">
                        <i data-lucide="trophy" class="w-20 h-20 text-yellow-400 animate-bounce"></i>
                        <h2 class="text-3xl font-black text-purple-600 italic">${t.successTitle}</h2>
                        
                        <div class="bg-gradient-to-r from-pink-50 to-purple-50 p-6 rounded-[40px] border-4 border-white shadow-xl w-full">
                            <div class="flex justify-center gap-2 mb-4">
                                ${[0, 1, 2, 3, 4].map(i => `
                                    <i data-lucide="star" class="w-8 h-8 ${i < state.stars ? 'text-yellow-400 fill-current' : 'text-gray-200'}"></i>
                                `).join('')}
                            </div>
                            
                            <div class="bg-white p-6 rounded-3xl shadow-inner border-2 border-dashed border-purple-200">
                                <p class="text-gray-400 text-xs font-bold mb-2">${t.rewardLabel}</p>
                                <div class="text-8xl mb-2 hover:scale-125 transition-transform cursor-pointer">${state.reward.emoji}</div>
                                <h3 class="text-2xl font-black text-purple-700">${state.reward.name}</h3>
                                <p class="text-sm text-gray-500">${state.reward.desc}</p>
                            </div>
                        </div>
                        
                        <div class="flex gap-4 w-full pt-4">
                            <button onclick="startGame(${state.currentDan})" class="flex-1 p-5 bg-pink-500 text-white rounded-3xl font-black shadow-lg border-b-4 border-pink-700 active:translate-y-1">${t.playAgain}</button>
                            <button onclick="setView('menu')" class="flex-1 p-5 bg-purple-500 text-white rounded-3xl font-black shadow-lg border-b-4 border-purple-700 active:translate-y-1">${t.back}</button>
                        </div>
                    </div>`;
            }

            lucide.createIcons();
        }

        // --- Event Listeners ---
        homeBtn.addEventListener('click', () => setView('menu'));
        langToggle.addEventListener('click', toggleLanguage);

        // Init
        render();
    </script>
</body>
</html>
