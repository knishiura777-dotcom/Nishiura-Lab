                        clearInterval(checkData);

                    const titleText = (exp.title[lang] || "").toLowerCase();
                    const descText = (exp.description[lang] || "").toLowerCase();
                    const titleMatch = titleText.includes(searchQuery.toLowerCase());
                    const descriptionMatch = descText.includes(searchQuery.toLowerCase());
                    return matchesCategory && (titleMatch || descriptionMatch);
                });
            }, [activeCategory, searchQuery, lang]);

            // Components (defined inside to use t)
            const LanguageSwitcher = () => (
                <div className="flex items-center gap-2 text-xs font-bold tracking-widest">
                    <button onClick={() => setLang('en')} className={`hover:text-indigo-600 transition-colors ${lang === 'en' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}>EN</button>
                    <span className="text-slate-300">|</span>
                    <button onClick={() => setLang('ja')} className={`hover:text-indigo-600 transition-colors ${lang === 'ja' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}>JP</button>
                    <span className="text-slate-300">|</span>
                    <button onClick={() => setLang('se')} className={`hover:text-indigo-600 transition-colors ${lang === 'se' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}>SE</button>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 font-sans animate-fade-in">
                    <Modal 
                        isOpen={modalOpen} 
                        onClose={() => setModalOpen(false)} 
                        message={modalMessage} 
                        title={t.modal_notice || "Notice"} 
                        btnText={t.modal_close || "Close"} 
                    />

                    <DataManualModal 
                        isOpen={manualOpen}
                        onClose={() => setManualOpen(false)}
                    />

                    <header className="glass sticky top-0 z-50 transition-all duration-300">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <a href="index.html" className="flex items-center gap-3 text-slate-500 hover:text-slate-900 transition-colors group">
                                <div className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center group-hover:border-slate-400 transition-colors bg-white"><Icon path={icons.arrowLeft} size={14} /></div>
                                <span className="text-xs font-bold tracking-widest uppercase font-serif">{t.lab_name}</span>
                            </a>
                            <div className="flex items-center gap-6">
                                <nav className="hidden md:flex gap-6 text-xs uppercase tracking-widest font-medium text-slate-500">
                                    <a href="index.html" className="hover:text-indigo-600 transition-colors">{t.nav_home}</a>
                                    <a href="#concept" className="hover:text-indigo-600 transition-colors">Concept</a>
                                    <a href="./Exp_About.html" className="hover:text-indigo-600 transition-colors">{t.nav_dev}</a>
                                    <a href="#library" className="hover:text-indigo-600 transition-colors">Library</a>
                                    <a href="index.html#contact" className="hover:text-indigo-600 transition-colors">{t.nav_contact}</a>
                                </nav>
                                <LanguageSwitcher />
                            </div>
                        </div>
                    </header>

                    <header className="relative min-h-[50vh] pt-40 pb-20 bg-white overflow-hidden flex items-center">
                        <div className="dot-grid"></div>
                        <div className="container max-w-7xl mx-auto px-6 relative z-10">
                            <div className="animate-fade-up">
                                <span className="block font-sans text-indigo-600 text-sm tracking-[0.2em] uppercase font-bold mb-4">{t.page_subtitle}</span>
                                <h1 className="text-5xl md:text-7xl font-serif text-slate-900 leading-[1.1] mb-6 tracking-tight" dangerouslySetInnerHTML={{__html: t.page_title}}></h1>
                                <p className="max-w-2xl text-slate-500 text-lg font-light leading-relaxed">{t.page_desc}</p>
                            </div>
                        </div>
                    </header>

                    <section id="concept" className="py-24 bg-white">
                        <div className="container max-w-7xl mx-auto px-6">
                            <div className="max-w-3xl animate-fade-up">
                                <span className="block text-indigo-600 text-xs font-bold tracking-widest uppercase mb-3">{t.concept_kicker}</span>
                                <h3 className="text-3xl font-serif text-slate-800 mb-6">{t.concept_head}</h3>
                                <p className="text-slate-500 leading-loose whitespace-pre-wrap font-light">{t.concept_body}</p>
                            </div>
                        </div>
                    </section>

                    <FeaturedResearch t={t} />
                    <ResearchAchievements t={t} />

                    <div id="library" className="bg-slate-50 pt-24 pb-12">
                        <div className="container max-w-7xl mx-auto px-6">
                            <div className="text-center mb-16 animate-fade-up">
                                <h2 className="text-4xl font-serif text-slate-900 mb-4">{t.libraryTitle}</h2>
                                <div className="relative max-w-md mx-auto mt-8">
                                    <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400"><Icon path={icons.search} size={18} /></div>
                                    <input type="text" placeholder={t.searchPlaceholder} value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-12 pr-6 py-4 bg-white border border-slate-200 hover:border-indigo-300 focus:border-indigo-500 focus:ring-0 rounded-full text-sm outline-none transition-all shadow-sm" />
                                </div>
                                <div className="flex flex-wrap justify-center gap-2 mt-8">
                                    <FilterTab label={t.filterAll} active={activeCategory === "All"} onClick={() => setActiveCategory("All")} />
                                    {categoriesList.map(catKey => (<FilterTab key={catKey} label={t[catKey]} active={activeCategory === catKey} onClick={() => setActiveCategory(catKey)} />))}
                                </div>
                            </div>

                            <TechCheck t={t} onOpenManual={() => setManualOpen(true)} />

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {filteredExperiments.map((exp, index) => (
                                    <ExperimentCard 
                                        key={exp.id} 
                                        data={exp} 
                                        index={index} 
                                        lang={lang} 
                                        t={t} 
                                        onAlert={handleAlert}
                                    />
                                ))}
                            </div>
                            {filteredExperiments.length === 0 && (
                                <div className="text-center py-32 animate-fade-in">
                                    <div className="inline-block p-4 rounded-full bg-white text-slate-300 mb-4 shadow-sm"><Icon path={icons.search} size={32} /></div>
                                    <p className="text-slate-500 font-medium">No experiments found.</p>
                                    <button onClick={() => {setActiveCategory("All"); setSearchQuery("");}} className="mt-4 text-indigo-600 text-sm hover:text-indigo-800 font-bold underline underline-offset-4">View all experiments</button>
                                </div>
                            )}
                        </div>
                    </div>

                    <TermsSection t={t} />

                    <footer className="bg-slate-900 text-slate-400 py-12 text-center text-xs uppercase tracking-widest">
                        <p>&copy; {new Date().getFullYear()} {t.footerRights}</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExperimentLibrary />);
    </script>
</body>
</html>
