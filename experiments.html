      if (manual) manual.addEventListener('click', () => document.getElementById('manualModal').classList.add('open'));
      document.querySelectorAll('[data-alert]').forEach(card => card.addEventListener('click', () => openNotice(card.dataset.alert)));
      document.querySelectorAll('[data-reset]').forEach(btn => btn.addEventListener('click', () => { state.activeCategory='All'; state.searchQuery=''; render(); }));
    }

    document.getElementById('noticeClose').addEventListener('click', () => closeModal('noticeModal'));
    document.getElementById('noticeModal').addEventListener('click', e => { if (e.target.id === 'noticeModal') closeModal('noticeModal'); });
    document.getElementById('manualClose').addEventListener('click', () => closeModal('manualModal'));
    document.getElementById('manualModal').addEventListener('click', e => { if (e.target.id === 'manualModal') closeModal('manualModal'); });
    state.lang = detectLang();
    render();
  </script>
</body>
</html>
