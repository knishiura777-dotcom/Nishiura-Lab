                    <div className="flex-grow"><h3 className="text-xl font-serif font-semibold text-slate-900 mb-3 leading-tight group-hover:text-indigo-900 transition-colors">{data.title[lang]}</h3><p className="text-sm text-slate-500 leading-relaxed font-body mb-6 whitespace-pre-wrap">{data.description[lang]}</p></div>
                    <div className="pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400"><div className="flex items-center gap-4"><span className="flex items-center gap-1.5"><Icon path={icons.clock} size={14} />{data.duration}</span><span className="flex items-center gap-1.5"><Icon path={icons.activity} size={14} />{t[data.difficulty]}</span></div><div className={`flex items-center gap-1 font-bold uppercase tracking-wider transition-all duration-300 ${data.link ? 'text-indigo-600 opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0' : 'hidden'}`}>{t.startBtn} <Icon path={icons.play} size={10} className="fill-current" /></div></div>
                    <div className={`absolute bottom-0 left-0 w-full h-1 bg-indigo-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left ${!data.link && 'hidden'}`}></div>
                </>
            );
            return data.link ? <a href={data.link} style={delayStyle} className="group relative bg-white rounded-2xl p-6 border border-slate-100 shadow-soft hover:shadow-hover transition-all duration-500 cursor-pointer animate-fade-up hover:-translate-y-1 flex flex-col h-full overflow-hidden block text-left no-underline">{content}</a> : <div style={delayStyle} onClick={() => onAlert(t.alertMsg)} className="group relative bg-white rounded-2xl p-6 border border-slate-100 shadow-soft transition-all duration-500 cursor-not-allowed animate-fade-up flex flex-col h-full overflow-hidden block text-left">{content}</div>;
        };

        const TechCheck = ({ t, onOpenManual }) => (
            <div className="max-w-7xl mx-auto px-6 mb-12 animate-fade-up" style={{animationDelay: '0.3s'}}>
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-6 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-slate-300"></div>
                    <div className="mb-4"><h3 className="text-lg font-serif font-bold text-slate-800 flex items-center gap-2"><Icon path={icons.alert} size={20} className="text-slate-500" />{t.precautionTitle}</h3><p className="text-xs text-slate-500">{t.precautionSubtitle}</p></div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <a href="./Frame_rate_measurement.html" target="_blank" className="group bg-white p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all flex flex-col block text-left"><div className="flex justify-between items-start mb-2"><span className="p-2 bg-indigo-50 text-indigo-600 rounded-lg group-hover:bg-indigo-100 transition"><Icon path={icons.monitor} size={20} /></span></div><h4 className="font-bold text-slate-800 text-sm mb-1">{t.prec_screen_title}</h4><p className="text-xs text-slate-500 mb-3">{t.prec_screen_desc}</p><span className="text-xs font-bold text-indigo-600 flex items-center gap-1">{t.prec_screen_link}</span></a>
                        <a href="./Key_response_measurement.html" className="group bg-white p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all flex flex-col block text-left"><div className="flex justify-between items-start mb-2"><span className="p-2 bg-emerald-50 text-emerald-600 rounded-lg group-hover:bg-emerald-100 transition"><Icon path={icons.zap} size={20} /></span></div><h4 className="font-bold text-slate-800 text-sm mb-1">{t.prec_input_title}</h4><p className="text-xs text-slate-500 mb-3">{t.prec_input_desc}</p><span className="text-xs font-bold text-emerald-600 flex items-center gap-1">{t.prec_input_link}</span></a>
                        <div onClick={onOpenManual} className="group bg-white p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all flex flex-col block text-left cursor-pointer"><div className="flex justify-between items-start mb-2"><span className="p-2 bg-slate-50 text-slate-600 rounded-lg group-hover:bg-slate-100 transition"><Icon path={icons.database} size={20} /></span></div><h4 className="font-bold text-slate-800 text-sm mb-1">{t.prec_data_title}</h4><p className="text-xs text-slate-500 mb-3">{t.prec_data_desc}</p><span className="text-xs font-bold text-indigo-600 flex items-center gap-1">{t.prec_data_link}</span></div>
                    </div>
                </div>
            </div>
        );

        function ExperimentLibrary() {
            const [activeCategory, setActiveCategory] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");
            const [lang, setLang] = useState("en");
            const [modalOpen, setModalOpen] = useState(false);
            const [modalMessage, setModalMessage] = useState("");
            const [manualOpen, setManualOpen] = useState(false);

            useEffect(() => {
                const browserLang = navigator.language || navigator.userLanguage;
                if (browserLang.startsWith('ja')) setLang('ja'); else if (browserLang.startsWith('sv')) setLang('se'); else setLang('en');
            }, []);

            useEffect(() => { document.documentElement.lang = lang === 'se' ? 'sv' : lang; }, [lang]);

            // Data is embedded, so always available
            const t = translations[lang];

            const filteredExperiments = useMemo(() => {
                return experimentsData.filter(exp => {
                    const matchesCategory = activeCategory === "All" || exp.category === activeCategory;
                    const titleMatch = exp.title[lang].toLowerCase().includes(searchQuery.toLowerCase());
                    const descriptionMatch = exp.description[lang].toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && (titleMatch || descriptionMatch);
                });
            }, [activeCategory, searchQuery, lang]);

            return (
                <div className="min-h-screen pb-24 font-sans animate-fade-in">
                    <Modal isOpen={modalOpen} onClose={() => setModalOpen(false)} message={modalMessage} title={t.modal_notice || "Notice"} btnText={t.modal_close || "Close"} />
                    <DataManualModal isOpen={manualOpen} onClose={() => setManualOpen(false)} />

                    <header className="glass sticky top-0 z-50 transition-all duration-300">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <a href="index.html" className="flex items-center gap-3 text-slate-500 hover:text-slate-900 transition-colors group">
                                <div className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center group-hover:border-slate-400 transition-colors bg-white"><Icon path={icons.arrowLeft} size={14} /></div>
                                <span className="text-xs font-bold tracking-widest uppercase font-serif">{t.lab_name}</span>
                            </a>
                            <div className="flex items-center gap-6">
                                <nav className="hidden md:flex gap-6 text-xs uppercase tracking-widest font-medium text-slate-500">
                                    <a href="index.html" className="hover:text-indigo-600 transition-colors">{t.nav_home}</a>
                                    <a href="#concept" className="hover:text-indigo-600 transition-colors">Concept</a>
                                    <a href="./Exp_About.html" className="hover:text-indigo-600 transition-colors">{t.nav_dev}</a>
                                    <a href="#library" className="hover:text-indigo-600 transition-colors">Library</a>
                                    <a href="index.html#contact" className="hover:text-indigo-600 transition-colors">{t.nav_contact}</a>
                                </nav>
                                <LanguageSwitcher currentLang={lang} setLang={setLang} />
                            </div>
                        </div>
                    </header>

                    <header className="relative min-h-[50vh] pt-40 pb-20 bg-white overflow-hidden flex items-center">
                        <div className="dot-grid"></div>
                        <div className="container max-w-7xl mx-auto px-6 relative z-10">
                            <div className="animate-fade-up">
                                <span className="block font-sans text-indigo-600 text-sm tracking-[0.2em] uppercase font-bold mb-4">{t.page_subtitle}</span>
                                <h1 className="text-5xl md:text-7xl font-serif text-slate-900 leading-[1.1] mb-6 tracking-tight" dangerouslySetInnerHTML={{__html: t.page_title}}></h1>
                                <p className="max-w-2xl text-slate-500 text-lg font-light leading-relaxed">{t.page_desc}</p>
                            </div>
                        </div>
                    </header>

                    <section id="concept" className="py-24 bg-white">
                        <div className="container max-w-7xl mx-auto px-6">
                            <div className="max-w-3xl animate-fade-up">
                                <span className="block text-indigo-600 text-xs font-bold tracking-widest uppercase mb-3">{t.concept_kicker}</span>
                                <h3 className="text-3xl font-serif text-slate-800 mb-6">{t.concept_head}</h3>
                                <p className="text-slate-500 leading-loose whitespace-pre-wrap font-light">{t.concept_body}</p>
                            </div>
                        </div>
                    </section>

                    <FeaturedResearch t={t} />
                    <ResearchAchievements t={t} />

                    <div id="library" className="bg-slate-50 pt-24 pb-12">
                        <div className="container max-w-7xl mx-auto px-6">
                            <div className="text-center mb-16 animate-fade-up">
                                <h2 className="text-4xl font-serif text-slate-900 mb-4">{t.libraryTitle}</h2>
                                <div className="relative max-w-md mx-auto mt-8">
                                    <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400"><Icon path={icons.search} size={18} /></div>
                                    <input type="text" placeholder={t.searchPlaceholder} value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-12 pr-6 py-4 bg-white border border-slate-200 hover:border-indigo-300 focus:border-indigo-500 focus:ring-0 rounded-full text-sm outline-none transition-all shadow-sm" />
                                </div>
                                <div className="flex flex-wrap justify-center gap-2 mt-8">
                                    <FilterTab label={t.filterAll} active={activeCategory === "All"} onClick={() => setActiveCategory("All")} />
                                    {categoriesList.map(catKey => (<FilterTab key={catKey} label={t[catKey]} active={activeCategory === catKey} onClick={() => setActiveCategory(catKey)} />))}
                                </div>
                            </div>

                            <TechCheck t={t} onOpenManual={() => setManualOpen(true)} />

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {filteredExperiments.map((exp, index) => <ExperimentCard key={exp.id} data={exp} index={index} lang={lang} t={t} onAlert={() => setModalMessage(t.alertMsg) || setModalOpen(true)} />)}
                            </div>
                            {filteredExperiments.length === 0 && (
                                <div className="text-center py-32 animate-fade-in"><div className="inline-block p-4 rounded-full bg-white text-slate-300 mb-4 shadow-sm"><Icon path={icons.search} size={32} /></div><p className="text-slate-500 font-medium">No experiments found.</p><button onClick={() => {setActiveCategory("All"); setSearchQuery("");}} className="mt-4 text-indigo-600 text-sm hover:text-indigo-800 font-bold underline underline-offset-4">View all experiments</button></div>
                            )}
                        </div>
                    </div>

                    <TermsSection t={t} />

                    <footer className="bg-slate-900 text-slate-400 py-12 text-center text-xs uppercase tracking-widest"><p>&copy; {new Date().getFullYear()} {t.footerRights}</p></footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExperimentLibrary />);
    </script>
</body>
</html>
