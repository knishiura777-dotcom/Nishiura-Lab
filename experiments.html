<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychology Experiments Library | Nishiura Lab</title>
    <meta name="description" content="西浦和樹研究室が提供するWebベースの心理学基礎実験アプリケーション集。">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@200;400;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        serif: ['"Noto Serif JP"', 'serif'],
                        english: ['"Cinzel"', 'serif'],
                        inter: ['"Inter"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- Icons ---
        const IconBase = ({ size = 24, className = "", children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );
        const ArrowLeft = (props) => (<IconBase {...props}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></IconBase>);
        const Search = (props) => (<IconBase {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconBase>);
        const Play = (props) => (<IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>);
        const Clock = (props) => (<IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>);
        const Activity = (props) => (<IconBase {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconBase>);
        const Brain = (props) => (<IconBase {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></IconBase>);
        const Eye = (props) => (<IconBase {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconBase>);
        const Database = (props) => (<IconBase {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></IconBase>);

        // --- Data ---
        // Stroop Taskにリンクを追加しました
        const experiments = [
            { id: 1, title: "Stroop Task", category: "Cognition", duration: "3-5 min", difficulty: "Easy", description: "色と文字の意味が矛盾する場合に反応時間が遅れる「ストループ効果」を測定します。選択的注意と認知的葛藤を評価する古典的な課題です。", icon: Brain, link: "./StroopTask_common_template_v2.html" },
            { id: 2, title: "Mental Rotation", category: "Spatial", duration: "5-10 min", difficulty: "Medium", description: "提示された物体が回転によって同一のものか識別する課題。空間的表象操作能力を測定します。", icon: Activity },
            { id: 3, title: "Visual Search", category: "Attention", duration: "3-5 min", difficulty: "Easy", description: "多数の妨害刺激の中からターゲット刺激を見つける課題。特徴探索と結合探索の違いを体験します。", icon: Eye },
            { id: 4, title: "Short-term Memory", category: "Memory", duration: "2-4 min", difficulty: "Easy", description: "数字や文字の系列を再生し、マジカルナンバー（7±2）などの短期記憶容量を測定します。", icon: Database },
            { id: 5, title: "Go/No-Go Task", category: "Inhibition", duration: "4-6 min", difficulty: "Medium", description: "特定の刺激に対しては反応し、別の刺激には反応を抑制する課題。実行機能の抑制制御を測定します。", icon: Activity },
            { id: 6, title: "N-back Task", category: "Memory", duration: "5-8 min", difficulty: "Hard", description: "N個前の刺激と同じ場合に反応する課題。ワーキングメモリの更新機能を測定する高負荷な実験です。", icon: Brain },
            { id: 7, title: "Müller-Lyer Illusion", category: "Perception", duration: "2-3 min", difficulty: "Easy", description: "矢羽の向きによって線の長さが異なって見える錯視量を調整法を用いて定量的に測定します。", icon: Eye },
            { id: 8, title: "Simon Task", category: "Cognition", duration: "4-6 min", difficulty: "Medium", description: "刺激の位置と反応キーの位置関係が反応時間に与える影響（サイモン効果）を検証します。", icon: Brain },
            { id: 9, title: "Change Blindness", category: "Perception", duration: "5-8 min", difficulty: "Hard", description: "画像の大きな変化であっても、瞬きや画面切り替えの間に起こると気づかない現象を体験します。", icon: Eye },
            { id: 10, title: "Posner Cueing", category: "Attention", duration: "4-7 min", difficulty: "Medium", description: "手がかり刺激（Cue）が注意の移動に与える促進・抑制効果を測定する空間的注意の実験です。", icon: Activity, link: "./Posner_Experiment_v1.html" },
        ];

        const categories = ["All", "Cognition", "Memory", "Attention", "Perception", "Spatial", "Inhibition"];

        // --- Components ---
        const FilterTab = ({ label, active, onClick }) => (
            <button 
                onClick={onClick}
                className={`px-4 py-2 rounded-full text-xs font-bold tracking-wider transition-all duration-300 ${
                    active 
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' 
                    : 'bg-white text-slate-500 hover:bg-slate-100 border border-slate-100'
                }`}
            >
                {label}
            </button>
        );

        const ExperimentCard = ({ data }) => {
            const Icon = data.icon;
            
            // クリック時のハンドラ
            const handleClick = () => {
                if (data.link) {
                    window.location.href = data.link;
                } else {
                    alert('この実験は現在準備中です。');
                }
            };

            return (
                <motion.div
                    layout
                    initial={{ opacity: 0, scale: 0.95 }}
                    animate={{ opacity: 1, scale: 1 }}
                    exit={{ opacity: 0, scale: 0.95 }}
                    whileHover={{ y: -5 }}
                    onClick={handleClick} // カード全体をクリック可能に
                    className="bg-white rounded-xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl hover:border-indigo-100 transition-all duration-300 flex flex-col h-full group cursor-pointer"
                >
                    <div className="h-32 bg-slate-50 relative overflow-hidden flex items-center justify-center">
                        <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'radial-gradient(#4f46e5 1px, transparent 1px)', backgroundSize: '12px 12px' }}></div>
                        <Icon size={48} className="text-indigo-200 group-hover:text-indigo-600 group-hover:scale-110 transition-all duration-500" />
                        <div className="absolute top-4 right-4 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold uppercase tracking-widest text-indigo-600 shadow-sm">
                            {data.category}
                        </div>
                    </div>
                    
                    <div className="p-6 flex flex-col flex-grow">
                        <h3 className="text-xl font-bold text-slate-900 mb-3 font-serif group-hover:text-indigo-700 transition-colors">{data.title}</h3>
                        <p className="text-slate-500 text-sm leading-relaxed mb-6 flex-grow">
                            {data.description}
                        </p>
                        
                        <div className="flex items-center gap-4 text-xs text-slate-400 mb-6 border-t border-slate-50 pt-4">
                            <div className="flex items-center gap-1">
                                <Clock size={14} />
                                <span>{data.duration}</span>
                            </div>
                            <div className="flex items-center gap-1">
                                <Activity size={14} />
                                <span>{data.difficulty}</span>
                            </div>
                        </div>

                        <button 
                            onClick={(e) => { e.stopPropagation(); handleClick(); }} // 親へのバブリングを止める（念のため）
                            className="w-full py-3 bg-slate-900 text-white rounded-lg font-bold text-xs tracking-widest uppercase hover:bg-indigo-600 transition-colors flex items-center justify-center gap-2 group-hover:shadow-lg group-hover:shadow-indigo-200"
                        >
                            <Play size={14} className="fill-current" /> Start Experiment
                        </button>
                    </div>
                </motion.div>
            );
        };

        function ExperimentLibrary() {
            const [activeCategory, setActiveCategory] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");

            const filteredExperiments = useMemo(() => {
                return experiments.filter(exp => {
                    const matchesCategory = activeCategory === "All" || exp.category === activeCategory;
                    const matchesSearch = exp.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          exp.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [activeCategory, searchQuery]);

            return (
                <div className="min-h-screen bg-slate-50 font-sans selection:bg-indigo-100 selection:text-indigo-900 pb-20">
                    
                    {/* Header */}
                    <header className="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <a href="./index.html" className="flex items-center gap-2 text-slate-500 hover:text-indigo-600 transition-colors group">
                                <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center group-hover:bg-indigo-100 transition-colors">
                                    <ArrowLeft size={16} />
                                </div>
                                <span className="text-xs font-bold tracking-widest uppercase hidden sm:inline">Back to Lab</span>
                            </a>
                            
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold serif">N</div>
                                <span className="text-lg font-bold serif tracking-wider text-slate-900">
                                    Experiment Library
                                </span>
                            </div>
                            
                            <div className="w-8"></div> {/* Spacer for centering */}
                        </div>
                    </header>

                    {/* Hero Area */}
                    <div className="bg-white border-b border-slate-100 pb-12 px-6 pt-4"> {/* pt-16 removed, added pt-4 for small spacing */}
                        <div className="max-w-4xl mx-auto text-center">
                            <motion.h1 
                                initial={{ opacity: 0, y: 20 }}
                                animate={{ opacity: 1, y: 0 }}
                                className="text-4xl md:text-5xl font-serif text-slate-900 mb-6"
                            >
                                Explore the Mind
                            </motion.h1>
                            <motion.p 
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ delay: 0.1 }}
                                className="text-slate-500 leading-relaxed max-w-2xl mx-auto mb-10"
                            >
                                教育心理学・認知心理学の基礎的な現象を体験・学習できるWebアプリケーション集です。<br/>
                                ブラウザ上で手軽に実験を行い、データの収集と分析のプロセスを学ぶことができます。
                            </motion.p>

                            {/* Search & Filter Controls */}
                            <div className="flex flex-col md:flex-row gap-6 justify-center items-center">
                                <div className="relative w-full max-w-xs">
                                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                    <input 
                                        type="text" 
                                        placeholder="Search experiments..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full pl-10 pr-4 py-2 rounded-full border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm"
                                    />
                                </div>
                                
                                <div className="flex flex-wrap justify-center gap-2">
                                    {categories.map(cat => (
                                        <FilterTab 
                                            key={cat} 
                                            label={cat} 
                                            active={activeCategory === cat} 
                                            onClick={() => setActiveCategory(cat)} 
                                        />
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Grid Content */}
                    <div className="max-w-7xl mx-auto px-6 py-12">
                        <motion.div 
                            layout
                            className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
                        >
                            <AnimatePresence>
                                {filteredExperiments.map(exp => (
                                    <ExperimentCard key={exp.id} data={exp} />
                                ))}
                            </AnimatePresence>
                        </motion.div>

                        {filteredExperiments.length === 0 && (
                            <div className="text-center py-20 text-slate-400">
                                <p>No experiments found matching your criteria.</p>
                                <button 
                                    onClick={() => {setActiveCategory("All"); setSearchQuery("");}}
                                    className="mt-4 text-indigo-600 text-sm hover:underline"
                                >
                                    Clear filters
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <footer className="text-center text-slate-400 text-xs py-12 border-t border-slate-200 bg-white">
                        <p>&copy; {new Date().getFullYear()} Nishiura Laboratory. All experiments are for educational purposes.</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExperimentLibrary />);
    </script>
</body>
</html>
