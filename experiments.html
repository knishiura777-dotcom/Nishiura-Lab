                            </span>
                        </div>
                        
                        <div className={`flex items-center gap-1 font-bold uppercase tracking-wider transition-all duration-300 ${data.link ? 'text-indigo-600 opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0' : 'hidden'}`}>
                            {t.startBtn} <Icon path={icons.play} size={10} className="fill-current" />
                        </div>
                    </div>
                    
                    {/* Interactive Border Bottom */}
                    <div className={`absolute bottom-0 left-0 w-full h-1 bg-indigo-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left ${!data.link && 'hidden'}`}></div>
                </>
            );

            // Conditional Rendering based on link presence
            if (data.link) {
                return (
                    <a 
                        href={data.link} 
                        style={delayStyle}
                        className="group relative bg-white rounded-2xl p-6 border border-slate-100 shadow-soft hover:shadow-hover transition-all duration-500 cursor-pointer animate-fade-up hover:-translate-y-1 flex flex-col h-full overflow-hidden block text-left"
                    >
                        {content}
                    </a>
                );
            }

            return (
                <div 
                    style={delayStyle}
                    onClick={() => alert(t.alertMsg)}
                    className="group relative bg-white rounded-2xl p-6 border border-slate-100 shadow-soft hover:shadow-hover transition-all duration-500 cursor-pointer animate-fade-up hover:-translate-y-1 flex flex-col h-full overflow-hidden block text-left"
                >
                    {content}
                </div>
            );
        };

        const TechCheck = ({ t }) => (
            <div className="max-w-7xl mx-auto px-6 mb-12 animate-fade-up" style={{animationDelay: '0.3s'}}>
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-6 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-slate-300"></div>
                    <div className="mb-4">
                        <h3 className="text-lg font-serif font-bold text-slate-800 flex items-center gap-2">
                            <Icon path={icons.alert} size={20} className="text-slate-500" />
                            {t.precautionTitle}
                        </h3>
                        <p className="text-xs text-slate-500">{t.precautionSubtitle}</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <a href="./Frame_rate_measurement.html" className="group bg-white p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all flex flex-col block text-left">
                            <div className="flex justify-between items-start mb-2">
                                <span className="p-2 bg-indigo-50 text-indigo-600 rounded-lg group-hover:bg-indigo-100 transition">
                                    <Icon path={icons.monitor} size={20} />
                                </span>
                                <Icon path={icons.play} size={16} className="text-slate-300 group-hover:text-indigo-500 transition" />
                            </div>
                            <h4 className="font-bold text-slate-800 text-sm mb-1 group-hover:text-indigo-700 transition">{t.prec_screen_title}</h4>
                            <p className="text-xs text-slate-500 leading-relaxed mb-3 flex-grow">{t.prec_screen_desc}</p>
                            <span className="text-xs font-bold text-indigo-600 flex items-center gap-1">
                                {t.prec_screen_link} <Icon path={icons.arrowLeft} size={12} className="rotate-180" />
                            </span>
                        </a>

                        <a href="./Key_response_measurement.html" className="group bg-white p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all flex flex-col block text-left">
                            <div className="flex justify-between items-start mb-2">
                                <span className="p-2 bg-emerald-50 text-emerald-600 rounded-lg group-hover:bg-emerald-100 transition">
                                    <Icon path={icons.zap} size={20} />
                                </span>
                                <Icon path={icons.play} size={16} className="text-slate-300 group-hover:text-emerald-500 transition" />
                            </div>
                            <h4 className="font-bold text-slate-800 text-sm mb-1 group-hover:text-emerald-700 transition">{t.prec_input_title}</h4>
                            <p className="text-xs text-slate-500 leading-relaxed mb-3 flex-grow">{t.prec_input_desc}</p>
                            <span className="text-xs font-bold text-emerald-600 flex items-center gap-1">
                                {t.prec_input_link} <Icon path={icons.arrowLeft} size={12} className="rotate-180" />
                            </span>
                        </a>
                    </div>
                </div>
            </div>
        );

        const LanguageSwitcher = ({ currentLang, setLang }) => (
            <div className="flex items-center gap-2 text-xs font-bold tracking-widest">
                <button 
                    onClick={() => setLang('en')} 
                    className={`hover:text-indigo-600 transition-colors ${currentLang === 'en' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}
                >
                    EN
                </button>
                <span className="text-slate-300">|</span>
                <button 
                    onClick={() => setLang('ja')} 
                    className={`hover:text-indigo-600 transition-colors ${currentLang === 'ja' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}
                >
                    JP
                </button>
                <span className="text-slate-300">|</span>
                <button 
                    onClick={() => setLang('se')} 
                    className={`hover:text-indigo-600 transition-colors ${currentLang === 'se' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}
                >
                    SE
                </button>
            </div>
        );

        function ExperimentLibrary() {
            const [activeCategory, setActiveCategory] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");
            const [lang, setLang] = useState("en"); // Default to English initially

            // Initialize Language based on browser
            useEffect(() => {
                const browserLang = navigator.language || navigator.userLanguage;
                if (browserLang.startsWith('ja')) {
                    setLang('ja');
                } else if (browserLang.startsWith('sv')) {
                    setLang('se');
                } else {
                    setLang('en');
                }
            }, []);

            const t = translations[lang];

            const filteredExperiments = useMemo(() => {
                return experimentsData.filter(exp => {
                    const matchesCategory = activeCategory === "All" || exp.category === activeCategory;
                    // Search in current language
                    const titleMatch = exp.title[lang].toLowerCase().includes(searchQuery.toLowerCase());
                    const descMatch = exp.description[lang].toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && (titleMatch || descMatch);
                });
            }, [activeCategory, searchQuery, lang]);

            // Update HTML lang attribute
            useEffect(() => {
                document.documentElement.lang = lang === 'se' ? 'sv' : lang;
            }, [lang]);

            return (
                <div className="min-h-screen pb-24 font-sans">
                    
                    {/* Header */}
                    <header className="glass sticky top-0 z-50 transition-all duration-300">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <a href="./index.html" className="flex items-center gap-3 text-slate-500 hover:text-slate-900 transition-colors group">
                                <div className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center group-hover:border-slate-400 transition-colors bg-white">
                                    <Icon path={icons.arrowLeft} size={14} />
                                </div>
                                <span className="text-xs font-bold tracking-widest uppercase font-serif">Nishiura Lab.</span>
                            </a>
                            
                            <div className="flex items-center gap-6">
                                <h1 className="text-sm font-serif font-bold tracking-wider text-slate-900 hidden sm:block">
                                    {t.libraryTitle.toUpperCase()}
                                </h1>
                                <LanguageSwitcher currentLang={lang} setLang={setLang} />
                            </div>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="relative px-6 py-20 md:py-28 bg-white border-b border-slate-100">
                        <div className="max-w-4xl mx-auto text-center">
                            <span className="block text-indigo-600 text-xs font-bold tracking-[0.2em] uppercase mb-6 animate-fade-up">Web-based Psychology Experiments</span>
                            <h2 className="text-5xl md:text-7xl font-serif text-slate-900 mb-8 leading-tight animate-fade-up" style={{animationDelay: '0.1s'}}>
                                {lang === 'ja' ? t.heroTitle : <>Explore the <span className="italic font-light text-slate-400">Mind</span></>}
                                {lang === 'se' && t.heroTitle}
                            </h2>
                            <p className="text-slate-500 leading-loose max-w-xl mx-auto mb-12 font-body animate-fade-up whitespace-pre-wrap" style={{animationDelay: '0.2s'}}>
                                {t.heroDesc}
                            </p>

                            {/* Search Bar */}
                            <div className="relative max-w-md mx-auto mb-12 animate-fade-up" style={{animationDelay: '0.3s'}}>
                                <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400">
                                    <Icon path={icons.search} size={18} />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder={t.searchPlaceholder}
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-12 pr-6 py-4 bg-slate-50 border border-transparent hover:border-slate-200 focus:border-indigo-500 focus:ring-0 focus:bg-white rounded-full text-sm outline-none transition-all shadow-sm"
                                />
                            </div>

                            {/* Categories */}
                            <div className="flex flex-wrap justify-center gap-2 animate-fade-up" style={{animationDelay: '0.4s'}}>
                                <FilterTab 
                                    label={t.filterAll} 
                                    active={activeCategory === "All"} 
                                    onClick={() => setActiveCategory("All")} 
                                />
                                {categoriesList.map(catKey => (
                                    <FilterTab 
                                        key={catKey} 
                                        label={t[catKey]} 
                                        active={activeCategory === catKey} 
                                        onClick={() => setActiveCategory(catKey)} 
                                    />
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* New Precautions Section */}
                    <TechCheck t={t} />

                    {/* Grid Section */}
                    <section className="max-w-7xl mx-auto px-6 py-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredExperiments.map((exp, index) => (
                                <ExperimentCard key={exp.id} data={exp} index={index} lang={lang} t={t} />
                            ))}
                        </div>

                        {filteredExperiments.length === 0 && (
                            <div className="text-center py-32 animate-fade-in">
                                <div className="inline-block p-4 rounded-full bg-slate-50 text-slate-300 mb-4">
                                    <Icon path={icons.search} size={32} />
                                </div>
                                <p className="text-slate-500 font-medium">No experiments found.</p>
                                <button 
                                    onClick={() => {setActiveCategory("All"); setSearchQuery("");}}
                                    className="mt-4 text-indigo-600 text-sm hover:text-indigo-800 font-bold underline underline-offset-4"
                                >
                                    View all experiments
                                </button>
                            </div>
                        )}
                    </section>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-6 pt-12 border-t border-slate-100 flex flex-col md:flex-row justify-between items-center text-xs text-slate-400 font-sans">
                        <p>&copy; {new Date().getFullYear()} {t.footerRights}</p>
                        <div className="flex gap-6 mt-4 md:mt-0">
                            <a href="#" className="hover:text-slate-600 transition-colors">{t.footerPrivacy}</a>
                            <a href="#" className="hover:text-slate-600 transition-colors">{t.footerTerms}</a>
                            <a href="mailto:nishiura@mgu.ac.jp" className="hover:text-slate-600 transition-colors">{t.footerContact}</a>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExperimentLibrary />);
    </script>
</body>
</html>
