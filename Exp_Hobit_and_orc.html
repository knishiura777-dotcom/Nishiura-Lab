<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ホビットとオーク stable noCDN</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#182033;--muted:#667085;--line:#d8dee9;--brand:#4f46e5;--brand2:#0f766e;--danger:#dc2626;--ok:#059669;--warn:#d97706;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.6} button,input,select,textarea{font:inherit} button{cursor:pointer} .wrap{max-width:980px;margin:0 auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.08);padding:28px}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.title{font-size:clamp(26px,4vw,42px);line-height:1.1;margin:0 0 10px;font-weight:850}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;text-align:left}.field label{font-weight:700;font-size:13px;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12)}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:#e5e7eb;color:#111827;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.primary{background:var(--brand);color:#fff}.btn.dark{background:#111827;color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#344054}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800}.note{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;color:#475467}.hidden{display:none!important}.muted{color:var(--muted)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--brand);width:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{background:#f8fafc;color:#475467;font-size:12px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.stat b{display:block;font-size:28px}.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:720px){.g2,.g3{grid-template-columns:1fr}.card{padding:20px}.wrap{padding:14px}.center{padding:14px}.row{align-items:stretch}.btn{width:100%}}

.bank{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:18px;min-height:250px}.river{background:linear-gradient(180deg,#bfdbfe,#60a5fa);border-radius:22px;padding:18px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}.char{border:1px solid var(--line);border-radius:14px;padding:10px;margin:5px;background:white;display:inline-flex;align-items:center;gap:6px;font-weight:900}.hob{color:#047857;background:#ecfdf5}.orc{color:#b91c1c;background:#fef2f2}.boat{background:#78350f;color:#fff;border-radius:999px;padding:16px;margin:10px auto;min-width:180px}.msg{font-weight:900;text-align:center;padding:12px;border-radius:14px;background:#eef2ff;color:#3730a3;margin:16px 0}.lost{background:#fee2e2;color:#991b1b}.won{background:#dcfce7;color:#166534}</style></head><body><div id="app"></div><script>
let s={screen:'initial',pid:'',left:{h:3,o:3},right:{h:0,o:0},boat:{h:0,o:0},pos:'left',moves:0,state:'playing',msg:'全員を右岸へ移動させてください。',history:[],method:'csv',gasUrl:localStorage.getItem('hobit_gas_url')||'',lang:'ja'};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); function set(p){s={...s,...p};render();}
function initial(){return `<div class="center"><div class="card" style="max-width:560px;width:100%;text-align:center"><h1 class="title">ホビットとオークの実験</h1><p class="sub">認知心理学：問題解決の思考実験</p><div class="field"><label>被験者ID（任意）</label><input id="pid" value="${esc(s.pid)}" placeholder="ID12345"></div><div class="footer-actions"><button class="btn primary" onclick="start()">実験開始</button><button class="btn ghost" onclick="set({screen:'settings'})">設定</button></div><div class="note" style="text-align:left;margin-top:18px"><b>ルール</b><br>3人のホビットと3人のオークを左岸から右岸へ移動します。ボートは最大2人。どちらの岸でも、ホビットがいる場合はオークがホビットを上回ってはいけません。</div></div></div>`}
function settings(){return `<div class="center"><div class="card" style="max-width:680px;width:100%"><h1 class="title">保存設定</h1><div class="field"><label>保存方法</label><select id="method"><option value="csv" ${s.method==='csv'?'selected':''}>CSV</option><option value="gas" ${s.method==='gas'?'selected':''}>GAS</option></select></div><div class="field" style="margin-top:14px"><label>GAS URL</label><input id="gas" value="${esc(s.gasUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="footer-actions"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn ghost" onclick="set({screen:'initial'})">戻る</button></div><pre class="note" style="white-space:pre-wrap;font-size:12px">function doPost(e) {
 const sheet=SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
 const data=JSON.parse(e.postData.contents);
 sheet.appendRow([new Date(), data.participantId, data.totalMoves, data.result, JSON.stringify(data.history)]);
 return ContentService.createTextOutput('Success');
}</pre></div></div>`}
function chips(type,count,place){let out='';for(let i=0;i<count;i++)out+=`<button class="char ${type==='h'?'hob':'orc'}" onclick="moveChar('${type}','${place}')">${type==='h'?'🧝 H':'💀 O'}</button>`;return out||'<span class="muted">なし</span>'}
function playing(){let msgClass=s.state==='won'?'msg won':s.state==='lost'?'msg lost':'msg';return `<div class="wrap"><div class="topbar"><div><h1 class="title" style="font-size:30px">ホビットとオーク</h1><span class="pill">手数 ${s.moves}</span> <span class="pill">ID: ${esc(s.pid||'Guest')}</span></div><div class="row"><button class="btn ghost" onclick="toggleLog()">ログ</button><button class="btn ghost" onclick="resetGame()">リセット</button><button class="btn dark" onclick="set({screen:'initial'})">初期画面</button></div></div><div class="${msgClass}">${esc(s.msg)}</div>${s.showLog?logPanel():''}<div class="grid g3"><div class="bank"><h2>左岸 Start</h2><p>ホビット</p>${chips('h',s.left.h,'left')}<p>オーク</p>${chips('o',s.left.o,'left')}</div><div class="river"><h2>川</h2><div class="boat">BOAT（${s.pos==='left'?'左岸':'右岸'}）<br>${chips('h',s.boat.h,'boat')} ${chips('o',s.boat.o,'boat')}</div><button class="btn primary" onclick="moveBoat()" ${s.state!=='playing'?'disabled':''}>${s.pos==='left'?'右岸へ進む':'左岸へ戻る'}</button></div><div class="bank"><h2>右岸 Goal</h2><p>ホビット</p>${chips('h',s.right.h,'right')}<p>オーク</p>${chips('o',s.right.o,'right')}</div></div><div class="footer-actions"><button class="btn ok" onclick="finish()">実験終了してログ保存</button></div></div>`}
function logPanel(){return `<div class="card" style="box-shadow:none;margin-bottom:18px"><div class="topbar"><h2>行動履歴</h2><div class="row"><button class="btn ghost" onclick="copyCsv()">CSVコピー</button><button class="btn ok" onclick="saveData()">${s.method==='csv'?'CSV保存':'GAS送信'}</button></div></div><div style="max-height:250px;overflow:auto"><table class="table"><thead><tr><th>#</th><th>Action</th><th>左(H/O)</th><th>右(H/O)</th><th>船(H/O)</th></tr></thead><tbody>${s.history.length?s.history.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.action)}</td><td>${r.left.h}/${r.left.o}</td><td>${r.right.h}/${r.right.o}</td><td>${r.boat.h}/${r.boat.o}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">履歴なし</td></tr>'}</tbody></table></div></div>`}
function render(){document.getElementById('app').innerHTML=s.screen==='initial'?initial():s.screen==='settings'?settings():playing(); if(s.screen==='initial'){let el=document.getElementById('pid'); if(el)el.oninput=()=>s.pid=el.value}}
function start(){resetGame();s.screen='playing';render()} function resetGame(){s.left={h:3,o:3};s.right={h:0,o:0};s.boat={h:0,o:0};s.pos='left';s.moves=0;s.state='playing';s.msg='全員を右岸へ移動させてください。';s.history=[];s.showLog=false}
function log(action){s.history.push({time:new Date().toLocaleTimeString(),moveCount:s.moves,action,left:{...s.left},right:{...s.right},boat:{...s.boat},pos:s.pos})} function safe(b){return b.h===0||b.o<=b.h} function check(){if(!safe(s.left)||!safe(s.right)){s.state='lost';s.msg='ゲームオーバー！ オークがホビットを襲ってしまいました。';log('ゲームオーバー')} else if(s.right.h===3&&s.right.o===3&&s.boat.h+s.boat.o===0){s.state='won';s.msg='クリアおめでとうございます！ 手数: '+s.moves;log('クリア達成')}}
function moveChar(type,place){if(s.state!=='playing')return;let bank=s.pos==='left'?s.left:s.right; if(place==='boat'){if(s.boat[type]<=0)return; s.boat[type]--; bank[type]++; log((s.pos==='left'?'左岸へ':'右岸へ')+'下船 '+(type==='h'?'H':'O'))} else {if(place!==s.pos||bank[type]<=0)return;if(s.boat.h+s.boat.o>=2){s.msg='ボートはいっぱいです。';render();return};bank[type]--;s.boat[type]++;log((s.pos==='left'?'左岸から':'右岸から')+'乗船 '+(type==='h'?'H':'O'))} s.msg='操作を続けてください。';check();render()}
function moveBoat(){if(s.state!=='playing')return;if(s.boat.h+s.boat.o===0){s.msg='ボートを動かすには最低1人の乗船が必要です。';render();return} s.pos=s.pos==='left'?'right':'left';s.moves++;log(s.pos==='right'?'ボート移動 左→右':'ボート移動 右→左');s.msg='ボートが移動しました。';check();render()}
function toggleLog(){s.showLog=!s.showLog;render()} function finish(){s.showLog=true;s.msg='実験を終了しました。ログを保存してください。';render()}
function csv(){
  let meta=`ParticipantID,${s.pid||'Guest'}\nDate,${new Date().toLocaleString()}\nResult,${s.state}\nTotalMoves,${s.moves}\n\n`;
  let h='Time,MoveCount,Action,Left_H,Left_O,Right_H,Right_O,Boat_H,Boat_O,Boat_Position\n';
  let rows=s.history.map(r=>[r.time,r.moveCount,`"${String(r.action).replaceAll('"','""')}"`,r.left.h,r.left.o,r.right.h,r.right.o,r.boat.h,r.boat.o,r.pos].join(',')).join('\n');
  return '\ufeff'+meta+h+rows;
}
function downloadCsv(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv;charset=utf-8;'}));a.download=`hobbits_orcs_${s.pid||'guest'}.csv`;a.click();URL.revokeObjectURL(a.href);s.msg='CSVを保存しました';render()} async function copyCsv(){await navigator.clipboard.writeText(csv()).catch(()=>{});s.msg='ログをコピーしました';render()}
async function saveData(){if(s.method==='csv'){downloadCsv();return} if(!s.gasUrl){s.msg='GAS URLが未設定です';render();return} try{await fetch(s.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({participantId:s.pid||'Guest',date:new Date().toISOString(),history:s.history,totalMoves:s.moves,result:s.state})});s.msg='GASへ送信しました'}catch(e){s.msg='送信に失敗しました: '+e.message}render()}
function saveSettings(){s.method=document.getElementById('method').value;s.gasUrl=document.getElementById('gas').value.trim();localStorage.setItem('hobit_gas_url',s.gasUrl);set({screen:'initial'})} render();
</script></body></html>
