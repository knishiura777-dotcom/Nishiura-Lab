            if (q.trait === "C") c += score;
            if (q.trait === "E") e += score;
            if (q.trait === "A") a += score;
            if (q.trait === "S") s += score;
          });

          const isC = c >= 6;

                            {/* Tier 2: 選択の専門資格 */}
                            <div class="bg-white/80 rounded-xl p-4 border border-brand-blush shadow-sm whitespace-normal break-words">
                              <div class="flex items-center gap-2 mb-2 text-brand-dark">
                                <span class="text-xs bg-brand-gold text-white px-2.5 py-0.5 rounded-full font-bold">
                                  💡 プラス専門資格
                                </span>
                                <h4 class="font-bold text-xs text-neutral-500">本学で選択できるもう一つの専門性</h4>
                              </div>
                              <p class="text-xs font-bold text-brand-dark mb-1 flex items-center gap-1">
                                <i class="fa-solid fa-tag text-[10px] text-brand-gold"></i>
                                {calculatedResult.specLicense} で個性をブースト！
                              </p>
                              <p class="text-xs leading-relaxed text-neutral-600 font-medium">
                                {calculatedResult.specLicenseDesc}
                              </p>
                            </div>

                            {/* Tier 3: 最大3資格掛け合わせによる未来の進路 */}
                            <div class="bg-brand-sageLight/20 rounded-xl p-4 border border-brand-sage/30 shadow-sm whitespace-normal break-words">
                              <div class="flex items-center gap-2 mb-2 text-brand-dark">
                                <span class="text-xs bg-brand-dark text-white px-2.5 py-0.5 rounded-full font-bold">
                                  🎓 最大3つの資格を掛け合わせた進路
                                </span>
                              </div>
                              <p class="text-xs font-bold text-brand-dark mb-1">
                                🌟 目指せる具体的キャリア像：
                              </p>
                              <p class="text-xs leading-relaxed text-brand-dark font-medium bg-white/70 px-3 py-2 rounded-lg border border-brand-sage/20 inline-block w-full">
                                {calculatedResult.tripleCareer}
                              </p>
                            </div>

                          </div>
                        </div>

                        {/* Academic Wing VS Professional Wing - ２つの翼 (The High-Flying Nudge) */}
                        <div class="border-t border-brand-dark/10 pt-6 mt-6">
                          <h4 class="font-serif text-sm font-bold text-brand-dark mb-3 flex items-center gap-1.5">
                            <i class="fa-solid fa-route"></i> 将来社会で輝くための、あなただけのポータブルスキル＆ライフキャリア・ヒント
                          </h4>
                          
                          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            
                            {/* Academic Wing */}
                            <div class="bg-brand-blushLight/40 rounded-2xl p-4 border border-brand-blush flex flex-col justify-between">
                              <div>
                                <span class="text-xs font-bold text-brand-gold block mb-1">
                                  <i class="fa-solid fa-book-open-reader"></i> 学術研究の道（Academic Wing）
                                </span>
                                <p class="text-xs leading-relaxed text-neutral-600 font-medium">
                                  将来さらに探求を深めたい場合、保育士資格や認定心理士の力をベースに、大学卒業後に<strong>発達心理学</strong>や<strong>児童発達学</strong>といった学問領域の大学院へと進学し、専門研究員・高度スペシャリストを目指す進路も開かれています。
                                </p>
                              </div>
                              <div class="mt-3 text-[11px] font-bold text-brand-dark bg-white/60 p-2 rounded border border-brand-blush/30">
                                研究分野：{calculatedResult.academic}
                              </div>
                            </div>

                            {/* Professional Wing */}
                            <div class="bg-brand-blushLight/40 rounded-2xl p-4 border border-brand-blush flex flex-col justify-between">
                              <div>
                                <span class="text-xs font-bold text-brand-gold block mb-1">
                                  <i class="fa-solid fa-rainbow"></i> 社会人イノベーター（Professional Wing）
                                </span>
                                <p class="text-xs leading-relaxed text-neutral-600 font-medium">
                                  幼児教育や福祉で培う「鋭い観察力」「高い傾聴共感力」「環境デザイン力」は、一般企業やスタートアップ、自治体でも絶大な価値を持つ最強のポータブルスキルです。卒業後にいかなる一般企業に進んでも、トップクリエイターとして即戦力で活躍できます。
                                </p>
                              </div>
                              <div class="mt-3 text-[11px] font-bold text-brand-dark bg-white/60 p-2 rounded border border-brand-blush/30">
                                活躍可能性：{calculatedResult.professional}
                              </div>
                            </div>

                          </div>
                          
                          <p class="text-center text-[11px] text-neutral-500 mt-5 italic">
                            自分らしさを活かし、あらゆる進路・学部（文学、社会科学、ビジネス、栄養、保育、看護医療など）で応用可能なポータブルスキルをゆっくりお庭で育てていきましょう。
                          </p>
                        </div>

                      </div>
                    </div>

                    {/* Navigation Buttons back or save */}
                    <div class="flex flex-col sm:flex-row gap-3 justify-center max-w-xl mx-auto">
                      <button 
                        onClick={handleReset}
                        class="px-8 py-3 bg-brand-dark text-white font-bold rounded-xl text-xs tracking-wider shadow-md hover:bg-neutral-800 transition-all text-center tap-target"
                      >
                        <i class="fa-solid fa-arrow-rotate-left mr-2"></i> もういちど診断する
                      </button>
                      <button 
                        onClick={() => setActiveTab("map")}
                        class="px-8 py-3 border border-brand-gold text-brand-gold font-bold rounded-xl text-xs tracking-wider hover:bg-brand-gold/10 transition-all text-center tap-target"
                      >
                        みんなのお庭マップ（寄せ植え）を見る <i class="fa-solid fa-chevron-right ml-1"></i>
                      </button>
                    </div>

                  </div>
                )}

              </div>
            )}

            {/* TAB 2: COLLABORATIVE GARDEN MAP (みんなの寄せ植え) */}
            {activeTab === "map" && (
              <div class="glass-card rounded-2xl p-5 md:p-8 max-w-3xl mx-auto border border-brand-blush shadow-sm animate-fade-in">
                
                {/* Header info */}
                <div class="text-center mb-6">
                  <span class="text-2xl text-brand-gold"><i class="fa-solid fa-border-all"></i></span>
                  <h3 class="font-serif text-xl font-bold mt-1 text-brand-dark">みんなのお庭マップ（心の寄せ植え）</h3>
                  <p class="text-xs text-neutral-500 mt-1 max-w-md mx-auto">
                    オープンキャンパスに一緒に来た仲間や、お友達のハーブを追加して、お庭全体のバランスを「寄せ植え」のように視覚化してみよう！
                  </p>
                </div>

                {/* Add Friend Small Interactive Panel */}
                <div class="bg-brand-canvas rounded-xl p-4 border border-brand-blush mb-6">
                  <form onSubmit={handleAddFriend} class="flex flex-col sm:flex-row gap-3">
                    <input 
                      type="text" 
                      value={newFriendName}
                      onChange={(e) => setNewFriendName(e.target.value)}
                      placeholder="お友達やご家族の名前を入力..."
                      maxLength="15"
                      class="flex-grow px-4 py-2 text-xs rounded-lg border border-brand-blush bg-white focus:outline-none focus:border-brand-gold"
                    />
                    <button 
                      type="submit"
                      class="px-5 py-2 bg-brand-dark text-white font-semibold rounded-lg text-xs hover:bg-neutral-800 transition-all shadow-sm flex items-center justify-center gap-1.5 tap-target"
                    >
                      <i class="fa-solid fa-plus-circle"></i> お友達をお庭に追加
                    </button>
                  </form>
                  {feedbackMsg && (
                    <p class="text-[10px] text-emerald-600 font-bold mt-2 text-center animate-pulse">
                      {feedbackMsg}
                    </p>
                  )}
                </div>

                {/* VISUAL COLLABORATIVE GARDEN CANVAS */}
                <div class="bg-brand-canvas rounded-2xl p-4 md:p-6 border border-brand-blush min-h-[300px] flex flex-wrap gap-4 items-center justify-center relative overflow-hidden shadow-inner">
                  
                  {/* Subtle background graphic decoration */}
                  <div class="absolute inset-0 pointer-events-none opacity-5 flex items-center justify-center">
                    <i class="fa-solid fa-seedling text-[200px]"></i>
                  </div>

                  {/* USER'S OWN PLANTED HERB (IF DIAGNOSED) */}
                  {calculatedResult && (
                    <div class="relative bg-white/95 rounded-2xl p-4 border-2 border-brand-gold w-36 h-36 md:w-40 md:h-40 flex flex-col justify-between items-center text-center shadow-lg transform hover:scale-105 transition-all duration-300 animate-float z-10">
                      <span class="absolute top-1.5 right-1.5 text-[8px] font-bold bg-brand-gold text-brand-dark px-1.5 py-0.5 rounded-full uppercase">
                        あなた
                      </span>
                      <div class="text-3xl mt-2 select-none">
                        {calculatedResult.plantType === "MINT" && "🍃"}
                        {calculatedResult.plantType === "LAVENDER" && "💜"}
                        {calculatedResult.plantType === "ANEMONE" && "🌸"}
                        {calculatedResult.plantType === "OLIVE" && "🌿"}
                        {calculatedResult.plantType === "ROSE" && "🌹"}
                        {calculatedResult.plantType === "IVY" && "🍀"}
                        {calculatedResult.plantType === "EUCALYPTUS" && "🌿"}
                        {calculatedResult.plantType === "SWEETPEA" && "🌺"}
                      </div>
                      <div class="mt-1">
                        <p class="font-bold text-xs text-brand-dark truncate max-w-[120px]">
                          あなた
                        </p>
                        <p class="text-[9px] text-brand-gold font-medium truncate max-w-[120px]">
                          {calculatedResult.name.split(" ")[0]}
                        </p>
                      </div>
                      <span class="text-[8px] text-neutral-400 font-mono">
                        {calculatedResult.code}
                      </span>
                    </div>
                  )}

                  {/* TEAM/FRIENDS PLANTED ELEMENTS */}
                  {teamMembers.map((member, i) => (
                    <div 
                      key={i}
                      class="relative bg-white/75 rounded-2xl p-4 border border-brand-blush w-32 h-32 md:w-36 md:h-36 flex flex-col justify-between items-center text-center shadow-sm transform hover:scale-105 transition-all duration-300 hover:shadow-md hover:bg-white z-10"
                    >
                      <div class="text-3xl mt-1 select-none">
                        {member.emoji}
                      </div>
                      <div>
                        <p class="font-bold text-xs text-brand-dark truncate max-w-[100px]">
                          {member.name}
                        </p>
                        <p class="text-[9px] text-neutral-500 truncate max-w-[100px]">
                          {BOTANICAL_ARCHETYPES[member.plant]?.name.split(" ")[0]}
                        </p>
                      </div>
                      <span class="text-[8px] text-neutral-400 font-mono">
                        MEMBER
                      </span>
                    </div>
                  ))}

                </div>

                {/* Summary footer nudge */}
                <div class="mt-6 bg-white/90 p-4 rounded-xl border border-brand-blush text-center text-xs text-neutral-600 leading-relaxed font-semibold">
                  ☘️ <strong>寄せ植えのアドバイス：</strong> 
                  お庭に多様なハーブが集まるほど、病気や強風に強い「持続可能で美しい生態系ガーデン」になります。おしゃべりなミントが場を盛り上げ、几帳面なラベンダーが場を整え、繊細なスイートピーが優しさの風を吹かせる。
                  多様な国家資格と特性を掛け合わせ、お互いの強みを活かし合うチームづくりを、本学キャンパスで実践的に学びましょう。
                </div>

              </div>
            )}

            {/* TAB 3: BOTANICAL HERB ENCYCLOPEDIA (ハーブ植物図鑑) */}
            {activeTab === "dictionary" && (
              <div class="glass-card rounded-2xl p-5 md:p-8 max-w-4xl mx-auto border border-brand-blush shadow-sm animate-fade-in font-medium">
                
                <div class="text-center mb-8">
                  <span class="text-2xl text-brand-gold"><i class="fa-solid fa-leaf"></i></span>
                  <h3 class="font-serif text-xl font-bold mt-1 text-brand-dark">幼児教育専攻ボタニカルハーブ図鑑</h3>
                  <p class="text-xs text-neutral-500 mt-1 max-w-md mx-auto">
                    PSY-CODEアセスメントに登場する、あなたの個性を引き出す代表的な8つのハーブ植物と、そのキャリア接続の解説です。
                  </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {Object.entries(BOTANICAL_ARCHETYPES).map(([key, value]) => (
                    <div key={key} class="bg-white/80 rounded-2xl overflow-hidden border border-brand-blush shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                      <div class="h-32 w-full overflow-hidden relative">
                        <img src={value.image} alt={value.name} class="w-full h-full object-cover" />
                        <div class="absolute inset-0 bg-gradient-to-t from-white via-white/20 to-transparent"></div>
                        <span class="absolute bottom-2 left-3 bg-brand-dark text-white text-[10px] tracking-widest uppercase px-2 py-0.5 rounded-full font-bold">
                          {value.role}
                        </span>
                      </div>
                      <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                          <h4 class="font-serif text-sm font-bold text-brand-dark border-b border-brand-blush pb-1 mb-2">
                            {value.name}
                          </h4>
                          <p class="text-xs text-neutral-600 leading-relaxed mb-4">
                            {value.desc}
                          </p>
                        </div>
                        <div class="space-y-2.5 pt-2 border-t border-dashed border-brand-blush">
                          <div class="text-[11px]">
                            <strong class="text-brand-gold block font-semibold mb-0.5">🌿 保育実践における強み</strong>
                            <p class="text-neutral-500 leading-relaxed">{value.basicLicenseDesc}</p>
                          </div>
                          <div class="text-[11px]">
                            <strong class="text-brand-dark block font-semibold mb-0.5">💡 {value.specLicense} の追加価値</strong>
                            <p class="text-neutral-500 leading-relaxed">{value.specLicenseDesc}</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            )}

          </main>

          {/* PREMIUM GENTLE FOOTER */}
          <footer class="mt-8 pt-4 border-t border-brand-blush flex flex-col sm:flex-row items-center justify-between gap-4 text-[10px] text-neutral-400 font-medium">
            <p>© 2026 PSY-CODE // わたし色のガーデンアセスメント. All Rights Reserved.</p>
            <div class="flex gap-4">
              <span>オープンキャンパス特別仕様</span>
              <span>幼児教育専攻・キャリア探求チーム監修</span>
            </div>
          </footer>

        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
