<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ミューラー・リヤー錯視実験 安定版</title>
  <style>
    :root{
      --bg:#f8fafc; --panel:#ffffff; --ink:#1e293b; --muted:#64748b; --soft:#e2e8f0;
      --indigo:#4f46e5; --indigo-dark:#4338ca; --indigo-soft:#eef2ff;
      --green:#059669; --green-soft:#d1fae5; --red:#e11d48; --red-soft:#ffe4e6;
      --amber:#b45309; --amber-soft:#fef3c7; --shadow:0 12px 30px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
    body{display:flex;justify-content:center}
    button,input,select{font:inherit}
    button{cursor:pointer;border:0}
    button:disabled{cursor:not-allowed;opacity:.55}
    .app{width:min(960px,100%);min-height:100vh;padding:18px;position:relative}
    .card{background:var(--panel);border:1px solid var(--soft);border-radius:22px;box-shadow:var(--shadow)}
    .intro{max-width:620px;margin:34px auto;padding:28px;text-align:center}
    .heroIcon{width:84px;height:84px;margin:0 auto 18px;border-radius:999px;background:var(--indigo-soft);display:grid;place-items:center;color:var(--indigo);font-size:42px}
    h1{font-size:clamp(25px,4vw,34px);margin:0 0 10px;letter-spacing:.02em}
    h2{font-size:22px;margin:0 0 14px}
    h3{margin:0 0 12px;font-size:17px}
    p{line-height:1.8;color:var(--muted)}
    .section{margin-top:18px;padding:18px;text-align:left;background:#fff;border:1px solid var(--soft);border-radius:16px}
    .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media(max-width:650px){.grid2,.grid3{grid-template-columns:1fr}.app{padding:12px}.intro{margin:14px auto;padding:18px}.experiment{padding:14px}.controlCard{padding:16px}.tableWrap{font-size:12px}}
    label{display:block;font-weight:700;font-size:13px;color:#334155;margin-bottom:6px}
    input[type="text"],input[type="number"],input[type="password"],select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;outline:none;color:var(--ink)}
    input:focus,select:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 18px;border-radius:14px;font-weight:800;transition:.15s transform,.15s background,.15s box-shadow;text-decoration:none}
    .btn:hover{transform:translateY(-1px)}
    .btnPrimary{background:var(--indigo);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.25)}
    .btnPrimary:hover{background:var(--indigo-dark)}
    .btnDark{background:#0f172a;color:#fff}
    .btnGhost{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
    .btnGreen{background:var(--green);color:#fff}
    .btnRed{background:var(--red);color:#fff}
    .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;background:var(--indigo-soft);color:var(--indigo)}
    .hint{font-size:12px;color:#94a3b8;margin-top:8px}
    .settingButtons{display:flex;gap:8px;flex-wrap:wrap}
    .choice{background:#fff;border:2px solid #e2e8f0;border-radius:13px;padding:10px 14px;font-weight:800;color:#64748b;min-width:92px}
    .choice.active{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo)}
    .checkboxLine{display:flex;gap:12px;align-items:flex-start;border:2px solid #e2e8f0;border-radius:14px;padding:13px;cursor:pointer;background:#fff}
    .checkboxLine.active{border-color:var(--indigo);background:var(--indigo-soft)}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
    .progress{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .adminBtn{position:absolute;right:18px;top:18px;width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.9);box-shadow:var(--shadow);font-size:20px;color:#64748b}
    .experiment{max-width:880px;margin:0 auto;padding:22px}
    .stage{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--soft);background:#f8fafc;aspect-ratio:16/10;min-height:300px;display:grid;place-items:center}
    .stage.gridBg{background-image:linear-gradient(rgba(15,23,42,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.08) 1px,transparent 1px);background-size:20px 20px}
    svg{width:100%;height:100%;display:block}
    .controlCard{margin-top:16px;padding:22px}
    .sliderWrap{margin:14px 0 20px}
    input[type="range"]{width:100%;height:44px;accent-color:var(--indigo)}
    .resultOverlay{position:absolute;inset:0;background:rgba(255,255,255,.74);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:5}
    .resultBox{width:min(420px,100%);padding:22px;text-align:center}
    .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
    .stat{padding:16px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;text-align:center}
    .stat .label{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:800;margin-bottom:4px}
    .stat .value{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
    .summary{max-width:820px;margin:26px auto;padding:24px;text-align:center}
    .status{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;text-align:left}
    .statusIcon{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-size:22px;flex:0 0 auto}
    .tableWrap{overflow:auto;border:1px solid var(--soft);border-radius:15px;background:#fff;margin-top:14px}
    table{border-collapse:collapse;width:100%;min-width:640px}
    th,td{padding:11px 12px;border-bottom:1px solid #e2e8f0;text-align:center;white-space:nowrap}
    th{background:#f8fafc;color:#64748b;font-size:12px;text-transform:uppercase}
    td:first-child,th:first-child{text-align:left;background:#f8fafc;font-weight:800;position:sticky;left:0}
    .bars{display:flex;align-items:end;justify-content:center;gap:28px;height:170px;padding:12px 16px 20px;border-top:1px solid #f1f5f9}
    .barItem{width:80px;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
    .bar{width:38px;min-height:8px;border-radius:9px 9px 0 0;background:var(--indigo)}
    .bar.neg{background:var(--red)}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:grid;place-items:center;padding:18px}
    .modalBox{width:min(420px,100%);padding:22px}
    .admin{max-width:920px;margin:20px auto;padding:22px}
    .errorBanner{background:var(--amber-soft);color:var(--amber);border:1px solid #fbbf24;border-radius:14px;padding:12px;margin-bottom:14px;font-weight:700;font-size:13px}
    .fatal{max-width:780px;margin:40px auto;padding:24px;border:2px solid #fecdd3;background:#fff1f2;color:#9f1239;border-radius:18px;white-space:pre-wrap}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
  (function(){
    'use strict';
    const MIN_LENGTH = 50;
    const MAX_LENGTH = 300;
    const DEFAULT_REFERENCE = 150;
    const PRACTICE_TRIAL_COUNT = 10;
    const ADMIN_PASSWORD = 'admin';
    const FIN_LENGTHS = { short:20, medium:40, long:60 };
    const angles = [15,30,45,60];
    const types = ['standard','inverted','control_out','control_in'];
    const lengths = [FIN_LENGTHS.short, FIN_LENGTHS.medium, FIN_LENGTHS.long];
    const root = document.getElementById('root');
    let state = {
      phase:'intro', experimentSets: safeGet('muller_lyer_config_sets','practice'), showFeedback:true,
      subjectInfo:{ id:'', age:'', gender:'unspecified' }, history: loadHistory(), sessionResults: [],
      targetTrialCount:0, currentTrialIndex:0, trialPlan:[], referenceLength:DEFAULT_REFERENCE,
      userLength:DEFAULT_REFERENCE, finAngle:30, finLength:FIN_LENGTHS.medium, illusionType:'standard',
      isRevealed:false, showGrid:false, adminLogin:false, adminInput:'', isAdminMode:false, copyStatus:'idle'
    };

    window.addEventListener('error', function(e){ showFatal('実行時エラーが発生しました。\n' + (e.message || e.error || 'unknown error')); });
    window.addEventListener('unhandledrejection', function(e){ showFatal('非同期処理でエラーが発生しました。\n' + (e.reason && e.reason.message ? e.reason.message : String(e.reason))); });

    function safeGet(key, fallback){ try { return localStorage.getItem(key) || fallback; } catch(e){ return fallback; } }
    function safeSet(key, value){ try { localStorage.setItem(key, value); } catch(e){} }
    function loadHistory(){ try { return JSON.parse(localStorage.getItem('muller_lyer_results_stable') || '[]'); } catch(e){ return []; } }
    function saveHistory(){ safeSet('muller_lyer_results_stable', JSON.stringify(state.history)); }
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
    function uid(){ return 'local-' + Math.random().toString(36).slice(2,10) + '-' + Date.now().toString(36); }
    function nowStr(){ return new Date().toLocaleString('ja-JP'); }
    function getTypeLabel(type){ return ({standard:'標準 (上 >-< vs 下 <->)',inverted:'逆転 (上 <-> vs 下 >-<)',control_out:'対照A (両方 >-<)',control_in:'対照B (両方 <->)'})[type] || type; }
    function getShortTypeLabel(type){ return ({standard:'標準',inverted:'逆転',control_out:'対照A',control_in:'対照B'})[type] || type; }
    function getLengthLabel(len){ if(len===20) return '短い'; if(len===40) return '普通'; if(len===60) return '長い'; return len + 'px'; }
    function getGenderLabel(g){ return ({male:'男性',female:'女性',other:'その他',prefer_not_to_say:'回答しない',unspecified:'未選択'})[g] || g; }
    function getFinPoints(cx, cy, length, angle, isLeftEnd, isInward){
      const rad = angle * Math.PI / 180;
      const xDir = isLeftEnd ? (isInward ? 1 : -1) : (isInward ? -1 : 1);
      const x1 = cx + Math.cos(rad) * length * xDir;
      const y1 = cy - Math.sin(rad) * length;
      const x2 = cx + Math.cos(rad) * length * xDir;
      const y2 = cy + Math.sin(rad) * length;
      return `${x1},${y1} ${cx},${cy} ${x2},${y2}`;
    }
    function icon(name){
      const map = { ruler:'📏', play:'▶', settings:'⚙', user:'👤', check:'✓', csv:'⬇', copy:'⧉', grid:'▦', lock:'🔒', back:'↩', trash:'🗑', stats:'📊', info:'ℹ', cloud:'💾' };
      return map[name] || '•';
    }
    function render(){
      if(state.isAdminMode){ renderAdmin(); return; }
      if(state.phase === 'experiment'){ renderExperiment(); return; }
      if(state.phase === 'summary'){ renderSummary(); return; }
      renderIntro();
    }
    function showFatal(msg){
      root.innerHTML = `<div class="fatal"><strong>画面表示エラー</strong>\n\n${esc(msg)}\n\nこの版では外部CDNを使っていないため、ここに表示された内容が原因特定に使えます。</div>`;
    }

    function renderIntro(){
      root.innerHTML = `
        <main class="app">
          <button class="adminBtn" id="openAdmin" title="教員用メニュー">${icon('settings')}</button>
          <section class="intro card">
            <div class="heroIcon">${icon('ruler')}</div>
            <h1>ミューラー・リヤー錯視実験</h1>
            <p>各試行で、下の線を上の線と「同じ長さ」に見えるように調整してください。</p>
            <div class="errorBanner">安定版：React / Babel / Tailwind / Firebase CDNを使わず、ブラウザ単体で動作します。データはこの端末のlocalStorageとCSVに保存します。</div>
            <div class="section">
              <h3>1. 実験設定</h3>
              <div class="row">
                <span class="pill">${icon('info')} 現在の試行数</span>
                <strong>${state.experimentSets === 'practice' ? `練習試行 (${PRACTICE_TRIAL_COUNT}回)` : `${state.experimentSets}セット (${Number(state.experimentSets) * 48}回)`}</strong>
              </div>
              <p class="hint">※ 教員用メニューから既定のセット数を変更できます。</p>
            </div>
            <div class="section">
              <h3>${icon('user')} 被験者情報 <span class="hint">入力は任意です</span></h3>
              <div class="grid2">
                <div style="grid-column:1/-1"><label>被験者ID / 氏名</label><input id="subjectId" type="text" value="${esc(state.subjectInfo.id)}" placeholder="未入力可（例: sub001）"></div>
                <div><label>年齢</label><input id="subjectAge" type="number" value="${esc(state.subjectInfo.age)}" placeholder="未入力可"></div>
                <div><label>性別</label><select id="subjectGender">
                  ${['unspecified','male','female','other','prefer_not_to_say'].map(g=>`<option value="${g}" ${state.subjectInfo.gender===g?'selected':''}>${getGenderLabel(g)}</option>`).join('')}
                </select></div>
              </div>
            </div>
            <div class="section">
              <h3>フィードバック設定</h3>
              <label class="checkboxLine ${state.showFeedback?'active':''}">
                <input id="showFeedback" type="checkbox" ${state.showFeedback?'checked':''}>
                <span><strong>試行ごとに正解を表示する</strong><br><span class="hint">チェックを外すと、決定後に連続して次の試行へ進みます。</span></span>
              </label>
            </div>
            <button id="startBtn" class="btn btnPrimary" style="width:100%;margin-top:20px;font-size:18px">${icon('play')} 実験を開始する</button>
          </section>
          ${state.adminLogin ? adminLoginModal() : ''}
        </main>`;
      byId('openAdmin').onclick = () => { state.adminLogin = true; render(); };
      byId('startBtn').onclick = () => { readSubjectForm(); startExperiment(); };
      byId('subjectId').oninput = e => { state.subjectInfo.id = e.target.value; };
      byId('subjectAge').oninput = e => { state.subjectInfo.age = e.target.value; };
      byId('subjectGender').onchange = e => { state.subjectInfo.gender = e.target.value; };
      byId('showFeedback').onchange = e => { state.showFeedback = e.target.checked; render(); };
      bindAdminModal();
    }
    function byId(id){ return document.getElementById(id); }
    function readSubjectForm(){
      state.subjectInfo.id = byId('subjectId') ? byId('subjectId').value : state.subjectInfo.id;
      state.subjectInfo.age = byId('subjectAge') ? byId('subjectAge').value : state.subjectInfo.age;
      state.subjectInfo.gender = byId('subjectGender') ? byId('subjectGender').value : state.subjectInfo.gender;
    }
    function adminLoginModal(){
      return `<div class="modal"><div class="modalBox card"><div class="row"><h2>${icon('lock')} 管理者ログイン</h2><button class="btn btnGhost" id="closeAdmin">×</button></div><form id="adminForm"><label>パスワード</label><input id="adminPass" type="password" autofocus placeholder="パスワードを入力"><button class="btn btnPrimary" style="width:100%;margin-top:14px" type="submit">ログイン</button></form><p class="hint">初期値は元ファイルと同じく admin です。公開時は変更してください。</p></div></div>`;
    }
    function bindAdminModal(){
      const close = byId('closeAdmin'); if(close) close.onclick = () => { state.adminLogin = false; render(); };
      const form = byId('adminForm'); if(form) form.onsubmit = e => { e.preventDefault(); const v = byId('adminPass').value; if(v === ADMIN_PASSWORD){ state.isAdminMode = true; state.adminLogin = false; render(); } else { alert('パスワードが違います'); } };
    }

    function startExperiment(){
      const plan = generatePlan(state.experimentSets);
      state.targetTrialCount = plan.length;
      state.trialPlan = plan;
      state.sessionResults = [];
      state.currentTrialIndex = 0;
      state.phase = 'experiment';
      applyCondition(plan[0]);
      render();
    }
    function generatePlan(sets){
      let base = [];
      types.forEach(type => angles.forEach(angle => lengths.forEach(finLength => base.push({type, angle, finLength}))));
      shuffle(base);
      if(sets === 'practice') return base.slice(0, PRACTICE_TRIAL_COUNT);
      let full = [];
      for(let i=0;i<Number(sets);i++){ const s = base.slice(); shuffle(s); full = full.concat(s); }
      return full;
    }
    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
    function randomizeLengths(){
      const ref = Math.floor(Math.random() * 100) + 100;
      state.referenceLength = ref;
      let startVal = ref + (Math.random() > .5 ? 60 : -60);
      state.userLength = Math.max(MIN_LENGTH, Math.min(MAX_LENGTH, startVal));
      state.isRevealed = false;
    }
    function applyCondition(c){ state.illusionType = c.type; state.finAngle = c.angle; state.finLength = c.finLength; randomizeLengths(); }
    function currentDiff(){ const diff = state.userLength - state.referenceLength; return { diff, diffPercent: ((diff / state.referenceLength) * 100).toFixed(1) }; }
    function drawLine(cx, cy, len, angle, finLength, isInward, color, revealed){
      const half = len/2, sx = cx-half, ex = cx+half;
      return `<g><line x1="${sx}" y1="${cy}" x2="${ex}" y2="${cy}" stroke="${color}" stroke-width="4" stroke-linecap="round" />
        <polyline points="${getFinPoints(sx,cy,finLength,angle,true,isInward)}" stroke="${color}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="${getFinPoints(ex,cy,finLength,angle,false,isInward)}" stroke="${color}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        ${revealed ? `<text x="${cx}" y="${cy-22}" text-anchor="middle" fill="#64748b" font-size="14" font-weight="800">${len}px</text>` : ''}</g>`;
    }
    function renderExperiment(){
      const {diff, diffPercent} = currentDiff();
      const isRefInward = ['standard','control_out'].includes(state.illusionType);
      const isUserInward = ['inverted','control_out'].includes(state.illusionType);
      const userColor = state.isRevealed && state.showFeedback ? (Math.abs(diff)<5 ? '#10b981' : '#e11d48') : '#4f46e5';
      const refStart = 250 - state.referenceLength/2, refEnd = 250 + state.referenceLength/2;
      root.innerHTML = `
        <main class="app">
          <section class="experiment">
            <div class="topbar">
              <div class="progress"><span class="pill">Trial ${state.currentTrialIndex + 1} / ${state.targetTrialCount}</span><span class="hint">進行度: ${Math.round(((state.currentTrialIndex + 1) / state.targetTrialCount) * 100)}%</span></div>
              <button id="toggleGrid" class="btn btnGhost">${icon('grid')} 補助線</button>
            </div>
            <div class="stage ${state.showGrid ? 'gridBg':''}">
              <svg viewBox="0 0 500 400" aria-label="ミューラー・リヤー錯視刺激">
                ${state.isRevealed && state.showFeedback ? `<g opacity=".55"><line x1="${refStart}" y1="60" x2="${refStart}" y2="340" stroke="#ef4444" stroke-dasharray="4"/><line x1="${refEnd}" y1="60" x2="${refEnd}" y2="340" stroke="#ef4444" stroke-dasharray="4"/><line x1="250" y1="60" x2="250" y2="340" stroke="#94a3b8" stroke-dasharray="2"/></g>` : ''}
                <text x="250" y="54" text-anchor="middle" fill="#3730a3" font-size="12" font-weight="900" letter-spacing="1">基準 (Reference)</text>
                ${drawLine(250,100,state.referenceLength,state.finAngle,state.finLength,isRefInward,'#1e293b',state.isRevealed && state.showFeedback)}
                <text x="250" y="360" text-anchor="middle" fill="#4f46e5" font-size="12" font-weight="900" letter-spacing="1">調整 (Adjust)</text>
                ${drawLine(250,300,state.userLength,state.finAngle,state.finLength,isUserInward,userColor,state.isRevealed && state.showFeedback)}
              </svg>
              ${state.isRevealed && state.showFeedback ? `<div class="resultOverlay"><div class="resultBox card"><h2>結果確認</h2><div class="statGrid"><div class="stat"><div class="label">誤差</div><div class="value" style="color:${diff>=0?'#4f46e5':'#e11d48'}">${diff>=0?'+':''}${diff}px</div></div><div class="stat"><div class="label">錯視率</div><div class="value">${diffPercent}%</div></div></div><button id="nextBtn" class="btn btnPrimary" style="width:100%">${state.currentTrialIndex < state.targetTrialCount - 1 ? '次の試行へ' : '結果を保存して終了'}</button></div></div>` : ''}
            </div>
            <div class="controlCard card">
              <div class="row"><h2>長さを調整してください</h2><span class="pill">${state.userLength}px</span></div>
              <div class="sliderWrap"><input id="lenSlider" type="range" min="${MIN_LENGTH}" max="${MAX_LENGTH}" step="1" value="${state.userLength}" ${state.isRevealed && state.showFeedback ? 'disabled':''}></div>
              <button id="confirmBtn" class="btn btnPrimary" style="width:100%" ${state.isRevealed ? 'disabled':''}>${state.showFeedback ? '決定・確認する' : '決定して次へ'}</button>
              <p class="hint" style="text-align:center">条件: ${getTypeLabel(state.illusionType).split('(')[0].trim()} / ${state.finAngle}° / ${getLengthLabel(state.finLength)}</p>
            </div>
          </section>
        </main>`;
      byId('toggleGrid').onclick = () => { state.showGrid = !state.showGrid; render(); };
      byId('lenSlider').oninput = e => { state.userLength = parseInt(e.target.value,10); render(); };
      byId('confirmBtn').onclick = handleConfirm;
      const next = byId('nextBtn'); if(next) next.onclick = handleNextTrial;
    }
    function makeResult(){
      const {diff, diffPercent} = currentDiff();
      const existingUserId = safeGet('muller_lyer_local_user_id', '');
      const localUserId = existingUserId || createLocalUser();
      return { id:uid(), localUserId:localUserId, timestamp:nowStr(), subjectId:state.subjectInfo.id, subjectAge:state.subjectInfo.age, subjectGender:state.subjectInfo.gender, type:state.illusionType, angle:state.finAngle, finLength:state.finLength, refLen:state.referenceLength, userLen:state.userLength, diff:diff, diffPercent:diffPercent };
    }
    function createLocalUser(){ const id='local-user-' + Math.random().toString(36).slice(2,10); safeSet('muller_lyer_local_user_id',id); return id; }
    function saveResult(){ const r = makeResult(); state.sessionResults.push(r); state.history.unshift(r); saveHistory(); }
    function handleConfirm(){
      if(state.showFeedback){ state.isRevealed = true; render(); }
      else { state.isRevealed = true; saveResult(); advanceTrial(); }
    }
    function handleNextTrial(){ if(state.showFeedback) saveResult(); advanceTrial(); }
    function advanceTrial(){
      const ni = state.currentTrialIndex + 1;
      if(ni >= state.targetTrialCount){ state.phase = 'summary'; render(); }
      else { state.currentTrialIndex = ni; applyCondition(state.trialPlan[ni]); render(); }
    }

    function summaryStats(results){
      const avg = results.length ? (results.reduce((a,r)=>a+parseFloat(r.diffPercent),0)/results.length).toFixed(1) : '0.0';
      const matrix = {};
      types.forEach(t=>{ matrix[t]={}; angles.forEach(a=>{ const rows=results.filter(r=>r.type===t && Number(r.angle)===a); matrix[t][a]=rows.length ? (rows.reduce((s,r)=>s+parseFloat(r.diffPercent),0)/rows.length).toFixed(1) : '-'; }); });
      const lenStats = lengths.map(len=>{ const rows=results.filter(r=>Number(r.finLength)===len); const avg=rows.length ? (rows.reduce((s,r)=>s+parseFloat(r.diffPercent),0)/rows.length).toFixed(1) : '0.0'; return {len,avg}; });
      return {avg,matrix,lenStats};
    }
    function renderSummary(){
      const s = summaryStats(state.sessionResults);
      root.innerHTML = `
        <main class="app"><section class="summary card">
          <div class="heroIcon" style="background:var(--green-soft);color:var(--green)">${icon('check')}</div>
          <h1>実験終了</h1><p>お疲れ様でした。全${state.targetTrialCount}回の試行が完了しました。</p>
          <div class="status"><div class="statusIcon">${icon('cloud')}</div><div><strong>保存完了</strong><br><span class="hint">この端末のlocalStorageに保存しました。必要に応じてCSVをダウンロードしてください。</span></div></div>
          <div class="grid2" style="margin-top:16px"><button id="downloadSession" class="btn btnPrimary">${icon('csv')} CSVダウンロード</button><button id="copySession" class="btn btnGreen">${icon('copy')} ${state.copyStatus==='copied'?'コピーしました':'クリップボードにコピー'}</button></div>
          <div class="stat" style="max-width:320px;margin:18px auto"><div class="label">全体の平均錯視率</div><div class="value" style="color:var(--indigo)">${s.avg}%</div></div>
          ${matrixTable(s.matrix)}
          ${lengthBars(s.lenStats)}
          <button id="restart" class="btn btnDark" style="width:min(360px,100%);margin-top:20px">タイトルに戻る</button>
        </section></main>`;
      byId('downloadSession').onclick = () => downloadCSV(state.sessionResults, 'muller_lyer_session_results');
      byId('copySession').onclick = () => copyTSV(state.sessionResults, true);
      byId('restart').onclick = () => { state.phase = 'intro'; state.copyStatus='idle'; render(); };
    }
    function matrixTable(matrix){
      return `<div class="tableWrap"><table><thead><tr><th>パターン \ 角度</th>${angles.map(a=>`<th>${a}°</th>`).join('')}</tr></thead><tbody>${types.map(t=>`<tr><td>${getShortTypeLabel(t)}</td>${angles.map(a=>{ const v=matrix[t][a]; const n=parseFloat(v); const c=!isNaN(n) && n>5?'#4f46e5':(!isNaN(n)&&n<-5?'#e11d48':'#334155'); return `<td style="color:${c};font-weight:${!isNaN(n)&&Math.abs(n)>5?'900':'600'}">${v!=='-'&&Number(v)>0?'+':''}${v}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    function lengthBars(lenStats){
      return `<div class="card" style="margin-top:16px;box-shadow:none"><h3 style="padding:16px 16px 0">${icon('stats')} 矢羽の長さ別 平均錯視率</h3><div class="bars">${lenStats.map(st=>{ const h=Math.min(115,Math.max(10,Math.abs(parseFloat(st.avg))*3)); const neg=parseFloat(st.avg)<0; return `<div class="barItem"><strong>${st.avg}%</strong><div class="bar ${neg?'neg':''}" style="height:${h}px"></div><span class="hint">${getLengthLabel(st.len)}</span></div>`; }).join('')}</div><p class="hint" style="padding:0 16px 14px;text-align:center">一般に、矢羽が長いほど錯視量は大きくなる傾向があります。</p></div>`;
    }

    function csvRows(results){
      const headers = ['User ID','被験者ID','年齢','性別','日時','パターン','角度(度)','矢羽長さ(px)','基準の長さ(px)','調整した長さ(px)','誤差(px)','錯視率(%)'];
      const rows = results.map(r => [r.localUserId||'',r.subjectId||'',r.subjectAge||'',getGenderLabel(r.subjectGender),r.timestamp||'',getTypeLabel(r.type).split('(')[0].trim(),r.angle,r.finLength,r.refLen,r.userLen,r.diff,r.diffPercent]);
      return {headers,rows};
    }
    function downloadCSV(results, base){
      if(!results.length){ alert('データがありません'); return; }
      const {headers,rows} = csvRows(results);
      const escapeCSV = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
      const content = '\uFEFF' + headers.map(escapeCSV).join(',') + '\n' + rows.map(row=>row.map(escapeCSV).join(',')).join('\n');
      const blob = new Blob([content], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${base}_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }
    function copyText(text){
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
    }
    function copyTSV(results, session){
      if(!results.length){ alert('データがありません'); return; }
      const {headers,rows} = csvRows(results);
      const text = headers.join('\t') + '\n' + rows.map(r=>r.join('\t')).join('\n');
      if(copyText(text)){ state.copyStatus='copied'; render(); setTimeout(()=>{ state.copyStatus='idle'; if(state.phase==='summary') render(); },2000); }
      else alert('コピーに失敗しました');
    }

    function renderAdmin(){
      const s = summaryStats(state.history);
      root.innerHTML = `<main class="app"><section class="admin card"><div class="row"><div><h1>${icon('settings')} 教員用管理画面</h1><p class="hint">安定版では、全学生Firebase集約ではなく、この端末に保存されたデータを管理します。</p></div><button id="adminBack" class="btn btnGhost">${icon('back')} 戻る</button></div>
        <div class="section"><h3>実験セット数（この端末の既定値）</h3><div class="settingButtons">${['practice','1','2'].map(v=>`<button class="choice ${String(state.experimentSets)===String(v)?'active':''}" data-set="${v}">${v==='practice'?`練習(${PRACTICE_TRIAL_COUNT}回)`:v+'セット'}</button>`).join('')}</div><p class="hint">1セットは、4パターン × 4角度 × 3矢羽長さ = 48試行です。</p></div>
        <div class="grid3" style="margin-top:16px"><div class="stat"><div class="label">保存済み試行数</div><div class="value">${state.history.length}</div></div><div class="stat"><div class="label">平均錯視率</div><div class="value" style="color:var(--indigo)">${s.avg}%</div></div><div class="stat"><div class="label">被験者ID数</div><div class="value">${new Set(state.history.map(r=>r.subjectId||'(未入力)')).size}</div></div></div>
        <div class="grid3" style="margin-top:16px"><button id="adminCSV" class="btn btnPrimary">${icon('csv')} 全CSV</button><button id="adminCopy" class="btn btnGreen">${icon('copy')} コピー</button><button id="adminClear" class="btn btnRed">${icon('trash')} この端末の履歴削除</button></div>
        <div class="tableWrap"><table><thead><tr><th>日時</th><th>被験者ID</th><th>条件</th><th>誤差</th><th>錯視率</th></tr></thead><tbody>${state.history.length?state.history.slice(0,250).map(r=>`<tr><td>${esc(r.timestamp)}</td><td>${esc(r.subjectId||'-')}</td><td>${getShortTypeLabel(r.type)} / ${r.angle}° / ${getLengthLabel(Number(r.finLength))}</td><td>${Number(r.diff)>0?'+':''}${r.diff}</td><td>${r.diffPercent}%</td></tr>`).join(''):`<tr><td colspan="5">データがまだありません</td></tr>`}</tbody></table></div>
      </section></main>`;
      byId('adminBack').onclick = () => { state.isAdminMode=false; render(); };
      document.querySelectorAll('[data-set]').forEach(btn => btn.onclick = () => { state.experimentSets = btn.getAttribute('data-set'); safeSet('muller_lyer_config_sets', state.experimentSets); render(); });
      byId('adminCSV').onclick = () => downloadCSV(state.history, 'muller_lyer_all_results');
      byId('adminCopy').onclick = () => copyTSV(state.history, false);
      byId('adminClear').onclick = () => { if(confirm('この端末に保存された実験データを削除しますか？')){ state.history=[]; saveHistory(); render(); } };
    }

    render();
  })();
  </script>
</body>
</html>
