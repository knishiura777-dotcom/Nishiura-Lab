<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>西浦研究室は新しいサイトへ移転しました</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://nishiura-lab.workspace-370172.chatgpt.site/">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: #101412;
      color: #f1eee6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    main { width: min(680px, 100%); }
    .mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid #d8f05a;
      border-radius: 50%;
      color: #d8f05a;
      font-family: Georgia, serif;
      font-style: italic;
    }
    p { color: rgba(255,255,255,.64); line-height: 1.9; }
    h1 { margin: 28px 0 18px; font-family: "Yu Mincho", Georgia, serif; font-weight: 400; font-size: clamp(32px, 6vw, 64px); }
    a { color: #d8f05a; }
  </style>
  <script>
    const base = "https://nishiura-lab.workspace-370172.chatgpt.site/";
    const allowed = new Set(["#principle", "#research", "#profile", "#publications", "#contact"]);
    const destination = allowed.has(window.location.hash) ? base + window.location.hash : base;
    window.location.replace(destination);
  </script>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>西浦研究室は移転しました。</h1>
    <p>自動的に新しい公式サイトへ移動します。移動しない場合は、<a href="https://nishiura-lab.workspace-370172.chatgpt.site/">Nishiura Lab 新サイト</a>を開いてください。</p>
    <p>Web心理学実験は、<a href="./experiments.html">実験プラットフォーム</a>から引き続き利用できます。</p>
  </main>
</body>
</html>
