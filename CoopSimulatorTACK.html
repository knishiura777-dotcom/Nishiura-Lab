<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoopSimulator TACK stable noCDN</title>
<style>
:root{--bg:#0f172a;--panel:rgba(15,23,42,.94);--line:rgba(255,255,255,.12);--cyan:#06b6d4;--emerald:#10b981;--rose:#f43f5e;--yellow:#eab308;--purple:#a855f7;--muted:#94a3b8;--text:#f8fafc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Hiragino Sans','Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
body{background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:20px 20px;padding:18px 12px 150px;touch-action:manipulation}.wrap{max-width:560px;margin:0 auto}.screen{min-height:calc(100vh - 30px);display:flex;align-items:center;justify-content:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.45);padding:22px}.glass{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.title{font-weight:900;letter-spacing:.02em;line-height:1.1}.grad{background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tiny{font-size:11px}.small{font-size:13px}.btn{border:1px solid rgba(255,255,255,.14);background:#1e293b;color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;transition:.15s transform,.15s background,.15s border-color}.btn:hover{background:#334155;border-color:#22d3ee}.btn:active{transform:scale(.98)}.btn.primary{background:#0891b2;border-color:#22d3ee;box-shadow:0 0 22px rgba(6,182,212,.25)}.btn.good{background:#047857;border-color:#34d399}.btn.warn{background:#854d0e;border-color:#eab308}.btn.bad{background:#9f1239;border-color:#fb7185}.top{position:sticky;top:12px;z-index:5;padding:16px;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bar{height:8px;background:#1e293b;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;width:0;transition:width .45s cubic-bezier(.2,.9,.25,1)}.map{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;aspect-ratio:10/5;background:rgba(2,6,23,.5);padding:6px;border-radius:10px}.cell{border-radius:2px;background:#334155;opacity:.55;transition:.35s}.cell.connected{background:#06b6d4;box-shadow:0 0 7px #06b6d4;opacity:1}.cell.risk{background:#eab308;opacity:1}.cell.critical{background:#f43f5e;box-shadow:0 0 8px #f43f5e;opacity:1;animation:pulse 1s infinite}.cell.non{opacity:.2}@keyframes pulse{50%{opacity:.55}}.statbox{padding:10px;border-radius:13px;background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.08);text-align:center}.log{font-size:12px;line-height:1.45;background:rgba(30,41,59,.45);border-left:3px solid #06b6d4;border-radius:9px;padding:9px;color:#cbd5e1;margin:6px 0}.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,42,.97);border-top:1px solid #334155;box-shadow:0 -10px 30px rgba(0,0,0,.4);padding:12px;z-index:10}.footer .inner{max-width:560px;margin:0 auto}.strategy{min-height:86px;padding:10px 8px;position:relative}.badge{position:absolute;top:5px;right:5px;font-size:10px;background:rgba(6,182,212,.16);border:1px solid rgba(34,211,238,.35);color:#a5f3fc;border-radius:999px;padding:1px 6px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.modalBox{max-width:480px;width:100%;max-height:86vh;overflow:auto;background:#0f172a;border:1px solid rgba(255,255,255,.16);border-radius:20px;box-shadow:0 20px 80px rgba(0,0,0,.65)}.modalHead{padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:#111827}.modalBody{padding:16px}.choice{width:100%;text-align:left;margin:7px 0}.forecast{background:rgba(2,6,23,.65);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}.factor{padding:8px;border-radius:12px;background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.06);cursor:pointer}.factor .num{font-weight:900}.introText{white-space:pre-wrap;line-height:1.75;color:#6ee7b7}.blink{display:inline-block;width:8px;height:16px;background:#6ee7b7;margin-left:4px;animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}.lang{position:fixed;top:12px;right:12px;z-index:20}.notice{border-left:4px solid #22d3ee;background:rgba(6,182,212,.08);padding:12px;border-radius:12px;color:#cbd5e1}.resultBar{height:10px;background:#1e293b;border-radius:999px;overflow:hidden}.resultBar i{display:block;height:100%}@media(max-width:430px){.grid3{gap:6px}.strategy{font-size:12px}.card{padding:18px}body{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';
const root=document.getElementById('root');
const MAX_TURNS=24, INITIAL_BUDGET=5000, C={NORMAL:'normal',RISK:'risk',CRITICAL:'critical',CONNECTED:'connected'};
const txt={ja:{budget:'予算',burn:'現場疲弊',together:'Togetherness（連帯）',start:'実験開始',intro:'A案：協力を「合理」へ',desc:'講演用実験モード：善意や精神論だけでなく、システム投資によってTACK因子を維持できるか確認してください。',accept:'ミッションを受諾する',retry:'再実験する',result:'TACK ANALYSIS'},en:{budget:'BUDGET',burn:'Burnout',together:'Togetherness',start:'Start Experiment',intro:'Plan A: Rationalize Cooperation',desc:'Lecture mode: verify whether systemic investment can maintain TACK factors instead of relying on goodwill alone.',accept:'Accept Mission',retry:'Retry Experiment',result:'TACK ANALYSIS'}};
const introText={ja:`西暦2035年。\n日本の人口減少は「危険水域」を突破した。\n\n行政サービスは撤退し、人々は社会の隙間に落ちていく。\n\nあなたの使命は、生協の物流網を社会的共通資本へ変えること。\n\nTACK因子を守れ。\nTogetherness / Agency / Coherence / Kinetics`,en:`AD 2035.\nJapan's depopulation has breached the critical zone.\n\nPublic services are retreating. People fall into the cracks of society.\n\nYour mission is to turn the Co-op logistics network into social common capital.\n\nProtect the TACK factors.\nTogetherness / Agency / Coherence / Kinetics`};
const factors=[
 {id:'agency',lab:{ja:'Agency',en:'Agency'},sub:{ja:'能動性',en:'agency'},color:'#34d399',desc:{ja:'自分で考え、動ける余白。',en:'Space to think and act.'}},
 {id:'meaning',lab:{ja:'Coherence',en:'Coherence'},sub:{ja:'一貫性',en:'coherence'},color:'#c084fc',desc:{ja:'目的と行動のつながり。',en:'Alignment of purpose and action.'}},
 {id:'vitality',lab:{ja:'Kinetics',en:'Kinetics'},sub:{ja:'動性',en:'kinetics'},color:'#facc15',desc:{ja:'未来へ進む活力。',en:'Vital energy toward the future.'}},
 {id:'connection',lab:{ja:'Kizuna',en:'Kizuna'},sub:{ja:'絆',en:'bond'},color:'#22d3ee',desc:{ja:'孤立を防ぐつながり。',en:'Connections preventing isolation.'}}
];
const strategies={
 delivery_sensing:{title:{ja:'見守り配送',en:'Sensing Delivery'},sub:{ja:'物流網をセーフティネットへ',en:'Logistics as safety net'},desc:{ja:'配送員が地域の異変を早期発見します。',en:'Delivery staff detect local issues early.'},pros:{ja:'KizunaとCoherenceを伸ばす。',en:'Improves Kizuna and Coherence.'},cons:{ja:'現場負担が増える。',en:'Increases workload.'},eff:{b:-300,bo:5,c:5,wb:{connection:15,meaning:10}}},
 product_social:{title:{ja:'時短Kit開発',en:'Time-Saving Kit'},sub:{ja:'時間を売る商品戦略',en:'Selling time'},desc:{ja:'家事負担を減らし、家庭の余白を作ります。',en:'Reduces household burden and creates space.'},pros:{ja:'AgencyとKineticsを伸ばす。',en:'Improves Agency and Kinetics.'},cons:{ja:'開発コストがかかる。',en:'Development costs.'},eff:{b:-200,bo:-2,c:2,wb:{agency:15,vitality:5}}},
 hub_commons:{title:{ja:'拠点開放',en:'Open Commons'},sub:{ja:'店舗を地域の居場所へ',en:'Stores as community hubs'},desc:{ja:'店舗を高齢者や子どもの居場所として開きます。',en:'Open stores as places for elderly and children.'},pros:{ja:'KizunaとKineticsを伸ばす。',en:'Improves Kizuna and Kinetics.'},cons:{ja:'維持管理コストがかかる。',en:'Maintenance costs.'},eff:{b:-150,bo:2,c:3,wb:{connection:10,vitality:10}}},
 default:{title:{ja:'通常業務',en:'Business as Usual'},sub:{ja:'効率と利益の追求',en:'Efficiency only'},desc:{ja:'短期収益は増えますが、Agency/Coherence/Kineticsを削ります。',en:'Short-term budget rises, but Agency/Coherence/Kinetics drop.'},pros:{ja:'予算を確保。',en:'Secures budget.'},cons:{ja:'精神論になりやすく、TACKが崩れやすい。',en:'TACK factors may collapse.'},eff:{b:200,bo:15,c:0,t:-1,wb:{agency:-5,meaning:-5,vitality:-5}}}
};
const events=[
 {title:{ja:'【行政】ハンコDX地獄',en:'Hanko DX Hell'},desc:{ja:'DX推進なのに、完了画面を印刷して押印せよと言われました。',en:'DX required, yet a printed screenshot with a seal is demanded.'},choices:[
  {t:{ja:'独自アプリで吸収',en:'Absorb with app'},eff:{b:-150,bo:0,c:5,wb:{agency:15}},msg:{ja:'システムで矛盾を吸収。Agencyが戻りました。',en:'The system absorbed the contradiction. Agency returned.'}},
  {t:{ja:'現場に丸投げ',en:'Dump to field'},eff:{b:0,bo:15,c:0,wb:{agency:-15,meaning:-10}},msg:{ja:'現場の余白と意味が削られました。',en:'Agency and Coherence dropped.'}},
  {t:{ja:'気合で処理',en:'Handle by grit'},eff:{b:0,bo:20,c:0,wb:{vitality:-15}},msg:{ja:'一時的に処理できましたがKineticsが低下。',en:'Handled temporarily; Kinetics dropped.'}}]},
 {title:{ja:'【現場】ベテランの独裁',en:'Veteran Dictatorship'},desc:{ja:'勤続30年のスタッフが実権を握り、若手が黙っています。',en:'A 30-year veteran dominates; young staff go silent.'},choices:[
  {t:{ja:'名誉役割を設計',en:'Design honorary role'},eff:{b:-50,bo:-5,c:5,wb:{meaning:10,connection:5}},msg:{ja:'役割設計でCoherenceとKizunaが回復。',en:'Role design restored Coherence and Kizuna.'}},
  {t:{ja:'効率のため全権委任',en:'Delegate all for efficiency'},eff:{b:100,bo:20,c:0,wb:{agency:-10,vitality:-10}},msg:{ja:'効率は上がりましたがAgencyが死にました。',en:'Efficiency rose, but Agency died.'}},
  {t:{ja:'放置',en:'Ignore'},eff:{b:0,bo:10,c:0,wb:{connection:-15}},msg:{ja:'チームの分断が進みました。',en:'Team division progressed.'}}]},
 {title:{ja:'【地域】豆腐1000丁',en:'1000 Tofu Bricks'},desc:{ja:'誤発注で豆腐1000丁。どう処理しますか。',en:'A misorder brings 1000 tofu bricks.'},choices:[
  {t:{ja:'豆腐祭りへ転換',en:'Turn into Tofu Fest'},eff:{b:-50,bo:10,c:10,wb:{vitality:20,connection:10}},msg:{ja:'KineticsとKizunaが大きく伸びました。',en:'Kinetics and Kizuna improved greatly.'}},
  {t:{ja:'全廃棄と始末書',en:'Discard and apologize'},eff:{b:-100,bo:5,c:0,wb:{meaning:-10,agency:-10}},msg:{ja:'CoherenceとAgencyが低下。',en:'Coherence and Agency dropped.'}},
  {t:{ja:'寄付でつなぐ',en:'Donate to connect'},eff:{b:-70,bo:0,c:8,wb:{meaning:12,connection:8}},msg:{ja:'赤字ですが意味と絆が伸びました。',en:'A loss, but Coherence and Kizuna rose.'}}]}
];
let s;
function hh(){return Array.from({length:100},(_,i)=>({id:i,isMember:Math.random()>.3,status:C.NORMAL}));}
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}function pick(a){return a[Math.floor(Math.random()*a.length)]}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function reset(){s={lang:'ja',screen:'intro',turn:1,budget:INITIAL_BUDGET,burnout:20,trust:100,wb:{connection:30,agency:40,meaning:50,vitality:40},hh:hh(),logs:[],event:null,confirm:null,used:[],exp:{delivery_sensing:0,product_social:0,hub_commons:0},final:null};render();typeIntro();}
function tr(k){return txt[s.lang][k];}function L(obj){return obj[s.lang]||obj.ja||obj.en}
function log(o){s.logs=[o,...s.logs].slice(0,5)}function level(id){let e=s.exp[id]||0;return e>=5?3:e>=2?2:1}
function eff(id){const b=JSON.parse(JSON.stringify(strategies[id].eff));if(id==='default')return b;const lv=level(id),m=lv===3?1.5:lv===2?1.2:1,d=lv===3?50:0;if(b.wb)Object.keys(b.wb).forEach(k=>b.wb[k]*=m);if(b.c)b.c*=m;if(b.b<0)b.b=Math.min(0,b.b+d);return b;}
function metrics(){const c=s.hh.filter(h=>h.status===C.CONNECTED).length;const q=s.hh.filter(h=>h.status===C.CRITICAL).length;return{p:Math.floor(c/s.hh.length*100),critical:q}}
function finalScore(){return{tack:{t:s.trust,a:s.wb.agency,c:s.wb.meaning,k:s.wb.vitality,kizuna:s.wb.connection}}}
function end(){if(s.budget<=0||s.burnout>=100||s.trust<=0||s.turn>MAX_TURNS){s.final=finalScore();s.screen='result';}}
function process(e){s.trust=clamp(s.trust+(e.t||0),0,100);let inc=150;if(s.trust<50)inc=Math.floor(inc*(s.trust/50));s.budget+=inc+(e.b||0);s.burnout=clamp(s.burnout-2+(e.bo||0),0,100);if(e.wb)Object.keys(e.wb).forEach(k=>s.wb[k]=clamp((s.wb[k]||0)+e.wb[k],0,100));const res=Object.values(s.wb).reduce((a,b)=>a+b,0)/4;const risk=clamp(.08-res/2000,.01,.15);const base=(e.c||0)/100;s.hh=s.hh.map(h=>{let st=h.status;if(h.isMember){if(st===C.NORMAL&&Math.random()<risk)st=C.RISK;else if(st===C.RISK&&Math.random()<risk*2.5)st=C.CRITICAL;let cc=base;if(st===C.CRITICAL)cc*=.3;cc+=res/1000;if(st!==C.CONNECTED&&Math.random()<cc)st=C.CONNECTED;}return{...h,status:st}});s.turn++;end();render();}
function choose(id){s.confirm=id;render()}function execute(id){s.confirm=null;if(id!=='default'){const before=level(id);s.exp[id]=(s.exp[id]||0)+1;if(level(id)>before)log({ja:`【LvUP】${strategies[id].title.ja} Lv${level(id)}になりました`,en:`【LvUP】${strategies[id].title.en} is now Lv${level(id)}`});}if(Math.random()<.45){const pool=events.filter(e=>!s.used.includes(e.title.ja));const ev=pool.length?pick(pool):pick(events);s.event=ev;s.used.push(ev.title.ja);render();return;}process(eff(id));}
function resolve(i){const c=s.event.choices[i];log(c.msg);s.event=null;process(c.eff)}
function typeIntro(){const el=document.getElementById('introText');if(!el)return;const text=introText[s.lang];let i=0;el.textContent='';const timer=setInterval(()=>{if(s.screen!=='intro'){clearInterval(timer);return;}i++;el.textContent=text.slice(0,i);if(i>=text.length)clearInterval(timer);},20)}
function langBtn(){return `<button class="btn lang" data-act="lang">${s.lang==='ja'?'EN':'JP'}</button>`}
function htmlIntro(){return `${langBtn()}<div class="screen"><div style="max-width:560px;width:100%"><pre id="introText" class="introText mono"></pre><span class="blink"></span><div style="margin-top:32px;text-align:center"><button class="btn primary" data-act="start">${tr('accept')}</button></div></div></div>`}
function htmlStart(){return `${langBtn()}<div class="screen"><div class="card" style="max-width:430px;width:100%;text-align:center"><div class="mono tiny" style="color:#22d3ee">${tr('intro')}</div><h1 class="title" style="font-size:35px"><span class="grad">CoopSimulator</span><br><span style="font-size:22px;color:#94a3b8">TACK Model Edition</span></h1><div class="notice" style="text-align:left">${tr('desc')}</div><div class="grid2" style="margin:18px 0"><div class="factor"><b style="color:#facc15">Togetherness</b></div><div class="factor"><b style="color:#34d399">Agency</b></div><div class="factor"><b style="color:#c084fc">Coherence</b></div><div class="factor"><b style="color:#facc15">Kinetics</b></div></div><button class="btn primary" data-act="play" style="width:100%">${tr('start')} →</button></div></div>`}
function header(){return `<div class="top glass">${langBtn()}<div class="row"><div><div class="tiny muted">${tr('budget')}</div><div class="mono" style="font-size:26px;font-weight:900">¥${Math.floor(s.budget).toLocaleString()}k</div></div><div style="text-align:right"><div class="tiny muted">TURN</div><div style="font-size:22px;font-weight:900;color:#22d3ee">${s.turn}<span class="small muted">/${MAX_TURNS}</span></div></div><button class="btn" data-act="help" style="padding:9px 12px">?</button></div><div style="margin-top:14px"><div class="row tiny"><b style="color:#fb7185">${tr('burn')}</b><span>${Math.floor(s.burnout)}%</span></div><div class="bar"><i style="width:${s.burnout}%;background:#f43f5e"></i></div></div><div style="margin-top:10px"><div class="row tiny"><b style="color:#facc15">${tr('together')}</b><span>${Math.floor(s.trust)}%</span></div><div class="bar"><i style="width:${s.trust}%;background:#eab308"></i></div></div><div class="grid4" style="margin-top:14px">${factors.map(f=>`<div class="factor" data-act="help"><div style="color:${f.color};font-weight:900">${f.lab[s.lang]}</div><div class="num">${Math.floor(s.wb[f.id])}</div></div>`).join('')}</div></div>`}
function mapHtml(){const m=metrics();return `<div class="glass" style="padding:12px;margin:0 0 14px"><div class="row tiny" style="margin-bottom:8px"><b class="muted">MONITORING AREA</b><span style="color:#22d3ee">Coverage ${m.p}%</span></div><div class="map">${s.hh.slice(0,50).map(h=>`<i class="cell ${!h.isMember?'non':h.status}"></i>`).join('')}</div><div class="tiny" style="text-align:right;margin-top:7px;color:#fb7185">${m.critical?`⚠ Critical: ${m.critical}`:''}</div></div>`}
function footer(){return `<div class="footer"><div class="inner"><div class="grid3">${['delivery_sensing','product_social','hub_commons'].map(id=>`<button class="btn strategy" data-strategy="${id}"><span class="badge">Lv.${level(id)}</span><div style="font-size:20px">${id==='delivery_sensing'?'🚚':id==='product_social'?'⏱':'🏠'}</div><div>${L(strategies[id].title)}</div><div class="tiny muted">${id==='delivery_sensing'?'Kizuna↑ Coherence↑':id==='product_social'?'Agency↑ Kinetics↑':'Kizuna↑ Kinetics↑'}</div></button>`).join('')}</div><button class="btn" data-strategy="default" style="width:100%;margin-top:8px">${L(strategies.default.title)}</button></div></div>`}
function htmlPlay(){return `<div class="wrap">${header()}${mapHtml()}<div style="margin-bottom:95px"><div class="tiny muted">SYSTEM LOG</div>${s.logs.length?s.logs.map(x=>`<div class="log"><span style="color:#22d3ee">&gt;</span> ${esc(L(x))}</div>`).join(''):`<div class="tiny muted" style="padding:10px">Waiting for strategy...</div>`}</div></div>${footer()}${s.event?eventModal():''}${s.confirm?confirmModal():''}${s.help?helpModal():''}`}
function eventModal(){const e=s.event;return `<div class="modal"><div class="modalBox"><div class="modalHead"><b>⚠ ${esc(L(e.title))}</b></div><div class="modalBody"><p class="notice">${esc(L(e.desc))}</p>${e.choices.map((c,i)=>`<button class="btn choice" data-choice="${i}"><b>${esc(L(c.t))}</b><br><span class="tiny muted">Budget ${(c.eff.b||0)>=0?'+':''}${c.eff.b||0} / Burnout ${(c.eff.bo||0)>=0?'+':''}${c.eff.bo||0}</span></button>`).join('')}</div></div></div>`}
function confirmModal(){const id=s.confirm,d=strategies[id],e=eff(id);return `<div class="modal"><div class="modalBox"><div class="modalHead"><b>&gt;&gt; ${L(d.title)} ${id!=='default'?`<span class="badge" style="position:static">Lv.${level(id)}</span>`:''}</b><div class="tiny muted">${L(d.sub)}</div></div><div class="modalBody"><p class="notice">${L(d.desc)}</p><div class="forecast"><b class="tiny muted">FORECAST</b><div class="grid2" style="margin-top:10px"><div class="small" style="color:${(e.b||0)>=0?'#34d399':'#fb7185'}">Budget ${(e.b||0)>=0?'+':''}${e.b||0}k</div><div class="small" style="color:${(e.bo||0)<=0?'#34d399':'#fb7185'}">Burnout ${(e.bo||0)>=0?'+':''}${e.bo||0}</div></div>${(e.t||0)?`<div class="row tiny"><span>Togetherness</span><b style="color:${e.t>0?'#34d399':'#fb7185'}">${e.t>0?'+':''}${e.t}</b></div>`:''}${factors.map(f=>{const v=e.wb?.[f.id]||0;return v?`<div class="row tiny" style="margin-top:7px"><span>${f.lab[s.lang]}</span><b style="color:${v>0?'#34d399':'#fb7185'}">${v>0?'+':''}${Math.round(v)}</b></div>`:''}).join('')}</div><div class="grid2" style="margin-top:12px"><div class="factor"><b style="color:#34d399">PROS</b><br><span class="tiny muted">${L(d.pros)}</span></div><div class="factor"><b style="color:#fb7185">CONS</b><br><span class="tiny muted">${L(d.cons)}</span></div></div><div class="grid2" style="margin-top:14px"><button class="btn" data-act="cancel">${s.lang==='ja'?'やめる':'Cancel'}</button><button class="btn primary" data-act="apply">${s.lang==='ja'?'決定・実行':'Execute'}</button></div></div></div></div>`}
function helpModal(){return `<div class="modal"><div class="modalBox"><div class="modalHead row"><b>TACK Model Guide</b><button class="btn" data-act="closeHelp">×</button></div><div class="modalBody"><div class="notice"><b>Game Over</b><br>Budget 0 / Burnout 100% / Togetherness 0</div>${factors.map(f=>`<div class="factor" style="margin:8px 0"><b style="color:${f.color}">${f.lab[s.lang]} (${f.sub[s.lang]})</b><br><span class="small muted">${f.desc[s.lang]}</span></div>`).join('')}</div></div></div>`}
function htmlResult(){const t=s.final.tack;function bar(v){const col=v<30?'#f43f5e':v<60?'#eab308':'#10b981';return `<div class="resultBar"><i style="width:${v}%;background:${col}"></i></div>`}let analysis=t.t<30?(s.lang==='ja'?'【連帯の崩壊】現場犠牲で問題を処理したためTogethernessが落ちました。':'[Division] Togetherness collapsed.'):t.a<30?(s.lang==='ja'?'【能動性の死】余白が消え、Agencyが低下しました。':'[Agency Loss] Agency collapsed.'):t.c<30?(s.lang==='ja'?'【意味の喪失】目的と行動がつながらずCoherenceが低下しました。':'[Coherence Loss] Meaning collapsed.'):t.k<30?(s.lang==='ja'?'【停滞】未来への投資不足でKineticsが低下しました。':'[Stagnation] Kinetics collapsed.'):(s.lang==='ja'?'【A案証明】合理的な投資でTACKを維持しました。':'[Plan A Proven] TACK maintained by rational investment.');return `${langBtn()}<div class="screen"><div class="card" style="max-width:440px;width:100%"><h2 class="title" style="text-align:center">RESULT</h2><div class="forecast"><b class="tiny muted">${tr('result')}</b>${[['Togetherness',t.t],['Agency',t.a],['Coherence',t.c],['Kinetics',t.k],['Kizuna',t.kizuna]].map(x=>`<div style="margin-top:10px"><div class="row small"><b>${x[0]}</b><span>${Math.floor(x[1])}</span></div>${bar(x[1])}</div>`).join('')}<div class="notice" style="margin-top:16px">${analysis}</div></div><button class="btn primary" data-act="restart" style="width:100%;margin-top:18px">${tr('retry')}</button></div></div>`}
function render(){root.innerHTML=s.screen==='intro'?htmlIntro():s.screen==='start'?htmlStart():s.screen==='playing'?htmlPlay():htmlResult();}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');const st=e.target.closest('[data-strategy]');const ch=e.target.closest('[data-choice]');if(st){choose(st.dataset.strategy);return;}if(ch){resolve(+ch.dataset.choice);return;}if(!a)return;const act=a.dataset.act;if(act==='lang'){s.lang=s.lang==='ja'?'en':'ja';render();if(s.screen==='intro')typeIntro();}if(act==='start'){s.screen='start';render();}if(act==='play'){s.screen='playing';render();}if(act==='help'){s.help=true;render();}if(act==='closeHelp'){s.help=false;render();}if(act==='cancel'){s.confirm=null;render();}if(act==='apply'){execute(s.confirm);}if(act==='restart'){const lang=s.lang;reset();s.lang=lang;s.screen='playing';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.screen==='intro'){s.screen='start';render();}else{s.help=false;s.confirm=null;s.event=null;render();}}});
reset();
})();
</script>
</body>
</html>
