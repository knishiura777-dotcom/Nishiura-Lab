<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CoopSimulator: TACK Model Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-dark:#0f172a;
      --primary:#06b6d4; --secondary:#ec4899; --accent:#eab308; --danger:#f43f5e;
      --grid-line:rgba(255,255,255,.05);
    }
    body{
      font-family:'Noto Sans JP',sans-serif;
      background-color:var(--bg-dark);
      color:#f8fafc;
      background-image:
        linear-gradient(var(--grid-line) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
      background-size:20px 20px;
      overflow-y:auto;
      touch-action:manipulation;
      padding-bottom:140px;
    }
    .font-mono{font-family:'JetBrains Mono',monospace;}
    .glass-panel{
      background:rgba(15,23,42,.95);
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 8px 32px rgba(0,0,0,.5);
    }

    @keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:.7}}
    .animate-pulse-soft{animation:pulse-soft 2s infinite}
    @keyframes slide-in{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .slide-in{animation:slide-in .3s ease-out forwards}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}
    .fade-in{animation:fade-in .5s ease-out forwards}
    
    .status-connected{background-color:#06b6d4;box-shadow:0 0 6px #06b6d4}
    .status-critical{background-color:#f43f5e;box-shadow:0 0 6px #f43f5e;animation:pulse-soft 0.8s infinite}
    .status-at-risk{background-color:#eab308}
    .status-normal{background-color:#334155}

    .modal-overlay{background-color:rgba(0,0,0,.8);z-index:100}
    .wb-bar{transition:width .6s cubic-bezier(.34,1.56,.64,1)}

    ::-webkit-scrollbar {width: 6px;}
    ::-webkit-scrollbar-track {background: #0f172a;}
    ::-webkit-scrollbar-thumb {background: #334155; border-radius: 3px;}
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ---------------------------
    // Utils
    // ---------------------------
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const RANKING_KEY = "ssg_ranking_tack_v1";

    // ---------------------------
    // Icons
    // ---------------------------
    const Icon = React.memo(({ name, size = 18, className = "" }) => {
      const icons = {
        Activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />,
        DollarSign: <g><line x1="12" y1="1" x2="12" y2="23" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></g>,
        Heart: <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />,
        Users: <g><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M16 3.13a4 4 0 0 1 0 7.75M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></g>,
        Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
        Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        Clock: <g><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g>,
        Target: <g><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>,
        Help: <g><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>,
        Book: <g><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></g>,
        Alert: <g><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>,
        Truck: <g><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></g>,
        Box: <g><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></g>,
        Trophy: <g><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></g>,
        X: <g><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></g>,
        Medal: <g><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></g>,
        ChevronsUp: <g><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></g>,
        Scale: <g><path d="M12 2v20"/><path d="M2 12h20"/><path d="M2 12l5-5"/><path d="M22 12l-5-5"/><path d="M12 2l-5 5"/><path d="M12 2l5 5"/></g>,
        Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>,
        ArrowRight: <g><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></g>,
        AlertTriangle: <g><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>,
        Smile: <g><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></g>,
        Printer: <g><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></g>,
        WifiOff: <g><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></g>,
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          aria-hidden="true"
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    });

    // ---------------------------
    // Game Data & TACK Definition
    // ---------------------------
    const INITIAL_BUDGET = 5000;
    const MAX_TURNS = 24;

    const STATUS = {
      NORMAL: "normal",
      AT_RISK: "at_risk",
      CRITICAL: "critical",
      CONNECTED: "connected",
    };

    // TACK Model Mapping
    // T: Togetherness (Global Variable) - Previously Trust
    // A: Autonomy (Local Variable)
    // C: Coherence (Mapped from meaning)
    // K: Kinetics (Mapped from vitality)
    const WB_FACTORS = [
      { id: "autonomy",   label: "Autonomy (自律)", icon: "Clock", color: "text-emerald-400", bg: "bg-emerald-500", desc: "自らの意志で決定・行動できる感覚。追われると低下。" },
      { id: "meaning",    label: "Coherence (一貫)", icon: "Target", color: "text-purple-400", bg: "bg-purple-500", desc: "目的と行動の一致感。首尾一貫性(SOC)。" },
      { id: "vitality",   label: "Kinetics (動性)", icon: "Activity", color: "text-yellow-400", bg: "bg-yellow-500", desc: "未来へ向かう組織の活力。停滞すると死ぬ。" },
      { id: "connection", label: "Kizuna (絆)", icon: "Users", color: "text-cyan-400", bg: "bg-cyan-500", desc: "セーフティネットとしての繋がり。孤立を防ぐ。" },
    ];

    const STRATEGY_DETAILS = {
      delivery_sensing: {
        title: "見守り配送 (Sensing)",
        subtitle: "物流網をセーフティネットへ",
        desc: "配送員が「ソーシャルワーカー」的な役割を兼務し、異変を早期発見します。",
        pros: "地域の孤立リスクを劇的に低減（Kizuna・Coherence↑）",
        cons: "現場の負担増、配送効率の低下",
        eff: { b: -300, bo: 5, c: 5, wb: { connection: 15, meaning: 10 } },
      },
      product_social: {
        title: "時短Kit開発 (Social Product)",
        subtitle: "時間を売る商品戦略",
        desc: "「親が子供と向き合う時間」を作るためのミールキット等を開発・普及させます。",
        pros: "子育て世帯の精神的余白を創出（Autonomy・Kinetics↑）",
        cons: "開発・広報コストがかかり、利益率は下がる可能性",
        eff: { b: -200, bo: -2, c: 2, wb: { autonomy: 15, vitality: 5 } },
      },
      hub_commons: {
        title: "拠点開放 (Commons)",
        subtitle: "店舗を地域の居場所へ",
        desc: "店舗や配送センターの一角を、高齢者や子供が無料で過ごせる「コモンズ」として開放します。",
        pros: "多世代交流の促進、スタッフの誇り向上（Kizuna・Kinetics↑）",
        cons: "場所代・維持管理コストの発生、回転率の低下",
        eff: { b: -150, bo: 2, c: 3, wb: { connection: 10, vitality: 10 } },
      },
      default: {
        title: "通常業務 (Business as Usual)",
        subtitle: "効率と利益の追求",
        desc: "従来の小売・物流業務に専念し、収益性を最大化します。",
        pros: "予算の確保、現場の混乱回避",
        cons: "【警告】現場疲弊大。TACK因子（特にAutonomy/Kinetics）が著しく低下します。",
        // 罰則強化: 疲弊度(bo)大幅増, Autonomy/Coherence/Kinetics減少, Togetherness減少
        eff: { b: 200, bo: 15, c: 0, wb: { autonomy: -5, meaning: -5, vitality: -5 }, t: -1 },
      },
    };

    const CRITICAL_EVENTS = [
      { id: "ev1", title: "【行政】仁義なき縦割り", icon: "Alert", desc: "福祉課「移動販売車を入れて」道路課「駐禁です」。板挟みで車が出せません。",
        choices: [
          // Good (System) Choice: Cost money, boosts TACK
          { t: "「これは家です」", eff: { b: -100, bo: 0, c: 5, wb: { vitality: 10, autonomy: 5 } }, msg: "法務部が動いてロジックを構築。Kinetics(活力)が生まれました。", good: true },
          // Bad (Guts) Choice: Free, Burns Autonomy/Coherence
          { t: "調整会議で粘る", eff: { b: 0, bo: 15, c: 0, wb: { meaning: -10, autonomy: -10 } }, msg: "「検討を加速」。Coherence(一貫性)が失われました。", good: false },
          // Risky
          { t: "強行突破", eff: { b: -20, bo: 5, c: 10, wb: { connection: 5 }, t: -10 }, msg: "住民は歓喜！しかしコンプラ違反でTogetherness低下。", good: true },
        ]
      },
      { id: "ev2", title: "【行政】ハイテク・ハンコ地獄", icon: "WifiOff", desc: "DX推進を頼まれましたが、完了画面のスクショを「印刷して実印」が必要らしいです。",
        choices: [
           // Good (System)
          { t: "独自アプリ開発", eff: { b: -150, bo: 0, c: 5, wb: { autonomy: 15 } }, msg: "システムで隠蔽！現場にAutonomy(余白)が戻りました。", good: true },
           // Bad (Guts)
          { t: "「規則ですので」", eff: { b: 0, bo: 10, c: 0, wb: { meaning: -15, vitality: -5 } }, msg: "思考停止。Coherence(意味)を感じられず現場は徒労感。", good: false },
          { t: "判子付きケース配布", eff: { b: -30, bo: 0, c: 2, wb: { vitality: 5 } }, msg: "ギミックが大ウケ。少しKinetics回復。", good: false },
        ]
      },
      { id: "ev3", title: "【行政】ポエムな成果指標", icon: "Target", desc: "報告書に対し、「定量的データはいいから、『地域の輝き度』を数値化して」との修正指示。",
        choices: [
          // Bad (Guts/Lying)
          { t: "適当に120%で報告", eff: { b: 0, bo: -5, c: 0, wb: { meaning: -20 }, t: -10 }, msg: "嘘をつく仕事。CoherenceとTogethernessが大きく傷つきました。", good: false },
          // Good (System)
          { t: "笑顔AI導入", eff: { b: -150, bo: 0, c: 0, wb: { vitality: 10, meaning: 5 } }, msg: "AIに「輝き」を測定させました。馬鹿馬鹿しいですがKineticsは維持。", good: true },
          { t: "データで反論", eff: { b: 0, bo: 20, c: 0, t: 5, wb: { autonomy: -10 } }, msg: "3時間の説教。Autonomy(時間)を浪費しました。", good: false },
        ]
      },
      { id: "ev_op1", title: "【現場】最強パート「お局様」", icon: "Zap", desc: "勤続30年の鈴木さんが「店長のやり方はぬるい！」と実権を掌握しかけています。",
        choices: [
          // System/Cost approach
          { t: "名誉理事に祭り上げ", eff: { b: -50, bo: -5, c: 5, wb: { meaning: 10, connection: 5 } }, msg: "役割を与える設計。承認欲求が満たされCoherence回復。", good: true },
          // Guts/Conflict
          { t: "店長vsお局", eff: { b: 0, bo: 30, c: 0, wb: { connection: -20, vitality: -10 } }, msg: "店舗が戦場に。KizunaとKineticsが崩壊。", good: false },
          { t: "全権委任", eff: { b: 100, bo: 20, c: 0, wb: { vitality: -10, autonomy: -10 } }, msg: "効率は上がりましたが、若手のAutonomyが死にました。", good: false },
        ]
      },
      { id: "ev_op2", title: "【物流】誤発注：豆腐1000丁", icon: "Truck", desc: "新人が0を1つ多く入力。トラック一杯の木綿豆腐が届きました。",
        choices: [
          // System/Creative
          { t: "緊急「豆腐祭り」", eff: { b: -50, bo: 10, c: 10, wb: { vitality: 20, connection: 10 } }, msg: "イベント化してKinetics爆増！", good: true },
          // Guts/Punishment
          { t: "全廃棄＆始末書", eff: { b: -100, bo: 5, c: 0, wb: { meaning: -10, autonomy: -10 } }, msg: "豆腐と共に心も砕けました。Coherence低下。", good: false },
          { t: "「豆腐風呂」", eff: { b: -50, bo: 0, c: -10, t: -20 }, msg: "炎上しました。Togetherness低下。", good: false },
        ]
      },
      { id: "ev_soc1", title: "【教育】部活の地域移行", icon: "Users", desc: "「練習場所がない」と子供たちが生協駐車場でサッカーを始めました。",
        choices: [
          // Guts/Rule
          { t: "追い返す", eff: { b: 0, bo: 0, c: -5, wb: { connection: -10 } }, msg: "安全管理上は正解ですが、地域とのKizunaに亀裂。", good: false },
          // System/Investment
          { t: "場所を開放・整備", eff: { b: -100, bo: 5, c: 20, wb: { vitality: 15, connection: 10 } }, msg: "ネットを設置。KineticsとKizunaが向上。", good: true },
          // Manual/Guts
          { t: "店長がGK参戦", eff: { b: 0, bo: 15, c: 10, wb: { vitality: 15 } }, msg: "盛り上がりましたが、店長の仕事が終わりません(Autonomy低下)。", good: true },
        ]
      },
      // More events can be added here, adhering to System vs Guts logic
    ];

    // ---------------------------
    // Components
    // ---------------------------
    const useEscToClose = (onClose, enabled = true) => {
      useEffect(() => {
        if (!enabled) return;
        const handler = (e) => {
          if (e.key === "Escape") onClose?.();
        };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [onClose, enabled]);
    };

    const HelpModal = React.memo(({ onClose }) => {
      useEscToClose(onClose);
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay fade-in" onClick={onClose}>
          <div className="glass-panel w-full max-w-md p-0 rounded-xl overflow-hidden slide-in" onClick={e => e.stopPropagation()}>
            <div className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
              <h3 className="font-bold text-white flex items-center gap-2">
                <Icon name="Book" className="text-cyan-400"/> TACK Model Guide
              </h3>
              <button onClick={onClose} className="p-1 hover:bg-slate-700 rounded"><Icon name="X" size={20}/></button>
            </div>
            <div className="p-6 overflow-y-auto max-h-[70vh] space-y-6">
              
              <div className="space-y-2">
                <h4 className="font-bold text-yellow-400 text-sm border-b border-slate-700 pb-1">ゲームオーバー条件</h4>
                <p className="text-xs text-slate-300 leading-relaxed">
                  <span className="text-rose-400">■ 資金枯渇</span><br/>
                  <span className="text-rose-400">■ 現場疲弊度 100% (Burnout)</span><br/>
                  <span className="text-rose-400">■ 連帯(Togetherness) 0 (崩壊・分断)</span><br/>
                </p>
              </div>

              <div className="space-y-2">
                <h4 className="font-bold text-emerald-400 text-sm border-b border-slate-700 pb-1">TACK因子 (Well-being Factors)</h4>
                <div className="grid grid-cols-1 gap-2">
                  <div className="flex gap-2 items-start bg-slate-900/50 p-2 rounded">
                    <div className="mt-0.5 text-yellow-400"><Icon name="Scale" size={16}/></div>
                    <div>
                       <div className="text-xs font-bold text-yellow-400">Togetherness (連帯)</div>
                       <div className="text-[10px] text-slate-400">組織や地域との一体感・連帯意識。</div>
                    </div>
                  </div>
                  {WB_FACTORS.map(f => (
                    <div key={f.id} className="flex gap-2 items-start bg-slate-900/50 p-2 rounded">
                      <div className={`mt-0.5 ${f.color}`}><Icon name={f.icon} size={16}/></div>
                      <div>
                        <div className={`text-xs font-bold ${f.color}`}>{f.label}</div>
                        <div className="text-[10px] text-slate-400">{f.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="p-4 bg-slate-900 border-t border-slate-700 text-center">
              <button onClick={onClose} className="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded text-white text-sm font-bold">閉じる</button>
            </div>
          </div>
        </div>
      );
    });

    const EventModal = React.memo(({ event, onResolve, onClose }) => {
      useEscToClose(onClose, !!event);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in" role="dialog" aria-modal="true" aria-label={event.title} onClick={onClose}>
          <div className="glass-panel w-full max-w-sm p-0 rounded-xl overflow-hidden slide-in border-l-4 border-rose-500 shadow-2xl" onClick={(e)=>e.stopPropagation()}>
            <div className="bg-rose-950/90 p-4 flex items-center gap-2 text-white font-bold border-b border-rose-900">
              <Icon name={event.icon} className="text-rose-400"/> {event.title}
            </div>
            <div className="p-6 bg-slate-900/95">
              <p className="text-slate-200 text-sm mb-6 leading-relaxed bg-slate-950/50 p-3 rounded border border-white/5">{event.desc}</p>
              <div className="space-y-3">
                {event.choices.map((c, i) => (
                  <button
                    key={i}
                    onClick={() => onResolve(c)}
                    className="w-full text-left bg-slate-800 hover:bg-slate-700 p-3 rounded border border-slate-600 hover:border-cyan-400 transition-colors group relative overflow-hidden"
                  >
                    <div className="font-bold text-white text-sm mb-1 group-hover:text-cyan-300 relative z-10">{c.t}</div>
                    <div className="text-xs text-slate-400 font-mono flex flex-wrap gap-2 relative z-10">
                      {c.eff.b !== 0 && <span className={c.eff.b > 0 ? "text-emerald-400" : "text-rose-400"}>予算{c.eff.b > 0 ? "+" : ""}{c.eff.b}</span>}
                      {c.eff.bo !== 0 && <span className={c.eff.bo < 0 ? "text-emerald-400" : "text-rose-400"}>疲弊{c.eff.bo > 0 ? "+" : ""}{c.eff.bo}</span>}
                      {c.eff.t && <span className={c.eff.t > 0 ? "text-yellow-400" : "text-rose-500 font-bold"}>連帯{c.eff.t > 0 ? "+" : ""}{c.eff.t}</span>}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    });

    const StrategyConfirmModal = React.memo(({ strategyId, currentStats, level, onConfirm, onCancel }) => {
      useEscToClose(onCancel, !!strategyId);
      const data = STRATEGY_DETAILS[strategyId];
      
      const getLevelEffect = (baseEff, lv) => {
        if (!baseEff) return {};
        const mult = lv === 3 ? 1.5 : lv === 2 ? 1.2 : 1.0;
        const discount = lv === 3 ? 50 : 0; 
        
        const newEff = { ...baseEff };
        if (newEff.wb) {
           newEff.wb = {};
           for (let k in baseEff.wb) {
             newEff.wb[k] = baseEff.wb[k] * mult;
           }
        }
        if (newEff.c) newEff.c = baseEff.c * mult;
        if (newEff.b < 0) newEff.b = Math.min(0, newEff.b + discount);
        
        return newEff;
      };

      const eff = getLevelEffect(data.eff, level);

      // DiffBar Component for Forecasting
      const DiffBar = ({ current, diff, baseClass, label }) => {
        const isPositive = diff > 0;
        if (diff === 0) return null; // Don't show if no change

        return (
          <div className="flex items-center gap-2 text-xs mb-1.5">
            <div className="w-20 text-right font-mono text-slate-400 truncate text-[10px]">{label}</div>
            <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden flex relative">
              <div className={`h-full ${baseClass} opacity-50`} style={{ width: `${clamp(current, 0, 100)}%` }} />
              {diff !== 0 && (
                <div
                  className={`absolute h-full ${isPositive ? "bg-emerald-400" : "bg-rose-500"}`}
                  style={{ 
                    left: `${clamp(current, 0, 100)}%`, 
                    width: `${clamp(Math.abs(diff), 0, 100 - current)}%`,
                    transform: diff < 0 ? `translateX(-100%)` : 'none'
                  }} 
                />
              )}
            </div>
            <div className={`w-10 font-bold text-right ${isPositive ? "text-emerald-400" : diff < 0 ? "text-rose-400" : "text-slate-600"}`}>
              {diff > 0 ? `+${diff.toFixed(0)}` : diff === 0 ? "-" : diff.toFixed(0)}
            </div>
          </div>
        );
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in" role="dialog" aria-modal="true" aria-label={`${data.title}の確認`} onClick={onCancel}>
          <div className="glass-panel w-full max-w-md p-0 rounded-xl overflow-hidden slide-in border border-cyan-500/30 shadow-2xl" onClick={e=>e.stopPropagation()}>
            <div className="bg-slate-900 p-4 border-b border-white/10 flex justify-between items-center">
              <div>
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span className="text-cyan-400">>></span> {data.title} 
                  {level > 1 && <span className="bg-yellow-500/20 text-yellow-400 text-xs px-2 py-0.5 rounded border border-yellow-500/50">Lv.{level}</span>}
                </h3>
                <p className="text-xs text-slate-400 font-mono mt-1">{data.subtitle}</p>
              </div>
            </div>

            <div className="p-5 space-y-4 max-h-[60vh] overflow-y-auto">
              <p className="text-sm text-slate-200 leading-relaxed font-bold border-l-2 border-cyan-500 pl-3">
                {data.desc}
              </p>
              
              <div className="bg-slate-950 p-3 rounded-lg border border-white/5 space-y-3">
                <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider flex justify-between">
                   <span>FORECAST (予測)</span>
                   {level > 1 && <span className="text-yellow-400 text-[10px]">Lv.{level} Effect Boosted</span>}
                </div>
                
                {/* Budget & Burnout */}
                <div className="flex justify-between text-xs font-mono mb-2 border-b border-white/5 pb-2">
                  <span className={eff.b >= 0 ? "text-emerald-400" : "text-rose-400"}>予算: {eff.b > 0 ? "+" : ""}{eff.b}k</span>
                  <span className={eff.bo <= 0 ? "text-emerald-400" : "text-rose-400"}>疲弊: {eff.bo > 0 ? "+" : ""}{eff.bo}</span>
                </div>

                {/* TACK Factors */}
                <div className="space-y-1">
                  {/* T */}
                  <DiffBar current={currentStats.trust} diff={eff.t || 0} baseClass="bg-yellow-500" label="Togetherness" />
                  {/* WB Factors (A, C, K, Kizuna) */}
                  {WB_FACTORS.map(f => {
                    const diff = eff.wb?.[f.id] || 0;
                    return <DiffBar key={f.id} current={currentStats.wb[f.id]} diff={diff} baseClass={f.bg} label={f.label.split(' ')[0]} />;
                  })}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 text-xs">
                <div className="bg-emerald-950/30 p-2 rounded border border-emerald-500/20">
                  <div className="font-bold text-emerald-400 mb-1 flex items-center gap-1"><Icon name="Shield" size={12}/> メリット</div>
                  <div className="text-slate-300 text-[10px] leading-tight">{data.pros}</div>
                </div>
                <div className="bg-rose-950/30 p-2 rounded border border-rose-500/20">
                  <div className="font-bold text-rose-400 mb-1 flex items-center gap-1"><Icon name="Zap" size={12}/> デメリット</div>
                  <div className="text-slate-300 text-[10px] leading-tight">{data.cons}</div>
                </div>
              </div>
            </div>

            <div className="p-4 bg-slate-900/80 flex gap-3 border-t border-white/10">
              <button onClick={onCancel} className="flex-1 py-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold transition-colors text-sm">
                やめる
              </button>
              <button onClick={onConfirm} className="flex-[2] py-3 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold shadow-lg shadow-cyan-500/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2">
                決定・実行 <Icon name="ArrowRight" size={16}/>
              </button>
            </div>
          </div>
        </div>
      );
    });

    // ---------------------------
    // Main App
    // ---------------------------
    const App = () => {
      const [gameState, setGameState] = useState("start");
      const [turn, setTurn] = useState(1);
      const [showHelp, setShowHelp] = useState(false);

      const [budget, setBudget] = useState(INITIAL_BUDGET);
      const [burnout, setBurnout] = useState(20);
      const [trust, setTrust] = useState(100);

      const [logs, setLogs] = useState([]);
      const [activeEvent, setActiveEvent] = useState(null);
      const [confirmingStrategy, setConfirmingStrategy] = useState(null);
      const [usedEventIds, setUsedEventIds] = useState([]);

      const [wbStats, setWbStats] = useState({ connection: 30, autonomy: 40, meaning: 50, vitality: 40 });
      const [households, setHouseholds] = useState(() => Array.from({ length: 100 }, (_, i) => ({ id: i, status: STATUS.NORMAL, isMember: Math.random() > 0.3 })));
      const [finalScore, setFinalScore] = useState(null);
      const [ranking, setRanking] = useState([]);
      
      const [strategyExp, setStrategyExp] = useState({ delivery_sensing: 0, product_social: 0, hub_commons: 0 });

      const addLog = useCallback((msg) => {
        setLogs(prev => [msg, ...prev].slice(0, 4));
      }, []);

      const getStrategyLevel = useCallback((exp) => {
        if (exp >= 5) return 3;
        if (exp >= 2) return 2;
        return 1;
      }, []);
      
      const getStrategyEffect = useCallback((id, exp) => {
        const baseEff = STRATEGY_DETAILS[id].eff;
        if (!baseEff) return {};
        
        const lv = getStrategyLevel(exp);
        const mult = lv === 3 ? 1.5 : lv === 2 ? 1.2 : 1.0;
        const discount = lv === 3 ? 50 : 0;
        
        const newEff = { ...baseEff };
        if (newEff.wb) {
           newEff.wb = {};
           for (let k in baseEff.wb) {
             newEff.wb[k] = baseEff.wb[k] * mult;
           }
        }
        if (newEff.c) newEff.c = baseEff.c * mult;
        if (newEff.b < 0) newEff.b = Math.min(0, newEff.b + discount);
        
        return newEff;
      }, [getStrategyLevel]);

      const metrics = useMemo(() => {
        const connected = households.filter(h => h.status === STATUS.CONNECTED).length;
        const critical = households.filter(h => h.status === STATUS.CRITICAL).length;
        const percentage = Math.floor((connected / households.length) * 100);
        let label = "五里霧中";
        if (percentage >= 90) label = "天下泰平";
        else if (percentage >= 70) label = "共存共栄";
        else if (percentage >= 50) label = "一致団結";
        else if (percentage >= 30) label = "一進一退";
        else if (percentage >= 15) label = "孤立無援";
        return { connect: percentage, criticalCount: critical, label };
      }, [households]);

      const calculateScore = useCallback(() => {
        const resourceScore = Math.floor(Object.values(wbStats).reduce((a, b) => a + b, 0) * 10);
        const coverageScore = metrics.connect * 20;
        const budgetScore = Math.floor(Math.max(0, budget) / 10);
        const riskPenalty = Math.floor(burnout * 20);
        const trustBonus = trust * 10;
        const total = Math.max(0, resourceScore + coverageScore + budgetScore + trustBonus - riskPenalty);
        return {
          total,
          details: { resource: resourceScore, coverage: coverageScore, budget: budgetScore, trust: trustBonus, risk: riskPenalty },
          tack: {
            t: trust,
            a: wbStats.autonomy,
            c: wbStats.meaning,
            k: wbStats.vitality,
            kizuna: wbStats.connection
          }
        };
      }, [wbStats, metrics.connect, budget, burnout, trust]);

      const endIfNeeded = useCallback((nextBudget, nextBurnout, nextTrust, nextTurn) => {
        if (nextBudget <= 0 || nextBurnout >= 100 || nextTrust <= 0 || nextTurn > MAX_TURNS) {
          const score = calculateScore();
          if (nextBudget <= 0 || nextBurnout >= 100 || nextTrust <= 0) score.total = Math.floor(score.total * 0.5);
          setFinalScore(score);
          setGameState("result");
          return true;
        }
        return false;
      }, [calculateScore]);

      const processTurn = useCallback((effect) => {
        setTrust(prev => clamp(prev + (effect.t || 0), 0, 100));
        setBudget(prev => {
          let income = 150;
          if (trust < 50) income = Math.floor(income * (trust / 50));
          return prev + income + (effect.b || 0);
        });
        setBurnout(prev => clamp(prev - 2 + (effect.bo || 0), 0, 100));
        setWbStats(prev => {
          const next = { ...prev };
          if (effect.wb) {
            for (const k of Object.keys(effect.wb)) next[k] = clamp(next[k] + effect.wb[k], 0, 100);
          }
          return next;
        });
        setHouseholds(prevHouseholds => {
          const assumedWb = { ...wbStats };
          if (effect.wb) {
             for (const k of Object.keys(effect.wb)) assumedWb[k] = clamp(assumedWb[k] + effect.wb[k], 0, 100);
          }
          const resLevel = (assumedWb.connection + assumedWb.autonomy + assumedWb.meaning + assumedWb.vitality) / 4;
          const riskProb = clamp(0.08 - (resLevel / 2000), 0.01, 0.15);
          const baseConnectChance = (effect.c || 0) / 100;
          return prevHouseholds.map(h => {
            let nextStatus = h.status;
            if (h.isMember) {
              if (h.status === STATUS.NORMAL && Math.random() < riskProb) nextStatus = STATUS.AT_RISK;
              else if (h.status === STATUS.AT_RISK && Math.random() < riskProb * 2.5) nextStatus = STATUS.CRITICAL;
              let connectChance = baseConnectChance;
              if (h.status === STATUS.CRITICAL) connectChance *= 0.3;
              connectChance += (resLevel / 1000);
              if (h.status !== STATUS.CONNECTED && Math.random() < connectChance) nextStatus = STATUS.CONNECTED;
            }
            return { ...h, status: nextStatus };
          });
        });
        setTurn(prev => prev + 1);
      }, [wbStats, trust]);

      const executeTurn = useCallback((strategyId) => {
        setConfirmingStrategy(null);
        if (strategyId !== 'default') {
          setStrategyExp(prev => {
            const currentExp = prev[strategyId] || 0;
            const nextExp = currentExp + 1;
            const prevLevel = getStrategyLevel(currentExp);
            const nextLevel = getStrategyLevel(nextExp);
            if (nextLevel > prevLevel) addLog(`【LvUP】${STRATEGY_DETAILS[strategyId].title} Lv${nextLevel}になりました！`);
            return { ...prev, [strategyId]: nextExp };
          });
        }

        if (Math.random() < 0.45) {
          const available = CRITICAL_EVENTS.filter(e => !usedEventIds.includes(e.id));
          const pool = available.length ? available : CRITICAL_EVENTS;
          const evt = pick(pool);
          setActiveEvent(evt);
          setUsedEventIds(prev => [...prev, evt.id]);
          return;
        }

        let eff = STRATEGY_DETAILS[strategyId].eff;
        if (strategyId !== 'default') eff = getStrategyEffect(strategyId, strategyExp[strategyId]);
        processTurn(eff);
      }, [processTurn, usedEventIds, strategyExp, getStrategyLevel, getStrategyEffect, addLog]);

      const handleEventResolve = useCallback((choice) => {
        addLog(choice.msg);
        setActiveEvent(null);
        processTurn(choice.eff);
      }, [addLog, processTurn]);

      useEffect(() => {
        if (gameState !== "playing") return;
        endIfNeeded(budget, burnout, trust, turn);
      }, [budget, burnout, trust, turn, gameState, endIfNeeded]);

      const restart = useCallback(() => {
        setTurn(1);
        setBudget(INITIAL_BUDGET);
        setBurnout(20);
        setTrust(100);
        setWbStats({ connection: 30, autonomy: 40, meaning: 50, vitality: 40 });
        setHouseholds(Array.from({ length: 100 }, (_, i) => ({ id: i, status: STATUS.NORMAL, isMember: Math.random() > 0.3 })));
        setLogs([]);
        setActiveEvent(null);
        setUsedEventIds([]);
        setConfirmingStrategy(null);
        setGameState("playing");
        setStrategyExp({ delivery_sensing: 0, product_social: 0, hub_commons: 0 });
      }, []);

      // ---------------------------
      // Views
      // ---------------------------
      if (gameState === "start") {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-slate-900 relative overflow-hidden">
             <div className="absolute inset-0 opacity-20 pointer-events-none" style={{background: 'radial-gradient(circle at 50% 50%, #06b6d4 0%, transparent 50%)'}}></div>
            <div className="space-y-8 max-w-sm w-full relative z-10 fade-in">
              <div>
                <div className="text-cyan-400 font-mono text-xs mb-2 tracking-widest">A案：協力を「合理」へ</div>
                <h1 className="text-4xl font-black text-white leading-tight">
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">CoopSimulator</span><br/>
                  <span className="text-2xl text-slate-400">TACK Model Edition</span>
                </h1>
              </div>

              <div className="glass-panel p-6 rounded-xl text-left space-y-4 border-l-4 border-cyan-500">
                <p className="text-sm text-slate-300 leading-relaxed">
                  <strong>講演用実験モード:</strong><br/>
                  「善意(精神論)」のみでプレイすると、TACK因子が崩壊することを確認してください。
                </p>
                <div className="text-xs text-slate-500 mt-2 bg-slate-900 p-2 rounded grid grid-cols-2 gap-2">
                  <span className="text-yellow-400 font-bold">Togetherness (連帯)</span>
                  <span className="text-emerald-400 font-bold">Autonomy (自律)</span>
                  <span className="text-purple-400 font-bold">Coherence (一貫)</span>
                  <span className="text-yellow-400 font-bold">Kinetics (活力)</span>
                </div>
              </div>

              <button onClick={() => setGameState("playing")} className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all active:scale-95 flex items-center justify-center gap-2 group">
                実験開始 <span className="group-hover:translate-x-1 transition-transform">→</span>
              </button>
            </div>
          </div>
        );
      }

      if (gameState === "result") {
        const { tack } = finalScore;
        const getBarColor = (val) => val < 30 ? "bg-rose-500" : val < 60 ? "bg-yellow-500" : "bg-emerald-500";
        
        // TACK Analysis Logic
        const getAnalysis = () => {
          if (tack.t < 30) return "【連帯の崩壊】トラブルを「現場の犠牲」で解決しようとしたため、組織のTogethernessが地に落ちました。";
          if (tack.a < 30) return "【自律性の死】「気合」と対応業務に追われ、現場から思考する余裕(Autonomy)が奪われました。";
          if (tack.c < 30) return "【意味の喪失】目的と行動が乖離しています。「なんのために頑張っているのか」が見えず、Coherenceが崩壊しました。";
          if (tack.k < 30) return "【停滞】自転車操業で精一杯です。未来への投資ができず、組織のKinetics(活力)が枯渇しました。";
          return "【A案証明完了】システムへの投資により、現場の負担を下げつつ高いTACKスコアを維持することに成功しました。これが「合理的な優しさ」です。";
        };

        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-900 fade-in pb-20">
            <div className="glass-panel w-full max-w-sm p-0 rounded-xl overflow-hidden relative shadow-2xl">
              <div className={`h-2 ${budget <= 0 || burnout >= 100 || trust <= 0 ? "bg-rose-500" : "bg-emerald-500"}`}></div>
              
              <div className="p-6 text-center space-y-4">
                <h2 className="text-2xl font-bold text-white tracking-widest">RESULT</h2>
                <div>
                   {budget <= 0 ? <div className="text-rose-400 font-bold"><Icon name="AlertTriangle" className="inline"/> 資金ショート</div>
                   : burnout >= 100 ? <div className="text-rose-400 font-bold"><Icon name="Zap" className="inline"/> 現場崩壊 (Burnout)</div>
                   : trust <= 0 ? <div className="text-rose-400 font-bold"><Icon name="Lock" className="inline"/> 連帯崩壊 (Division)</div>
                   : <div className="text-emerald-400 font-bold"><Icon name="Trophy" className="inline"/> MISSION ACCOMPLISHED</div>}
                </div>

                <div className="bg-slate-950/80 p-4 rounded-lg border border-white/10 text-left space-y-3">
                  <div className="text-xs font-bold text-slate-400 border-b border-slate-800 pb-1 mb-2">TACK ANALYSIS</div>
                  
                  {/* T */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>Togetherness (連帯)</span> <span>{tack.t}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.t)}`} style={{width: `${tack.t}%`}}></div>
                    </div>
                  </div>
                  {/* A */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>Autonomy (自律)</span> <span>{tack.a}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.a)}`} style={{width: `${tack.a}%`}}></div>
                    </div>
                  </div>
                  {/* C */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>Coherence (一貫)</span> <span>{tack.c}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.c)}`} style={{width: `${tack.c}%`}}></div>
                    </div>
                  </div>
                  {/* K */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>Kinetics (活力)</span> <span>{tack.k}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.k)}`} style={{width: `${tack.k}%`}}></div>
                    </div>
                  </div>

                  <div className="mt-4 pt-4 border-t border-slate-800 text-xs text-slate-300 leading-relaxed font-mono bg-slate-900 p-2 rounded">
                    <span className="text-cyan-400 font-bold">>> ANALYSIS:</span><br/>
                    {getAnalysis()}
                  </div>
                </div>
              </div>

              <div className="p-4 bg-slate-900/80 border-t border-slate-800 flex gap-3">
                <button onClick={restart} className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg text-sm shadow-lg shadow-cyan-500/20 transition-all active:scale-95">
                  再実験する
                </button>
              </div>
            </div>
          </div>
        );
      }

      // playing
      return (
        <div className="min-h-screen max-w-md mx-auto flex flex-col relative pb-32 fade-in">
          {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
          {activeEvent && <EventModal event={activeEvent} onResolve={handleEventResolve} onClose={() => setActiveEvent(null)} />}
          {confirmingStrategy && <StrategyConfirmModal strategyId={confirmingStrategy} currentStats={{ wb: wbStats, budget, burnout, trust }} level={confirmingStrategy !== 'default' ? getStrategyLevel(strategyExp[confirmingStrategy]) : 1} onConfirm={() => executeTurn(confirmingStrategy)} onCancel={() => setConfirmingStrategy(null)} />}

          {/* Header */}
          <div className="glass-panel p-4 m-4 rounded-xl sticky top-4 z-30 shadow-xl">
            <div className="flex justify-between items-start mb-4">
              <div className="flex flex-col">
                <span className="text-[10px] font-bold text-slate-400 tracking-wider mb-1">BUDGET</span>
                <div className={`text-2xl font-mono font-bold leading-none ${budget < 1000 ? "text-rose-500 animate-pulse" : "text-white"}`}>
                  ¥{budget.toLocaleString()}k
                </div>
              </div>
              <div className="flex items-center gap-2">
                 <div className="flex flex-col items-end mr-2">
                    <span className="text-[10px] font-bold text-slate-400 tracking-wider">TURN</span>
                    <span className="text-lg font-bold text-cyan-400 leading-none">{turn}<span className="text-sm text-slate-500">/{MAX_TURNS}</span></span>
                 </div>
                 <button onClick={() => setShowHelp(true)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-300 transition-colors">
                   <Icon name="Help" size={20} />
                 </button>
              </div>
            </div>

            <div className="space-y-3">
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                   <span className="text-rose-400 font-bold flex items-center gap-1"><Icon name="Zap" size={10}/> 現場疲弊 (Burnout)</span>
                   <span className="text-white font-mono">{burnout}%</span>
                </div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                   <div className={`h-full wb-bar ${burnout > 80 ? "bg-rose-500 animate-pulse" : "bg-rose-500"}`} style={{ width: `${clamp(burnout, 0, 100)}%` }}></div>
                </div>
              </div>
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                   <span className="text-yellow-400 font-bold flex items-center gap-1"><Icon name="Scale" size={10}/> Togetherness (連帯)</span>
                   <span className="text-white font-mono">{trust}%</span>
                </div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                   <div className={`h-full wb-bar ${trust < 50 ? "bg-yellow-600 animate-pulse" : "bg-yellow-500"}`} style={{ width: `${clamp(trust, 0, 100)}%` }}></div>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-4 gap-2 mt-4 pt-4 border-t border-white/5">
              {WB_FACTORS.map(f => (
                <div key={f.id} className="flex flex-col items-center p-1.5 rounded bg-slate-800/50 border border-white/5 cursor-help active:scale-95 transition-transform" onClick={() => setShowHelp(true)}>
                  <Icon name={f.icon} size={14} className={f.color}/>
                  <div className="text-[10px] font-bold text-slate-300 mt-1">{Math.floor(wbStats[f.id])}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Map */}
          <div className="px-4 mb-4">
            <div className="glass-panel p-3 rounded-xl">
              <div className="text-[10px] text-slate-500 mb-2 font-bold tracking-widest flex justify-between items-center">
                <span>MONITORING AREA</span>
                <span className="text-cyan-400 bg-cyan-950/50 px-2 py-0.5 rounded flex items-center gap-1 border border-cyan-500/20 text-[10px]">
                  <Icon name="Target" size={10}/> Coverage: {metrics.connect}%
                </span>
              </div>
              <div className="grid grid-cols-10 gap-1 aspect-[10/5] bg-slate-900/50 p-1 rounded">
                {households.slice(0, 50).map(h => {
                  let colorClass = "status-normal opacity-30";
                  if (h.isMember) {
                    if (h.status === STATUS.CONNECTED) colorClass = "status-connected";
                    else if (h.status === STATUS.CRITICAL) colorClass = "status-critical";
                    else if (h.status === STATUS.AT_RISK) colorClass = "status-at-risk";
                    else colorClass = "status-normal";
                  }
                  return <div key={h.id} className={`w-full h-full rounded-[1px] ${colorClass} transition-all duration-500`} />;
                })}
              </div>
            </div>
          </div>

          {/* Logs */}
          <div className="px-4 mb-20 flex-1">
             <div className="text-[10px] font-bold text-slate-500 mb-1 ml-1">SYSTEM LOG</div>
             <div className="space-y-1.5 min-h-[100px]">
              {logs.length === 0 && <div className="text-[10px] text-slate-600 pl-2 italic">Waiting for strategy...</div>}
              {logs.map((log, i) => (
                <div key={i} className="text-[11px] text-slate-300 bg-slate-800/40 p-2 rounded border-l-2 border-cyan-500/50 fade-in">
                  <span className="text-cyan-500 mr-1">></span> {log}
                </div>
              ))}
            </div>
          </div>

          {/* Controls Footer */}
          <div className="fixed bottom-0 left-0 right-0 bg-[#0f172a]/95 backdrop-blur-md border-t border-slate-700 z-40 max-w-md mx-auto pb-6 pt-3 px-3 shadow-[0_-5px_20px_rgba(0,0,0,0.5)]">
            <div className="grid grid-cols-3 gap-2 mb-2">
              <button onClick={() => setConfirmingStrategy("delivery_sensing")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-cyan-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-cyan-900 text-cyan-200 px-1 rounded border border-cyan-500/30">
                  Lv.{getStrategyLevel(strategyExp.delivery_sensing)}
                </div>
                <div className="text-cyan-400 mb-1"><Icon name="Truck"/></div>
                <div className="text-[10px] font-bold text-white">見守り配送</div>
                <div className="text-[8px] text-slate-500">Kizuna↑ Coherence↑</div>
              </button>
              <button onClick={() => setConfirmingStrategy("product_social")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-emerald-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-emerald-900 text-emerald-200 px-1 rounded border border-emerald-500/30">
                  Lv.{getStrategyLevel(strategyExp.product_social)}
                </div>
                <div className="text-emerald-400 mb-1"><Icon name="Clock"/></div>
                <div className="text-[10px] font-bold text-white">時短Kit</div>
                <div className="text-[8px] text-slate-500">Autonomy↑ Kinetics↑</div>
              </button>
              <button onClick={() => setConfirmingStrategy("hub_commons")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-purple-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-purple-900 text-purple-200 px-1 rounded border border-purple-500/30">
                  Lv.{getStrategyLevel(strategyExp.hub_commons)}
                </div>
                <div className="text-purple-400 mb-1"><Icon name="Users"/></div>
                <div className="text-[10px] font-bold text-white">拠点開放</div>
                <div className="text-[8px] text-slate-500">Kizuna↑ Kinetics↑</div>
              </button>
            </div>
            <button onClick={() => setConfirmingStrategy("default")} className="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-2.5 rounded border border-slate-600 font-bold transition-colors">
              通常業務のみを行う (気合・現状維持)
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
