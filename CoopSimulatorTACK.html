  <style>
    :root{

      --grid-line:rgba(255,255,255,.05);
    }
    body{
      font-family:'Noto Sans JP', 'Noto Sans', sans-serif;
      background-color:var(--bg-dark);
      color:#f8fafc;
      background-image:
        linear-gradient(var(--grid-line) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
      background-size:20px 20px;
      overflow-y:auto;
      touch-action:manipulation;
      padding-bottom:140px;
    }
    .font-mono{font-family:'JetBrains Mono',monospace;}
    .glass-panel{
      background:rgba(15,23,42,.95);
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 8px 32px rgba(0,0,0,.5);
    }

    @keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:.7}}
    .animate-pulse-soft{animation:pulse-soft 2s infinite}
    @keyframes slide-in{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .slide-in{animation:slide-in .3s ease-out forwards}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}
    .fade-in{animation:fade-in .5s ease-out forwards}
    
    .status-connected{background-color:#06b6d4;box-shadow:0 0 6px #06b6d4}
    .status-critical{background-color:#f43f5e;box-shadow:0 0 6px #f43f5e;animation:pulse-soft 0.8s infinite}
    .status-at-risk{background-color:#eab308}
    .status-normal{background-color:#334155}

    .modal-overlay{background-color:rgba(0,0,0,.8);z-index:100}
    .wb-bar{transition:width .6s cubic-bezier(.34,1.56,.64,1)}

    ::-webkit-scrollbar {width: 6px;}
    ::-webkit-scrollbar-track {background: #0f172a;}
    ::-webkit-scrollbar-thumb {background: #334155; border-radius: 3px;}

    /* Typewriter Cursor */
    .typewriter-cursor::after {
      content: '|';
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      from, to { color: transparent }
      50% { color: #06b6d4 }
    }

    // Typewriter Story Component

      const fullText = TEXT[lang].intro;
      const [displayedText, setDisplayedText] = useState("");

      // Reset when lang changes
      useEffect(() => {
        setDisplayedText("");
        setIndex(0);
      }, [lang]);

      useEffect(() => {
        if (index < fullText.length) {
          const timer = setTimeout(() => {
            setDisplayedText(prev => prev + fullText[index]);
            setIndex(prev => prev + 1);
          }, 30); 
          return () => clearTimeout(timer);
        }
      }, [index, fullText]);

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-black text-cyan-400 font-mono relative">

      const getLevelEffect = (baseEff, lv) => {
        if (!baseEff) return {};
        const mult = lv === 3 ? 1.5 : lv === 2 ? 1.2 : 1.0;
        const discount = lv === 3 ? 50 : 0; 
        
        const newEff = { ...baseEff };

           }
        }
        if (newEff.c) newEff.c = baseEff.c * mult;
        if (newEff.b < 0) newEff.b = Math.min(0, newEff.b + discount);
        
        return newEff;
      };

      const eff = getLevelEffect(logic.eff, level);

      const DiffBar = ({ current, diff, baseClass, label }) => {
        const isPositive = diff > 0;
        if (diff === 0) return null;

        return (
          <div className="flex items-center gap-2 text-xs mb-1.5">
            <div className="w-24 text-right font-mono text-slate-400 truncate text-[10px]">{label}</div>
            <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden flex relative">
              <div className={`h-full ${baseClass} opacity-50`} style={{ width: `${clamp(current, 0, 100)}%` }} />
              {diff !== 0 && (
                <div
                  className={`absolute h-full ${isPositive ? "bg-emerald-400" : "bg-rose-500"}`}
                  style={{ 
                    left: `${clamp(current, 0, 100)}%`, 
                    width: `${clamp(Math.abs(diff), 0, 100 - current)}%`,
                    transform: diff < 0 ? `translateX(-100%)` : 'none'
                  }} 
                />
              )}
            </div>
            <div className={`w-10 font-bold text-right ${isPositive ? "text-emerald-400" : diff < 0 ? "text-rose-400" : "text-slate-600"}`}>
              {diff > 0 ? `+${diff.toFixed(0)}` : diff === 0 ? "-" : diff.toFixed(0)}
            </div>
          </div>
        );
      };

      const wbLabels = {
        agency: TEXT[lang].tack.a.label.split('(')[0],
        meaning: TEXT[lang].tack.c.label.split('(')[0],
        vitality: TEXT[lang].tack.k.label.split('(')[0],
        connection: TEXT[lang].tack.kizuna.label.split('(')[0],
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in" role="dialog" aria-modal="true" aria-label={`${text.title}`} onClick={onCancel}>
          <div className="glass-panel w-full max-w-md p-0 rounded-xl overflow-hidden slide-in border border-cyan-500/30 shadow-2xl" onClick={e=>e.stopPropagation()}>
            <div className="bg-slate-900 p-4 border-b border-white/10 flex justify-between items-center">
              <div>
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span className="text-cyan-400">>></span> {text.title} 
                  {level > 1 && <span className="bg-yellow-500/20 text-yellow-400 text-xs px-2 py-0.5 rounded border border-yellow-500/50">Lv.{level}</span>}
                </h3>
                <p className="text-xs text-slate-400 font-mono mt-1">{text.subtitle}</p>
              </div>
            </div>

            <div className="p-5 space-y-4 max-h-[60vh] overflow-y-auto">
              <p className="text-sm text-slate-200 leading-relaxed font-bold border-l-2 border-cyan-500 pl-3">
                {text.desc}
              </p>
              
              <div className="bg-slate-950 p-3 rounded-lg border border-white/5 space-y-3">
                <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider flex justify-between">
                   <span>{TEXT[lang].forecast}</span>
                   {level > 1 && <span className="text-yellow-400 text-[10px]">Lv.{level} Boosted</span>}
                </div>
                
                <div className="flex justify-between text-xs font-mono mb-2 border-b border-white/5 pb-2">
                  <span className={eff.b >= 0 ? "text-emerald-400" : "text-rose-400"}>{TEXT[lang].budget}: {eff.b > 0 ? "+" : ""}{eff.b}k</span>
                  <span className={eff.bo <= 0 ? "text-emerald-400" : "text-rose-400"}>{TEXT[lang].burnout.split(' ')[0]}: {eff.bo > 0 ? "+" : ""}{eff.bo}</span>
                </div>

                <div className="space-y-1">
                  <DiffBar current={currentStats.trust} diff={eff.t || 0} baseClass="bg-yellow-500" label={TEXT[lang].tack.t.label.split('(')[0]} />
                  {WB_FACTORS_DEF.map(f => {
                    const diff = eff.wb?.[f.id] || 0;
                    return <DiffBar key={f.id} current={currentStats.wb[f.id]} diff={diff} baseClass={f.bg} label={wbLabels[f.id]} />;
                  })}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 text-xs">
                <div className="bg-emerald-950/30 p-2 rounded border border-emerald-500/20">
                  <div className="font-bold text-emerald-400 mb-1 flex items-center gap-1"><Icon name="Shield" size={12}/> {TEXT[lang].pros}</div>
                  <div className="text-slate-300 text-[10px] leading-tight">{text.pros}</div>
                </div>
                <div className="bg-rose-950/30 p-2 rounded border border-rose-500/20">
                  <div className="font-bold text-rose-400 mb-1 flex items-center gap-1"><Icon name="Zap" size={12}/> {TEXT[lang].cons}</div>
                  <div className="text-slate-300 text-[10px] leading-tight">{text.cons}</div>
                </div>
              </div>
            </div>

            <div className="p-4 bg-slate-900/80 flex gap-3 border-t border-white/10">
              <button onClick={onCancel} className="flex-1 py-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold transition-colors text-sm">
                {TEXT[lang].cancel}
              </button>
              <button onClick={onConfirm} className="flex-[2] py-3 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold shadow-lg shadow-cyan-500/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2">
                {TEXT[lang].confirm} <Icon name="ArrowRight" size={16}/>
              </button>
            </div>
          </div>
        </div>
      );
    });

    // ---------------------------
    // Main App
    // ---------------------------
    const App = () => {
      const [lang, setLang] = useState("ja");
      const [gameState, setGameState] = useState("intro"); 
      const [turn, setTurn] = useState(1);
      const [showHelp, setShowHelp] = useState(false);

      const [budget, setBudget] = useState(INITIAL_BUDGET);
      const [burnout, setBurnout] = useState(20);
      const [trust, setTrust] = useState(100);

      const [logs, setLogs] = useState([]);
      const [activeEvent, setActiveEvent] = useState(null);
      const [confirmingStrategy, setConfirmingStrategy] = useState(null);
      const [usedEventIds, setUsedEventIds] = useState([]);

      const [wbStats, setWbStats] = useState({ connection: 30, agency: 40, meaning: 50, vitality: 40 });
      const [households, setHouseholds] = useState(() => Array.from({ length: 100 }, (_, i) => ({ id: i, status: STATUS.NORMAL, isMember: Math.random() > 0.3 })));
      const [finalScore, setFinalScore] = useState(null);
      
      const [strategyExp, setStrategyExp] = useState({ delivery_sensing: 0, product_social: 0, hub_commons: 0 });

      const addLog = useCallback((msg) => {
        setLogs(prev => [msg, ...prev].slice(0, 4));
      }, []);

      const getStrategyLevel = useCallback((exp) => {
        if (exp >= 5) return 3;
        if (exp >= 2) return 2;
        return 1;
      }, []);
      
      const getStrategyEffect = useCallback((id, exp) => {
        const baseEff = STRATEGY_LOGIC[id].eff;
        if (!baseEff) return {};
        
        const lv = getStrategyLevel(exp);
        const mult = lv === 3 ? 1.5 : lv === 2 ? 1.2 : 1.0;
        const discount = lv === 3 ? 50 : 0;
        
        const newEff = { ...baseEff };
        if (newEff.wb) {
           newEff.wb = {};
           for (let k in baseEff.wb) {
             newEff.wb[k] = baseEff.wb[k] * mult;
           }
        }
        if (newEff.c) newEff.c = baseEff.c * mult;
        if (newEff.b < 0) newEff.b = Math.min(0, newEff.b + discount);
        
        return newEff;
      }, [getStrategyLevel]);

      const metrics = useMemo(() => {
        const connected = households.filter(h => h.status === STATUS.CONNECTED).length;
        const critical = households.filter(h => h.status === STATUS.CRITICAL).length;
        const percentage = Math.floor((connected / households.length) * 100);
        return { connect: percentage, criticalCount: critical };
      }, [households]);

      const calculateScore = useCallback(() => {
        return {
          tack: {
            t: trust,
            a: wbStats.agency,
            c: wbStats.meaning,
            k: wbStats.vitality,
            kizuna: wbStats.connection
          }
        };
      }, [wbStats, trust]);

      const endIfNeeded = useCallback((nextBudget, nextBurnout, nextTrust, nextTurn) => {
        if (nextBudget <= 0 || nextBurnout >= 100 || nextTrust <= 0 || nextTurn > MAX_TURNS) {
          setFinalScore(calculateScore());
          setGameState("result");
          return true;
        }
        return false;
      }, [calculateScore]);

      const processTurn = useCallback((effect) => {
        setTrust(prev => clamp(prev + (effect.t || 0), 0, 100));
        setBudget(prev => {
          let income = 150;
          if (trust < 50) income = Math.floor(income * (trust / 50));
          return prev + income + (effect.b || 0);
        });
        setBurnout(prev => clamp(prev - 2 + (effect.bo || 0), 0, 100));
        setWbStats(prev => {
          const next = { ...prev };
          if (effect.wb) {
            for (const k of Object.keys(effect.wb)) next[k] = clamp(next[k] + effect.wb[k], 0, 100);
          }
          return next;
        });
        setHouseholds(prevHouseholds => {
          const assumedWb = { ...wbStats };
          if (effect.wb) {
             for (const k of Object.keys(effect.wb)) assumedWb[k] = clamp(assumedWb[k] + effect.wb[k], 0, 100);
          }
          const resLevel = (assumedWb.connection + assumedWb.agency + assumedWb.meaning + assumedWb.vitality) / 4;
          const riskProb = clamp(0.08 - (resLevel / 2000), 0.01, 0.15);
          const baseConnectChance = (effect.c || 0) / 100;
          return prevHouseholds.map(h => {
            let nextStatus = h.status;
            if (h.isMember) {
              if (h.status === STATUS.NORMAL && Math.random() < riskProb) nextStatus = STATUS.AT_RISK;
              else if (h.status === STATUS.AT_RISK && Math.random() < riskProb * 2.5) nextStatus = STATUS.CRITICAL;
              let connectChance = baseConnectChance;
              if (h.status === STATUS.CRITICAL) connectChance *= 0.3;
              connectChance += (resLevel / 1000);
              if (h.status !== STATUS.CONNECTED && Math.random() < connectChance) nextStatus = STATUS.CONNECTED;
            }
            return { ...h, status: nextStatus };
          });
        });
        setTurn(prev => prev + 1);
      }, [wbStats, trust]);

      const executeTurn = useCallback((strategyId) => {
        setConfirmingStrategy(null);
        if (strategyId !== 'default') {
          setStrategyExp(prev => {
            const currentExp = prev[strategyId] || 0;
            const nextExp = currentExp + 1;
            const prevLevel = getStrategyLevel(currentExp);
            const nextLevel = getStrategyLevel(nextExp);
            if (nextLevel > prevLevel) {
              const msg = TEXT[lang].lv_up.replace('{name}', TEXT[lang].strategies[strategyId].title).replace('{lv}', nextLevel);
              addLog(msg);
            }
            return { ...prev, [strategyId]: nextExp };
          });
        }

        if (Math.random() < 0.45) {
          const available = CRITICAL_EVENTS_LOGIC.filter(e => !usedEventIds.includes(e.id));
          const pool = available.length ? available : CRITICAL_EVENTS_LOGIC;
          const evt = pick(pool);
          setActiveEvent(evt);
          setUsedEventIds(prev => [...prev, evt.id]);
          return;
        }

        let eff = STRATEGY_LOGIC[strategyId].eff;
        if (strategyId !== 'default') eff = getStrategyEffect(strategyId, strategyExp[strategyId]);
        processTurn(eff);
      }, [processTurn, usedEventIds, strategyExp, getStrategyLevel, getStrategyEffect, addLog, lang]);

      const handleEventResolve = useCallback((choice, msg) => {
        addLog(msg);
        setActiveEvent(null);
        processTurn(choice.eff);
      }, [addLog, processTurn]);

      useEffect(() => {
        if (gameState !== "playing") return;
        endIfNeeded(budget, burnout, trust, turn);
      }, [budget, burnout, trust, turn, gameState, endIfNeeded]);

      const restart = useCallback(() => {
        setTurn(1);
        setBudget(INITIAL_BUDGET);
        setBurnout(20);
        setTrust(100);
        setWbStats({ connection: 30, agency: 40, meaning: 50, vitality: 40 });
        setHouseholds(Array.from({ length: 100 }, (_, i) => ({ id: i, status: STATUS.NORMAL, isMember: Math.random() > 0.3 })));
        setLogs([]);
        setActiveEvent(null);
        setUsedEventIds([]);
        setConfirmingStrategy(null);
        setGameState("playing");
        setStrategyExp({ delivery_sensing: 0, product_social: 0, hub_commons: 0 });
      }, []);

      // ---------------------------
      // Views
      // ---------------------------
      
      // Story Introduction
      if (gameState === "intro") {
        return <IntroStory onComplete={() => setGameState("start")} lang={lang} setLang={setLang} />;
      }

      if (gameState === "start") {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-slate-900 relative overflow-hidden">
             <div className="absolute inset-0 opacity-20 pointer-events-none" style={{background: 'radial-gradient(circle at 50% 50%, #06b6d4 0%, transparent 50%)'}}></div>
            
            <div className="absolute top-4 right-4">
               <LangSwitcher lang={lang} setLang={setLang} />
            </div>

            <div className="space-y-8 max-w-sm w-full relative z-10 fade-in">
              <div>
                <div className="text-cyan-400 font-mono text-xs mb-2 tracking-widest">{TEXT[lang].title_sub}</div>
                <h1 className="text-4xl font-black text-white leading-tight">
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">CoopSimulator</span><br/>
                  <span className="text-2xl text-slate-400">TACK Model Edition</span>
                </h1>
              </div>

              <div className="glass-panel p-6 rounded-xl text-left space-y-4 border-l-4 border-cyan-500">
                <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">
                  {TEXT[lang].start_desc}
                </p>
                <div className="text-xs text-slate-500 mt-2 bg-slate-900 p-2 rounded grid grid-cols-2 gap-2">
                  <span className="text-yellow-400 font-bold">{TEXT[lang].tack.t.label.split('(')[0]}</span>
                  <span className="text-emerald-400 font-bold">{TEXT[lang].tack.a.label.split('(')[0]}</span>
                  <span className="text-purple-400 font-bold">{TEXT[lang].tack.c.label.split('(')[0]}</span>
                  <span className="text-yellow-400 font-bold">{TEXT[lang].tack.k.label.split('(')[0]}</span>
                </div>
              </div>

              <button onClick={() => setGameState("playing")} className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all active:scale-95 flex items-center justify-center gap-2 group">
                {TEXT[lang].start_btn} <span className="group-hover:translate-x-1 transition-transform">→</span>
              </button>
            </div>
          </div>
        );
      }

      if (gameState === "result") {
        const { tack } = finalScore;
        const getBarColor = (val) => val < 30 ? "bg-rose-500" : val < 60 ? "bg-yellow-500" : "bg-emerald-500";
        const t = TEXT[lang].result;
        
        const getAnalysis = () => {
          if (tack.t < 30) return t.msg_t_fail;
          if (tack.a < 30) return t.msg_a_fail;
          if (tack.c < 30) return t.msg_c_fail;
          if (tack.k < 30) return t.msg_k_fail;
          return t.msg_success;
        };

        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-900 fade-in pb-20">
            <div className="glass-panel w-full max-w-sm p-0 rounded-xl overflow-hidden relative shadow-2xl">
              <div className={`h-2 ${budget <= 0 || burnout >= 100 || trust <= 0 ? "bg-rose-500" : "bg-emerald-500"}`}></div>
              
              <div className="p-6 text-center space-y-4">
                <h2 className="text-2xl font-bold text-white tracking-widest">{t.title}</h2>
                <div>
                   {budget <= 0 ? <div className="text-rose-400 font-bold"><Icon name="AlertTriangle" className="inline"/> {t.fail_money}</div>
                   : burnout >= 100 ? <div className="text-rose-400 font-bold"><Icon name="Zap" className="inline"/> {t.fail_burnout}</div>
                   : trust <= 0 ? <div className="text-rose-400 font-bold"><Icon name="Lock" className="inline"/> {t.fail_trust}</div>
                   : <div className="text-emerald-400 font-bold"><Icon name="Trophy" className="inline"/> {t.success}</div>}
                </div>

                <div className="bg-slate-950/80 p-4 rounded-lg border border-white/10 text-left space-y-3">
                  <div className="text-xs font-bold text-slate-400 border-b border-slate-800 pb-1 mb-2">{t.analysis}</div>
                  
                  {/* T */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>{TEXT[lang].tack.t.label.split('(')[0]}</span> <span>{tack.t}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.t)}`} style={{width: `${tack.t}%`}}></div>
                    </div>
                  </div>
                  {/* A (Agency) */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>{TEXT[lang].tack.a.label.split('(')[0]}</span> <span>{tack.a}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.a)}`} style={{width: `${tack.a}%`}}></div>
                    </div>
                  </div>
                  {/* C */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>{TEXT[lang].tack.c.label.split('(')[0]}</span> <span>{tack.c}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.c)}`} style={{width: `${tack.c}%`}}></div>
                    </div>
                  </div>
                  {/* K */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold text-slate-300">
                      <span>{TEXT[lang].tack.k.label.split('(')[0]}</span> <span>{tack.k}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                       <div className={`h-full ${getBarColor(tack.k)}`} style={{width: `${tack.k}%`}}></div>
                    </div>
                  </div>

                  <div className="mt-4 pt-4 border-t border-slate-800 text-xs text-slate-300 leading-relaxed font-mono bg-slate-900 p-2 rounded">
                    <span className="text-cyan-400 font-bold">>> ANALYSIS:</span><br/>
                    {getAnalysis()}
                  </div>
                </div>
              </div>

              <div className="p-4 bg-slate-900/80 border-t border-slate-800 flex gap-3">
                <button onClick={restart} className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg text-sm shadow-lg shadow-cyan-500/20 transition-all active:scale-95">
                  {t.retry}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // playing
      const tackLabels = {
        agency: TEXT[lang].tack.a.label.split('(')[0],
        meaning: TEXT[lang].tack.c.label.split('(')[0],
        vitality: TEXT[lang].tack.k.label.split('(')[0],
        connection: TEXT[lang].tack.kizuna.label.split('(')[0],
      };

      return (
        <div className="min-h-screen max-w-md mx-auto flex flex-col relative pb-32 fade-in">
          {showHelp && <HelpModal onClose={() => setShowHelp(false)} lang={lang} />}
          {activeEvent && <EventModal eventLogic={activeEvent} onResolve={handleEventResolve} onClose={() => setActiveEvent(null)} lang={lang} />}
          {confirmingStrategy && <StrategyConfirmModal strategyId={confirmingStrategy} currentStats={{ wb: wbStats, budget, burnout, trust }} level={confirmingStrategy !== 'default' ? getStrategyLevel(strategyExp[confirmingStrategy]) : 1} onConfirm={() => executeTurn(confirmingStrategy)} onCancel={() => setConfirmingStrategy(null)} lang={lang} />}

          {/* Header */}
          <div className="glass-panel p-4 m-4 rounded-xl sticky top-4 z-30 shadow-xl">
            <div className="flex justify-between items-start mb-4">
              <div className="flex flex-col">
                <span className="text-[10px] font-bold text-slate-400 tracking-wider mb-1">{TEXT[lang].budget}</span>
                <div className={`text-2xl font-mono font-bold leading-none ${budget < 1000 ? "text-rose-500 animate-pulse" : "text-white"}`}>
                  ¥{budget.toLocaleString()}k
                </div>
              </div>
              <div className="flex items-center gap-2">
                 <div className="flex flex-col items-end mr-2">
                    <span className="text-[10px] font-bold text-slate-400 tracking-wider">{TEXT[lang].turn}</span>
                    <span className="text-lg font-bold text-cyan-400 leading-none">{turn}<span className="text-sm text-slate-500">/{MAX_TURNS}</span></span>
                 </div>
                 <button onClick={() => setShowHelp(true)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-300 transition-colors">
                   <Icon name="Help" size={20} />
                 </button>
              </div>
            </div>

            <div className="space-y-3">
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                   <span className="text-rose-400 font-bold flex items-center gap-1"><Icon name="Zap" size={10}/> {TEXT[lang].burnout}</span>
                   <span className="text-white font-mono">{burnout}%</span>
                </div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                   <div className={`h-full wb-bar ${burnout > 80 ? "bg-rose-500 animate-pulse" : "bg-rose-500"}`} style={{ width: `${clamp(burnout, 0, 100)}%` }}></div>
                </div>
              </div>
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                   <span className="text-yellow-400 font-bold flex items-center gap-1"><Icon name="Scale" size={10}/> {TEXT[lang].tack.t.label}</span>
                   <span className="text-white font-mono">{trust}%</span>
                </div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                   <div className={`h-full wb-bar ${trust < 50 ? "bg-yellow-600 animate-pulse" : "bg-yellow-500"}`} style={{ width: `${clamp(trust, 0, 100)}%` }}></div>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-4 gap-2 mt-4 pt-4 border-t border-white/5">
              {WB_FACTORS_DEF.map(f => (
                <div key={f.id} className="flex flex-col items-center p-1.5 rounded bg-slate-800/50 border border-white/5 cursor-help active:scale-95 transition-transform" onClick={() => setShowHelp(true)}>
                  <Icon name={f.icon} size={14} className={f.color}/>
                  <div className="text-[10px] font-bold text-slate-300 mt-1">{Math.floor(wbStats[f.id])}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Map */}
          <div className="px-4 mb-4">
            <div className="glass-panel p-3 rounded-xl">
              <div className="text-[10px] text-slate-500 mb-2 font-bold tracking-widest flex justify-between items-center">
                <span>{TEXT[lang].monitoring}</span>
                <span className="text-cyan-400 bg-cyan-950/50 px-2 py-0.5 rounded flex items-center gap-1 border border-cyan-500/20 text-[10px]">
                  <Icon name="Target" size={10}/> {TEXT[lang].coverage}: {metrics.connect}%
                </span>
              </div>
              <div className="grid grid-cols-10 gap-1 aspect-[10/5] bg-slate-900/50 p-1 rounded">
                {households.slice(0, 50).map(h => {
                  let colorClass = "status-normal opacity-30";
                  if (h.isMember) {
                    if (h.status === STATUS.CONNECTED) colorClass = "status-connected";
                    else if (h.status === STATUS.CRITICAL) colorClass = "status-critical";
                    else if (h.status === STATUS.AT_RISK) colorClass = "status-at-risk";
                    else colorClass = "status-normal";
                  }
                  return <div key={h.id} className={`w-full h-full rounded-[1px] ${colorClass} transition-all duration-500`} />;
                })}
              </div>
            </div>
          </div>

          {/* Logs */}
          <div className="px-4 mb-20 flex-1">
             <div className="text-[10px] font-bold text-slate-500 mb-1 ml-1">{TEXT[lang].system_log}</div>
             <div className="space-y-1.5 min-h-[100px]">
              {logs.length === 0 && <div className="text-[10px] text-slate-600 pl-2 italic">{TEXT[lang].waiting_log}</div>}
              {logs.map((log, i) => (
                <div key={i} className="text-[11px] text-slate-300 bg-slate-800/40 p-2 rounded border-l-2 border-cyan-500/50 fade-in">
                  <span className="text-cyan-500 mr-1">></span> {log}
                </div>
              ))}
            </div>
          </div>

          {/* Controls Footer */}
          <div className="fixed bottom-0 left-0 right-0 bg-[#0f172a]/95 backdrop-blur-md border-t border-slate-700 z-40 max-w-md mx-auto pb-6 pt-3 px-3 shadow-[0_-5px_20px_rgba(0,0,0,0.5)]">
            <div className="grid grid-cols-3 gap-2 mb-2">
              <button onClick={() => setConfirmingStrategy("delivery_sensing")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-cyan-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-cyan-900 text-cyan-200 px-1 rounded border border-cyan-500/30">
                  Lv.{getStrategyLevel(strategyExp.delivery_sensing)}
                </div>
                <div className="text-cyan-400 mb-1"><Icon name="Truck"/></div>
                <div className="text-[10px] font-bold text-white leading-tight">{TEXT[lang].strategies.delivery_sensing.title.split(' ')[0]}</div>
                <div className="text-[8px] text-slate-500 truncate w-full text-center">T↑ C↑</div>
              </button>
              <button onClick={() => setConfirmingStrategy("product_social")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-emerald-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-emerald-900 text-emerald-200 px-1 rounded border border-emerald-500/30">
                  Lv.{getStrategyLevel(strategyExp.product_social)}
                </div>
                <div className="text-emerald-400 mb-1"><Icon name="Clock"/></div>
                <div className="text-[10px] font-bold text-white leading-tight">{TEXT[lang].strategies.product_social.title.split(' ')[0]}</div>
                <div className="text-[8px] text-slate-500 truncate w-full text-center">A↑ K↑</div>
              </button>
              <button onClick={() => setConfirmingStrategy("hub_commons")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-purple-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-purple-900 text-purple-200 px-1 rounded border border-purple-500/30">
                  Lv.{getStrategyLevel(strategyExp.hub_commons)}
                </div>
                <div className="text-purple-400 mb-1"><Icon name="Users"/></div>
                <div className="text-[10px] font-bold text-white leading-tight">{TEXT[lang].strategies.hub_commons.title.split(' ')[0]}</div>
                <div className="text-[8px] text-slate-500 truncate w-full text-center">Kizuna↑ K↑</div>
              </button>
            </div>
            <button onClick={() => setConfirmingStrategy("default")} className="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-2.5 rounded border border-slate-600 font-bold transition-colors">
              {TEXT[lang].strategies.default.btn_text}
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
