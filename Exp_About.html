<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVELOPMENT STORY - Vibe Coding｜西浦研究室</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                        serif: ['"Cinzel"', '"Noto Serif JP"', 'serif'],
                        body: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#4f46e5',
                            900: '#102a43',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #fcfcfc;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const Icon = ({ path, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const icons = {
            arrowLeft: <><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></>,
            sparkles: <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></>,
            code: <><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></>,
            brain: <><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></>,
            monitor: <><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></>,
            message: <><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></>,
            arrowRight: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>
        };

        // --- Translations ---
        const translations = {
            ja: {
                lab_name: "Nishiura Lab.",
                nav_home: "Home",
                nav_about: "About",
                nav_dev: "DEVELOPMENT STORY",
                nav_research: "Research",
                nav_contact: "Contact",
                
                hero_title_1: "この実験プラットフォームの",
                hero_title_2: "秘密",
                hero_desc: "実は、このWebサイトのプログラムコードは、<br />人間がキーボードで打ち込んだものではありません。",
                
                vibe_title: "Vibe Coding（バイブ・コーディング）とは？",
                vibe_desc: "このプラットフォームは、現在シリコンバレーなどで注目されている<strong>「Vibe Coding」</strong>という手法で作られています。プログラミング言語を一文字ずつ書くのではなく、AIに対して「どのような実験をしたいか」「どのようなデザイン（Vibe）にしたいか」を自然言語で指示し、対話しながら構築していく手法です。",
                
                role_human: "人間（心理学者）",
                role_human_desc: "「ストループ課題を作りたい」<br>「刺激提示は500msで」<br><span class='font-bold text-indigo-700'>実験デザインと専門知識を提供</span>",
                role_ai: "生成AI",
                role_ai_desc: "Webコードを瞬時に生成。<br>デザインの調整。<br><span class='font-bold text-teal-700'>バグ修正・実装を担当</span>",
                cycle_label: "対話と修正",

                msg_title: "学生の皆さんへ",
                msg_p1: "「AIがコードを書くなら、人間の心理学者は不要になる？」<br>そう思うかもしれませんが、答えは<strong>「いいえ、逆です」</strong>。",
                msg_p2: "AIはコードの書き方は知っていますが、<strong>「人間の心がどう動くか」「どうすれば心理効果を測定できるか」</strong>は知りません。それを正しく設計し、指示できるのは心理学を学ぶ皆さんだけです。",
                msg_highlight: "プログラミングスキル以上に、「何を明らかにしたいか」という心理学の専門知識が、これからの時代の最強のクリエイティブ・ツールになります。",
                
                footer_credit: "Developed with Vibe Coding methodology.",
                footer_roles: "Director: Human / Coder: AI Model"
            },
            en: {
                lab_name: "Nishiura Lab.",
                nav_home: "Home",
                nav_about: "About",
                nav_dev: "DEVELOPMENT STORY",
                nav_research: "Research",
                nav_contact: "Contact",

                hero_title_1: "The Secret Behind",
                hero_title_2: "This Platform",
                hero_desc: "Actually, the code for this website was not<br />typed by a human keyboard.",

                vibe_title: "What is Vibe Coding?",
                vibe_desc: "This platform was built using a methodology called <strong>'Vibe Coding'</strong>, which is currently gaining attention in Silicon Valley. Instead of writing programming language character by character, we instruct the AI in natural language about 'what kind of experiment we want' and 'what kind of design (Vibe) we prefer', building it through dialogue.",

                role_human: "Human (Psychologist)",
                role_human_desc: "\"I want to make a Stroop task\"<br>\"Stimulus presentation for 500ms\"<br><span class='font-bold text-indigo-700'>Provides experimental design & expertise</span>",
                role_ai: "Generative AI",
                role_ai_desc: "Instantly generates Web code.<br>Adjusts design.<br><span class='font-bold text-teal-700'>Handles bug fixes & implementation</span>",
                cycle_label: "Dialogue & Refinement",

                msg_title: "To All Students",
                msg_p1: "\"If AI writes the code, do we still need human psychologists?\"<br>You might think so, but the answer is <strong>\"No, quite the opposite.\"</strong>",
                msg_p2: "AI knows how to write code, but it doesn't know <strong>\"how the human mind works\"</strong> or <strong>\"how to measure psychological effects.\"</strong> Only you, studying psychology, can properly design and instruct that.",
                msg_highlight: "More than programming skills, your specialized knowledge in psychology—knowing 'what you want to clarify'—will become the most powerful creative tool in the coming era.",

                footer_credit: "Developed with Vibe Coding methodology.",
                footer_roles: "Director: Human / Coder: AI Model"
            },
            se: {
                lab_name: "Nishiura Lab.",
                nav_home: "Hem",
                nav_about: "Om oss",
                nav_dev: "DEVELOPMENT STORY",
                nav_research: "Forskning",
                nav_contact: "Kontakt",

                hero_title_1: "Hemligheten bakom",
                hero_title_2: "Denna plattform",
                hero_desc: "Faktum är att koden för denna webbplats inte<br />skrevs av en människa på ett tangentbord.",

                vibe_title: "Vad är Vibe Coding?",
                vibe_desc: "Denna plattform byggdes med en metod som kallas <strong>'Vibe Coding'</strong>. Istället för att skriva programmeringsspråk tecken för tecken, instruerar vi AI på naturligt språk om 'vilken typ av experiment vi vill ha' och 'vilken typ av design (Vibe) vi föredrar', och bygger det genom dialog.",

                role_human: "Människa (Psykolog)",
                role_human_desc: "\"Jag vill skapa en Stroop-uppgift\"<br>\"Stimuluspresentation i 500ms\"<br><span class='font-bold text-indigo-700'>Tillhandahåller experimentdesign & expertis</span>",
                role_ai: "Generativ AI",
                role_ai_desc: "Genererar webbkod direkt.<br>Justerar design.<br><span class='font-bold text-teal-700'>Hanterar buggfixar & implementering</span>",
                cycle_label: "Dialog & Förfining",

                msg_title: "Till alla studenter",
                msg_p1: "\"Om AI skriver koden, behöver vi då fortfarande mänskliga psykologer?\"<br>Du kanske tror det, men svaret är <strong>\"Nej, precis tvärtom.\"</strong>",
                msg_p2: "AI vet hur man skriver kod, men den vet inte <strong>\"hur det mänskliga sinnet fungerar\"</strong> eller <strong>\"hur man mäter psykologiska effekter.\"</strong> Endast ni som studerar psykologi kan designa och instruera det korrekt.",
                msg_highlight: "Mer än programmeringskunskaper kommer din specialistkunskap inom psykologi—att veta 'vad du vill klargöra'—att bli det mest kraftfulla kreativa verktyget i den kommande eran.",

                footer_credit: "Utvecklad med Vibe Coding-metodik.",
                footer_roles: "Regissör: Människa / Kodare: AI-modell"
            }
        };

        const LanguageSwitcher = ({ currentLang, setLang }) => (
            <div className="flex items-center gap-2 text-xs font-bold tracking-widest">
                <button onClick={() => setLang('en')} className={`hover:text-indigo-600 transition-colors ${currentLang === 'en' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}>EN</button>
                <span className="text-slate-300">|</span>
                <button onClick={() => setLang('ja')} className={`hover:text-indigo-600 transition-colors ${currentLang === 'ja' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}>JP</button>
                <span className="text-slate-300">|</span>
                <button onClick={() => setLang('se')} className={`hover:text-indigo-600 transition-colors ${currentLang === 'se' ? 'text-indigo-600 underline underline-offset-4' : 'text-slate-400'}`}>SE</button>
            </div>
        );

        const AboutPage = () => {
            const [lang, setLang] = useState("ja");
            
            // ブラウザの言語設定を反映
            useEffect(() => {
                const browserLang = navigator.language || navigator.userLanguage;
                if (browserLang.startsWith('ja')) setLang('ja');
                else if (browserLang.startsWith('sv')) setLang('se');
                else setLang('en');
            }, []);

            useEffect(() => { document.documentElement.lang = lang === 'se' ? 'sv' : lang; }, [lang]);

            const t = translations[lang];

            return (
                <div className="min-h-screen pb-12 font-sans flex flex-col">
                    
                    {/* Header (Unified with experiments.html) */}
                    <header className="glass sticky top-0 z-50 transition-all duration-300">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <a href="experiments.html" className="flex items-center gap-3 text-slate-500 hover:text-slate-900 transition-colors group">
                                <div className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center group-hover:border-slate-400 transition-colors bg-white"><Icon path={icons.arrowLeft} size={14} /></div>
                                <span className="text-xs font-bold tracking-widest uppercase font-serif">{t.lab_name}</span>
                            </a>
                            <div className="flex items-center gap-6">
                                <nav className="hidden md:flex gap-6 text-xs uppercase tracking-widest font-medium text-slate-500">
                                    <a href="https://nishiura-lab.workspace-370172.chatgpt.site/" className="hover:text-indigo-600 transition-colors">{t.nav_home}</a>
                                    <a href="experiments.html#concept" className="hover:text-indigo-600 transition-colors">Concept</a>
                                    <span className="text-indigo-600 font-bold border-b-2 border-indigo-600">{t.nav_dev}</span>
                                    <a href="experiments.html#library" className="hover:text-indigo-600 transition-colors">Library</a>
                                    <a href="https://nishiura-lab.workspace-370172.chatgpt.site/#contact" className="hover:text-indigo-600 transition-colors">{t.nav_contact}</a>
                                </nav>
                                <LanguageSwitcher currentLang={lang} setLang={setLang} />
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <div className="flex-grow max-w-4xl mx-auto space-y-12 px-4 py-12 w-full">
                        
                        {/* 1. Hero Section */}
                        <section className="text-center space-y-6 py-12 px-6 bg-gradient-to-br from-indigo-50 to-blue-50 rounded-3xl shadow-sm border border-blue-100 animate-fade-up">
                            <div className="flex justify-center mb-4">
                                <div className="bg-white p-4 rounded-full shadow-md text-indigo-600">
                                    <Icon path={icons.sparkles} size={32} />
                                </div>
                            </div>
                            <h1 className="text-3xl md:text-4xl font-serif font-bold text-gray-900 leading-tight">
                                {t.hero_title_1}<br className="md:hidden" /> <span className="text-indigo-600">{t.hero_title_2}</span>
                            </h1>
                            <p className="text-lg text-gray-600 max-w-2xl mx-auto" dangerouslySetInnerHTML={{__html: t.hero_desc}}></p>
                        </section>

                        {/* 2. Vibe Coding Explanation */}
                        <section className="space-y-6 animate-fade-up" style={{animationDelay: '0.1s'}}>
                            <div className="flex items-center space-x-3 mb-6 px-2">
                                <div className="text-indigo-600">
                                    <Icon path={icons.code} size={28} />
                                </div>
                                <h2 className="text-2xl font-serif font-bold text-gray-900">{t.vibe_title}</h2>
                            </div>

                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
                                <p className="leading-relaxed text-gray-700 mb-8 text-lg" dangerouslySetInnerHTML={{__html: t.vibe_desc}}></p>
                                
                                {/* Diagram Area */}
                                <div className="grid md:grid-cols-3 gap-6 text-center mt-8 items-center">
                                    
                                    {/* Left: Human */}
                                    <div className="bg-indigo-50 p-6 rounded-xl flex flex-col items-center h-full">
                                        <div className="bg-white p-3 rounded-full mb-3 shadow-sm text-indigo-600">
                                            <Icon path={icons.brain} size={32} />
                                        </div>
                                        <h3 className="font-bold text-lg mb-2 text-gray-800">{t.role_human}</h3>
                                        <p className="text-sm text-gray-600 leading-relaxed" dangerouslySetInnerHTML={{__html: t.role_human_desc}}></p>
                                    </div>

                                    {/* Center: Arrow */}
                                    <div className="flex flex-col items-center justify-center py-2 md:py-0">
                                        <div className="bg-blue-100 px-4 py-1 rounded-full text-blue-800 text-xs font-bold mb-2">{t.cycle_label}</div>
                                        <div className="text-gray-400 rotate-90 md:rotate-0">
                                            <Icon path={icons.arrowRight} size={32} />
                                        </div>
                                    </div>

                                    {/* Right: AI */}
                                    <div className="bg-teal-50 p-6 rounded-xl flex flex-col items-center h-full">
                                        <div className="bg-white p-3 rounded-full mb-3 shadow-sm text-teal-600">
                                            <Icon path={icons.monitor} size={32} />
                                        </div>
                                        <h3 className="font-bold text-lg mb-2 text-gray-800">{t.role_ai}</h3>
                                        <p className="text-sm text-gray-600 leading-relaxed" dangerouslySetInnerHTML={{__html: t.role_ai_desc}}></p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* 3. Message to Students */}
                        <section className="bg-slate-900 text-white p-8 md:p-10 rounded-3xl shadow-xl overflow-hidden relative animate-fade-up" style={{animationDelay: '0.2s'}}>
                            {/* Background Effects */}
                            <div className="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-indigo-500 rounded-full blur-3xl opacity-20 pointer-events-none"></div>
                            <div className="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-teal-500 rounded-full blur-3xl opacity-20 pointer-events-none"></div>
                            
                            <div className="relative z-10">
                                <div className="flex items-center space-x-3 mb-6">
                                    <div className="text-indigo-300">
                                        <Icon path={icons.message} size={28} />
                                    </div>
                                    <h2 className="text-2xl font-serif font-bold">{t.msg_title}</h2>
                                </div>
                                <div className="space-y-5 text-slate-200 leading-relaxed text-lg">
                                    <p dangerouslySetInnerHTML={{__html: t.msg_p1}}></p>
                                    <p dangerouslySetInnerHTML={{__html: t.msg_p2}}></p>
                                    <div className="pt-6 border-t border-slate-700 mt-6">
                                        <p className="font-bold text-white text-xl">
                                            {t.msg_highlight}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Footer */}
                        <div className="text-center text-sm text-gray-500 pt-8 pb-4">
                            <p>{t.footer_credit}</p>
                            <p>{t.footer_roles}</p>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AboutPage />);
    </script>
</body>
</html>
