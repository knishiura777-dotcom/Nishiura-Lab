<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>高密度戦略シミュレータ: 解説付き版</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-dark:#0f172a;
      --primary:#06b6d4; --secondary:#ec4899; --accent:#eab308; --danger:#f43f5e;
      --grid-line:rgba(255,255,255,.05);
    }
    body{
      font-family:'Noto Sans JP',sans-serif;
      background-color:var(--bg-dark);
      color:#f8fafc;
      background-image:
        linear-gradient(var(--grid-line) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
      background-size:20px 20px;
      overflow-y:auto;
      touch-action:manipulation;
      padding-bottom:140px; /* 下部ボタン用の余白を少し拡大 */
    }
    .font-mono{font-family:'JetBrains Mono',monospace;}
    .glass-panel{
      background:rgba(15,23,42,.95);
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 8px 32px rgba(0,0,0,.5);
    }

    @keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:.7}}
    .animate-pulse-soft{animation:pulse-soft 2s infinite}
    @keyframes slide-in{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .slide-in{animation:slide-in .3s ease-out forwards}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}
    .fade-in{animation:fade-in .5s ease-out forwards}
    @keyframes level-up{0%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.2);filter:brightness(1.5)}100%{transform:scale(1);filter:brightness(1)}}
    .animate-levelup{animation:level-up 0.5s ease-out}

    .status-connected{background-color:#06b6d4;box-shadow:0 0 6px #06b6d4}
    .status-critical{background-color:#f43f5e;box-shadow:0 0 6px #f43f5e;animation:pulse-soft 0.8s infinite}
    .status-at-risk{background-color:#eab308}
    .status-normal{background-color:#334155}

    .modal-overlay{background-color:rgba(0,0,0,.8);z-index:100}
    .wb-bar{transition:width .6s cubic-bezier(.34,1.56,.64,1)}

    .cursor-blink{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}

    /* 独自スクロールバー */
    ::-webkit-scrollbar {width: 6px;}
    ::-webkit-scrollbar-track {background: #0f172a;}
    ::-webkit-scrollbar-thumb {background: #334155; border-radius: 3px;}
    ::-webkit-scrollbar-thumb:hover {background: #475569;}
  </style>
</head>

<body>
  <div id="root"></div>

      // Calculate effect based on Level
      const getLevelEffect = (baseEff, lv) => {
        if (!baseEff) return {};
        const mult = lv === 3 ? 1.5 : lv === 2 ? 1.2 : 1.0;
        const discount = lv === 3 ? 50 : 0; // Discount cost at max level
        
        const newEff = { ...baseEff };
        // Apply multiplier to wb stats and connection chance
        if (newEff.wb) {
           newEff.wb = {};
           for (let k in baseEff.wb) {
             newEff.wb[k] = baseEff.wb[k] * mult;
           }
        }
        if (newEff.c) newEff.c = baseEff.c * mult;
        
        // Adjust budget cost (if negative)
        if (newEff.b < 0) newEff.b = Math.min(0, newEff.b + discount);
        
        return newEff;

    // ---------------------------

    const IntroScreen = ({ onComplete }) => {
      const [text, setText] = useState("");
      const fullText = `西暦2035年。
日本の人口減少は「危険水域」を突破した。

行政サービスは撤退し、
「買い物難民」「独居老人の孤立」「子育ての孤立」……
社会の隙間に、音もなく人々が落ちていく。

あなたに課せられた使命は、
地域に根ざした物流網を持つ「生協」を
次世代の『社会的共通資本』へとハックすること。

地域の資源（Resource）を最大化し、
社会的負荷（Risk）を最小化せよ。

これは、単なる経営シミュレーションではない。
この国の「生存戦略」だ。

Project: The Bridge
System Initializing...`;

      const idx = useRef(0);
      const [done, setDone] = useState(false);

          if (idx.current < fullText.length) {

          } else {
            clearInterval(timer);
            setDone(true);
          }
        }, 25);
        return () => clearInterval(timer);
      }, []);

      const handleClick = () => {

          setText(fullText);
          idx.current = fullText.length;
          setDone(true);
        } else {
          onComplete();
        }
      };

      return (

          </div>
          <div className={`mt-4 text-xs text-slate-500 animate-pulse font-sans w-full text-center transition-opacity duration-500 ${done ? "opacity-100" : "opacity-50"}`}>

    // ---------------------------
    // Household factory
    // ---------------------------
    const makeHouseholds = () =>
      Array.from({ length: 100 }, (_, i) => ({
        id: i,
        status: STATUS.NORMAL,
        isMember: Math.random() > 0.3,
      }));

    // ---------------------------
    // Main App
    // ---------------------------
    const App = () => {
      const [gameState, setGameState] = useState("start");
      const [turn, setTurn] = useState(1);
      const [showHelp, setShowHelp] = useState(false);

      const [budget, setBudget] = useState(INITIAL_BUDGET);
      const [burnout, setBurnout] = useState(20);
      const [trust, setTrust] = useState(100);

      const [logs, setLogs] = useState([]);
      const [activeEvent, setActiveEvent] = useState(null);
      const [confirmingStrategy, setConfirmingStrategy] = useState(null);
      const [usedEventIds, setUsedEventIds] = useState([]);

      const [wbStats, setWbStats] = useState({ connection: 30, autonomy: 40, meaning: 50, vitality: 40 });
      const [households, setHouseholds] = useState(() => makeHouseholds());
      const [finalScore, setFinalScore] = useState(null);
      const [ranking, setRanking] = useState([]);
      
      // Strategy Level System
      const [strategyExp, setStrategyExp] = useState({ delivery_sensing: 0, product_social: 0, hub_commons: 0 });

      const addLog = useCallback((msg) => {
        setLogs(prev => [msg, ...prev].slice(0, 4));
      }, []);

      const getStrategyLevel = useCallback((exp) => {
        if (exp >= 5) return 3; // Max Level
        if (exp >= 2) return 2;
        return 1;
      }, []);
      
      const getStrategyEffect = useCallback((id, exp) => {
        const baseEff = STRATEGY_DETAILS[id].eff;
        if (!baseEff) return {};
        
        const lv = getStrategyLevel(exp);
        const mult = lv === 3 ? 1.5 : lv === 2 ? 1.2 : 1.0;
        const discount = lv === 3 ? 50 : 0;
        
        const newEff = { ...baseEff };
        if (newEff.wb) {
           newEff.wb = {};
           for (let k in baseEff.wb) {
             newEff.wb[k] = baseEff.wb[k] * mult;
           }
        }
        if (newEff.c) newEff.c = baseEff.c * mult;
        if (newEff.b < 0) newEff.b = Math.min(0, newEff.b + discount);
        
        return newEff;
      }, [getStrategyLevel]);

      const metrics = useMemo(() => {
        const connected = households.filter(h => h.status === STATUS.CONNECTED).length;
        const critical = households.filter(h => h.status === STATUS.CRITICAL).length;
        const percentage = Math.floor((connected / households.length) * 100);
        
        let label = "五里霧中";
        if (percentage >= 90) label = "天下泰平";
        else if (percentage >= 70) label = "共存共栄";
        else if (percentage >= 50) label = "一致団結";
        else if (percentage >= 30) label = "一進一退";
        else if (percentage >= 15) label = "孤立無援";

        return { 
          connect: percentage,
          criticalCount: critical,
          label
        };
      }, [households]);

      const wbBalance = useMemo(() => {
        const resources = (wbStats.connection + wbStats.autonomy + wbStats.meaning + wbStats.vitality) / 4;
        return { resources, risks: burnout };
      }, [wbStats, burnout]);

      const calculateScore = useCallback(() => {
        const resourceScore = Math.floor(Object.values(wbStats).reduce((a, b) => a + b, 0) * 10);
        const coverageScore = metrics.connect * 20;
        const budgetScore = Math.floor(Math.max(0, budget) / 10);
        const riskPenalty = Math.floor(burnout * 20);
        const trustBonus = trust * 10;
        
        const total = Math.max(0, resourceScore + coverageScore + budgetScore + trustBonus - riskPenalty);
        
        return {
          total,
          details: {
            resource: resourceScore,
            coverage: coverageScore,
            budget: budgetScore,
            trust: trustBonus,
            risk: riskPenalty
          }
        };
      }, [wbStats, metrics.connect, budget, burnout, trust]);

      const saveRanking = useCallback((scoreData) => {
        try {
          const stored = localStorage.getItem(RANKING_KEY);
          let currentRank = stored ? JSON.parse(stored) : [];
          
          const newEntry = {
            date: new Date().toLocaleDateString(),
            score: scoreData.total,
            id: Date.now()
          };
          
          currentRank.push(newEntry);
          currentRank.sort((a, b) => b.score - a.score);
          currentRank = currentRank.slice(0, 5);
          
          localStorage.setItem(RANKING_KEY, JSON.stringify(currentRank));
          setRanking(currentRank);
          
          return newEntry.id;
        } catch (e) {
          console.error("Ranking save failed", e);
          return null;
        }
      }, []);

      const endIfNeeded = useCallback((nextBudget, nextBurnout, nextTrust, nextTurn) => {
        if (nextBudget <= 0 || nextBurnout >= 100 || nextTrust <= 0 || nextTurn > MAX_TURNS) {
          const score = calculateScore();
          if (nextBudget <= 0 || nextBurnout >= 100 || nextTrust <= 0) {
            score.total = Math.floor(score.total * 0.5);
          }
          
          setFinalScore(score);
          const newId = saveRanking(score);
          setFinalScore(prev => ({...prev, rankId: newId}));
          
          setGameState("result");
          return true;
        }
        return false;
      }, [calculateScore, saveRanking]);

      const processTurn = useCallback((effect) => {
        // Trust effect
        setTrust(prev => {
          const next = clamp(prev + (effect.t || 0), 0, 100);
          return next;
        });

        setBudget(prev => {
          // Trust affects base income. <50 trust reduces income.
          let income = 150;
          if (trust < 50) income = Math.floor(income * (trust / 50));
          
          const next = prev + income + (effect.b || 0);
          return next;
        });

        setBurnout(prev => clamp(prev - 2 + (effect.bo || 0), 0, 100));

        setWbStats(prev => {
          const next = { ...prev };
          if (effect.wb) {
            for (const k of Object.keys(effect.wb)) {
              next[k] = clamp(next[k] + effect.wb[k], 0, 100);
            }
          }
          return next;
        });

        setHouseholds(prevHouseholds => {
          const assumedWb = { ...wbStats };
          if (effect.wb) {
            for (const k of Object.keys(effect.wb)) assumedWb[k] = clamp(assumedWb[k] + effect.wb[k], 0, 100);
          }

          const resLevel = (assumedWb.connection + assumedWb.autonomy + assumedWb.meaning + assumedWb.vitality) / 4;
          const riskProb = clamp(0.08 - (resLevel / 2000), 0.01, 0.15);

          const baseConnectChance = (effect.c || 0) / 100;

          return prevHouseholds.map(h => {
            let nextStatus = h.status;

            if (h.isMember) {
              if (h.status === STATUS.NORMAL && Math.random() < riskProb) nextStatus = STATUS.AT_RISK;
              else if (h.status === STATUS.AT_RISK && Math.random() < riskProb * 2.5) nextStatus = STATUS.CRITICAL;

              let connectChance = baseConnectChance;
              if (h.status === STATUS.CRITICAL) connectChance *= 0.3;

              connectChance += (resLevel / 1000);

              if (h.status !== STATUS.CONNECTED && Math.random() < connectChance) {
                nextStatus = STATUS.CONNECTED;
              }
            }
            return { ...h, status: nextStatus };
          });
        });

        setTurn(prevTurn => {
          const nextTurn = prevTurn + 1;
          return nextTurn;
        });
      }, [wbStats, trust]);

      const executeTurn = useCallback((strategyId) => {
        setConfirmingStrategy(null);

        // Update Strategy Experience if not default
        if (strategyId !== 'default') {
          setStrategyExp(prev => {
            const currentExp = prev[strategyId] || 0;
            const nextExp = currentExp + 1;
            const prevLevel = getStrategyLevel(currentExp);
            const nextLevel = getStrategyLevel(nextExp);
            
            if (nextLevel > prevLevel) {
              addLog(`【LvUP】${STRATEGY_DETAILS[strategyId].title} Lv${nextLevel}になりました！`);
            }
            return { ...prev, [strategyId]: nextExp };
          });
        }

        // 40% event trigger
        if (Math.random() < 0.4) {
          const available = CRITICAL_EVENTS.filter(e => !usedEventIds.includes(e.id));
          const pool = available.length ? available : CRITICAL_EVENTS;
          const evt = pick(pool);
          setActiveEvent(evt);
          setUsedEventIds(prev => [...prev, evt.id]);
          return;
        }

        // Apply effect with level boost
        let eff = STRATEGY_DETAILS[strategyId].eff;
        if (strategyId !== 'default') {
          eff = getStrategyEffect(strategyId, strategyExp[strategyId]);
        }
        processTurn(eff);
      }, [processTurn, usedEventIds, strategyExp, getStrategyLevel, getStrategyEffect, addLog]);

      const handleEventResolve = useCallback((choice) => {
        addLog(choice.msg);
        setActiveEvent(null);
        processTurn(choice.eff);
      }, [addLog, processTurn]);

      useEffect(() => {
        if (gameState !== "playing") return;
        endIfNeeded(budget, burnout, trust, turn);
      }, [budget, burnout, trust, turn, gameState, endIfNeeded]);

      const restart = useCallback(() => {
        setTurn(1);
        setBudget(INITIAL_BUDGET);
        setBurnout(20);
        setTrust(100);
        setWbStats({ connection: 30, autonomy: 40, meaning: 50, vitality: 40 });
        setHouseholds(makeHouseholds());
        setLogs([]);
        setActiveEvent(null);
        setUsedEventIds([]);
        setConfirmingStrategy(null);
        setGameState("playing");
        setStrategyExp({ delivery_sensing: 0, product_social: 0, hub_commons: 0 });
      }, []);

      // ---------------------------
      // Views
      // ---------------------------
      if (gameState === "start") {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-slate-900 relative overflow-hidden">
            <div className="absolute inset-0 opacity-20 pointer-events-none" style={{background: 'radial-gradient(circle at 50% 50%, #06b6d4 0%, transparent 50%)'}}></div>
            <div className="space-y-8 max-w-sm w-full relative z-10 fade-in">
              <div>
                <div className="text-cyan-400 font-mono text-xs mb-2 tracking-widest">STRATEGY SIMULATOR</div>
                <h1 className="text-4xl font-black text-white leading-tight">
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">THE BRIDGE</span><br/>
                  <span className="text-2xl text-slate-400">Co-op Strategy</span>
                </h1>
              </div>

              <div className="glass-panel p-6 rounded-xl text-left space-y-4 border-l-4 border-cyan-500">
                <div className="text-xs font-bold text-slate-400 border-b border-slate-700 pb-2 flex justify-between">
                  <span>MISSION BRIEFING</span>
                  <span className="animate-pulse text-cyan-400">● LIVE</span>
                </div>
                <p className="text-sm text-slate-300 leading-relaxed">
                  あなたは生協のエリアマネージャー。<br/>
                  24ヶ月間、破綻（資金尽・現場崩壊）を避けながら、孤立していく地域を物流網で繋ぎ止めろ。
                </p>
                <div className="text-xs text-slate-500 mt-2 bg-slate-900 p-2 rounded">
                  <span className="text-emerald-400 font-bold">Resources:</span> 絆・余白・意義・活力<br/>
                  <span className="text-rose-400 font-bold">Risks:</span> 資金ショート・現場疲弊・地域孤立・信用失墜
                </div>
              </div>

              <button
                onClick={() => setGameState("intro")}
                className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all active:scale-95 flex items-center justify-center gap-2 group"
              >
                シミュレーション開始 <span className="group-hover:translate-x-1 transition-transform">→</span>
              </button>
            </div>
          </div>
        );
      }

      if (gameState === "intro") {
        return <IntroScreen onComplete={() => setGameState("playing")} />;
      }

      if (gameState === "result") {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-900 fade-in pb-20">
            <div className="glass-panel w-full max-w-sm p-0 rounded-xl overflow-hidden relative shadow-2xl">
              <div className={`h-2 ${budget <= 0 || burnout >= 100 || trust <= 0 ? "bg-rose-500" : "bg-emerald-500"}`}></div>
              
              <div className="p-6 text-center space-y-4">
                <h2 className="text-2xl font-bold text-white tracking-widest">RESULT</h2>

                <div>
                   {budget <= 0 ? (
                      <div className="text-rose-400 font-bold text-lg"><Icon name="AlertTriangle" className="inline mb-1"/> 資金ショート</div>
                   ) : burnout >= 100 ? (
                      <div className="text-rose-400 font-bold text-lg"><Icon name="Zap" className="inline mb-1"/> 組織崩壊</div>
                   ) : trust <= 0 ? (
                      <div className="text-rose-400 font-bold text-lg"><Icon name="Lock" className="inline mb-1"/> 社会的信用失墜</div>
                   ) : (
                      <div className="text-emerald-400 font-bold text-lg"><Icon name="Trophy" className="inline mb-1"/> MISSION ACCOMPLISHED</div>
                   )}
                </div>

                {finalScore && (
                  <div className="bg-slate-950/50 p-4 rounded-lg border border-white/5">
                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-2">Well-being Management Index</div>
                    <div className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-white mb-4">
                      {finalScore.total.toLocaleString()}
                    </div>
                    
                    <div className="space-y-1 text-xs font-mono">
                      <div className="flex justify-between">
                        <span className="text-emerald-400">Resources (地域資源)</span>
                        <span>+{finalScore.details.resource}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-cyan-400">Coverage (見守り)</span>
                        <span>+{finalScore.details.coverage}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Budget (財務健全性)</span>
                        <span>+{finalScore.details.budget}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-yellow-400">Trust (信頼ボーナス)</span>
                        <span>+{finalScore.details.trust}</span>
                      </div>
                      <div className="flex justify-between border-t border-slate-800 pt-1 mt-1">
                        <span className="text-rose-400">Risk Penalty (疲弊)</span>
                        <span className="text-rose-400">-{finalScore.details.risk}</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* Ranking Board */}
                <div className="bg-slate-800 rounded-lg p-3 text-left">
                  <div className="text-[10px] font-bold text-slate-400 mb-2 flex items-center gap-1">
                    <Icon name="Medal" size={12} className="text-yellow-500"/> TOP 5 RANKING
                  </div>
                  <div className="space-y-1">
                    {ranking.map((r, i) => (
                      <div 
                        key={i} 
                        className={`flex justify-between text-xs p-1.5 rounded ${finalScore && finalScore.rankId === r.id ? "bg-cyan-900/50 border border-cyan-500/30 text-cyan-200 font-bold" : "text-slate-400 even:bg-slate-700/30"}`}
                      >
                        <span className="flex gap-2">
                           <span className="w-4 text-center">{i+1}.</span>
                           <span>{r.date}</span>
                        </span>
                        <span className="font-mono">{r.score.toLocaleString()}</span>
                      </div>
                    ))}
                    {ranking.length === 0 && <div className="text-center text-[10px] text-slate-600 py-2">No Records Yet</div>}
                  </div>
                </div>
              </div>

              <div className="p-4 bg-slate-900/80 border-t border-slate-800 flex gap-3">
                <button onClick={() => setGameState("start")} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg text-sm transition-colors">
                  タイトル
                </button>
                <button onClick={restart} className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg text-sm shadow-lg shadow-cyan-500/20 transition-all active:scale-95">
                  再挑戦
                </button>
              </div>
            </div>
          </div>
        );
      }

      // playing
      return (
        <div className="min-h-screen max-w-md mx-auto flex flex-col relative pb-32 fade-in">
          {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
          
          {activeEvent && (
            <EventModal
              event={activeEvent}
              onResolve={handleEventResolve}
              onClose={() => setActiveEvent(null)}
            />
          )}

          {confirmingStrategy && (
            <StrategyConfirmModal
              strategyId={confirmingStrategy}
              currentStats={{ wb: wbStats, budget, burnout }}
              level={strategyExp && confirmingStrategy !== 'default' ? getStrategyLevel(strategyExp[confirmingStrategy]) : 1}
              onConfirm={() => executeTurn(confirmingStrategy)}
              onCancel={() => setConfirmingStrategy(null)}
            />
          )}

          {/* Header */}
          <div className="glass-panel p-4 m-4 rounded-xl sticky top-4 z-30 shadow-xl">
            <div className="flex justify-between items-start mb-4">
              <div className="flex flex-col">
                <span className="text-[10px] font-bold text-slate-400 tracking-wider mb-1">BUDGET (資金)</span>
                <div className={`text-2xl font-mono font-bold leading-none ${budget < 1000 ? "text-rose-500 animate-pulse" : "text-white"}`}>
                  ¥{budget.toLocaleString()}k
                </div>
              </div>
              
              <div className="flex items-center gap-2">
                 <div className="flex flex-col items-end mr-2">
                    <span className="text-[10px] font-bold text-slate-400 tracking-wider">TURN</span>
                    <span className="text-lg font-bold text-cyan-400 leading-none">{turn}<span className="text-sm text-slate-500">/{MAX_TURNS}</span></span>
                 </div>
                 <button onClick={() => setShowHelp(true)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-300 transition-colors">
                   <Icon name="Help" size={20} />
                 </button>
              </div>
            </div>

            {/* WB Balance Bars */}
            <div className="space-y-3">
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                   <span className="text-emerald-400 font-bold flex items-center gap-1"><Icon name="Shield" size={10}/> 地域の豊かさ</span>
                   <span className="text-white font-mono">{Math.floor(wbBalance.resources)}</span>
                </div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                   <div className="h-full bg-emerald-500 wb-bar" style={{ width: `${clamp(wbBalance.resources, 0, 100)}%` }}></div>
                </div>
              </div>
              
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                   <span className="text-rose-400 font-bold flex items-center gap-1"><Icon name="Zap" size={10}/> 現場の疲弊度</span>
                   <span className="text-white font-mono">{burnout}%</span>
                </div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                   <div className={`h-full wb-bar ${burnout > 80 ? "bg-rose-500 animate-pulse" : "bg-rose-500"}`} style={{ width: `${clamp(burnout, 0, 100)}%` }}></div>
                </div>
              </div>

              <div>
                <div className="flex justify-between text-[10px] mb-1">
                   <span className="text-yellow-400 font-bold flex items-center gap-1"><Icon name="Scale" size={10}/> 信頼 (Trust)</span>
                   <span className="text-white font-mono">{trust}%</span>
                </div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                   <div className={`h-full wb-bar ${trust < 50 ? "bg-yellow-600 animate-pulse" : "bg-yellow-500"}`} style={{ width: `${clamp(trust, 0, 100)}%` }}></div>
                </div>
              </div>
            </div>

            {/* WB Factors Grid */}
            <div className="grid grid-cols-4 gap-2 mt-4 pt-4 border-t border-white/5">
              {WB_FACTORS.map(f => (
                <div key={f.id} className="flex flex-col items-center p-1.5 rounded bg-slate-800/50 border border-white/5 cursor-help active:scale-95 transition-transform" onClick={() => setShowHelp(true)}>
                  <Icon name={f.icon} size={14} className={f.color}/>
                  <div className="text-[10px] font-bold text-slate-300 mt-1">{Math.floor(wbStats[f.id])}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Map */}
          <div className="px-4 mb-4">
            <div className="glass-panel p-3 rounded-xl">
              <div className="text-[10px] text-slate-500 mb-2 font-bold tracking-widest flex justify-between items-center">
                <span>MONITORING AREA</span>
                <div className="flex gap-2">
                  <span className="text-emerald-400 bg-emerald-950/30 px-2 py-0.5 rounded border border-emerald-500/20 font-mono text-[10px]">
                     {metrics.label}
                  </span>
                  <span className="text-cyan-400 bg-cyan-950/50 px-2 py-0.5 rounded flex items-center gap-1 border border-cyan-500/20">
                    <Icon name="Target" size={10}/> Coverage: {metrics.connect}%
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-10 gap-1 aspect-[10/5] bg-slate-900/50 p-1 rounded">
                {households.slice(0, 50).map(h => {
                  let colorClass = "status-normal opacity-30"; // Non-member
                  if (h.isMember) {
                    if (h.status === STATUS.CONNECTED) colorClass = "status-connected";
                    else if (h.status === STATUS.CRITICAL) colorClass = "status-critical";
                    else if (h.status === STATUS.AT_RISK) colorClass = "status-at-risk";
                    else colorClass = "status-normal";
                  }
                  return <div key={h.id} className={`w-full h-full rounded-[1px] ${colorClass} transition-all duration-500`} />;
                })}
              </div>
              <div className="mt-2 text-[10px] text-slate-500 text-right">
                {metrics.criticalCount > 0 && <span className="text-rose-400 animate-pulse font-bold">⚠ 孤立危機世帯: {metrics.criticalCount}</span>}
              </div>
            </div>
          </div>

          {/* Logs */}
          <div className="px-4 mb-20 flex-1">
             <div className="text-[10px] font-bold text-slate-500 mb-1 ml-1">SYSTEM LOG</div>
             <div className="space-y-1.5 min-h-[100px]">
              {logs.length === 0 && <div className="text-[10px] text-slate-600 pl-2 italic">No events yet...</div>}
              {logs.map((log, i) => (
                <div key={i} className="text-[11px] text-slate-300 bg-slate-800/40 p-2 rounded border-l-2 border-cyan-500/50 fade-in">
                  <span className="text-cyan-500 mr-1">></span> {log}
                </div>
              ))}
            </div>
          </div>

          {/* Controls Footer */}
          <div className="fixed bottom-0 left-0 right-0 bg-[#0f172a]/95 backdrop-blur-md border-t border-slate-700 z-40 max-w-md mx-auto pb-6 pt-3 px-3 shadow-[0_-5px_20px_rgba(0,0,0,0.5)]">
            <div className="grid grid-cols-3 gap-2 mb-2">
              <button onClick={() => setConfirmingStrategy("delivery_sensing")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-cyan-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-cyan-900 text-cyan-200 px-1 rounded border border-cyan-500/30">
                  Lv.{getStrategyLevel(strategyExp.delivery_sensing)}
                </div>
                <div className="text-cyan-400 mb-1"><Icon name="Truck"/></div>
                <div className="text-[10px] font-bold text-white">見守り配送</div>
                <div className="text-[8px] text-slate-500">絆↑ 意義↑</div>
              </button>

              <button onClick={() => setConfirmingStrategy("product_social")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-emerald-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-emerald-900 text-emerald-200 px-1 rounded border border-emerald-500/30">
                  Lv.{getStrategyLevel(strategyExp.product_social)}
                </div>
                <div className="text-emerald-400 mb-1"><Icon name="Clock"/></div>
                <div className="text-[10px] font-bold text-white">時短Kit</div>
                <div className="text-[8px] text-slate-500">余白↑ 活力↑</div>
              </button>

              <button onClick={() => setConfirmingStrategy("hub_commons")} className="flex flex-col items-center justify-center p-2 rounded-lg bg-slate-800 border border-slate-600 hover:border-purple-400 active:bg-slate-700 transition-all relative">
                <div className="absolute top-1 right-1 text-[8px] bg-purple-900 text-purple-200 px-1 rounded border border-purple-500/30">
                  Lv.{getStrategyLevel(strategyExp.hub_commons)}
                </div>
                <div className="text-purple-400 mb-1"><Icon name="Users"/></div>
                <div className="text-[10px] font-bold text-white">拠点開放</div>
                <div className="text-[8px] text-slate-500">絆↑ 活力↑</div>
              </button>
            </div>

            <button onClick={() => setConfirmingStrategy("default")} className="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-2.5 rounded border border-slate-600 font-bold transition-colors">
              通常業務のみを行う（コストカット・現状維持）
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
