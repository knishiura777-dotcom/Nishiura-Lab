<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoopSimulator stable noCDN</title>
<style>
:root{--bg:#0f172a;--panel:rgba(15,23,42,.94);--line:rgba(255,255,255,.12);--cyan:#06b6d4;--emerald:#10b981;--rose:#f43f5e;--yellow:#eab308;--purple:#a855f7;--muted:#94a3b8;--text:#f8fafc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Hiragino Sans','Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
body{background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:20px 20px;padding:18px 12px 150px;touch-action:manipulation}.wrap{max-width:560px;margin:0 auto}.screen{min-height:calc(100vh - 30px);display:flex;align-items:center;justify-content:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.45);padding:22px}.glass{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.title{font-weight:900;letter-spacing:.02em;line-height:1.1}.grad{background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tiny{font-size:11px}.small{font-size:13px}.btn{border:1px solid rgba(255,255,255,.14);background:#1e293b;color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;transition:.15s transform,.15s background,.15s border-color}.btn:hover{background:#334155;border-color:#22d3ee}.btn:active{transform:scale(.98)}.btn.primary{background:#0891b2;border-color:#22d3ee;box-shadow:0 0 22px rgba(6,182,212,.25)}.btn.good{background:#047857;border-color:#34d399}.btn.warn{background:#854d0e;border-color:#eab308}.btn.bad{background:#9f1239;border-color:#fb7185}.top{position:sticky;top:12px;z-index:5;padding:16px;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bar{height:8px;background:#1e293b;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;width:0;transition:width .45s cubic-bezier(.2,.9,.25,1)}.map{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;aspect-ratio:10/5;background:rgba(2,6,23,.5);padding:6px;border-radius:10px}.cell{border-radius:2px;background:#334155;opacity:.55;transition:.35s}.cell.connected{background:#06b6d4;box-shadow:0 0 7px #06b6d4;opacity:1}.cell.risk{background:#eab308;opacity:1}.cell.critical{background:#f43f5e;box-shadow:0 0 8px #f43f5e;opacity:1;animation:pulse 1s infinite}.cell.non{opacity:.2}@keyframes pulse{50%{opacity:.55}}.statbox{padding:10px;border-radius:13px;background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.08);text-align:center}.log{font-size:12px;line-height:1.45;background:rgba(30,41,59,.45);border-left:3px solid #06b6d4;border-radius:9px;padding:9px;color:#cbd5e1;margin:6px 0}.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,42,.97);border-top:1px solid #334155;box-shadow:0 -10px 30px rgba(0,0,0,.4);padding:12px;z-index:10}.footer .inner{max-width:560px;margin:0 auto}.strategy{min-height:86px;padding:10px 8px;position:relative}.badge{position:absolute;top:5px;right:5px;font-size:10px;background:rgba(6,182,212,.16);border:1px solid rgba(34,211,238,.35);color:#a5f3fc;border-radius:999px;padding:1px 6px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.modalBox{max-width:480px;width:100%;max-height:86vh;overflow:auto;background:#0f172a;border:1px solid rgba(255,255,255,.16);border-radius:20px;box-shadow:0 20px 80px rgba(0,0,0,.65)}.modalHead{padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:#111827}.modalBody{padding:16px}.choice{width:100%;text-align:left;margin:7px 0}.forecast{background:rgba(2,6,23,.65);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}.factor{padding:8px;border-radius:12px;background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.06);cursor:pointer}.factor .num{font-weight:900}.introText{white-space:pre-wrap;line-height:1.75;color:#6ee7b7}.blink{display:inline-block;width:8px;height:16px;background:#6ee7b7;margin-left:4px;animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}.lang{position:fixed;top:12px;right:12px;z-index:20}.notice{border-left:4px solid #22d3ee;background:rgba(6,182,212,.08);padding:12px;border-radius:12px;color:#cbd5e1}.resultBar{height:10px;background:#1e293b;border-radius:999px;overflow:hidden}.resultBar i{display:block;height:100%}@media(max-width:430px){.grid3{gap:6px}.strategy{font-size:12px}.card{padding:18px}body{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';
const root=document.getElementById('root');
const C={NORMAL:'normal',RISK:'risk',CRITICAL:'critical',CONNECTED:'connected'};
const MAX_TURNS=24, INITIAL_BUDGET=5000;
const factors=[
 {id:'connection',label:'絆',sub:'つながり',color:'#22d3ee',desc:'地域の人間関係。孤立を防ぐ基盤。'},
 {id:'autonomy',label:'余白',sub:'ゆとり',color:'#34d399',desc:'時間的・精神的な余裕。トラブル耐性。'},
 {id:'meaning',label:'意義',sub:'誇り',color:'#c084fc',desc:'活動への納得感。現場の士気。'},
 {id:'vitality',label:'活力',sub:'元気',color:'#facc15',desc:'地域のエネルギー。前向きな連鎖。'}
];
const strategies={
 delivery_sensing:{title:'見守り配送',sub:'物流網をセーフティネットへ',desc:'配送時に異変を見つけ、孤立を早期発見します。',pros:'孤立リスクを低減。絆と意義を伸ばす。',cons:'現場負担とコストが増える。',eff:{b:-300,bo:5,c:5,wb:{connection:15,meaning:10}}},
 product_social:{title:'時短Kit開発',sub:'時間を売る商品戦略',desc:'家事負担を減らし、家族が向き合う時間をつくります。',pros:'余白と活力を伸ばす。疲弊も少し下げる。',cons:'開発・広報コストが必要。',eff:{b:-200,bo:-2,c:2,wb:{autonomy:15,vitality:5}}},
 hub_commons:{title:'拠点開放',sub:'店舗を地域の居場所へ',desc:'店舗や拠点を高齢者・子どもの居場所として開きます。',pros:'多世代交流を促し、絆と活力を伸ばす。',cons:'場所代・管理コストがかかる。',eff:{b:-150,bo:2,c:3,wb:{connection:10,vitality:10}}},
 default:{title:'通常業務',sub:'効率と利益の追求',desc:'従来の小売・物流業務に集中し、短期収益を確保します。',pros:'予算を増やせる。',cons:'地域課題を見過ごし、資源が少し削られる。',eff:{b:150,bo:-5,c:0,wb:{connection:-2,meaning:-2}}}
};
const events=[
 {title:'【行政】仁義なき縦割り',icon:'⚠',desc:'福祉課は移動販売を求め、道路課は駐車禁止を主張。板挟みで車が出せません。',choices:[
  {t:'強行突破',eff:{b:-20,bo:5,c:10,t:-10,wb:{connection:5,autonomy:5}},msg:'住民は歓喜。しかし法令面の不安で信頼が下がりました。'},
  {t:'調整会議',eff:{b:-50,bo:10,c:0,wb:{meaning:-5}},msg:'会議は踊る。結論は先送りです。'},
  {t:'独自アプリで予約制',eff:{b:-120,bo:0,c:7,wb:{autonomy:10,meaning:5}},msg:'予約制で道路課も納得。現場の余白が少し戻りました。'}]},
 {title:'【物流】豆腐1000丁の誤発注',icon:'📦',desc:'新人が0を1つ多く入力。トラック一杯の木綿豆腐が届きました。',choices:[
  {t:'全廃棄',eff:{b:-120,bo:-5,c:0,wb:{meaning:-10}},msg:'処理は早いが、現場の誇りは砕けました。'},
  {t:'緊急「豆腐祭り」',eff:{b:-20,bo:10,c:10,wb:{vitality:15,connection:5}},msg:'地域イベント化。疲れましたが、地域が妙に団結しました。'},
  {t:'福祉施設へ寄付',eff:{b:-70,bo:0,c:8,wb:{meaning:12,connection:8}},msg:'赤字は出ましたが、信頼と意義が高まりました。'}]},
 {title:'【現場】最強パートの反乱',icon:'⚡',desc:'勤続30年の鈴木さんが「店長のやり方はぬるい」と実権を握りかけています。',choices:[
  {t:'全権委任',eff:{b:100,bo:20,c:0,wb:{vitality:-10}},msg:'効率は上がりましたが、若手が震えています。'},
  {t:'名誉理事に任命',eff:{b:-50,bo:-5,c:5,wb:{meaning:8,connection:5}},msg:'承認欲求が満たされ、仏の鈴木さんになりました。'},
  {t:'店長と公開討論',eff:{b:-20,bo:15,c:0,wb:{connection:-8}},msg:'正論のぶつかり合いで店舗が戦場になりました。'}]},
 {title:'【地域】部活の場所不足',icon:'⚽',desc:'子どもたちが生協駐車場でサッカーを始めました。',choices:[
  {t:'追い返す',eff:{b:0,bo:0,c:-5,wb:{connection:-8}},msg:'安全管理上は正解ですが、地域との距離が広がりました。'},
  {t:'時間限定で開放',eff:{b:-70,bo:5,c:15,wb:{vitality:10,connection:10}},msg:'安全ルールを決めて開放。地域の活力が上がりました。'},
  {t:'店長がGK参戦',eff:{b:0,bo:10,c:8,wb:{vitality:12}},msg:'大盛り上がり。ただし店長の仕事は終わりません。'}]},
 {title:'【治安】怪しい名簿購入の電話',icon:'🚨',desc:'配送員なら家の様子がわかるだろうと、名簿を買いたい電話がありました。',choices:[
  {t:'警察へ相談',eff:{b:0,bo:5,c:12,t:10,wb:{meaning:18}},msg:'犯人逮捕に貢献。信頼と誇りが高まりました。'},
  {t:'無視する',eff:{b:0,bo:0,c:-5,wb:{connection:-5}},msg:'後日、近隣で被害が出ました。後味が悪いです。'},
  {t:'名簿を売る',eff:{b:500,bo:0,c:-30,t:-60,wb:{meaning:-25}},msg:'短期収入は得ましたが、社会的信用が壊滅的に低下しました。'}]}
];
let s;
function newHouseholds(){return Array.from({length:100},(_,i)=>({id:i,isMember:Math.random()>.3,status:C.NORMAL}));}
function reset(){s={screen:'start',turn:1,budget:INITIAL_BUDGET,burnout:20,trust:100,wb:{connection:30,autonomy:40,meaning:50,vitality:40},hh:newHouseholds(),logs:[],event:null,confirm:null,used:[],exp:{delivery_sensing:0,product_social:0,hub_commons:0},final:null,ranking:loadRank()};render();}
function loadRank(){try{return JSON.parse(localStorage.getItem('coop_rank_v1')||'[]')}catch(e){return[]}}
function saveRank(score){const r=loadRank();const entry={id:Date.now(),date:new Date().toLocaleDateString('ja-JP'),score};r.push(entry);r.sort((a,b)=>b.score-a.score);const top=r.slice(0,5);localStorage.setItem('coop_rank_v1',JSON.stringify(top));s.ranking=top;return entry.id;}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function log(m){s.logs=[m,...s.logs].slice(0,5);}
function level(id){const e=s.exp[id]||0;return e>=5?3:e>=2?2:1;}
function scaledEff(id){const base=JSON.parse(JSON.stringify(strategies[id].eff));if(id==='default')return base;const lv=level(id), mult=lv===3?1.5:lv===2?1.2:1, discount=lv===3?50:0;if(base.wb)Object.keys(base.wb).forEach(k=>base.wb[k]*=mult);if(base.c)base.c*=mult;if(base.b<0)base.b=Math.min(0,base.b+discount);return base;}
function metric(){const connected=s.hh.filter(h=>h.status===C.CONNECTED).length;const critical=s.hh.filter(h=>h.status===C.CRITICAL).length;let p=Math.floor(connected/s.hh.length*100);let label=p>=90?'天下泰平':p>=70?'共存共栄':p>=50?'一致団結':p>=30?'一進一退':p>=15?'孤立無援':'五里霧中';return{connected,critical,p,label};}
function score(){const m=metric();const resource=Object.values(s.wb).reduce((a,b)=>a+b,0)*10|0;const coverage=m.p*20;const budget=Math.max(0,s.budget/10)|0;const trust=s.trust*10;const risk=s.burnout*20|0;return{total:Math.max(0,resource+coverage+budget+trust-risk),details:{resource,coverage,budget,trust,risk}};}
function checkEnd(){if(s.budget<=0||s.burnout>=100||s.trust<=0||s.turn>MAX_TURNS){const sc=score();if(s.budget<=0||s.burnout>=100||s.trust<=0)sc.total=Math.floor(sc.total*.5);sc.rankId=saveRank(sc.total);s.final=sc;s.screen='result';}}
function process(eff){s.trust=clamp(s.trust+(eff.t||0),0,100);let income=150;if(s.trust<50)income=Math.floor(income*(s.trust/50));s.budget+=income+(eff.b||0);s.burnout=clamp(s.burnout-2+(eff.bo||0),0,100);if(eff.wb){Object.keys(eff.wb).forEach(k=>s.wb[k]=clamp((s.wb[k]||0)+eff.wb[k],0,100));}
 const res=Object.values(s.wb).reduce((a,b)=>a+b,0)/4;const risk=clamp(.08-res/2000,.01,.15);const base=(eff.c||0)/100;
 s.hh=s.hh.map(h=>{let st=h.status;if(h.isMember){if(st===C.NORMAL&&Math.random()<risk)st=C.RISK;else if(st===C.RISK&&Math.random()<risk*2.5)st=C.CRITICAL;let cc=base;if(st===C.CRITICAL)cc*=.3;cc+=res/1000;if(st!==C.CONNECTED&&Math.random()<cc)st=C.CONNECTED;}return{...h,status:st};});
 s.turn++;checkEnd();render();}
function chooseStrategy(id){s.confirm=id;render();}
function executeStrategy(id){s.confirm=null;if(id!=='default'){const before=level(id);s.exp[id]=(s.exp[id]||0)+1;const after=level(id);if(after>before)log('【LvUP】'+strategies[id].title+' Lv'+after+'になりました。');}
 if(Math.random()<.4){const pool=events.filter(e=>!s.used.includes(e.title));const ev=pool.length?pick(pool):pick(events);s.event=ev;s.used.push(ev.title);render();return;}
 process(scaledEff(id));}
function resolveChoice(i){const c=s.event.choices[i];log(c.msg);s.event=null;process(c.eff);}
function applyConfirm(){executeStrategy(s.confirm)}
function startIntro(){s.screen='intro';render();typeIntro();}
function typeIntro(){const el=document.getElementById('introText');if(!el)return;const txt=`西暦2035年。\n日本の人口減少は「危険水域」を突破した。\n\n行政サービスは撤退し、買い物難民、独居高齢者の孤立、子育ての孤立が広がっていく。\n\nあなたの使命は、地域に根ざした生協の物流網を、次世代の社会的共通資本へと変えること。\n\n地域の資源を最大化し、社会的負荷を最小化せよ。\n\nProject: The Bridge\nSystem Initializing...`;let i=0;el.textContent='';const t=setInterval(()=>{if(s.screen!=='intro'){clearInterval(t);return;}i++;el.textContent=txt.slice(0,i);if(i>=txt.length)clearInterval(t);},18);}
function htmlStart(){return `<div class="screen"><div class="card" style="max-width:440px;width:100%;text-align:center"><div class="mono tiny" style="color:#22d3ee;margin-bottom:10px">STRATEGY SIMULATOR</div><h1 class="title" style="font-size:38px;margin:0"><span class="grad">THE BRIDGE</span><br><span style="font-size:23px;color:#94a3b8">Co-op Strategy</span></h1><div class="notice" style="text-align:left;margin:26px 0"><b>MISSION BRIEFING</b><br><br>24か月間、資金ショート・現場崩壊・信用失墜を避けながら、孤立していく地域を物流網でつなぎ止めてください。</div><button class="btn primary" data-act="intro" style="width:100%">シミュレーション開始 →</button></div></div>`;}
function htmlIntro(){return `<div class="screen" style="align-items:flex-start;padding-top:80px"><div style="max-width:560px;width:100%"><pre id="introText" class="introText mono"></pre><span class="blink"></span><div style="margin-top:32px;text-align:center"><button class="btn primary" data-act="play">TAP TO START MISSION</button></div></div></div>`;}
function bars(){const res=Object.values(s.wb).reduce((a,b)=>a+b,0)/4;return `<div class="top glass"><div class="row"><div><div class="tiny muted">BUDGET</div><div class="mono" style="font-size:26px;font-weight:900;color:${s.budget<1000?'#fb7185':'#fff'}">¥${Math.floor(s.budget).toLocaleString()}k</div></div><div style="text-align:right"><div class="tiny muted">TURN</div><div style="font-size:22px;font-weight:900;color:#22d3ee">${s.turn}<span class="small muted">/${MAX_TURNS}</span></div></div><button class="btn" data-act="help" style="padding:9px 12px">?</button></div><div style="margin-top:14px"><div class="row tiny"><b style="color:#34d399">地域の豊かさ</b><span>${Math.floor(res)}</span></div><div class="bar"><i style="width:${res}%;background:#10b981"></i></div></div><div style="margin-top:10px"><div class="row tiny"><b style="color:#fb7185">現場の疲弊度</b><span>${Math.floor(s.burnout)}%</span></div><div class="bar"><i style="width:${s.burnout}%;background:#f43f5e"></i></div></div><div style="margin-top:10px"><div class="row tiny"><b style="color:#facc15">信頼</b><span>${Math.floor(s.trust)}%</span></div><div class="bar"><i style="width:${s.trust}%;background:#eab308"></i></div></div><div class="grid4" style="margin-top:14px">${factors.map(f=>`<div class="factor" data-act="help"><div style="color:${f.color};font-weight:900">${f.label}</div><div class="num">${Math.floor(s.wb[f.id])}</div></div>`).join('')}</div></div>`;}
function mapHtml(){const m=metric();return `<div class="glass" style="padding:12px;margin:0 0 14px"><div class="row tiny" style="margin-bottom:8px"><b class="muted">MONITORING AREA</b><span style="color:#22d3ee;border:1px solid rgba(34,211,238,.3);padding:2px 7px;border-radius:999px">${m.label} / Coverage ${m.p}%</span></div><div class="map">${s.hh.slice(0,50).map(h=>`<i class="cell ${!h.isMember?'non':h.status}"></i>`).join('')}</div><div class="tiny" style="text-align:right;margin-top:7px;color:#fb7185">${m.critical?`⚠ 孤立危機世帯: ${m.critical}`:''}</div></div>`;}
function footer(){return `<div class="footer"><div class="inner"><div class="grid3">${['delivery_sensing','product_social','hub_commons'].map(id=>`<button class="btn strategy" data-strategy="${id}"><span class="badge">Lv.${level(id)}</span><div style="font-size:20px">${id==='delivery_sensing'?'🚚':id==='product_social'?'⏱':'🏠'}</div><div>${strategies[id].title}</div><div class="tiny muted">${id==='delivery_sensing'?'絆↑ 意義↑':id==='product_social'?'余白↑ 活力↑':'絆↑ 活力↑'}</div></button>`).join('')}</div><button class="btn" data-strategy="default" style="width:100%;margin-top:8px">通常業務のみを行う</button></div></div>`;}
function htmlPlay(){return `<div class="wrap">${bars()}${mapHtml()}<div style="margin:0 0 90px"><div class="tiny muted" style="margin-left:4px">SYSTEM LOG</div>${s.logs.length?s.logs.map(x=>`<div class="log"><span style="color:#22d3ee">&gt;</span> ${esc(x)}</div>`).join(''):'<div class="tiny muted" style="padding:10px">No events yet...</div>'}</div></div>${footer()}${s.event?eventModal():''}${s.confirm?confirmModal():''}`;}
function helpModal(){return `<div class="modal" data-close="1"><div class="modalBox"><div class="modalHead row"><b>ルールブック</b><button class="btn" data-act="closeModal">×</button></div><div class="modalBody"><div class="notice"><b>勝利条件</b><br>24ターン生き残り、地域の見守り率とウェルビーイング資源を高めます。<br><br><span style="color:#fb7185">資金0・疲弊100%・信頼0で終了</span></div><h3>4つの幸福因子</h3>${factors.map(f=>`<div class="factor" style="margin:8px 0"><b style="color:${f.color}">${f.label}（${f.sub}）</b><br><span class="small muted">${f.desc}</span></div>`).join('')}</div></div></div>`;}
function eventModal(){const e=s.event;return `<div class="modal"><div class="modalBox"><div class="modalHead"><b>${e.icon} ${esc(e.title)}</b></div><div class="modalBody"><p class="notice">${esc(e.desc)}</p>${e.choices.map((c,i)=>`<button class="btn choice" data-choice="${i}"><b>${esc(c.t)}</b><br><span class="tiny muted">予算${(c.eff.b||0)>=0?'+':''}${c.eff.b||0} / 疲弊${(c.eff.bo||0)>=0?'+':''}${c.eff.bo||0} / 信頼${(c.eff.t||0)>=0?'+':''}${c.eff.t||0}</span></button>`).join('')}</div></div></div>`;}
function confirmModal(){const id=s.confirm,d=strategies[id],eff=scaledEff(id);return `<div class="modal"><div class="modalBox"><div class="modalHead"><b>&gt;&gt; ${d.title} ${id!=='default'?`<span class="badge" style="position:static">Lv.${level(id)}</span>`:''}</b><div class="tiny muted">${d.sub}</div></div><div class="modalBody"><p class="notice">${d.desc}</p><div class="forecast"><b class="tiny muted">FORECAST</b><div class="grid2" style="margin-top:10px"><div class="small" style="color:${(eff.b||0)>=0?'#34d399':'#fb7185'}">予算 ${(eff.b||0)>=0?'+':''}${eff.b||0}k</div><div class="small" style="color:${(eff.bo||0)<=0?'#34d399':'#fb7185'}">疲弊 ${(eff.bo||0)>=0?'+':''}${eff.bo||0}</div></div>${factors.map(f=>{const v=eff.wb?.[f.id]||0;return v?`<div class="row tiny" style="margin-top:7px"><span>${f.label}</span><b style="color:${v>0?'#34d399':'#fb7185'}">${v>0?'+':''}${Math.round(v)}</b></div>`:''}).join('')}</div><div class="grid2" style="margin-top:12px"><div class="factor"><b style="color:#34d399">メリット</b><br><span class="tiny muted">${d.pros}</span></div><div class="factor"><b style="color:#fb7185">デメリット</b><br><span class="tiny muted">${d.cons}</span></div></div><div class="grid2" style="margin-top:14px"><button class="btn" data-act="cancelConfirm">やめる</button><button class="btn primary" data-act="applyConfirm">決定・実行</button></div></div></div></div>`;}
function htmlResult(){const f=s.final;return `<div class="screen"><div class="card" style="max-width:450px;width:100%;text-align:center;border-top:6px solid ${s.budget<=0||s.burnout>=100||s.trust<=0?'#f43f5e':'#10b981'}"><h2 class="title">RESULT</h2><div style="font-size:18px;font-weight:900;color:${s.budget<=0||s.burnout>=100||s.trust<=0?'#fb7185':'#34d399'}">${s.budget<=0?'資金ショート':s.burnout>=100?'組織崩壊':s.trust<=0?'社会的信用失墜':'MISSION ACCOMPLISHED'}</div><div class="forecast" style="margin-top:18px"><div class="tiny muted">Well-being Management Index</div><div class="grad title" style="font-size:42px">${f.total.toLocaleString()}</div><div class="small mono" style="text-align:left;line-height:1.8"><div>Resources +${f.details.resource}</div><div>Coverage +${f.details.coverage}</div><div>Budget +${f.details.budget}</div><div>Trust +${f.details.trust}</div><div style="color:#fb7185">Risk -${f.details.risk}</div></div></div><div class="forecast" style="margin-top:14px;text-align:left"><b class="tiny muted">TOP 5 RANKING</b>${s.ranking.length?s.ranking.map((r,i)=>`<div class="row small" style="padding:6px;border-radius:8px;background:${r.id===f.rankId?'rgba(6,182,212,.18)':'transparent'}"><span>${i+1}. ${r.date}</span><b>${r.score.toLocaleString()}</b></div>`).join(''):'<div class="tiny muted">No records</div>'}</div><div class="grid2" style="margin-top:18px"><button class="btn" data-act="title">タイトル</button><button class="btn primary" data-act="restart">再挑戦</button></div></div></div>`;}
function render(){if(s.screen==='start')root.innerHTML=htmlStart();else if(s.screen==='intro')root.innerHTML=htmlIntro();else if(s.screen==='playing')root.innerHTML=htmlPlay();else if(s.screen==='result')root.innerHTML=htmlResult();if(s.showHelp)root.insertAdjacentHTML('beforeend',helpModal());}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');const st=e.target.closest('[data-strategy]');const ch=e.target.closest('[data-choice]');if(st){chooseStrategy(st.dataset.strategy);return;}if(ch){resolveChoice(+ch.dataset.choice);return;}if(!a)return;const act=a.dataset.act;if(act==='intro')startIntro();if(act==='play'){s.screen='playing';render();}if(act==='help'){s.showHelp=true;render();}if(act==='closeModal'||act==='cancelConfirm'){s.showHelp=false;s.confirm=null;render();}if(act==='applyConfirm')applyConfirm();if(act==='restart')reset(),s.screen='playing',render();if(act==='title')reset();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){s.showHelp=false;s.confirm=null;s.event=null;render();}});
reset();
})();
</script>
</body>
</html>
