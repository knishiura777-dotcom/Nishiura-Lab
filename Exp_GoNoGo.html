<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Go/No-Go stable noCDN</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#182033;--muted:#667085;--line:#d8dee9;--brand:#4f46e5;--brand2:#0f766e;--danger:#dc2626;--ok:#059669;--warn:#d97706;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.6} button,input,select,textarea{font:inherit} button{cursor:pointer} .wrap{max-width:980px;margin:0 auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.08);padding:28px}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.title{font-size:clamp(26px,4vw,42px);line-height:1.1;margin:0 0 10px;font-weight:850}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;text-align:left}.field label{font-weight:700;font-size:13px;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12)}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:#e5e7eb;color:#111827;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.primary{background:var(--brand);color:#fff}.btn.dark{background:#111827;color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#344054}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800}.note{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;color:#475467}.hidden{display:none!important}.muted{color:var(--muted)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--brand);width:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{background:#f8fafc;color:#475467;font-size:12px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.stat b{display:block;font-size:28px}.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:720px){.g2,.g3{grid-template-columns:1fr}.card{padding:20px}.wrap{padding:14px}.center{padding:14px}.row{align-items:stretch}.btn{width:100%}}

.expstage{height:420px;background:#fff;border:1px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;margin-top:18px}.stim{font-size:96px;font-weight:900}.flash{box-shadow:inset 0 0 0 12px var(--danger)}.kbd{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-weight:900}</style></head><body><div id="app"></div><script>
let cfg={fix:300,stim:300,resp:1000,itiMin:700,itiMax:1000,trials:24,go:'◯',nogo:'△',gasUrl:localStorage.getItem('gng_gas_url')||'',saveMode:'csv'}; let st={phase:'intro',pid:'',age:'',gender:'',blocks:[],b:0,seq:[],i:0,status:'',results:[],stimStart:0,responded:false,screenError:false,saveStatus:''};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); function set(p){st={...st,...p};render();}
function intro(){return `<div class="center"><div class="card" style="max-width:800px;width:100%"><div class="topbar"><div><h1 class="title">Go/No-Go 課題</h1><p class="sub">反応抑制と注意制御を測定します。Go刺激ではスペースキー、No-Go刺激では押さないでください。</p></div><button class="btn ghost" onclick="set({phase:'settings'})">設定</button></div><div class="grid g3"><div class="field"><label>参加者ID <span style="color:red">*</span></label><input id="pid" value="${esc(st.pid)}" placeholder="sub001"></div><div class="field"><label>年齢</label><input id="age" type="number" value="${esc(st.age)}"></div><div class="field"><label>性別</label><select id="gender"><option value="">選択</option><option value="M" ${st.gender==='M'?'selected':''}>男性</option><option value="F" ${st.gender==='F'?'selected':''}>女性</option><option value="O" ${st.gender==='O'?'selected':''}>その他</option></select></div></div><div class="note" style="margin-top:18px"><b>${cfg.go}</b> が出たら <span class="kbd">Space</span>、<b>${cfg.nogo}</b> が出たら押さない。</div><div class="footer-actions"><button class="btn primary" onclick="startExperiment()">実験開始</button></div><p class="muted">${esc(st.status)}</p></div></div>`}
function settings(){return `<div class="center"><div class="card" style="max-width:780px;width:100%"><h1 class="title">設定</h1><div class="grid g2"><div class="field"><label>ブロックごとの試行数</label><input id="trials" type="number" value="${cfg.trials}"></div><div class="field"><label>刺激提示時間(ms)</label><input id="stim" type="number" value="${cfg.stim}"></div><div class="field"><label>反応受付時間(ms)</label><input id="resp" type="number" value="${cfg.resp}"></div><div class="field"><label>Go刺激</label><input id="go" value="${esc(cfg.go)}"></div><div class="field"><label>No-Go刺激</label><input id="nogo" value="${esc(cfg.nogo)}"></div><div class="field"><label>保存モード</label><select id="mode"><option value="csv" ${cfg.saveMode==='csv'?'selected':''}>CSV</option><option value="gas" ${cfg.saveMode==='gas'?'selected':''}>GAS</option></select></div><div class="field" style="grid-column:1/-1"><label>GAS URL</label><input id="gas" value="${esc(cfg.gasUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div></div><div class="footer-actions"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn ghost" onclick="set({phase:'intro'})">戻る</button></div></div></div>`}
function instruction(){let bl=st.blocks[st.b];return `<div class="center"><div class="card" style="max-width:760px;text-align:center"><span class="pill">Block ${st.b+1} / ${st.blocks.length}</span><h1 class="title">${bl.instruction==='speed'?'スピード重視':'正確性重視'}</h1><p class="sub">${bl.instruction==='speed'?'できるだけ速く反応してください。':'間違えないことを優先してください。'}</p><div class="note"><b>${cfg.go}</b> = Space / <b>${cfg.nogo}</b> = 押さない / No-Go比率 ${Math.round(bl.ratio*100)}%</div><button class="btn primary" onclick="startBlock()" style="margin-top:18px">スタート</button></div></div>`}
function playing(){let content=st.phase==='fixation'?'<div class="stim">+</div>':st.phase==='stimulus'?`<div class="stim">${st.seq[st.i]==='go'?cfg.go:cfg.nogo}</div>`:'';return `<div class="center"><div class="card ${st.screenError?'flash':''}" style="max-width:760px;width:100%;text-align:center"><div class="topbar"><span class="pill">Block ${st.b+1} / ${st.blocks.length}</span><span class="pill">Trial ${st.i+1} / ${st.seq.length}</span></div><div class="progress"><div style="width:${(st.i/st.seq.length)*100}%"></div></div><div class="expstage">${content}</div><p class="muted">Spaceキーで反応</p></div></div>`}
function finished(){const stat=instr=>{let sub=st.results.filter(r=>r.instruction===instr),go=sub.filter(r=>r.type==='go'),ng=sub.filter(r=>r.type==='nogo'),rts=go.filter(r=>r.response).map(r=>r.rt),rt=rts.length?Math.round(rts.reduce((a,b)=>a+b,0)/rts.length):0,comm=ng.length?Math.round(ng.filter(r=>r.response).length/ng.length*1000)/10:0;return{rt,comm}};let sp=stat('speed'),ac=stat('accuracy');return `<div class="center"><div class="card" style="max-width:850px;width:100%"><h1 class="title">実験終了</h1><div class="grid g2"><div class="stat"><span>スピード重視 平均RT</span><b>${sp.rt} ms</b><span>No-Go誤反応率 ${sp.comm}%</span></div><div class="stat"><span>正確性重視 平均RT</span><b>${ac.rt} ms</b><span>No-Go誤反応率 ${ac.comm}%</span></div></div><div class="footer-actions"><button class="btn ok" onclick="saveResults()">${cfg.saveMode==='csv'?'CSVダウンロード':'GASへ送信'}</button><button class="btn ghost" onclick="copyCsv()">コピー</button><button class="btn dark" onclick="set({phase:'intro'})">タイトルへ</button></div><p id="status" class="muted">${esc(st.saveStatus)}</p></div></div>`}
function render(){document.getElementById('app').innerHTML=st.phase==='intro'?intro():st.phase==='settings'?settings():st.phase==='instruction'?instruction():['fixation','stimulus','iti'].includes(st.phase)?playing():finished(); if(st.phase==='intro') ['pid','age','gender'].forEach(id=>{let el=document.getElementById(id); if(el)el.oninput=()=>{st[id]=el.value}})}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a} function seq(n,ratio){let ng=Math.round(n*ratio);return shuffle(Array(n-ng).fill('go').concat(Array(ng).fill('nogo')))} function wait(ms){return new Promise(r=>setTimeout(r,ms))} function iti(){return Math.random()*(cfg.itiMax-cfg.itiMin)+cfg.itiMin}
function startExperiment(){if(!st.pid.trim()){st.status='参加者IDを入力してください';render();return};st.blocks=shuffle([{ratio:.1,instruction:'speed'},{ratio:.1,instruction:'accuracy'},{ratio:.3,instruction:'speed'},{ratio:.3,instruction:'accuracy'}]);st.b=0;st.results=[];prepareBlock()}
function prepareBlock(){st.seq=seq(cfg.trials,st.blocks[st.b].ratio);st.i=0;set({phase:'instruction'})} function startBlock(){runTrial()}
async function runTrial(){st.responded=false;st.screenError=false;set({phase:'fixation'});await wait(cfg.fix);set({phase:'stimulus'});st.stimStart=performance.now();await wait(cfg.resp); if(!st.responded) endTrial(null)}
function endTrial(rt){if(st.phase!=='stimulus')return; st.responded=true;let type=st.seq[st.i],pressed=rt!==null,correct=(type==='go'&&pressed)||(type==='nogo'&&!pressed),err=correct?'':(type==='go'?'omission':'commission'); st.results.push({ParticipantID:st.pid,Age:st.age,Gender:st.gender,Date:new Date().toISOString(),block:st.b+1,instruction:st.blocks[st.b].instruction,ratio:st.blocks[st.b].ratio,trial:st.i+1,type,response:pressed?1:0,rt:rt?Math.round(rt):'',correct:correct?1:0,error:err}); st.screenError=!correct; set({phase:'iti'}); setTimeout(()=>{if(st.i<st.seq.length-1){st.i++;runTrial()}else if(st.b<st.blocks.length-1){st.b++;prepareBlock()}else set({phase:'finished'})},iti())}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return; if(e.code==='Space'){e.preventDefault();if(st.phase==='stimulus'&&!st.responded)endTrial(performance.now()-st.stimStart)}});
function csv(){
  const h=['ParticipantID','Age','Gender','Date','block','instruction','ratio','trial','type','response','rt','correct','error'];
  const rows=st.results.map(r=>h.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','));
  return '\ufeff'+h.join(',')+'\n'+rows.join('\n');
}
function downloadCsv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv;charset=utf-8;'}));a.download=`gng_results_${st.pid}.csv`;a.click();URL.revokeObjectURL(a.href)} async function copyCsv(){await navigator.clipboard.writeText(csv()).catch(()=>{});document.getElementById('status').textContent='コピーしました'}
async function saveResults(){if(cfg.saveMode==='csv'){downloadCsv();document.getElementById('status').textContent='CSVを保存しました';return} if(!cfg.gasUrl){alert('GAS URLが未設定です');return} try{await fetch(cfg.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(st.results)});document.getElementById('status').textContent='送信しました'}catch(e){alert(e.message)}}
function saveSettings(){cfg.trials=parseInt(document.getElementById('trials').value)||24;cfg.stim=parseInt(document.getElementById('stim').value)||300;cfg.resp=parseInt(document.getElementById('resp').value)||1000;cfg.go=document.getElementById('go').value||'◯';cfg.nogo=document.getElementById('nogo').value||'△';cfg.saveMode=document.getElementById('mode').value;cfg.gasUrl=document.getElementById('gas').value.trim();localStorage.setItem('gng_gas_url',cfg.gasUrl);set({phase:'intro'})} render();
</script></body></html>
