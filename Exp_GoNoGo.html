<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go/No-Go Experiment</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        /* Prevent spacebar scrolling */
        window { overflow: hidden; }
        /* Explicitly allow selection in inputs */
        input, select, textarea { user-select: text !important; -webkit-user-select: text !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- React Hooks & Utils ---
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons ---
        const IconBase = ({ children, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );
        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const Settings = (props) => <IconBase {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>;
        const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>;
        const Target = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconBase>;
        const AlertCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>;
        const Sliders = (props) => <IconBase {...props}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></IconBase>;
        const ArrowLeft = (props) => <IconBase {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>;
        const Copy = (props) => <IconBase {...props}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconBase>;
        const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const Server = (props) => <IconBase {...props}><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></IconBase>;

        // --- Configuration & Constants ---
        const DEFAULT_CONFIG = {
            fixationDuration: 300,
            stimulusDuration: 300,
            responseWindow: 1000,
            itiType: 'jitter', // 'jitter' (default) or 'fixed'
            itiDuration: 1000, // Used when fixed
            itiMin: 700,      // Used when jitter
            itiMax: 1000,     // Used when jitter
            practiceTrials: 10,
            mainTrialsPerBlock: 40, 
            goStimulus: '◯',
            noGoStimulus: '△',
            saveMode: 'csv',
            gasUrl: ''
        };

        const GAS_CODE = `function doPost(e) {
  var data;
  try {
    data = JSON.parse(e.postData.contents);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({status: "error", message: "Invalid JSON"}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  
  // Headers
  if (sheet.getLastRow() === 0) {
    sheet.appendRow([
      "ParticipantID", "Age", "Gender", "Date", 
      "Block", "Instruction", "Ratio", "Trial", 
      "Type", "Response", "RT", "Correct", "ErrorType"
    ]);
  }
  
  // Data
  if (Array.isArray(data)) {
    data.forEach(function(row) {
      sheet.appendRow([
        row.ParticipantID, row.Age, row.Gender, row.Date,
        row.block, row.instruction, row.ratio, row.trial,
        row.type, row.response, row.rt, row.correct, row.error
      ]);
    });
  }
  
  var output = ContentService.createTextOutput(JSON.stringify({status: "success"}));
  output.setMimeType(ContentService.MimeType.JSON);
  return output;
}`;

        // --- Helper Functions ---
        const shuffle = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const generateTrialSequence = (numTrials, noGoRatio, maxConsecutiveNoGo = 3) => {
            const noGoCount = Math.round(numTrials * noGoRatio);
            const goCount = numTrials - noGoCount;
            
            let trials = Array(goCount).fill('go').concat(Array(noGoCount).fill('nogo'));
            let valid = false;
            let shuffled;

            while (!valid) {
                shuffled = shuffle(trials);
                valid = true;
                let consecutive = 0;
                for (let type of shuffled) {
                    if (type === 'nogo') {
                        consecutive++;
                        if (consecutive > maxConsecutiveNoGo) {
                            valid = false;
                            break;
                        }
                    } else {
                        consecutive = 0;
                    }
                }
            }
            return shuffled;
        };

        // --- Sub-components ---

        const IntroScreen = ({ participantInfo, setParticipantInfo, startExperiment, errorMessage, setErrorMessage, setGameState }) => {
            const validateAndStart = () => {
                if (!participantInfo.id.trim()) {
                    setErrorMessage('参加者IDを入力してください');
                    return;
                }
                setErrorMessage('');
                startExperiment();
            };

            return (
                <div className="max-w-2xl w-full bg-white p-8 rounded-xl shadow-lg text-center animate-in fade-in zoom-in duration-300">
                    <div className="flex justify-center mb-4 text-indigo-600">
                        <Zap className="w-16 h-16" />
                    </div>
                    <h1 className="text-3xl font-bold mb-2 text-gray-800">Go/No-Go 課題</h1>
                    <p className="text-gray-500 mb-8">反応抑制と注意制御を測定する心理学実験</p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-left bg-gray-50 p-6 rounded-lg mb-8">
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-1">参加者ID <span className="text-red-500">*</span></label>
                            <input 
                                type="text" 
                                value={participantInfo.id}
                                onChange={e => {
                                    setParticipantInfo(prev => ({...prev, id: e.target.value}));
                                    if(e.target.value.trim()) setErrorMessage('');
                                }}
                                onKeyDown={(e) => e.stopPropagation()} 
                                className={`w-full p-2 border rounded focus:ring-2 focus:ring-indigo-500 select-text transition-colors ${errorMessage ? 'border-red-500 bg-red-50' : 'border-gray-300'}`}
                                placeholder="例: sub001"
                            />
                            {errorMessage && (
                                <div className="flex items-center gap-1 mt-1 text-red-600 text-sm animate-pulse">
                                    <AlertCircle className="w-3 h-3" /> {errorMessage}
                                </div>
                            )}
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">年齢</label>
                                <input 
                                    type="number" 
                                    value={participantInfo.age} 
                                    onChange={e => setParticipantInfo(prev => ({...prev, age: e.target.value}))} 
                                    onKeyDown={(e) => e.stopPropagation()}
                                    className="w-full p-2 border rounded select-text" 
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">性別</label>
                                <select 
                                    value={participantInfo.gender} 
                                    onChange={e => setParticipantInfo(prev => ({...prev, gender: e.target.value}))} 
                                    onKeyDown={(e) => e.stopPropagation()}
                                    className="w-full p-2 border rounded bg-white select-text"
                                >
                                    <option value="">選択</option>
                                    <option value="M">男性</option>
                                    <option value="F">女性</option>
                                    <option value="O">その他</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-4">
                        <button onClick={validateAndStart} className="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-lg flex items-center justify-center gap-2 transition transform hover:scale-105">
                            <Play className="w-5 h-5" /> 実験開始
                        </button>
                        <button onClick={() => setGameState('settings')} className="px-4 py-4 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg shadow flex items-center justify-center">
                            <Settings className="w-5 h-5" />
                        </button>
                    </div>
                    <p className="text-xs text-gray-400 mt-4">所要時間: 約20-30分</p>
                </div>
            );
        };

        const InstructionScreen = ({ blocks, currentBlockIndex, startBlock, config }) => {
            const block = blocks[currentBlockIndex];
            const isSpeed = block.instruction === 'speed';

            return (
                <div className="max-w-2xl w-full bg-white p-10 rounded-xl shadow-xl text-center border-t-8 border-indigo-500 animate-in slide-in-from-right duration-300">
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">ブロック {currentBlockIndex + 1} / {blocks.length}</h2>
                    <div className="text-sm text-gray-500 mb-8 uppercase tracking-wide">Ready for next session</div>
                    
                    <div className={`p-6 rounded-lg mb-8 ${isSpeed ? 'bg-orange-50 border-orange-200 border' : 'bg-blue-50 border-blue-200 border'}`}>
                        <div className="flex justify-center mb-2">
                            {isSpeed ? <Zap className="w-10 h-10 text-orange-500" /> : <Target className="w-10 h-10 text-blue-500" />}
                        </div>
                        <h3 className={`text-2xl font-black mb-4 ${isSpeed ? 'text-orange-700' : 'text-blue-700'}`}>
                            {isSpeed ? 'スピード重視 (Speed)' : '正確性重視 (Accuracy)'}
                        </h3>
                        <p className="text-lg text-gray-800 font-medium leading-relaxed">
                            {isSpeed 
                                ? "「できるだけ速く反応してください。多少の間違いは気にせず、テンポよく進めてください。」"
                                : "「できるだけ正確に反応してください。間違えないことが最優先です。迷ったら押さないでください。」"
                            }
                        </p>
                    </div>

                    <div className="bg-gray-100 p-4 rounded-lg mb-8 text-left inline-block">
                        <p className="mb-1"><span className="font-bold text-gray-900">{config.goStimulus}</span> が出たら <span className="font-bold bg-white px-2 py-0.5 rounded border">スペースキー</span> を押す</p>
                        <p className="mb-0"><span className="font-bold text-gray-900">{config.noGoStimulus}</span> が出たら <span className="font-bold text-red-600">押さない</span></p>
                    </div>

                    <button onClick={startBlock} className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-lg text-xl transition">
                        スタート
                    </button>
                </div>
            );
        };

        const SettingsScreen = ({ config, setConfig, setGameState }) => {
            const [activeTab, setActiveTab] = useState('params');
            const [copyStatus, setCopyStatus] = useState('idle');

            const copyGasCode = () => {
                const textArea = document.createElement("textarea");
                textArea.value = GAS_CODE;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        setCopyStatus('copied');
                        setTimeout(() => setCopyStatus('idle'), 2000);
                    }
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            };

            return (
                <div className="max-w-3xl w-full bg-white rounded-xl shadow-lg flex flex-col h-[600px] overflow-hidden">
                    <div className="bg-white border-b px-8 py-6 flex items-center justify-between sticky top-0 z-10">
                        <h2 className="text-2xl font-bold flex items-center gap-2"><Settings className="w-6 h-6" /> 設定・詳細</h2>
                        <button onClick={() => setGameState('intro')} className="text-gray-500 hover:text-gray-800 flex items-center gap-1 font-bold">
                            <ArrowLeft className="w-5 h-5" /> 戻る
                        </button>
                    </div>

                    <div className="flex border-b bg-gray-50">
                        <button 
                            onClick={() => setActiveTab('params')}
                            className={`flex-1 py-4 flex items-center justify-center gap-2 font-medium transition-colors ${activeTab === 'params' ? 'bg-white text-indigo-600 border-t-2 border-indigo-600' : 'text-gray-500 hover:bg-gray-100'}`}
                        >
                            <Sliders className="w-4 h-4" /> パラメータ
                        </button>
                        <button 
                            onClick={() => setActiveTab('info')}
                            className={`flex-1 py-4 flex items-center justify-center gap-2 font-medium transition-colors ${activeTab === 'info' ? 'bg-white text-indigo-600 border-t-2 border-indigo-600' : 'text-gray-500 hover:bg-gray-100'}`}
                        >
                            <FileText className="w-4 h-4" /> 実験情報
                        </button>
                    </div>

                    <div className="p-8 overflow-y-auto flex-1">
                        {activeTab === 'params' && (
                            <div className="space-y-4 max-w-lg mx-auto animate-in fade-in duration-300">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">ブロックごとの試行数</label>
                                    <input type="number" value={config.mainTrialsPerBlock} onChange={e => setConfig(prev => ({...prev, mainTrialsPerBlock: parseInt(e.target.value)}))} className="w-full p-2 border rounded select-text" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">刺激提示時間 (ms)</label>
                                    <input type="number" value={config.stimulusDuration} onChange={e => setConfig(prev => ({...prev, stimulusDuration: parseInt(e.target.value)}))} className="w-full p-2 border rounded select-text" />
                                </div>
                                
                                {/* ITI Settings */}
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">試行間間隔 (ITI) 設定</label>
                                    <div className="flex gap-4 mb-3">
                                        <label className="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-gray-100 border border-transparent hover:border-gray-200">
                                            <input 
                                                type="radio" 
                                                name="itiType" 
                                                value="jitter" 
                                                checked={config.itiType === 'jitter'} 
                                                onChange={() => setConfig(prev => ({...prev, itiType: 'jitter'}))}
                                                className="accent-indigo-600 w-4 h-4"
                                            />
                                            <span className="text-sm font-medium">ランダム変動 (Jitter)</span>
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-gray-100 border border-transparent hover:border-gray-200">
                                            <input 
                                                type="radio" 
                                                name="itiType" 
                                                value="fixed" 
                                                checked={config.itiType === 'fixed'} 
                                                onChange={() => setConfig(prev => ({...prev, itiType: 'fixed'}))}
                                                className="accent-indigo-600 w-4 h-4"
                                            />
                                            <span className="text-sm font-medium">固定時間</span>
                                        </label>
                                    </div>

                                    {config.itiType === 'fixed' ? (
                                        <div className="bg-gray-50 p-4 rounded-lg border">
                                            <label className="block text-xs font-bold text-gray-600 mb-1">固定時間 (ms)</label>
                                            <input type="number" value={config.itiDuration} onChange={e => setConfig(prev => ({...prev, itiDuration: parseInt(e.target.value)}))} className="w-full p-2 border rounded select-text bg-white" />
                                            <p className="text-xs text-gray-400 mt-2">※毎試行、同じ間隔で提示されます（予測されやすいがデモ向き）</p>
                                        </div>
                                    ) : (
                                        <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100 flex gap-4">
                                            <div className="flex-1">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">最小 (ms)</label>
                                                <input type="number" value={config.itiMin} onChange={e => setConfig(prev => ({...prev, itiMin: parseInt(e.target.value)}))} className="w-full p-2 border rounded select-text bg-white" />
                                            </div>
                                            <div className="flex-1">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">最大 (ms)</label>
                                                <input type="number" value={config.itiMax} onChange={e => setConfig(prev => ({...prev, itiMax: parseInt(e.target.value)}))} className="w-full p-2 border rounded select-text bg-white" />
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Go刺激文字</label>
                                    <input type="text" value={config.goStimulus} onChange={e => setConfig(prev => ({...prev, goStimulus: e.target.value}))} className="w-full p-2 border rounded select-text" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">No-Go刺激文字</label>
                                    <input type="text" value={config.noGoStimulus} onChange={e => setConfig(prev => ({...prev, noGoStimulus: e.target.value}))} className="w-full p-2 border rounded select-text" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">保存モード</label>
                                    <select value={config.saveMode} onChange={e => setConfig(prev => ({...prev, saveMode: e.target.value}))} className="w-full p-2 border rounded bg-white select-text">
                                        <option value="csv">CSVダウンロード</option>
                                        <option value="firebase">Firebase</option>
                                        <option value="gas">Google Apps Script (GAS)</option>
                                    </select>
                                </div>

                                {config.saveMode === 'gas' && (
                                    <div className="space-y-4 pt-4 border-t">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">Web App URL</label>
                                            <input 
                                                type="text" 
                                                value={config.gasUrl} 
                                                onChange={e => setConfig(prev => ({...prev, gasUrl: e.target.value}))} 
                                                placeholder="https://script.google.com/macros/s/..."
                                                className="w-full p-2 border rounded select-text font-mono text-sm" 
                                            />
                                            <p className="text-xs text-gray-500 mt-1">デプロイしたWebアプリのURLを入力してください</p>
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <h4 className="font-bold text-gray-700 text-sm">GAS デプロイ用コード (doPost)</h4>
                                                <button onClick={copyGasCode} className="flex items-center gap-1 text-xs px-3 py-1 bg-white border rounded hover:bg-gray-100 transition">
                                                    {copyStatus === 'copied' ? <Check className="w-3 h-3 text-green-600" /> : <Copy className="w-3 h-3" />}
                                                    {copyStatus === 'copied' ? 'コピー完了' : 'コードをコピー'}
                                                </button>
                                            </div>
                                            <pre className="bg-gray-800 text-gray-100 p-4 rounded-lg text-xs overflow-x-auto h-48 font-mono leading-relaxed select-all">
                                                {GAS_CODE}
                                            </pre>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'info' && (
                            <div className="space-y-6 text-gray-700 animate-in fade-in duration-300 leading-relaxed">
                                <div className="bg-blue-50 p-5 rounded-lg border-l-4 border-blue-500">
                                    <h4 className="font-bold text-blue-900 mb-2">研究目的</h4>
                                    <p className="text-sm">Go/No-Go課題により反応抑制（inhibitory control）を測定し、No-Go頻度（希少性）や教示（スピード重視 vs 正確性重視）が誤反応と反応時間に与える影響を検討します。</p>
                                </div>
                                
                                <div>
                                    <h4 className="font-bold text-gray-900 mb-2 border-b pb-1">独立変数 (IVs)</h4>
                                    <ul className="list-disc list-inside space-y-1 pl-2 text-sm">
                                        <li><span className="font-bold">No-Go比率</span>：10%（希少） vs 30%</li>
                                        <li><span className="font-bold">教示</span>：スピード重視 vs 正確性重視</li>
                                    </ul>
                                </div>

                                <div>
                                    <h4 className="font-bold text-gray-900 mb-2 border-b pb-1">従属変数 (DVs)</h4>
                                    <ul className="list-disc list-inside space-y-1 pl-2 text-sm">
                                        <li><span className="font-bold">Go反応時間 (RT)</span>：正答試行の反応時間</li>
                                        <li><span className="font-bold">No-Go誤反応率 (Commission Error)</span>：No-Go刺激に対して反応してしまった割合</li>
                                        <li><span className="font-bold">Go見逃し率 (Omission Error)</span>：Go刺激に対して反応しなかった割合</li>
                                    </ul>
                                </div>

                                <div>
                                    <h4 className="font-bold text-gray-900 mb-2 border-b pb-1">実験デザイン</h4>
                                    <p className="text-sm">2要因被験者内計画（No-Go比率 × 教示）。全4ブロック構成。</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FinishedScreen = ({ results, saveResults, setGameState, config, saveStatus }) => {
            const calcStats = (instr) => {
                const subset = results.filter(r => r.instruction === instr);
                const goTrials = subset.filter(r => r.type === 'go');
                const noGoTrials = subset.filter(r => r.type === 'nogo');
                
                const hitRT = goTrials.filter(r => r.response === 1).reduce((sum, r) => sum + r.rt, 0) / (goTrials.filter(r => r.response === 1).length || 1);
                const commErrors = noGoTrials.filter(r => r.response === 1).length;
                const commRate = (commErrors / (noGoTrials.length || 1)) * 100;

                return { rt: Math.round(hitRT), commRate: commRate.toFixed(1) };
            };

            const speedStats = calcStats('speed');
            const accStats = calcStats('accuracy');

            return (
                <div className="max-w-3xl w-full bg-white p-8 rounded-xl shadow-lg text-center animate-in zoom-in duration-300">
                    <h2 className="text-3xl font-bold mb-6 text-gray-800">実験終了</h2>
                    <p className="mb-8 text-gray-600">お疲れ様でした。以下のデータを保存してください。</p>

                    <div className="grid grid-cols-2 gap-4 mb-8">
                        <div className="bg-orange-50 p-4 rounded-lg border border-orange-100">
                            <h3 className="font-bold text-orange-800 mb-2">スピード重視条件</h3>
                            <div className="text-sm text-gray-600">平均反応時間: <span className="text-xl font-bold text-orange-600">{speedStats.rt} ms</span></div>
                            <div className="text-sm text-gray-600">No-Go誤反応率: <span className="text-xl font-bold text-orange-600">{speedStats.commRate}%</span></div>
                        </div>
                        <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                            <h3 className="font-bold text-blue-800 mb-2">正確性重視条件</h3>
                            <div className="text-sm text-gray-600">平均反応時間: <span className="text-xl font-bold text-blue-600">{accStats.rt} ms</span></div>
                            <div className="text-sm text-gray-600">No-Go誤反応率: <span className="text-xl font-bold text-blue-600">{accStats.commRate}%</span></div>
                        </div>
                    </div>

                    <div className="flex gap-4">
                        <button 
                            onClick={saveResults} 
                            disabled={saveStatus === 'saving' || saveStatus === 'success'}
                            className={`flex-1 py-3 font-bold rounded-lg shadow flex items-center justify-center gap-2 ${saveStatus === 'success' ? 'bg-green-600 text-white' : 'bg-green-600 hover:bg-green-700 text-white'}`}
                        >
                            {saveStatus === 'saving' ? (
                                <span>保存中...</span>
                            ) : saveStatus === 'success' ? (
                                <> <Check className="w-5 h-5" /> 保存完了 ({config.saveMode.toUpperCase()}) </>
                            ) : (
                                <> 
                                    {config.saveMode === 'csv' ? <Download className="w-5 h-5"/> : <Server className="w-5 h-5"/>}
                                    {config.saveMode === 'csv' ? 'CSVダウンロード' : `データを送信 (${config.saveMode.toUpperCase()})`}
                                </>
                            )}
                        </button>
                        <button onClick={() => setGameState('intro')} className="px-6 py-3 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-lg shadow flex items-center justify-center gap-2">
                            <RotateCcw className="w-5 h-5" /> タイトルへ
                        </button>
                    </div>
                </div>
            );
        };

        // --- Main Component ---
        function GoNoGoApp() {
            // State
            const [gameState, setGameState] = useState('intro'); // intro, instruction, playing, break, finished, settings
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [participantInfo, setParticipantInfo] = useState({ id: '', age: '', gender: '' });
            const [errorMessage, setErrorMessage] = useState('');
            const [saveStatus, setSaveStatus] = useState('idle');
            
            // Experiment State (Managed in Refs for Game Loop performance)
            const [blocks, setBlocks] = useState([]);
            const [currentBlockIndex, setCurrentBlockIndex] = useState(0);
            const [trialSequence, setTrialSequence] = useState([]);
            const [results, setResults] = useState([]);
            
            // Refs for Logic
            const canvasRef = useRef(null);
            const loopRef = useRef(null);
            
            // State Machine Refs
            const expRef = useRef({
                status: 'idle', // 'idle', 'fixation', 'stimulus', 'iti'
                startTime: 0,   // When the current phase started
                trialIdx: 0,    // Current trial index
                responded: false,
                responseRT: null,
                itiDuration: 1000 // Calculated for current trial
            });

            // Firebase
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);

            // --- Initialization ---
            useEffect(() => {
                if (typeof firebase !== 'undefined' && typeof __firebase_config !== 'undefined') {
                    try {
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
                        const auth = firebase.auth();
                        const dbInstance = firebase.firestore();
                        setDb(dbInstance);

                        const initAuth = async () => {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await auth.signInWithCustomToken(__initial_auth_token);
                            } else {
                                await auth.signInAnonymously();
                            }
                        };
                        initAuth();
                        auth.onAuthStateChanged(setUser);
                    } catch (e) { console.error("Firebase Error", e); }
                }
            }, []);

            // --- Game Loop Implementation ---

            // ITI Calculator
            const calculateIti = () => {
                 return config.itiType === 'fixed' 
                    ? config.itiDuration 
                    : Math.random() * (config.itiMax - config.itiMin) + config.itiMin;
            };

            // Start the loop when switching to 'playing'
            useEffect(() => {
                if (gameState === 'playing') {
                    // Initialize loop state
                    expRef.current = {
                        status: 'fixation',
                        startTime: performance.now(),
                        trialIdx: 0,
                        responded: false,
                        responseRT: null,
                        itiDuration: calculateIti()
                    };
                    
                    // Start Loop
                    loopRef.current = requestAnimationFrame(gameLoop);
                } else {
                    if (loopRef.current) cancelAnimationFrame(loopRef.current);
                }
                
                return () => {
                    if (loopRef.current) cancelAnimationFrame(loopRef.current);
                };
            }, [gameState]);

            const gameLoop = (timestamp) => {
                if (gameState !== 'playing') return;

                const canvas = canvasRef.current;
                if (!canvas) {
                    loopRef.current = requestAnimationFrame(gameLoop);
                    return;
                }

                const ctx = canvas.getContext('2d');
                const state = expRef.current;
                const elapsed = timestamp - state.startTime;
                
                const width = canvas.width;
                const height = canvas.height;
                
                // Clear Canvas
                ctx.fillStyle = '#f3f4f6';
                ctx.fillRect(0, 0, width, height);

                // --- State Machine Logic ---
                
                if (state.status === 'fixation') {
                    // Draw Fixation
                    ctx.fillStyle = '#374151';
                    ctx.font = 'bold 80px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('+', width / 2, height / 2);

                    // Transition Check
                    if (elapsed >= config.fixationDuration) {
                        state.status = 'stimulus';
                        state.startTime = timestamp;
                        state.responded = false;
                        state.responseRT = null;
                    }
                } 
                else if (state.status === 'stimulus') {
                    const currentTrialType = trialSequence[state.trialIdx];
                    const char = currentTrialType === 'go' ? config.goStimulus : config.noGoStimulus;

                    // Draw Stimulus (Only for stimulusDuration)
                    if (elapsed <= config.stimulusDuration) {
                        ctx.fillStyle = '#111827';
                        ctx.font = 'bold 80px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(char, width / 2, height / 2);
                    } else {
                        // Blank screen after stimulus duration (but still waiting for response)
                    }

                    // Check for Response (Keyboard listener updates expRef.current.responded/responseRT)
                    // If responded, we need to end the trial
                    if (state.responded) {
                        endTrial(state.responseRT, timestamp);
                        // Loop continues but state changes inside endTrial
                    } else if (elapsed >= config.responseWindow) {
                        // Time out
                        endTrial(null, timestamp);
                    }
                }
                else if (state.status === 'iti') {
                    // Draw Feedback if needed (Red flash for error)
                    if (state.isError) {
                        ctx.strokeStyle = 'red';
                        ctx.lineWidth = 10;
                        ctx.strokeRect(0, 0, width, height);
                        // Optional: clear error flag after some ms if we want short flash
                        if (elapsed > 200) state.isError = false; 
                    }

                    // Transition
                    if (elapsed >= state.itiDuration) {
                        // Next Trial
                        const nextIdx = state.trialIdx + 1;
                        if (nextIdx < trialSequence.length) {
                            state.status = 'fixation';
                            state.startTime = timestamp;
                            state.trialIdx = nextIdx;
                            state.isError = false;
                        } else {
                            // Block End
                            handleBlockEnd();
                            return; // Stop loop
                        }
                    }
                }

                loopRef.current = requestAnimationFrame(gameLoop);
            };

            const endTrial = (rt, timestamp) => {
                const state = expRef.current;
                const currentTrialType = trialSequence[state.trialIdx];
                const blockConfig = blocks[currentBlockIndex];
                
                const isGo = currentTrialType === 'go';
                const pressed = rt !== null;
                let isCorrect = false;
                let errorType = null;

                if (isGo && pressed) { isCorrect = true; }
                else if (isGo && !pressed) { isCorrect = false; errorType = 'omission'; }
                else if (!isGo && !pressed) { isCorrect = true; }
                else if (!isGo && pressed) { isCorrect = false; errorType = 'commission'; }

                // Record Result
                const result = {
                    block: currentBlockIndex + 1,
                    instruction: blockConfig.instruction,
                    ratio: blockConfig.ratio,
                    trial: state.trialIdx + 1,
                    type: currentTrialType,
                    response: pressed ? 1 : 0,
                    rt: rt ? Math.round(rt) : null,
                    correct: isCorrect ? 1 : 0,
                    error: errorType
                };
                
                // Use functional update to ensure no race conditions
                setResults(prev => [...prev, result]);

                // Set up ITI
                state.status = 'iti';
                state.startTime = timestamp;
                state.itiDuration = calculateIti(); // Recalculate ITI based on config
                state.isError = !isCorrect;
            };

            // Keyboard Handler (Attached globally but only active in 'playing' + 'stimulus')
            useEffect(() => {
                const handleKeyDown = (e) => {
                    // High-precision timestamp capture immediately
                    const now = performance.now();

                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

                    // Prevent repeated keydown events from triggering multiple responses
                    if (e.repeat) return;

                    if (gameState === 'playing' && e.code === 'Space') {
                        e.preventDefault();
                        const state = expRef.current;
                        
                        // Allow response only during stimulus phase and if not already responded
                        if (state.status === 'stimulus' && !state.responded) {
                            state.responded = true;
                            // Calculate RT based on phase start time using the high-precision capture
                            state.responseRT = now - state.startTime;
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameState]); // Re-bind if gameState changes, though refs are stable

            // --- Logic ---

            const startExperiment = () => {
                const conditions = [
                    { ratio: 0.1, instruction: 'speed', label: 'スピード重視' },
                    { ratio: 0.1, instruction: 'accuracy', label: '正確性重視' },
                    { ratio: 0.3, instruction: 'speed', label: 'スピード重視' },
                    { ratio: 0.3, instruction: 'accuracy', label: '正確性重視' }
                ];
                
                const shuffledBlocks = shuffle(conditions);
                setBlocks(shuffledBlocks);
                setCurrentBlockIndex(0);
                setResults([]);
                setSaveStatus('idle');
                prepareBlock(0, shuffledBlocks);
            };

            const prepareBlock = (blockIdx, blockList) => {
                const blockConfig = blockList[blockIdx];
                const seq = generateTrialSequence(config.mainTrialsPerBlock, blockConfig.ratio);
                setTrialSequence(seq);
                setGameState('instruction');
            };

            const startBlock = () => {
                setGameState('playing');
            };

            const handleBlockEnd = () => {
                // Must stop loop explicitly here just in case, though state change triggers useEffect cleanup
                if (loopRef.current) cancelAnimationFrame(loopRef.current);
                
                if (currentBlockIndex < blocks.length - 1) {
                    setCurrentBlockIndex(prev => prev + 1);
                    // Prepare next block
                    const blockConfig = blocks[currentBlockIndex + 1];
                    const seq = generateTrialSequence(config.mainTrialsPerBlock, blockConfig.ratio);
                    setTrialSequence(seq);
                    setGameState('break');
                } else {
                    setGameState('finished');
                }
            };

            const saveResults = async () => {
                setSaveStatus('saving');
                const date = new Date().toLocaleString();
                const data = results.map(r => ({
                    ParticipantID: participantInfo.id || 'Guest',
                    Age: participantInfo.age,
                    Gender: participantInfo.gender,
                    Date: date,
                    ...r
                }));

                try {
                    if (config.saveMode === 'csv') {
                        const headers = Object.keys(data[0]).join(',');
                        const rows = data.map(obj => Object.values(obj).join(',')).join('\n');
                        const csvContent = `\uFEFF${headers}\n${rows}`;
                        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `GoNoGo_${participantInfo.id || 'data'}.csv`;
                        link.click();
                        setSaveStatus('success');
                    } else if (config.saveMode === 'gas') {
                        if (!config.gasUrl) throw new Error("GAS URL Not Set");
                        await fetch(config.gasUrl, {
                            method: 'POST',
                            mode: 'no-cors', 
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        setSaveStatus('success');
                        alert("データを送信しました");
                    } else if (config.saveMode === 'firebase' && db && user) {
                         const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';
                         await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('gonogo_data').add({
                             participant: participantInfo,
                             config: config,
                             results: data,
                             timestamp: new Date()
                         });
                         alert("Firebaseに保存しました");
                         setSaveStatus('success');
                    }
                } catch (err) {
                    console.error(err);
                    alert(`保存エラー: ${err.message}`);
                    setSaveStatus('error');
                }
            };

            // --- Render Switcher ---
            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-100 to-gray-200 flex items-center justify-center p-4">
                    {gameState === 'intro' && (
                        <IntroScreen 
                            participantInfo={participantInfo} 
                            setParticipantInfo={setParticipantInfo} 
                            startExperiment={startExperiment}
                            errorMessage={errorMessage}
                            setErrorMessage={setErrorMessage}
                            setGameState={setGameState}
                        />
                    )}
                    {gameState === 'settings' && (
                        <SettingsScreen 
                            config={config} 
                            setConfig={setConfig} 
                            setGameState={setGameState} 
                        />
                    )}
                    {gameState === 'instruction' && (
                        <InstructionScreen 
                            blocks={blocks} 
                            currentBlockIndex={currentBlockIndex} 
                            startBlock={startBlock} 
                            config={config} 
                        />
                    )}
                    {gameState === 'break' && (
                        <div className="text-center bg-white p-10 rounded-xl shadow-lg">
                            <h2 className="text-2xl font-bold mb-4">休憩</h2>
                            <p className="mb-6 text-gray-600">少し休んでから次のブロックへ進んでください。</p>
                            <button onClick={() => setGameState('instruction')} className="px-8 py-3 bg-indigo-600 text-white font-bold rounded hover:bg-indigo-700">次へ</button>
                        </div>
                    )}
                    {gameState === 'finished' && (
                        <FinishedScreen 
                            results={results} 
                            saveResults={saveResults} 
                            setGameState={setGameState} 
                            config={config}
                            saveStatus={saveStatus}
                        />
                    )}
                    
                    {gameState === 'playing' && (
                        <div className="relative">
                            <div className="absolute top-[-40px] left-0 text-gray-500 font-mono text-sm">
                                Block: {currentBlockIndex + 1}/{blocks.length} | Trial: {trialSequence.length > 0 ? (expRef.current.trialIdx + 1) : 0}/{trialSequence.length}
                            </div>
                            <div className="bg-white p-2 rounded-xl shadow-2xl border-4 border-gray-300">
                                <canvas 
                                    ref={canvasRef} 
                                    width={800} 
                                    height={500} 
                                    className="bg-gray-100 rounded cursor-none"
                                />
                            </div>
                            <p className="text-center mt-4 text-gray-500 text-sm">Go刺激でスペースキーを押下</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GoNoGoApp />);
    </script>
</body>
</html>
