                resultConformityDesc: "Överensstämmelsegrad vid kritiska försök",
                saveTitle: "Spara data",
                btnDownloadCsv: "Ladda ner CSV",
                descDownloadCsv: "Spara till lokal PC",
                btnCloudUpload: "Ladda upp till molnet",
                descCloudUpload: "Registrera i databasen",
                btnGasUpload: "Skicka till GAS",
                descGasUpload: "Till kalkylblad",
                btnFirebaseUpload: "Skicka till Firebase",
                descFirebaseUpload: "Till databas",
                uploading: "Laddar upp...",
                uploadSuccess: "Klar",
                uploadError: "Fel",
                btnReset: "Återgå till start (Slumpa om)",
                settingsTitle: "Inställningar",
                settingsFirebase: "Firebase-lagring",
                settingsFirebaseDesc: "Spara resultat till standarddatabasen (Firestore).",
                settingsFirebaseError: "* Inaktiverad eftersom Firebase-konfiguration saknas",
                settingsGas: "GAS-integration (Web Hook)",
                settingsGasUrl: "GAS Web App URL",
                settingsGasDesc: "* Implementera doGet/doPost-funktioner och distribuera som en webbapp.",
                settingsCodeBtn: "Visa GAS-exempelkod",
                settingsCodeCopy: "Kopiera kod",
                settingsCodeCopied: "Kopierad!",
                settingsCodeSteps: "Inställningssteg:",
                settingsCodeStep1: "Öppna 'Tillägg > Apps Script' i Google Kalkylark",
                settingsCodeStep2: "Kopiera och klistra in koden ovan",
                settingsCodeStep3: "Välj 'Distribuera > Ny distribution'",
                settingsCodeStep4: "Typ: 'Webbapp', Vem har åtkomst: 'Alla'",
                settingsCodeStep5: "Klistra in den genererade URL:en i inmatningsfältet ovan",
                settingsCsv: "Automatisk CSV-nedladdning",
                settingsCsvDesc: "Ladda automatiskt ner CSV när slutskärmen visas.",
                settingsPlan: "Experimentplan / Översikt",
                planPurpose: "■ Syfte",
                planPurposeDesc: "Att undersöka effekten av grupptryck på individens bedömning (konformitetsbeteende).",
                planVariables: "■ Variabler",
                planIV: "Oberoende variabel:",
                planIVDesc: "Presentation av andras svar (Synlig / Dold)",
                planDV: "Beroende variabel:",
                planDVDesc: "Konformitetsgrad i kritiska försök (grad av överensstämmelse med konfedererades felaktiga svar)",
                planProcedure: "■ Procedur",
                planProcedureDesc: "I 6 av 10 försök (kritiska försök) ger konfedererade enhälligt fel svar.",
                btnSaveClose: "Spara & Stäng",
                authTitle: "Administratörsautentisering",
                authPassword: "Lösenord",
                authBtn: "Autentisera",
                authError: "Felaktigt lösenord",
                sessionMode: "Sessionsläge: ",
                conditionVisibleLabel: "Grupp (Synlig)",
                conditionHiddenLabel: "Individuell (Dold)",
                csvHeaders: ["ParticipantID", "Age", "Gender", "TrialID", "Type", "Condition(IV)", "UserResponse", "CorrectResponse", "GroupResponse", "IsCorrect", "IsConformity(DV)"]
            }
        };

        // --- Firebase Configuration Helper ---
        const getFirebaseConfig = () => {
            // 1. 環境変数からの取得 (Canvas環境など)
            if (typeof window.__firebase_config !== 'undefined') {
                try {
                    return JSON.parse(window.__firebase_config);
                } catch (e) {
                    console.error("Firebase config parse error", e);
                }
            }
            // 2. フォールバック (手動設定用)
            // このHTMLファイルを単独で使用する場合は、以下のオブジェクトに自身のFirebase設定を入力してください。
            return {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_PROJECT_ID.appspot.com",
                messagingSenderId: "SENDER_ID",
                appId: "APP_ID"
            };
        };

        const firebaseConfig = getFirebaseConfig();
        
        // Firebase初期化の安全策
        let app, auth, db;
        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } else {
                console.warn("Firebase config is missing or default. Some features will be disabled.");
            }
        } catch (e) {
            console.error("Firebase initialization failed:", e);
        }

        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'asch-experiment';

        // GAS Sample Code
        const GAS_SAMPLE_CODE = `function doPost(e) {
  // 1. スプレッドシートを取得
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  
  // 2. データを受信してパース
  var data;
  try {
    data = JSON.parse(e.postData.contents);
  } catch(f) {
    return ContentService.createTextOutput("Error: JSON Parse Failed");
  }

  // 3. ヘッダー行の作成（シートが空の場合）
  if (sheet.getLastRow() === 0) {
    sheet.appendRow([
      "受信日時", 
      "参加者ID", 
      "年齢", 
      "性別", 
      "条件", 
      "同調率(%)", 
      "詳細データ(JSON)"
    ]);
  }

  // 4. 行データの作成
  var row = [
    new Date(),
    data.participantId,
    data.age,     // 年齢
    data.gender,  // 性別
    data.condition,
    data.summary ? data.summary.conformityRate : "",
    JSON.stringify(data)
  ];

  // 5. シートに追加
  sheet.appendRow(row);

  // 6. レスポンスを返す
  return ContentService.createTextOutput("Success")
    .setMimeType(ContentService.MimeType.TEXT);
}`;

        // 実験刺激データ定義
        const TRIALS = [
            { id: 1, type: 'neutral',  standard: 100, options: [100, 80, 120], correctIndex: 0, lureIndex: 0 },
            { id: 2, type: 'neutral',  standard: 150, options: [180, 150, 120], correctIndex: 1, lureIndex: 1 },
            { id: 3, type: 'critical', standard: 120, options: [120, 160, 90],  correctIndex: 0, lureIndex: 1 },
            { id: 4, type: 'neutral',  standard: 200, options: [150, 200, 250], correctIndex: 1, lureIndex: 1 },
            { id: 5, type: 'critical', standard: 140, options: [100, 140, 180], correctIndex: 1, lureIndex: 2 },
            { id: 6, type: 'critical', standard: 160, options: [200, 120, 160], correctIndex: 2, lureIndex: 0 },
            { id: 7, type: 'neutral',  standard: 90,  options: [90, 110, 70],   correctIndex: 0, lureIndex: 0 },
            { id: 8, type: 'critical', standard: 180, options: [180, 140, 220], correctIndex: 0, lureIndex: 2 },
            { id: 9, type: 'critical', standard: 110, options: [150, 110, 80],  correctIndex: 1, lureIndex: 0 },
            { id: 10, type: 'critical', standard: 130, options: [100, 160, 130], correctIndex: 2, lureIndex: 1 },
        ];

        const BOTS = ["A", "B", "C"]; // 名前はシンプルに英字に統一（言語依存を減らす）

        function AschExperiment() {
            const [phase, setPhase] = useState('intro'); // intro, instruction, task, debrief
            const [condition, setCondition] = useState(null); // 'visible' or 'hidden'
            const [assignmentMode, setAssignmentMode] = useState('random'); // 'random', 'visible', 'hidden'
            const [participantId, setParticipantId] = useState('');
            const [age, setAge] = useState(''); // 年齢
            const [gender, setGender] = useState(''); // 性別
            const [isConsentGiven, setIsConsentGiven] = useState(false); // 同意チェック
            const [currentTrialIndex, setCurrentTrialIndex] = useState(0);
            const [results, setResults] = useState([]);
            const [selectedOption, setSelectedOption] = useState(null);
            const [showNextButton, setShowNextButton] = useState(false);
            const [botAnswers, setBotAnswers] = useState([]);
            const [loadingBots, setLoadingBots] = useState(false);
            
            // i18n State
            const [language, setLanguage] = useState('ja'); // 'ja', 'en', 'sv'
            const t = TRANSLATIONS[language]; // 現在の言語のリソース

            // Auth & Upload State
            const [user, setUser] = useState(null);
            const [authStatus, setAuthStatus] = useState('loading');
            const [firebaseStatus, setFirebaseStatus] = useState('idle');
            const [gasStatus, setGasStatus] = useState('idle');

            // Settings & Security State
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [showPasswordModal, setShowPasswordModal] = useState(false); // パスワードモーダル表示
            const [inputPassword, setInputPassword] = useState(''); // 入力されたパスワード
            const SETTINGS_PASSWORD = 'admin'; // 設定パスワード初期値

            const [config, setConfig] = useState({
                useFirebase: true,
                useGas: true, // デフォルトで有効化
                gasUrl: '',
                autoDownloadCsv: false
            });

            // Firebase Authentication
            useEffect(() => {
                if (!auth) {
                    setAuthStatus('error');
                    return;
                }

                const initAuth = async () => {
                    try {
                        setAuthStatus('loading');
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth failed", error);
                        setAuthStatus('error');
                    }
                };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                        setAuthStatus('authenticated');
                    } else {
                        setUser(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            // Auto download on debrief if configured
            useEffect(() => {
                if (phase === 'debrief' && config.autoDownloadCsv) {
                    downloadCSV();
                }
            }, [phase, config.autoDownloadCsv]);

            const determineCondition = () => {
                if (assignmentMode === 'random') {
                    return Math.random() > 0.5 ? 'visible' : 'hidden';
                } else {
                    return assignmentMode;
                }
            };

            // Bot behavior
            useEffect(() => {
                if (phase === 'task') {
                    const trial = TRIALS[currentTrialIndex];
                    setSelectedOption(null);
                    setShowNextButton(false);
                    setBotAnswers([]);
                    
                    if (condition === 'visible') {
                        setLoadingBots(true);
                        const timer = setTimeout(() => {
                            const targetAnswer = trial.type === 'critical' ? trial.lureIndex : trial.correctIndex;
                            setBotAnswers(Array(3).fill(targetAnswer));
                            setLoadingBots(false);
                        }, 1500);
                        return () => clearTimeout(timer);
                    } else {
                        setLoadingBots(false);
                    }
                }
            }, [currentTrialIndex, phase, condition]);

            const handleStartInstruction = () => {
                const nextCondition = determineCondition();
                setCondition(nextCondition);
                setPhase('instruction');
            };

            const handleStartTask = () => {
                setPhase('task');
                setCurrentTrialIndex(0);
                setResults([]);
                setFirebaseStatus('idle');
                setGasStatus('idle');
            };

            const handleResetExperiment = () => {
                setPhase('intro');
                setCurrentTrialIndex(0);
                setResults([]);
                setSelectedOption(null);
                setShowNextButton(false);
                setBotAnswers([]);
                setFirebaseStatus('idle');
                setGasStatus('idle');
                setParticipantId('');
                setAge('');
                setGender('');
                setIsConsentGiven(false);
                setCondition(null);
            };

            const handleOptionSelect = (index) => {
                if (condition === 'visible' && loadingBots) return;
                setSelectedOption(index);
                setShowNextButton(true);
            };

            const handleNext = () => {
                const trial = TRIALS[currentTrialIndex];
                const index = selectedOption;
                
                const isCritical = trial.type === 'critical';
                const isConformity = isCritical && (index === trial.lureIndex);
                const isCorrect = index === trial.correctIndex;

                const resultData = {
                    trialId: trial.id,
                    trialType: trial.type,
                    condition: condition,
                    participantId: participantId || 'anonymous',
                    age: age,
                    gender: gender,
                    userResponse: index,
                    correctResponse: trial.correctIndex,
                    groupResponse: condition === 'visible' ? (isCritical ? trial.lureIndex : trial.correctIndex) : null,
                    isCorrect: isCorrect,
                    isConformity: isConformity,
                };

                setResults(prev => [...prev, resultData]);

                if (currentTrialIndex < TRIALS.length - 1) {
                    setCurrentTrialIndex(currentTrialIndex + 1);
                } else {
                    setPhase('debrief');
                }
            };

            const getExperimentData = () => {
                const criticalTrials = results.filter(r => r.trialType === 'critical');
                const conformityCount = criticalTrials.filter(r => r.isConformity).length;
                const conformityRate = criticalTrials.length > 0 ? ((conformityCount / criticalTrials.length) * 100).toFixed(1) : 0;

                return {
                    participantId: participantId || 'anonymous',
                    age: age,
                    gender: gender,
                    userId: user ? user.uid : 'anonymous',
                    condition: condition,
                    createdAt: serverTimestamp(),
                    createdAtISO: new Date().toISOString(),
                    results: results,
                    summary: {
                        conformityRate: parseFloat(conformityRate),
                        totalTrials: results.length,
                        criticalTrialsCount: criticalTrials.length,
                        conformityCount: conformityCount
                    },
                    userAgent: navigator.userAgent
                };
            };

            const generateCSV = () => {
                // ヘッダーを現在の言語に合わせて取得
                const headers = t.csvHeaders;
                const rows = results.map(r => [
                    `"${r.participantId}"`,
                    r.age,
                    r.gender,
                    r.trialId,
                    r.trialType,
                    r.condition,
                    r.userResponse + 1,
                    r.correctResponse + 1,
                    r.groupResponse !== null ? r.groupResponse + 1 : "",
                    r.isCorrect ? 1 : 0,
                    r.isConformity ? 1 : 0
                ].join(","));
                return headers.join(",") + "\n" + rows.join("\n");
            };

            const downloadCSV = () => {
                const csvContent = generateCSV();
                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
                
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `asch_data_${participantId || 'anonymous'}_${condition}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const sendToGAS = async (data) => {
                if (!config.useGas || !config.gasUrl) return false;
                
                try {
                    await fetch(config.gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'text/plain',
                        },
                        body: JSON.stringify(data)
                    });
                    console.log("Sent to GAS");
                    return true;
                } catch (error) {
                    console.error("GAS sending failed", error);
                    return false;
                }
            };

            const handleFirebaseUpload = async () => {
                if (!user || !db) return;
                setFirebaseStatus('uploading');
                try {
                    const dataToSave = getExperimentData();
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'asch_experiment_results'), dataToSave);
                    setFirebaseStatus('success');
                } catch (error) {
                    console.error("Firebase upload failed", error);
                    setFirebaseStatus('error');
                }
            };

            const handleGasUpload = async () => {
                if (!config.gasUrl) {
                    // URL未設定時は設定画面へ誘導
                    alert(t.settingsGasDesc);
                    setIsSettingsOpen(true);
                    return;
                }
                setGasStatus('uploading');
                try {
                    const dataToSave = getExperimentData();
                    // GAS用にcreatedAtを文字列で確実に上書き
                    const gasData = { ...dataToSave, createdAt: new Date().toISOString() };
                    await sendToGAS(gasData);
                    setGasStatus('success');
                } catch (error) {
                    console.error("GAS upload failed", error);
                    setGasStatus('error');
                }
            };

            const handleSaveSettings = (e) => {
                e.preventDefault();
                setIsSettingsOpen(false);
            };

            const handleOpenSettingsRequest = () => {
                setInputPassword('');
                setShowPasswordModal(true);
            };

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (inputPassword === SETTINGS_PASSWORD) {
                    setShowPasswordModal(false);
                    setIsSettingsOpen(true);
                } else {
                    alert(t.authError); // アラートも翻訳
                }
            };

            // Toggle Language (Cyclic)
            const toggleLanguage = () => {
                setLanguage(prev => {
                    if (prev === 'ja') return 'en';
                    if (prev === 'en') return 'sv';
                    return 'ja';
                });
            };

            const getLanguageLabel = () => {
                switch(language) {
                    case 'ja': return 'English';
                    case 'en': return 'Svenska';
                    case 'sv': return '日本語';
                    default: return 'English';
                }
            };

            // --- UI Components ---

            const PasswordModal = () => {
                if (!showPasswordModal) return null;
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in-up">
                            <div className="bg-gray-800 text-white p-4 flex justify-between items-center">
                                <h3 className="font-bold flex items-center gap-2"><Lock size={18} /> {t.authTitle}</h3>
                                <button onClick={() => setShowPasswordModal(false)} className="text-gray-400 hover:text-white transition">
                                    <X size={20} />
                                </button>
                            </div>
                            <form onSubmit={handlePasswordSubmit} className="p-6 space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">{t.authPassword}</label>
                                    <input
                                        type="password"
                                        autoFocus
                                        value={inputPassword}
                                        onChange={(e) => setInputPassword(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none"
                                        placeholder="Enter password"
                                    />
                                </div>
                                <button 
                                    type="submit"
                                    className="w-full py-2 bg-indigo-600 text-white rounded font-bold hover:bg-indigo-700 transition"
                                >
                                    {t.authBtn}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            };

            const SettingsModal = () => {
                const [showCode, setShowCode] = useState(false);
                const [showPlan, setShowPlan] = useState(false);
                const [copySuccess, setCopySuccess] = useState(false);

                const handleCopyCode = () => {
                    const textArea = document.createElement("textarea");
                    textArea.value = GAS_SAMPLE_CODE;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 2000);
                };

                if (!isSettingsOpen) return null;

                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in-up flex flex-col max-h-[90vh]">
                            <div className="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0">
                                <h3 className="font-bold flex items-center gap-2"><Settings size={18} /> {t.settingsTitle}</h3>
                                <button onClick={() => setIsSettingsOpen(false)} className="text-gray-400 hover:text-white transition">
                                    <X size={20} />
                                </button>
                            </div>
                            
                            <div className="p-6 space-y-6 overflow-y-auto custom-scrollbar">
                                
                                {/* Experiment Plan */}
                                <div className="border border-gray-200 rounded-md overflow-hidden mb-6">
                                    <button 
                                        onClick={() => setShowPlan(!showPlan)}
                                        className="w-full px-3 py-2 bg-indigo-50 text-xs font-bold text-indigo-800 flex justify-between items-center hover:bg-indigo-100 transition"
                                    >
                                        <span className="flex items-center gap-2"><FileText size={14} /> {t.settingsPlan}</span>
                                        <span>{showPlan ? '▲' : '▼'}</span>
                                    </button>
                                    
                                    {showPlan && (
                                        <div className="p-3 bg-white text-xs text-gray-600 space-y-3 leading-relaxed border-t border-gray-200">
                                            <div>
                                                <strong className="block text-gray-800 mb-1">{t.planPurpose}</strong>
                                                {t.planPurposeDesc}
                                            </div>
                                            <div>
                                                <strong className="block text-gray-800 mb-1">{t.planVariables}</strong>
                                                <ul className="list-disc list-inside pl-1 space-y-1">
                                                    <li><span className="font-semibold">{t.planIV}</span> {t.planIVDesc}</li>
                                                    <li><span className="font-semibold">{t.planDV}</span> {t.planDVDesc}</li>
                                                </ul>
                                            </div>
                                            <div>
                                                <strong className="block text-gray-800 mb-1">{t.planProcedure}</strong>
                                                {t.planProcedureDesc}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Firebase */}
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center">
                                        <label className="font-bold text-gray-700 flex items-center gap-2">
                                            <CloudUpload size={16} className="text-orange-500" /> {t.settingsFirebase}
                                        </label>
                                        <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                            <input 
                                                type="checkbox" 
                                                name="toggle" 
                                                id="firebase-toggle" 
                                                checked={config.useFirebase}
                                                onChange={(e) => setConfig({...config, useFirebase: e.target.checked})}
                                                className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300"
                                                style={{ right: config.useFirebase ? '0' : '50%', borderColor: config.useFirebase ? '#4F46E5' : '#D1D5DB' }}
                                            />
                                            <label 
                                                htmlFor="firebase-toggle" 
                                                className={`toggle-label block overflow-hidden h-6 rounded-full cursor-pointer ${config.useFirebase ? 'bg-indigo-600' : 'bg-gray-300'}`}
                                            ></label>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-500">
                                        {t.settingsFirebaseDesc}
                                        {!auth && <span className="text-red-500 block mt-1">{t.settingsFirebaseError}</span>}
                                    </p>
                                </div>

                                <hr className="border-gray-100" />

                                {/* GAS */}
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center">
                                        <label className="font-bold text-gray-700 flex items-center gap-2">
                                            <ArrowRight size={16} className="text-green-600" /> {t.settingsGas}
                                        </label>
                                        <div className="relative inline-block w-12 mr-2 align-middle select-none">
                                            <input 
                                                type="checkbox" 
                                                id="gas-toggle" 
                                                checked={config.useGas}
                                                onChange={(e) => setConfig({...config, useGas: e.target.checked})}
                                                className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300"
                                                style={{ right: config.useGas ? '0' : '50%', borderColor: config.useGas ? '#4F46E5' : '#D1D5DB' }}
                                            />
                                            <label htmlFor="gas-toggle" className={`block h-6 rounded-full cursor-pointer ${config.useGas ? 'bg-indigo-600' : 'bg-gray-300'}`}></label>
                                        </div>
                                    </div>
                                    
                                    {config.useGas && (
                                        <div className="animate-fade-in-up space-y-3">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1">{t.settingsGasUrl}</label>
                                                <input
                                                    type="text"
                                                    value={config.gasUrl}
                                                    onChange={(e) => setConfig({...config, gasUrl: e.target.value})}
                                                    placeholder="https://script.google.com/macros/s/..."
                                                    className="w-full px-3 py-2 border border-gray-300 rounded text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                                                />
                                            </div>

                                            <div className="border border-gray-200 rounded-md overflow-hidden">
                                                <button 
                                                    onClick={() => setShowCode(!showCode)}
                                                    className="w-full px-3 py-2 bg-gray-50 text-xs font-bold text-gray-600 flex justify-between items-center hover:bg-gray-100 transition"
                                                >
                                                    <span className="flex items-center gap-2"><FileCode size={14} /> {t.settingsCodeBtn}</span>
                                                    <span>{showCode ? '▲' : '▼'}</span>
                                                </button>
                                                
                                                {showCode && (
                                                    <div className="relative bg-gray-900 p-3">
                                                        <button 
                                                            onClick={handleCopyCode}
                                                            className="absolute top-2 right-2 p-1.5 bg-white/10 hover:bg-white/20 text-white rounded transition flex items-center gap-1"
                                                            title={t.settingsCodeCopy}
                                                        >
                                                            {copySuccess ? <Check size={14} className="text-green-400"/> : <Copy size={14} />}
                                                            <span className="text-[10px]">{copySuccess ? t.settingsCodeCopied : t.settingsCodeCopy}</span>
                                                        </button>
                                                        <pre className="text-[10px] text-gray-300 font-mono overflow-x-auto whitespace-pre-wrap pt-6">
                                                            {GAS_SAMPLE_CODE}
                                                        </pre>
                                                        <div className="mt-2 pt-2 border-t border-gray-700 text-[10px] text-gray-400 leading-relaxed">
                                                            <p><strong>{t.settingsCodeSteps}</strong></p>
                                                            <ol className="list-decimal list-inside">
                                                                <li>{t.settingsCodeStep1}</li>
                                                                <li>{t.settingsCodeStep2}</li>
                                                                <li>{t.settingsCodeStep3}</li>
                                                                <li>{t.settingsCodeStep4}</li>
                                                                <li>{t.settingsCodeStep5}</li>
                                                            </ol>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <hr className="border-gray-100" />

                                {/* CSV */}
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center">
                                        <label className="font-bold text-gray-700 flex items-center gap-2">
                                            <Download size={16} className="text-blue-500" /> {t.settingsCsv}
                                        </label>
                                        <input 
                                            type="checkbox" 
                                            checked={config.autoDownloadCsv}
                                            onChange={(e) => setConfig({...config, autoDownloadCsv: e.target.checked})}
                                            className="w-5 h-5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <p className="text-xs text-gray-500">
                                        {t.settingsCsvDesc}
                                    </p>
                                </div>

                            </div>

                            <div className="bg-gray-50 p-4 border-t border-gray-200 flex justify-end shrink-0">
                                <button 
                                    onClick={handleSaveSettings}
                                    className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition flex items-center gap-2"
                                >
                                    <Save size={16} /> {t.btnSaveClose}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // 1. Intro
            if (phase === 'intro') {
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-6 text-gray-800 font-sans relative">
                        <PasswordModal />
                        <SettingsModal />

                        {/* Header Controls */}
                        <div className="absolute top-6 right-6 flex items-center gap-3">
                            <button 
                                onClick={toggleLanguage}
                                className="px-3 py-2 bg-white text-gray-600 rounded-full shadow-md hover:text-indigo-600 transition flex items-center gap-2 text-sm font-bold border border-gray-100"
                                title="Switch Language"
                            >
                                <Globe size={18} />
                                {getLanguageLabel()}
                            </button>
                            <button 
                                onClick={handleOpenSettingsRequest}
                                className="p-2 bg-white text-gray-500 rounded-full shadow-md hover:text-indigo-600 hover:rotate-90 transition duration-300 border border-gray-100"
                                title={t.settingsTitle}
                            >
                                <Settings size={24} />
                            </button>
                        </div>

                        <div className="max-w-2xl bg-white p-8 rounded-xl shadow-lg border border-gray-200 w-full">
                            <h1 className="text-3xl font-bold mb-6 text-indigo-700 flex items-center gap-2">
                                <Activity className="w-8 h-8" /> {t.title}
                            </h1>
                            <p className="mb-6 text-gray-600 leading-relaxed" dangerouslySetInnerHTML={{ __html: t.description }} />
                            
                            <div className="space-y-4 mb-6">
                                <div>
                                    <label htmlFor="participantId" className="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                                        <User size={16} /> {t.participantIdLabel}
                                    </label>
                                    <input
                                        type="text"
                                        id="participantId"
                                        value={participantId}
                                        onChange={(e) => setParticipantId(e.target.value)}
                                        placeholder={t.participantIdPlaceholder}
                                        className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm outline-none"
                                    />
                                    <p className="text-xs text-red-500 mt-1 font-bold">
                                        {t.participantIdWarning}
                                    </p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label htmlFor="age" className="block text-sm font-bold text-gray-700 mb-2">
                                            {t.ageLabel}
                                        </label>
                                        <input
                                            type="number"
                                            id="age"
                                            value={age}
                                            onChange={(e) => setAge(e.target.value)}
                                            placeholder={t.agePlaceholder}
                                            className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label htmlFor="gender" className="block text-sm font-bold text-gray-700 mb-2">
                                            {t.genderLabel}
                                        </label>
                                        <select
                                            id="gender"
                                            value={gender}
                                            onChange={(e) => setGender(e.target.value)}
                                            className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm outline-none bg-white"
                                        >
                                            <option value="">{t.genderSelect}</option>
                                            <option value="male">{t.genderMale}</option>
                                            <option value="female">{t.genderFemale}</option>
                                            <option value="other">{t.genderOther}</option>
                                            <option value="no_answer">{t.genderNoAnswer}</option>
                                        </select>
                                    </div>
                                </div>
                                
                                {/* 実験条件選択UI */}
                                <div>
                                    <label htmlFor="assignmentMode" className="block text-sm font-bold text-gray-700 mb-2">
                                        {t.conditionLabel}
                                    </label>
                                    <select
                                        id="assignmentMode"
                                        value={assignmentMode}
                                        onChange={(e) => setAssignmentMode(e.target.value)}
                                        className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm outline-none bg-white"
                                    >
                                        <option value="random">{t.conditionRandom}</option>
                                        <option value="visible">{t.conditionVisible}</option>
                                        <option value="hidden">{t.conditionHidden}</option>
                                    </select>
                                </div>
                            </div>

                            <div className="bg-blue-50 p-4 rounded-md mb-6 text-sm text-blue-800 border-l-4 border-blue-500">
                                <h3 className="font-bold mb-2 flex items-center gap-1">
                                    <BookOpen size={16} /> {t.consentTitle}
                                </h3>
                                <ul className="list-disc list-inside space-y-1 mb-4 text-gray-700">
                                    <li>{t.consent1}</li>
                                    <li>{t.consent2}</li>
                                    <li>{t.consent3}</li>
                                    <li>{t.consent4}</li>
                                </ul>
                                
                                <label className="flex items-start gap-2 cursor-pointer hover:bg-blue-100 p-2 rounded transition border border-blue-200 bg-white">
                                    <input 
                                        type="checkbox" 
                                        className="mt-1 w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500"
                                        checked={isConsentGiven}
                                        onChange={(e) => setIsConsentGiven(e.target.checked)}
                                    />
                                    <span className="font-bold text-blue-900">{t.consentAgree}</span>
                                </label>
                            </div>
                            
                            <button 
                                onClick={handleStartInstruction}
                                disabled={!isConsentGiven}
                                className="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-bold text-lg shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2"
                            >
                                {isConsentGiven ? t.btnNext : t.btnConsentNext} <ArrowRight size={20} />
                            </button>
                        </div>
                    </div>
                );
            }

            // 2. Instruction
            if (phase === 'instruction') {
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-6 text-gray-800">
                        <div className="max-w-2xl bg-white p-8 rounded-xl shadow-lg border border-gray-200">
                            <h2 className="text-2xl font-bold mb-4 flex items-center gap-2">
                                <BookOpen className="text-indigo-600" /> {t.instructionTitle}
                            </h2>
                            <ol className="list-decimal list-inside space-y-4 mb-8 text-lg text-gray-700">
                                <li className="pl-2" dangerouslySetInnerHTML={{ __html: t.instruction1 }} />
                                <li className="pl-2" dangerouslySetInnerHTML={{ __html: t.instruction2 }} />
                                <li className="pl-2" dangerouslySetInnerHTML={{ __html: t.instruction3 }} />
                                {condition === 'visible' && (
                                    <li className="font-bold text-indigo-700 bg-indigo-50 p-3 rounded border border-indigo-100 mt-4">
                                        {t.instructionConditionNote}
                                    </li>
                                )}
                            </ol>
                            <button 
                                onClick={handleStartTask}
                                className="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-bold text-lg flex items-center justify-center gap-2 shadow-md"
                            >
                                {t.btnStart} <ArrowRight />
                            </button>
                        </div>
                    </div>
                );
            }

            // 3. Task
            if (phase === 'task') {
                const trial = TRIALS[currentTrialIndex];
                return (
                    <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-start py-10 px-4 select-none">
                        
                        {/* Header Information */}
                        <div className="w-full max-w-4xl flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                            <div className="flex flex-col">
                                <span className="font-mono text-gray-500 text-sm">{t.taskTrial} {currentTrialIndex + 1} / {TRIALS.length}</span>
                                <span className="font-bold text-gray-700 text-sm">ID: {participantId || 'anonymous'}</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className={`px-3 py-1 rounded-full text-xs font-bold border ${condition === 'visible' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-gray-50 text-gray-600 border-gray-200'}`}>
                                    {t.sessionMode} {condition === 'visible' ? t.taskConditionVisible : t.taskConditionHidden}
                                </span>
                            </div>
                        </div>

                        {/* Stimuli Area */}
                        <div className="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                            {/* Standard Line */}
                            <div className="bg-white p-10 rounded-xl shadow-md flex flex-col items-center justify-center h-72 border-t-4 border-indigo-500 relative">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider absolute top-4 left-4">{t.taskStandard}</h3>
                                <div className="bg-black h-3 rounded-sm" style={{ width: `${trial.standard}px` }}></div>
                            </div>

                            {/* Comparison Lines */}
                            <div className="bg-white p-10 rounded-xl shadow-md flex flex-col items-center justify-center h-72 border-t-4 border-indigo-500 relative">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider absolute top-4 left-4">{t.taskComparison}</h3>
                                <div className="space-y-10 w-full flex flex-col items-center">
                                    {trial.options.map((opt, i) => (
                                        <div key={i} className="flex items-center w-full max-w-xs relative group">
                                            <span className="absolute -left-8 font-bold text-gray-400 text-xl">{i + 1}.</span>
                                            <div className="bg-black h-3 rounded-sm transition-all duration-300" style={{ width: `${opt}px` }}></div>
                                            <div className="absolute inset-0 border-b border-gray-100 -z-10" style={{ top: '50%'}}></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Social Influence Area (Visible Condition Only) */}
                        {condition === 'visible' && (
                            <div className="w-full max-w-4xl mb-8 min-h-[120px]">
                                <div className="bg-white border border-indigo-100 rounded-xl p-6 shadow-sm">
                                    <h4 className="text-sm font-bold text-indigo-800 mb-4 flex items-center gap-2">
                                        <Users size={18} /> {t.taskOtherAnswers}
                                    </h4>
                                    <div className="flex justify-around items-center h-16">
                                        {loadingBots ? (
                                            <div className="flex items-center gap-3 text-indigo-400 animate-pulse">
                                                <Loader2 className="animate-spin" size={20} />
                                                <span className="text-sm font-medium">{t.taskLoading}</span>
                                            </div>
                                        ) : (
                                            BOTS.map((botName, i) => (
                                                <div key={i} className="flex flex-col items-center animate-fade-in-up" style={{ animationDelay: `${i * 100}ms` }}>
                                                    <div className="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold mb-2 shadow-sm border border-indigo-200">
                                                        {botName}
                                                    </div>
                                                    <div className="bg-gray-800 text-white font-bold w-12 h-10 rounded flex items-center justify-center shadow-md text-xl">
                                                        {botAnswers[i] + 1}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* User Interaction Area */}
                        <div className="w-full max-w-4xl text-center">
                            <h3 className="text-xl font-bold mb-6 text-gray-800">
                                {t.taskQuestion}
                            </h3>
                            
                            <div className="flex justify-center gap-6 mb-10">
                                {trial.options.map((_, i) => (
                                    <button
                                        key={i}
                                        disabled={(condition === 'visible' && loadingBots)}
                                        onClick={() => handleOptionSelect(i)}
                                        className={`
                                            w-24 h-24 rounded-2xl text-3xl font-bold transition-all transform duration-200
                                            ${selectedOption === i 
                                                ? 'bg-indigo-600 text-white shadow-xl scale-110 ring-4 ring-indigo-200' 
                                                : 'bg-white text-gray-700 shadow-md hover:scale-105 hover:bg-gray-50 border border-gray-200'}
                                            ${(condition === 'visible' && loadingBots) ? 'opacity-40 cursor-not-allowed grayscale' : ''}
                                        `}
                                    >
                                        {i + 1}
                                    </button>
                                ))}
                            </div>

                            <div className="h-16">
                                {showNextButton && (
                                    <button
                                        onClick={handleNext}
                                        className="px-10 py-3 bg-gray-900 text-white rounded-full font-bold hover:bg-black transition-all shadow-lg flex items-center gap-2 mx-auto hover:gap-3"
                                    >
                                        {t.btnNextTrial} <ArrowRight size={20} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // 4. Debrief
            if (phase === 'debrief') {
                const criticalTrials = results.filter(r => r.trialType === 'critical');
                const conformityCount = criticalTrials.filter(r => r.isConformity).length;
                const conformityRate = criticalTrials.length > 0 ? ((conformityCount / criticalTrials.length) * 100).toFixed(1) : 0;
                
                return (
                    <div className="min-h-screen bg-gray-50 p-6 font-sans flex items-center justify-center">
                        <div className="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
                            <div className="bg-indigo-700 p-6 text-white text-center">
                                <h1 className="text-2xl font-bold flex items-center justify-center gap-2">
                                    <CheckCircle /> {t.debriefTitle}
                                </h1>
                                <p className="opacity-80 text-sm mt-1">{t.debriefThankYou}</p>
                            </div>

                            <div className="p-8">
                                <div className="bg-yellow-50 border-l-4 border-yellow-400 p-5 mb-8 rounded-r-md">
                                    <h2 className="text-lg font-bold text-yellow-800 mb-2 flex items-center gap-2">
                                        <BookOpen size={20} /> {t.debriefExplanationTitle}
                                    </h2>
                                    <p className="text-yellow-900 text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: t.debriefExplanation }} />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                                        <h3 className="font-bold text-gray-500 text-xs uppercase tracking-wide mb-4">{t.resultCondition}</h3>
                                        <div className="text-3xl font-bold text-gray-800 mb-1">
                                            {condition === 'visible' ? t.resultConditionVisible : t.resultConditionHidden}
                                        </div>
                                        <p className="text-sm text-gray-500">
                                            {condition === 'visible' ? t.resultConditionDescVisible : t.resultConditionDescHidden}
                                        </p>
                                    </div>

                                    <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                                        <h3 className="font-bold text-gray-500 text-xs uppercase tracking-wide mb-4">{t.resultConformity}</h3>
                                        <div className="flex justify-between items-end mb-2">
                                            <span className="text-sm text-gray-600">ID: {participantId || 'anonymous'}</span>
                                            <span className="text-4xl font-bold text-indigo-600">{conformityRate}%</span>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-2 mb-2">
                                            <div className="bg-indigo-600 h-2 rounded-full transition-all duration-1000" style={{ width: `${conformityRate}%` }}></div>
                                        </div>
                                        <p className="text-xs text-right text-gray-400">{t.resultConformityDesc}</p>
                                    </div>
                                </div>

                                <div className="border-t border-gray-100 pt-8">
                                    <h3 className="font-bold text-gray-800 mb-4 text-center">{t.saveTitle}</h3>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto">
                                        {/* CSV Download */}
                                        <button 
                                            onClick={downloadCSV}
                                            className="flex flex-col items-center justify-center p-4 bg-white border-2 border-indigo-100 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition group"
                                        >
                                            <Download className="text-indigo-600 mb-2 group-hover:scale-110 transition" size={24} />
                                            <span className="font-bold text-indigo-900 text-sm">{t.btnDownloadCsv}</span>
                                            <span className="text-xs text-indigo-400 mt-1">{t.descDownloadCsv}</span>
                                        </button>

                                        {/* GAS Upload */}
                                        {config.useGas && (
                                            <div className="flex flex-col items-center justify-center p-4 bg-white border-2 border-green-100 rounded-xl hover:border-green-500 hover:bg-green-50 transition group">
                                                {gasStatus === 'idle' && (
                                                    <button 
                                                        onClick={handleGasUpload}
                                                        disabled={false} // Always clickable to check URL
                                                        className={`flex flex-col items-center w-full h-full ${!config.gasUrl ? 'opacity-70' : ''}`}
                                                        title={!config.gasUrl ? "Click to set URL" : ""}
                                                    >
                                                        <FileText className="text-green-600 mb-2 group-hover:scale-110 transition" size={24} />
                                                        <span className="font-bold text-green-900 text-sm">{t.btnGasUpload}</span>
                                                        <span className="text-xs text-green-600 mt-1">{t.descGasUpload}</span>
                                                    </button>
                                                )}
                                                
                                                {gasStatus === 'uploading' && (
                                                    <div className="flex flex-col items-center text-gray-500">
                                                        <Loader2 className="animate-spin mb-2" size={24} />
                                                        <span className="text-xs font-bold">{t.uploading}</span>
                                                    </div>
                                                )}

                                                {gasStatus === 'success' && (
                                                    <div className="flex flex-col items-center text-green-600">
                                                        <CheckCircle className="mb-2" size={24} />
                                                        <span className="text-xs font-bold">{t.uploadSuccess}</span>
                                                    </div>
                                                )}

                                                {gasStatus === 'error' && (
                                                    <div className="flex flex-col items-center text-red-500">
                                                        <AlertCircle className="mb-2" size={24} />
                                                        <span className="text-xs font-bold">{t.uploadError}</span>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Firebase Upload */}
                                        {config.useFirebase && (
                                            <div className="flex flex-col items-center justify-center p-4 bg-white border-2 border-orange-100 rounded-xl hover:border-orange-500 hover:bg-orange-50 transition group">
                                                {firebaseStatus === 'idle' && (
                                                    <button 
                                                        onClick={handleFirebaseUpload}
                                                        disabled={authStatus !== 'authenticated'}
                                                        className="flex flex-col items-center w-full h-full"
                                                        title={authStatus !== 'authenticated' ? "Not authenticated" : ""}
                                                    >
                                                        <CloudUpload className="text-orange-600 mb-2 group-hover:scale-110 transition" size={24} />
                                                        <span className="font-bold text-orange-900 text-sm">{t.btnFirebaseUpload}</span>
                                                        <span className="text-xs text-orange-600 mt-1">{t.descFirebaseUpload}</span>
                                                    </button>
                                                )}
                                                
                                                {firebaseStatus === 'uploading' && (
                                                    <div className="flex flex-col items-center text-gray-500">
                                                        <Loader2 className="animate-spin mb-2" size={24} />
                                                        <span className="text-xs font-bold">{t.uploading}</span>
                                                    </div>
                                                )}

                                                {firebaseStatus === 'success' && (
                                                    <div className="flex flex-col items-center text-green-600">
                                                        <CheckCircle className="mb-2" size={24} />
                                                        <span className="text-xs font-bold">{t.uploadSuccess}</span>
                                                    </div>
                                                )}

                                                {firebaseStatus === 'error' && (
                                                    <div className="flex flex-col items-center text-red-500">
                                                        <AlertCircle className="mb-2" size={24} />
                                                        <span className="text-xs font-bold">{t.uploadError}</span>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                
                                <button 
                                   onClick={handleResetExperiment}
                                   className="mt-8 text-gray-400 underline hover:text-gray-600 text-xs block mx-auto transition"
                                >
                                    {t.btnReset}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AschExperiment />);
    </script>
</body>
</html>
