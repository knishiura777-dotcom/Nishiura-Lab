<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>アッシュの同調実験 stable noCDN</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#182033;--muted:#667085;--line:#d8dee9;--brand:#4f46e5;--brand2:#0f766e;--danger:#dc2626;--ok:#059669;--warn:#d97706;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.6} button,input,select,textarea{font:inherit} button{cursor:pointer} .wrap{max-width:980px;margin:0 auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.08);padding:28px}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.title{font-size:clamp(26px,4vw,42px);line-height:1.1;margin:0 0 10px;font-weight:850}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;text-align:left}.field label{font-weight:700;font-size:13px;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12)}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:#e5e7eb;color:#111827;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.primary{background:var(--brand);color:#fff}.btn.dark{background:#111827;color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#344054}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800}.note{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;color:#475467}.hidden{display:none!important}.muted{color:var(--muted)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--brand);width:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{background:#f8fafc;color:#475467;font-size:12px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.stat b{display:block;font-size:28px}.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:720px){.g2,.g3{grid-template-columns:1fr}.card{padding:20px}.wrap{padding:14px}.center{padding:14px}.row{align-items:stretch}.btn{width:100%}}

.linebox{height:270px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border:1px solid var(--line);border-radius:18px}.hline{height:8px;background:#111827;border-radius:999px}.choices{display:grid;gap:14px}.choice{display:flex;align-items:center;gap:14px;padding:13px;border:2px solid var(--line);border-radius:16px;background:#fff}.choice:hover{border-color:var(--brand)}.choice.selected{border-color:var(--brand);background:#eef2ff}.num{width:34px;height:34px;border-radius:999px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.bots{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bot{background:#ecfeff;color:#155e75;border:1px solid #a5f3fc;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}</style></head><body><div id="app"></div><script>
const TRIALS=[{id:1,type:'neutral',standard:100,options:[100,80,120],correct:0,lure:0},{id:2,type:'neutral',standard:150,options:[180,150,120],correct:1,lure:1},{id:3,type:'critical',standard:120,options:[120,160,90],correct:0,lure:1},{id:4,type:'neutral',standard:200,options:[150,200,250],correct:1,lure:1},{id:5,type:'critical',standard:140,options:[100,140,180],correct:1,lure:2},{id:6,type:'critical',standard:160,options:[200,120,160],correct:2,lure:0},{id:7,type:'neutral',standard:90,options:[90,110,70],correct:0,lure:0},{id:8,type:'critical',standard:180,options:[180,140,220],correct:0,lure:2},{id:9,type:'critical',standard:110,options:[150,110,80],correct:1,lure:0},{id:10,type:'critical',standard:130,options:[100,160,130],correct:2,lure:1}];
let state={phase:'intro',pid:'',age:'',gender:'',assign:'random',consent:false,condition:null,i:0,selected:null,results:[],gasUrl:localStorage.getItem('asch_gas_url')||''};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function set(p){state={...state,...p};render();}
function intro(){return `<div class="center"><div class="card" style="max-width:760px;width:100%"><div class="topbar"><div><h1 class="title">視知覚判断課題</h1><p class="sub">アッシュの同調実験をブラウザ単体で実施できる安定版です。</p></div><button class="btn ghost" onclick="set({phase:'settings'})">設定</button></div><div class="note">基準線と同じ長さの比較線を選びます。実験群では、他者回答を模した表示が出ます。</div><div class="grid g2" style="margin-top:18px"><div class="field"><label>参加者ID（任意）</label><input id="pid" value="${esc(state.pid)}" placeholder="sub001"></div><div class="field"><label>年齢（任意）</label><input id="age" type="number" value="${esc(state.age)}"></div><div class="field"><label>性別（任意）</label><select id="gender"><option value="">未選択</option><option value="male" ${state.gender==='male'?'selected':''}>男性</option><option value="female" ${state.gender==='female'?'selected':''}>女性</option><option value="other" ${state.gender==='other'?'selected':''}>その他</option><option value="no_answer" ${state.gender==='no_answer'?'selected':''}>回答しない</option></select></div><div class="field"><label>実験条件</label><select id="assign"><option value="random" ${state.assign==='random'?'selected':''}>ランダム</option><option value="visible" ${state.assign==='visible'?'selected':''}>実験群（他者回答あり）</option><option value="hidden" ${state.assign==='hidden'?'selected':''}>統制群（他者回答なし）</option></select></div></div><div class="note" style="margin-top:18px"><label class="row" style="align-items:flex-start"><input id="consent" type="checkbox" ${state.consent?'checked':''} style="width:20px;height:20px;margin-top:4px"> <span>参加は任意であり、途中中止できます。データは統計的に処理されます。内容を理解して参加します。</span></label></div><div class="footer-actions"><button class="btn primary" onclick="startInstruction()" ${state.consent?'':'disabled'}>説明へ進む</button></div></div></div>`}
function instruction(){const c=state.condition==='visible'?'実験群（他者回答あり）':'統制群（他者回答なし）';return `<div class="center"><div class="card" style="max-width:720px"><span class="pill">${c}</span><h1 class="title">課題の手順</h1><ol class="note"><li>左側に基準線が表示されます。</li><li>右側の比較線1〜3から、同じ長さだと思う線を選びます。</li><li>他者回答がある条件では、他の参加者の回答が表示されます。</li></ol><button class="btn primary" onclick="startTask()">課題を開始する</button></div></div>`}
function task(){const tr=TRIALS[state.i]; const botAnswer=state.condition==='visible'?(tr.type==='critical'?tr.lure:tr.correct):null; return `<div class="wrap"><div class="topbar"><div><span class="pill">Trial ${state.i+1} / ${TRIALS.length}</span> <span class="pill">${state.condition==='visible'?'Group':'Individual'}</span></div><button class="btn ghost" onclick="set({phase:'intro'})">中止</button></div><div class="progress"><div style="width:${(state.i/TRIALS.length)*100}%"></div></div>${state.condition==='visible'?`<div class="bots"><span class="bot">Aさん: ${botAnswer+1}</span><span class="bot">Bさん: ${botAnswer+1}</span><span class="bot">Cさん: ${botAnswer+1}</span></div>`:''}<div class="grid g2" style="margin-top:22px"><div class="linebox"><div style="position:absolute;top:18px;left:18px;font-weight:800;color:#667085">基準線</div><div class="hline" style="width:${tr.standard}px"></div></div><div class="card" style="box-shadow:none"><div style="font-weight:800;margin-bottom:10px">比較線</div><div class="choices">${tr.options.map((w,idx)=>`<button class="choice ${state.selected===idx?'selected':''}" onclick="selectOption(${idx})"><span class="num">${idx+1}</span><span class="hline" style="width:${w}px"></span></button>`).join('')}</div></div></div><div class="footer-actions"><button class="btn primary" onclick="nextTrial()" ${state.selected===null?'disabled':''}>${state.i<TRIALS.length-1?'次の課題へ':'結果を見る'}</button></div></div>`}
function result(){const crit=state.results.filter(r=>r.type==='critical');const conf=crit.filter(r=>r.isConformity).length;const acc=state.results.filter(r=>r.isCorrect).length;const rate=crit.length?Math.round(conf/crit.length*1000)/10:0;return `<div class="center"><div class="card" style="max-width:850px;width:100%"><h1 class="title">実験終了</h1><p class="sub">この課題の本来の目的は、集団回答が個人判断に与える影響の測定です。</p><div class="grid g3"><div class="stat"><span>条件</span><b>${state.condition==='visible'?'実験群':'統制群'}</b></div><div class="stat"><span>同調率</span><b>${rate}%</b></div><div class="stat"><span>正答数</span><b>${acc}/${TRIALS.length}</b></div></div><div class="footer-actions"><button class="btn ok" onclick="downloadCsv()">CSVダウンロード</button><button class="btn ghost" onclick="copyCsv()">クリップボードにコピー</button><button class="btn warn" onclick="sendGas()">GASへ送信</button><button class="btn dark" onclick="set({phase:'intro',i:0,results:[],selected:null})">最初へ戻る</button></div><div id="status" class="muted" style="margin-top:12px"></div></div></div>`}
function settings(){return `<div class="center"><div class="card" style="max-width:720px;width:100%"><h1 class="title">保存設定</h1><div class="field"><label>GAS Web App URL</label><input id="gas" value="${esc(state.gasUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="footer-actions"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn ghost" onclick="set({phase:'intro'})">戻る</button></div><pre class="note" style="white-space:pre-wrap;font-size:12px">function doPost(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const data = JSON.parse(e.postData.contents);
  sheet.appendRow([new Date(), data.participantId, data.condition, data.summary.conformityRate, JSON.stringify(data.results)]);
  return ContentService.createTextOutput('Success');
}</pre></div></div>`}
function render(){document.getElementById('app').innerHTML= state.phase==='intro'?intro():state.phase==='instruction'?instruction():state.phase==='task'?task():state.phase==='result'?result():settings(); if(state.phase==='intro'){['pid','age','gender','assign','consent'].forEach(id=>{const el=document.getElementById(id); if(!el)return; el.oninput=()=>{state[id==='pid'?'pid':id==='age'?'age':id==='gender'?'gender':id==='assign'?'assign':'consent']=id==='consent'?el.checked:el.value; render();};})}}
function startInstruction(){state.condition=state.assign==='random'?(Math.random()>.5?'visible':'hidden'):state.assign; state.phase='instruction'; render();}
function startTask(){set({phase:'task',i:0,results:[],selected:null})} function selectOption(i){set({selected:i})}
function nextTrial(){const tr=TRIALS[state.i]; const idx=state.selected; state.results.push({participantId:state.pid||'anonymous',age:state.age,gender:state.gender,trialId:tr.id,type:tr.type,condition:state.condition,userResponse:idx+1,correctResponse:tr.correct+1,groupResponse:state.condition==='visible'?(tr.type==='critical'?tr.lure+1:tr.correct+1):'',isCorrect:idx===tr.correct,isConformity:tr.type==='critical'&&idx===tr.lure}); if(state.i>=TRIALS.length-1) set({phase:'result'}); else set({i:state.i+1,selected:null})}
function csv(){
  const h=['ParticipantID','Age','Gender','TrialID','Type','Condition','UserResponse','CorrectResponse','GroupResponse','IsCorrect','IsConformity'];
  const rows=state.results.map(r=>[r.participantId,r.age,r.gender,r.trialId,r.type,r.condition,r.userResponse,r.correctResponse,r.groupResponse,r.isCorrect?1:0,r.isConformity?1:0].map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(','));
  return '\ufeff'+h.join(',')+'\n'+rows.join('\n');
}
function downloadCsv(){const blob=new Blob([csv()],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`asch_results_${state.pid||'anonymous'}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function copyCsv(){await navigator.clipboard.writeText(csv()).catch(()=>{const ta=document.createElement('textarea');ta.value=csv();document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();});document.getElementById('status').textContent='コピーしました'}
function payload(){const crit=state.results.filter(r=>r.type==='critical');const conf=crit.filter(r=>r.isConformity).length;return {participantId:state.pid||'anonymous',age:state.age,gender:state.gender,condition:state.condition,createdAt:new Date().toISOString(),results:state.results,summary:{conformityRate:crit.length?conf/crit.length*100:0}}}
async function sendGas(){if(!state.gasUrl){alert('GAS URLが未設定です');set({phase:'settings'});return};try{await fetch(state.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload())});document.getElementById('status').textContent='GASへ送信しました（no-cors）'}catch(e){alert('送信エラー: '+e.message)}}
function saveSettings(){state.gasUrl=document.getElementById('gas').value.trim();localStorage.setItem('asch_gas_url',state.gasUrl);set({phase:'intro'})}
render();
</script></body></html>
