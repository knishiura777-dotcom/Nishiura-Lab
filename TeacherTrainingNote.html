<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 4) CSP（Content Security Policy）導入 -->
    <!-- 
       A1対応: base-uri 'none', form-action 'none' を設定。
       script-src には 'unsafe-inline' を残していますが、HTML内のインラインイベント(onclick等)は全廃し、
       JS側でaddEventListenerを行う形にリファクタリングすることでリスクを低減しています。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none';">
    
    <title>教育実習日誌（セキュリティ強化・動作安定版）v27</title>
    
    <!-- Wordファイル解析用ライブラリ (Mammoth.js) -->
    <!-- 
        【セキュリティ強化（A2対応）推奨】
        現在は動作確認用にCDNを使用していますが、本番運用では以下の手順でローカルファイルを使用することを強く推奨します。
        1. https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js をダウンロード
        2. HTMLと同じ階層（または vendor/ フォルダ等）に保存
        3. 以下のscriptタグを書き換え:
           <script src="./mammoth.browser.min.js"></script>
        
        これにより、外部CDNへの依存リスク（可用性・改ざん・プライバシー）を完全に排除できます。
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <style>
        /* システム標準フォントを使用 */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 40px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border-radius: 4px;
        }

        /* タイトルヘッダーエリア */
        .title-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            padding: 0;
            border: none;
            font-size: 24px;
            line-height: 1.2;
        }

        .student-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: right;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .info-label {
            font-size: 14px;
            font-weight: bold;
            margin-right: 8px;
            white-space: nowrap;
        }

        .info-input {
            min-width: 160px;
            border-bottom: 1px solid #ccc;
        }

        /* 編集可能エリア */
        .editable {
            background-color: #fff9c4;
            cursor: text;
            min-height: 1.5em;
            outline: none;
            padding: 2px 5px;
            border-radius: 2px;
            transition: background-color 0.3s;
            white-space: pre-wrap; /* 改行を維持 */
        }
        .editable:focus {
            background-color: #fff176;
        }
        .editable:empty::before {
            content: "[入力]";
            color: #999;
        }

        /* テーブルスタイル */
        .header-table, .content-table, .reflection-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .header-table th, .header-table td,
        .content-table th, .content-table td {
            border: 1px solid #333;
            padding: 8px;
            vertical-align: top;
        }

        .header-table th {
            background-color: #e0e0e0;
            text-align: center;
            width: 15%;
            font-weight: bold;
            print-color-adjust: exact;
            -webkit-print-color-adjust: exact;
        }

        /* 印鑑枠エリア */
        .stamp-area {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 100%;
        }
        .stamp-item {
            display: flex;
            align-items: center;
            margin-left: 15px;
        }
        .stamp-box {
            width: 60px;
            height: 60px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
            font-size: 10px;
            color: #666;
        }

        /* 環境構成エリア */
        .env-section {
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #fafafa;
            print-color-adjust: exact;
            -webkit-print-color-adjust: exact;
        }
        .env-content {
            display: flex;
            gap: 20px;
        }
        .env-drawing-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .env-drawing-area {
            border: 2px dashed #ccc;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            position: relative;
            overflow: hidden;
        }
        .env-drawing-area canvas {
            max-width: 100%;
            max-height: 100%;
            cursor: crosshair;
        }
        .env-drawing-area canvas.dragging {
            cursor: grabbing;
        }
        .env-drawing-area canvas.hovering {
            cursor: grab;
        }

        #manual-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: absolute;
            display: none;
            pointer-events: none; /* クリック透過 */
        }
        .env-text-area {
            flex: 1;
            font-size: 13px;
        }

        /* 描画ツールバー */
        .drawing-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 5px;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .tool-btn {
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #999;
            border-radius: 3px;
        }
        .tool-btn:hover { background: #e9ecef; }
        .tool-btn.danger { color: #d32f2f; border-color: #d32f2f; }

        /* 記録・反省エリア */
        .record-section {
            border: 1px solid #333;
            margin-bottom: -1px; /* 重なり用 */
        }
        .record-header {
            background-color: #e0e0e0;
            padding: 5px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            print-color-adjust: exact;
            -webkit-print-color-adjust: exact;
        }
        .record-body {
            padding: 10px;
            min-height: 100px;
        }

        /* コントロールパネル */
        .controls {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .file-upload-wrapper {
            position: relative;
            display: inline-block;
        }
        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-clear { background-color: #6c757d; }
        .btn-clear:hover { background-color: #545b62; }
        .btn-orange { background-color: #ff9800; }
        .btn-orange:hover { background-color: #f57c00; }
        .btn-blue { background-color: #0056b3; }
        .btn-blue:hover { background-color: #004494; }
        .btn-purple { background-color: #6f42c1; }
        .btn-purple:hover { background-color: #5a32a3; }

        #docx-input, #manual-img-input {
            display: none;
        }

        #status-msg {
            width: 100%;
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
            color: #d32f2f;
            font-weight: bold;
        }
        .note-msg {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        /* 印刷設定 */
        @media print {
            body { background-color: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
            .no-print { display: none !important; }
            .editable { background-color: transparent !important; padding: 0; }
            .editable:empty::before { content: ""; }
            .env-drawing-area { border: 1px solid #333; }
            .drawing-toolbar { display: none; }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <div class="file-upload-wrapper">
            <!-- onclick削除済み: JSでイベントリスナーを設定 -->
            <label for="docx-input" class="btn btn-success">
                📂 Word下書きを読込
            </label>
            <input type="file" id="docx-input" accept=".docx,.doc">
        </div>
        
        <button id="btn-print" class="btn">🖨️ 印刷 / PDF保存</button>
        <button id="btn-export" class="btn btn-blue">💾 Word保存(.doc)</button>
        
        <div class="file-upload-wrapper">
            <label for="manual-img-input" class="btn btn-orange">
                🖼️ 図の差し替え
            </label>
            <input type="file" id="manual-img-input" accept="image/png, image/jpeg, image/gif, image/webp">
        </div>

        <button id="btn-save-img" class="btn btn-purple">🖼️ 図を画像保存</button>
        <button id="btn-clear" class="btn btn-clear">🗑️ クリア/リセット</button>
        
        <div id="status-msg"></div>
        <div class="note-msg">※Wordで図が表示されない場合は、「図を画像保存」で保存し、Wordに貼り付けてください。</div>
    </div>

    <div class="container" id="journal-area">
        
        <!-- タイトル・氏名ヘッダー -->
        <div class="title-header">
            <h1>教育実習日誌</h1>
            <div class="student-info">
                <div class="info-row">
                    <span class="info-label">大学名</span>
                    <div class="editable info-input" id="field-university" contenteditable="true"></div>
                </div>
                <div class="info-row">
                    <span class="info-label">氏名</span>
                    <div class="editable info-input" id="field-name" contenteditable="true"></div>
                </div>
            </div>
        </div>

        <!-- 基本情報テーブル -->
        <table class="header-table">
            <tr>
                <th>月・日・曜日</th>
                <td style="width: 25%;"><div class="editable" id="field-date" contenteditable="true"></div></td>
                <th>天気</th>
                <td style="width: 15%;"><div class="editable" id="field-weather" contenteditable="true"></div></td>
                <!-- 印鑑枠 -->
                <td colspan="2" style="padding: 0; vertical-align: middle;">
                    <div class="stamp-area">
                        <div class="stamp-item">園長印<div class="stamp-box">印</div></div>
                        <div class="stamp-item">指導者印<div class="stamp-box">印</div></div>
                    </div>
                </td>
            </tr>
            <tr>
                <th>配属組</th>
                <td><div class="editable" id="field-class" contenteditable="true"></div></td>
                <th>出席</th>
                <td colspan="3">
                    <div class="editable" id="field-attendance" contenteditable="true"></div>
                </td>
            </tr>
        </table>

        <!-- ねらい・目標 -->
        <table class="header-table">
            <tr>
                <th>クラスの<br>ねらい</th>
                <td><div class="editable" id="field-class-goal" contenteditable="true"></div></td>
            </tr>
            <tr>
                <th>実習生の<br>目標</th>
                <td><div class="editable" id="field-student-goal" contenteditable="true"></div></td>
            </tr>
        </table>

        <!-- 環境構成 -->
        <div class="env-section">
            <span style="font-weight:bold; border-bottom:1px dashed #999; display:block; margin-bottom:10px;">環境構成・配置図</span>
            <div class="env-content">
                <div class="env-drawing-container">
                    <!-- ツールバー: onclickを削除し、data属性を利用してJSでイベント管理 -->
                    <div id="drawing-toolbar" class="drawing-toolbar no-print">
                        <button class="tool-btn" data-action="add" data-type="teacher">＋保育者</button>
                        <button class="tool-btn" data-action="add" data-type="child">＋子供</button>
                        <button class="tool-btn" data-action="add" data-type="desk">＋机</button>
                        <button class="tool-btn" data-action="add" data-type="chair">＋椅子</button>
                        <button class="tool-btn" data-action="add" data-type="piano">＋ピアノ</button>
                        <button class="tool-btn" data-action="add" data-type="mat">＋マット</button>
                        <button class="tool-btn" data-action="add" data-type="cone">＋コーン</button>
                        <button class="tool-btn" data-action="add" data-type="goal">＋ゴール</button>
                        <button class="tool-btn" data-action="regen">🔄再生成</button>
                        <button class="tool-btn danger" data-action="delete">✖ 削除</button>
                    </div>

                    <div class="env-drawing-area" id="drawing-area">
                        <canvas id="env-canvas" width="400" height="300"></canvas>
                        <img id="manual-image" alt="環境構成図">
                        <div id="placeholder-text" style="position:absolute; color:#999; pointer-events:none;">
                            テキストから図を自動生成します<br>
                            （ドラッグで移動、ツールバーで追加可能）
                        </div>
                    </div>
                </div>
                
                <div class="env-text-area">
                    <div class="editable" id="field-env-text" contenteditable="true">
                        ここに環境構成の記述や図の説明を入力してください。
                    </div>
                </div>
            </div>
             <!-- 隠しフィールド -->
             <div id="diagram-description" style="display:none;"></div>
        </div>

        <!-- 時系列テーブル -->
        <table class="content-table">
            <thead>
                <tr>
                    <th style="width:10%;">時刻</th>
                    <th style="width:30%;">幼児の活動</th>
                    <th style="width:30%;">保育者の活動</th>
                    <th style="width:30%;">実習内容</th>
                </tr>
            </thead>
            <tbody id="timeline-body">
                <!-- Javascriptで自動生成 -->
            </tbody>
        </table>

        <!-- 記録・反省 -->
        <div class="record-section">
            <div class="record-header">主な活動の記録</div>
            <div class="record-body">
                <div class="editable" id="field-record" contenteditable="true"></div>
            </div>
        </div>

        <div class="record-section">
            <div class="record-header">振り返りと課題</div>
            <div class="record-body">
                <div class="editable" id="field-reflection" contenteditable="true"></div>
            </div>
        </div>

        <div class="record-section">
            <div class="record-header">指導者の講評・助言など</div>
            <div class="record-body">
                <div class="editable" id="field-feedback" contenteditable="true"></div>
            </div>
        </div>

    </div>

    <script>
        // --- 変数定義 ---
        let canvasObjects = [];
        let selectedIndex = -1;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        
        let currentObjectUrl = null;

        const MAX_FILE_SIZE = 10 * 1024 * 1024;
        const ALLOWED_DOC_EXT = ['.doc', '.docx'];
        const ALLOWED_IMG_EXT = ['.png', '.jpg', '.jpeg', '.gif', '.webp'];

        // --- 初期化 (DOMContentLoaded でイベント設定: インラインJS廃止対応) ---
        window.addEventListener('DOMContentLoaded', function() {
            initApp();
        });

        function initApp() {
            // イベントリスナーの登録 (onclick属性の代替)
            document.getElementById('btn-print').addEventListener('click', printDocument);
            document.getElementById('btn-export').addEventListener('click', exportToWord);
            document.getElementById('btn-save-img').addEventListener('click', saveDiagramImage);
            document.getElementById('btn-clear').addEventListener('click', clearAll);

            // ファイル入力イベント
            const docInput = document.getElementById('docx-input');
            docInput.addEventListener('click', function() { this.value = null; });
            docInput.addEventListener('change', handleDocUpload);

            const imgInput = document.getElementById('manual-img-input');
            imgInput.addEventListener('click', function() { this.value = null; });
            imgInput.addEventListener('change', handleImageUpload);

            // ツールバーイベント (Event Delegation)
            const toolbar = document.getElementById('drawing-toolbar');
            if (toolbar) {
                toolbar.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') {
                        const action = e.target.getAttribute('data-action');
                        const type = e.target.getAttribute('data-type');
                        
                        if (action === 'add' && type) {
                            addObj(type);
                        } else if (action === 'regen') {
                            generateDiagramFromText();
                        } else if (action === 'delete') {
                            deleteSelectedObj();
                        }
                    }
                });
            }

            // Canvasイベント
            initCanvasEvents();
            
            // 初期表示クリア
            clearAll();
        }

        // --- バグ修正: 大学名と氏名は消さない ---
        function clearAll() {
            // すべての .editable を対象にするが、大学名と氏名は除外する
            document.querySelectorAll('.editable').forEach(el => {
                if (el.id !== 'field-university' && el.id !== 'field-name') {
                    el.innerText = '';
                }
            });
            
            const tbody = document.getElementById('timeline-body');
            tbody.innerHTML = '';
            for(let i=0; i<6; i++) addTimelineRow();
            
            // Canvasデータリセット
            canvasObjects = [];
            selectedIndex = -1;
            renderCanvas();
            
            // 画像リソースの解放
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }

            const manualImg = document.getElementById('manual-image');
            manualImg.src = "";
            manualImg.style.display = 'none';
            document.getElementById('env-canvas').style.display = 'block';

            // ファイル入力もリセット
            document.getElementById('docx-input').value = null;
            document.getElementById('manual-img-input').value = null;

            document.getElementById('placeholder-text').style.display = 'block';
            document.getElementById('diagram-description').innerText = '';
            document.getElementById('status-msg').innerText = '';
        }

        function addTimelineRow(time='', child='', teacher='', student='') {
            const tbody = document.getElementById('timeline-body');
            const tr = document.createElement('tr');
            
            // XSS対策: DOM操作でセル生成
            const createCell = (text) => {
                const td = document.createElement('td');
                const div = document.createElement('div');
                div.className = 'editable';
                div.contentEditable = 'true';
                div.innerText = text; // innerTextを使用
                td.appendChild(div);
                return td;
            };

            tr.appendChild(createCell(time));
            tr.appendChild(createCell(child));
            tr.appendChild(createCell(teacher));
            tr.appendChild(createCell(student));
            
            tbody.appendChild(tr);
        }

        // --- A3対応: HTMLサニタイズ関数 ---
        function sanitizeHtml(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            
            // 削除対象のタグ
            const forbiddenTags = ['script', 'iframe', 'object', 'embed', 'style', 'link', 'form', 'input', 'button', 'meta', 'base'];
            forbiddenTags.forEach(tag => {
                const elements = doc.querySelectorAll(tag);
                elements.forEach(el => el.remove());
            });

            // 全要素の属性チェック
            const allElements = doc.querySelectorAll('*');
            allElements.forEach(el => {
                const attrsToRemove = [];
                Array.from(el.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.toLowerCase().trim();
                    
                    // on* 属性 (onclick, onload等) の削除
                    if (name.startsWith('on')) {
                        attrsToRemove.push(name);
                    }
                    // javascript: リンクの削除
                    if ((name === 'href' || name === 'src') && value.startsWith('javascript:')) {
                        attrsToRemove.push(name);
                    }
                });
                attrsToRemove.forEach(attrName => el.removeAttribute(attrName));
            });

            return doc.body.innerHTML;
        }

        // ファイル検証用ヘルパー関数
        function validateFile(file, allowedExtensions) {
            if (!file) return false;
            
            if (file.size > MAX_FILE_SIZE) {
                alert(`ファイルサイズが大きすぎます（上限10MB）。\nファイル名: ${file.name}`);
                return false;
            }

            const fileName = file.name.toLowerCase();
            const isValidExt = allowedExtensions.some(ext => fileName.endsWith(ext));
            if (!isValidExt) {
                alert(`許可されていないファイル形式です。\n許可されている拡張子: ${allowedExtensions.join(', ')}`);
                return false;
            }

            if (allowedExtensions === ALLOWED_IMG_EXT) {
                if (!file.type.startsWith('image/')) {
                    alert("画像ファイルではありません。");
                    return false;
                }
            }
            return true;
        }

        function getFormattedDate() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}${mm}${dd}_${hh}${min}`;
        }

        function printDocument() {
            selectedIndex = -1;
            renderCanvas();
            const originalTitle = document.title;
            document.title = `教育実習日誌_${getFormattedDate()}`;
            window.focus();
            window.print();
            setTimeout(() => { document.title = originalTitle; }, 2000);
        }

        // --- Canvas イベント処理 ---
        function initCanvasEvents() {
            const canvas = document.getElementById('env-canvas');
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
            canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
            window.addEventListener('touchend', handleMouseUp);
        }

        function getMousePos(evt) {
            const canvas = document.getElementById('env-canvas');
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (evt.changedTouches) {
                clientX = evt.changedTouches[0].clientX;
                clientY = evt.changedTouches[0].clientY;
            } else {
                clientX = evt.clientX;
                clientY = evt.clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleMouseDown(e) {
            e.preventDefault();
            const pos = getMousePos(e);
            let hitIndex = -1;
            for (let i = canvasObjects.length - 1; i >= 0; i--) {
                if (hitTest(canvasObjects[i], pos.x, pos.y)) { hitIndex = i; break; }
            }
            if (hitIndex !== -1) {
                selectedIndex = hitIndex;
                isDragging = true;
                dragStartX = pos.x;
                dragStartY = pos.y;
                dragOffsetX = canvasObjects[hitIndex].x - pos.x;
                dragOffsetY = canvasObjects[hitIndex].y - pos.y;
            } else {
                selectedIndex = -1;
            }
            renderCanvas();
        }

        function handleMouseMove(e) {
            e.preventDefault();
            const pos = getMousePos(e);
            const canvas = document.getElementById('env-canvas');
            let hit = false;
            for (let i = canvasObjects.length - 1; i >= 0; i--) {
                if (hitTest(canvasObjects[i], pos.x, pos.y)) { hit = true; break; }
            }
            canvas.style.cursor = isDragging ? 'grabbing' : (hit ? 'grab' : 'crosshair');

            if (isDragging && selectedIndex !== -1) {
                const obj = canvasObjects[selectedIndex];
                obj.x = pos.x + dragOffsetX;
                obj.y = pos.y + dragOffsetY;
                renderCanvas();
            }
        }

        function handleMouseUp(e) { isDragging = false; renderCanvas(); }
        function handleTouchStart(e) { handleMouseDown(e); }
        function handleTouchMove(e) { handleMouseMove(e); }

        function hitTest(obj, mx, my) {
            let w = 20, h = 20;
            if (obj.type === 'track') {
                return (Math.abs(mx - obj.x) < obj.w/2 && Math.abs(my - obj.y) < obj.h/2);
            }
            if (obj.w && obj.h) { w = obj.w; h = obj.h; }
            else if (['teacher','child','cone'].includes(obj.type)) { w = 30; h = 30; }
            else if (obj.type === 'desk') { w = 40; h = 25; }
            else if (obj.type === 'piano') { w = 40; h = 40; }
            return (mx >= obj.x - w/2 && mx <= obj.x + w/2 && my >= obj.y - h/2 && my <= obj.y + h/2);
        }

        function addObj(type) {
            const canvas = document.getElementById('env-canvas');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            let newObj = { type: type, x: cx + (Math.random()*40-20), y: cy + (Math.random()*40-20) };

            if (type === 'teacher') { newObj.label = 'T'; newObj.color = 'red'; }
            if (type === 'child') { newObj.label = '子'; newObj.color = '#333'; }
            if (type === 'desk') { newObj.w = 50; newObj.h = 30; newObj.color = '#e0e0e0'; }
            if (type === 'chair') { newObj.w = 15; newObj.h = 15; newObj.color = '#e0e0e0'; }
            if (type === 'piano') { newObj.w = 40; newObj.h = 50; newObj.color = '#333'; }
            if (type === 'mat') { newObj.w = 60; newObj.h = 40; newObj.color = '#81c784'; }
            if (type === 'cone') { newObj.color = 'red'; }
            if (type === 'goal') { newObj.color = 'blue'; }

            canvasObjects.push(newObj);
            selectedIndex = canvasObjects.length - 1;
            document.getElementById('placeholder-text').style.display = 'none';
            renderCanvas();
        }

        function deleteSelectedObj() {
            if (selectedIndex !== -1) {
                canvasObjects.splice(selectedIndex, 1);
                selectedIndex = -1;
                renderCanvas();
            }
        }

        function renderCanvas() {
            const canvas = document.getElementById('env-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = "#ccc";
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, width, height);

            if (canvasObjects.length === 0) return;

            canvasObjects.forEach((obj, index) => {
                ctx.save();
                ctx.translate(obj.x, obj.y);
                if (index === selectedIndex) {
                    ctx.shadowColor = 'rgba(0, 123, 255, 0.8)';
                    ctx.shadowBlur = 10;
                }

                if (obj.type === 'teacher') {
                    ctx.font = "bold 20px Arial"; ctx.fillStyle = obj.color || "red";
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText("×", 0, 0);
                    if (obj.label) { ctx.font = "12px Arial"; ctx.fillText(obj.label, 15, 5); }
                } else if (obj.type === 'child') {
                    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.strokeStyle = obj.color || "#333"; ctx.lineWidth = 2; ctx.stroke();
                    if (obj.label) { ctx.font = "10px Arial"; ctx.fillStyle = "#333"; ctx.textAlign = "center"; ctx.fillText(obj.label, 0, -12); }
                } else if (obj.type === 'desk' || obj.type === 'mat') {
                    const w = obj.w || 40; const h = obj.h || 25;
                    ctx.fillStyle = obj.color || "#e0e0e0"; ctx.fillRect(-w/2, -h/2, w, h);
                    ctx.strokeStyle = "#999"; ctx.strokeRect(-w/2, -h/2, w, h);
                } else if (obj.type === 'chair') {
                    const w = obj.w || 15;
                    ctx.fillStyle = obj.color || "#fff"; ctx.fillRect(-w/2, -w/2, w, w);
                    ctx.strokeStyle = "#666"; ctx.strokeRect(-w/2, -w/2, w, w);
                    ctx.beginPath(); ctx.moveTo(-w/2, -w/2); ctx.lineTo(w/2, -w/2); ctx.stroke();
                } else if (obj.type === 'piano') {
                    const w = obj.w || 40; const h = obj.h || 50;
                    ctx.fillStyle = "#333"; ctx.fillRect(-w/2, -h/2, w, h);
                    ctx.fillStyle = "#fff"; ctx.fillRect(-w/2, h/4, w, h/4);
                } else if (obj.type === 'cone') {
                    ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(8, 10); ctx.lineTo(-8, 10); ctx.closePath();
                    ctx.fillStyle = obj.color || "red"; ctx.fill(); ctx.strokeStyle = "#333"; ctx.stroke();
                } else if (obj.type === 'goal') {
                    ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -20);
                    ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = obj.color || "blue"; ctx.fillRect(0, -20, 15, 10);
                } else if (obj.type === 'track') {
                    const w = obj.w || width * 0.7; const h = obj.h || height * 0.5;
                    ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/2, 0, 0, 2 * Math.PI);
                    ctx.strokeStyle = "#555"; ctx.lineWidth = 3; ctx.stroke();
                    if (index === selectedIndex) {
                        ctx.strokeStyle = "blue"; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
                        ctx.strokeRect(-w/2, -h/2, w, h); ctx.setLineDash([]);
                    }
                } else if (obj.type === 'text') {
                    ctx.fillStyle = "#000"; ctx.font = "14px Arial"; ctx.textAlign = "center";
                    ctx.fillText(obj.text || "Text", 0, 0);
                }

                if (index === selectedIndex && obj.type !== 'track') {
                    ctx.strokeStyle = "#007bff"; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
                    ctx.strokeRect(-20, -20, 40, 40); ctx.setLineDash([]);
                }
                ctx.restore();
            });
        }

        function saveDiagramImage() {
            const canvas = document.getElementById('env-canvas');
            const manualImg = document.getElementById('manual-image');
            const prevSelected = selectedIndex;
            selectedIndex = -1;

                try { downloadUrl = canvas.toDataURL("image/png"); }

            } else {

            }

            const link = document.createElement('a');

        // --- 図の差し替え（Blob URL処理） ---
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!validateFile(file, ALLOWED_IMG_EXT)) { this.value = null; return; }

            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = URL.createObjectURL(file);
            
            const manualImg = document.getElementById('manual-image');
            manualImg.src = currentObjectUrl;
            manualImg.style.display = 'block';
            document.getElementById('env-canvas').style.display = 'none';
            document.getElementById('placeholder-text').style.display = 'none';
            document.getElementById('status-msg').innerText = "図を差し替えました";
        }

        // --- Word読み込み（サニタイズ処理追加） ---
        function handleDocUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size === 0) { alert("ファイルが空のようです。"); return; }
            if (!validateFile(file, ALLOWED_DOC_EXT)) { this.value = null; return; }

            document.getElementById('status-msg').innerText = "ファイルを解析中...";
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                mammoth.convertToHtml({arrayBuffer: arrayBuffer})
                    .then(displayResult)
                    .catch(handleError);
            };
            reader.onerror = function() { handleError(new Error("読込エラー")); };
            reader.readAsArrayBuffer(file);
        }

        function displayResult(result) {
            document.getElementById('status-msg').innerText = "";
            
            // 重要: Wordから生成されたHTMLをサニタイズ (A3対応)
            const safeHtml = sanitizeHtml(result.value);
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = safeHtml; // サニタイズ済みHTMLを挿入

            document.getElementById('env-canvas').style.display = 'block';
            document.getElementById('manual-image').style.display = 'none';
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
                document.getElementById('manual-image').src = "";
            }

            // 基本情報の抽出
            const elements = tempDiv.querySelectorAll('p, tr, h1, h2, h3, h4, h5, h6, li');
            
            // 修正: 大学名(uniVal)と氏名(nameVal)の変数を削除し、読み込み対象外としました
            let dateVal = "", weatherVal = "", classVal = "", attendVal = "";
            elements.forEach(el => {
                const text = el.innerText.trim();
                if (!dateVal && text.match(/日付\s*[:：]?\s*(\S.*)/)) dateVal = RegExp.$1.trim();
                if (!weatherVal && text.match(/天気\s*[:：]?\s*(\S.*)/)) weatherVal = RegExp.$1.trim();
                if (!classVal && text.match(/配属組\s*[:：]?\s*(\S.*)/)) classVal = RegExp.$1.trim();
                if (!attendVal && text.match(/出席\s*[:：]?\s*(\S.*)/)) attendVal = RegExp.$1.trim();
                // 大学名・氏名の抽出処理を削除
            });

            if(dateVal) document.getElementById('field-date').innerText = dateVal;
            if(weatherVal) document.getElementById('field-weather').innerText = weatherVal;
            if(classVal) document.getElementById('field-class').innerText = classVal;
            if(attendVal) document.getElementById('field-attendance').innerText = attendVal;
            // 大学名・氏名の反映処理を削除（手入力を維持）

            // セクションごとのテキスト抽出
            let currentMode = "none"; let subMode = "none"; 
            let sectionContent = {
                classGoal: [], studentGoal: [], envText: [], envImageDesc: [],
                record: [], reflectionToday: [], reflectionTomorrow: [], feedback: []
            };

            elements.forEach(el => {
                let text = el.innerText.trim();
                if(!text) return;

                if (text.match(/^[2-9２-９][.．]?\s*ねらい/)) { currentMode = "goal"; subMode = "none"; return; }
                if (text.match(/^[3-9３-９][.．]?\s*環境構成/)) { currentMode = "env"; subMode = "none"; return; }
                if (text.match(/^[4-9４-９][.．]?\s*一日の実習の流れ/)) { currentMode = "timeline"; return; }
                if (text.match(/^[5-9５-９][.．]?\s*主な活動の記録/)) { currentMode = "record"; return; }
                if (text.match(/^[6-9６-９][.．]?\s*振り返りと課題/)) { currentMode = "reflection"; subMode = "none"; return; }
                if (text.match(/^[7-9７-９][.．]?\s*指導者の講評/)) { currentMode = "feedback"; return; }

                if (currentMode === "goal") {
                    if (text.includes("クラスのねらい")) {
                        subMode = "class"; text = text.replace(/.*クラスのねらい(?:[】\]\)])?\s*[:：]?\s*/, "").trim();
                    } else if (text.includes("実習生の目標")) {
                        subMode = "student"; text = text.replace(/.*実習生の目標(?:[】\]\)])?\s*[:：]?\s*/, "").trim();
                    }
                    if (text) {
                        if (subMode === "class") sectionContent.classGoal.push(text);
                        if (subMode === "student") sectionContent.studentGoal.push(text);
                    }
                } else if (currentMode === "env") {
                    if (text.includes("図のイメージ")) {
                        subMode = "image"; text = text.replace(/.*図のイメージ(?:[】\]\)])?\s*[:：]?\s*/, "").trim();
                    } else if (text.includes("テキスト記述")) {
                        subMode = "text"; text = text.replace(/.*テキスト記述(?:[】\]\)])?\s*[:：]?\s*/, "").trim();
                    }
                    if (text) {
                        if (subMode === "image") sectionContent.envImageDesc.push(text);
                        if (subMode === "text") sectionContent.envText.push(text);
                    }
                } else if (currentMode === "record") {
                    if (!text.match(/^[5-9５-９][.．]/)) sectionContent.record.push(text);
                } else if (currentMode === "reflection") {
                    if (text.includes("本日の振り返り")) {
                        subMode = "today"; text = text.replace(/.*本日の振り返り(?:[】\]\)])?\s*[:：]?\s*/, "").trim();
                    } else if (text.includes("翌日への課題")) {
                        subMode = "tomorrow"; text = text.replace(/.*翌日への課題(?:[】\]\)])?\s*[:：]?\s*/, "").trim();
                    }
                    if (text) {
                        if (subMode === "today") sectionContent.reflectionToday.push(text);
                        if (subMode === "tomorrow") sectionContent.reflectionTomorrow.push(text);
                    }
                } else if (currentMode === "feedback") {
                    if (!text.match(/^[7-9７-９][.．]/)) sectionContent.feedback.push(text);
                }
            });

            document.getElementById('field-class-goal').innerText = sectionContent.classGoal.join('\n');
            document.getElementById('field-student-goal').innerText = sectionContent.studentGoal.join('\n');
            document.getElementById('field-env-text').innerText = sectionContent.envText.join('\n');
            document.getElementById('diagram-description').innerText = sectionContent.envImageDesc.join('\n');
            document.getElementById('field-record').innerText = sectionContent.record.join('\n');
            
            let reflectionText = "";
            if (sectionContent.reflectionToday.length > 0) reflectionText += "【本日の振り返り】\n" + sectionContent.reflectionToday.join('\n') + "\n\n";
            if (sectionContent.reflectionTomorrow.length > 0) reflectionText += "【翌日への課題】\n" + sectionContent.reflectionTomorrow.join('\n');
            document.getElementById('field-reflection').innerText = reflectionText;
            document.getElementById('field-feedback').innerText = sectionContent.feedback.join('\n');

            // 時系列テーブル解析
            const tables = tempDiv.querySelectorAll('table');
            tables.forEach(table => {
                const rows = table.querySelectorAll('tr');
                let headerRowIndex = -1;
                rows.forEach((row, idx) => {
                    const rowText = row.innerText;
                    if(rowText.includes('時刻') && rowText.includes('活動')) headerRowIndex = idx;
                });
                if (headerRowIndex !== -1) {
                    const tbody = document.getElementById('timeline-body');
                    tbody.innerHTML = ''; 
                    for(let i = headerRowIndex + 1; i < rows.length; i++) {
                        const cells = rows[i].querySelectorAll('td');
                        if(cells.length > 0) {
                            addTimelineRow(
                                cells[0]?.innerText || "", cells[1]?.innerText || "",
                                cells[2]?.innerText || "", cells[3]?.innerText || ""
                            );
                        }
                    }
                }
            });

            generateDiagramFromText();
        }

        function handleError(err) {
            console.error(err);
            alert("読み込みエラー: " + err.message);
        }

        function generateDiagramFromText() {
            const desc = document.getElementById('diagram-description').innerText;
            const canvas = document.getElementById('env-canvas');
            const width = canvas.width;
            const height = canvas.height;

            canvasObjects = [];
            selectedIndex = -1;

            if (!desc && document.getElementById('field-env-text').innerText.trim() === "") {
                document.getElementById('placeholder-text').style.display = 'block';
            } else {
                document.getElementById('placeholder-text').style.display = 'none';
            }

            if (desc.includes("トラック") || desc.includes("楕円")) {
                canvasObjects.push({type: 'track', x: width/2, y: height/2, w: width*0.7, h: height*0.5});
            }
            if (desc.includes("コーン") || desc.includes("待機")) {
                canvasObjects.push({type: 'cone', x: width/2 - 40, y: height/2 + 30, color: 'red'});
                canvasObjects.push({type: 'cone', x: width/2 - 15, y: height/2 + 30, color: 'white'});
                canvasObjects.push({type: 'cone', x: width/2 + 15, y: height/2 + 30, color: 'blue'});
                canvasObjects.push({type: 'cone', x: width/2 + 40, y: height/2 + 30, color: 'yellow'});
            }
            if (desc.includes("ゴール") || desc.includes("旗") || desc.includes("得点板")) {
                canvasObjects.push({type: 'goal', x: width - 50, y: height/2 - 20});
                canvasObjects.push({type: 'text', x: width - 40, y: height/2 - 40, text: "得点板"});
            }
            if (desc.includes("保育者") || desc.includes("×") || desc.includes("読み手")) {
                canvasObjects.push({type: 'teacher', x: 60, y: 60, label: 'T1', color: 'red'});
                canvasObjects.push({type: 'teacher', x: width - 60, y: height - 60, label: 'T2', color: 'red'});
                canvasObjects.push({type: 'teacher', x: width/2, y: height - 40, label: 'T3', color: 'red'});
            }
            if (desc.includes("かるた") || desc.includes("円形")) {
                for(let i=0; i<8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const r = 60;
                    canvasObjects.push({type: 'child', x: width/2 + r * Math.cos(angle), y: height/2 + r * Math.sin(angle), label: '子'});
                }
            }
            if (desc.includes("コの字")) {
                 for(let x = 80; x < width - 80; x += 30) canvasObjects.push({type: 'child', x: x, y: 50, label: '子'});
                 for(let y = 80; y < height - 50; y += 30) canvasObjects.push({type: 'child', x: 80, y: y, label: '子'});
                 for(let y = 80; y < height - 50; y += 30) canvasObjects.push({type: 'child', x: width - 80, y: y, label: '子'});
            }
            if (desc.includes("ホワイトボード") || desc.includes("50音")) {
                canvasObjects.push({type: 'desk', x: width/2, y: 30, w: 80, h: 20, color: '#eee'});
                canvasObjects.push({type: 'text', x: width/2, y: 34, text: 'WB'});
            }
            renderCanvas();
        }
    </script>
</body>
