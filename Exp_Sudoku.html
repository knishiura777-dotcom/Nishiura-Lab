<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUDOKU - Minimalist Design</title>
    <style>
        :root {
            --bg-body: #f4f5f7;
            --bg-board: #e2e8f0;
            --bg-cell: #ffffff;
            --bg-cell-fixed: #f8fafc;
            
            --text-main: #1e293b;
            --text-sub: #64748b;
            --text-accent: #3b82f6; /* User input */
            
            --color-primary: #0f172a; /* Buttons, Strong text */
            --color-secondary: #3b82f6; /* Selection */
            --color-highlight: #eff6ff; /* Same number highlight */
            --color-error: #ef4444;
            --color-success: #10b981;
            
            --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --shadow-sharp: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            
            --radius-l: 24px;
            --radius-m: 12px;
            --radius-s: 8px;

            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px 80px 20px; /* 下部のパディングを増やして見切れ防止 */
            overflow-x: hidden;
        }

        /* --- Header & Stats --- */
        header {
            width: 100%;
            max-width: 420px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--color-primary);
            line-height: 1;
        }

        .stats-badge {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-sub);
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
        }

        .stat-value {
            color: var(--color-primary);
            font-weight: 800;
            margin-left: 4px;
        }

        /* --- Controls --- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
            gap: 12px;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            appearance: none;
            background-color: transparent;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            padding-right: 20px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        select:hover {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background-color: white;
            color: var(--text-main);
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:hover {
            background-color: #f1f5f9;
            border-color: var(--text-sub);
        }
        .btn-action:active {
            transform: translateY(1px);
        }

        .btn-new-game {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: var(--shadow-sharp);
        }

        .btn-new-game:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(0,0,0,0.15);
        }

        .btn-new-game:active {
            transform: translateY(0);
        }

        /* --- Game Board --- */
        .game-wrapper {
            background: white;
            padding: 20px;
            border-radius: var(--radius-l);
            box-shadow: var(--shadow-soft);
            margin-bottom: 24px;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: center;
        }

        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px;
            background-color: var(--bg-board);
            border: 2px solid var(--color-primary);
            border-radius: var(--radius-m);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1; /* 明示的な比率指定 */
        }

        .cell {
            background-color: var(--bg-cell);
            display: flex;
            justify-content: center;
            align-items: center;
            /* 修正: フォントサイズを画面幅に応じて可変にし、はみ出しを防ぐ */
            font-size: clamp(1rem, 4.5vw, 1.5rem);
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.1s;
            position: relative;
            
            /* 重要修正: グリッドアイテムのサイズが中身に引っ張られないようにする */
            min-width: 0;
            min-height: 0;
            overflow: hidden; 
        }

        /* 3x3 Grid Separation */
        .cell:nth-child(3n) {
            border-right: 2px solid var(--bg-board);
        }
        .cell:nth-child(9n) {
            border-right: none;
        }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid var(--bg-board);
        }

        /* States */
        .cell.fixed {
            background-color: var(--bg-cell-fixed);
            color: var(--text-main);
            font-weight: 700;
        }

        .cell.user-input {
            color: var(--text-accent);
            font-weight: 600;
        }

        .cell.selected {
            background-color: var(--color-secondary) !important;
            color: white !important;
        }

        .cell.same-number {
            background-color: var(--color-highlight);
        }
        .cell.same-number.selected {
            background-color: var(--color-secondary) !important;
        }

        .cell.error {
            color: var(--color-error) !important;
            background-color: #fee2e2 !important;
        }

        @keyframes cell-pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .cell span {
            animation: cell-pop 0.2s ease-out;
            display: block;
            /* 数字のセンタリングを確実にする */
            line-height: 1;
        }

        /* --- Numpad --- */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        .num-btn {
            aspect-ratio: 1;
            border: none;
            background-color: white;
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0; /* 余計なパディングを削除 */
        }

        .num-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            color: var(--color-secondary);
        }

        .num-btn:active {
            transform: scale(0.95);
        }

        .num-btn.delete {
            color: var(--text-sub);
            font-size: 1rem;
        }
        .num-btn.delete:hover {
            color: var(--color-error);
            background-color: #fef2f2;
        }

        .status-area {
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status-area.visible {
            opacity: 1;
        }

        .win-state .game-wrapper {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
            border: 2px solid var(--color-success);
        }
        
        @keyframes pop-stats {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop-stats 0.3s ease;
        }

        @media (max-width: 500px) {
            body { padding: 20px 10px 60px 10px; }
            h1 { font-size: 2rem; }
            .sudoku-board { max-width: 100%; }
            .numpad { gap: 8px; }
            .num-btn { font-size: 1.1rem; }
            .game-wrapper { padding: 10px; border-radius: var(--radius-m); }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-row">
            <h1>SUDOKU</h1>
            <div class="stats-badge" id="stats-container">
                <div>LV <span class="stat-value" id="level-display">1</span></div>
                <div>PTS <span class="stat-value" id="score-display">0</span></div>
            </div>
        </div>
        
        <div class="controls">
            <div class="select-wrapper">
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            
            <div class="btn-group">
                <button class="btn-action" onclick="saveGame()">Save</button>
                <button class="btn-action" onclick="loadGame()">Load</button>
            </div>

            <button class="btn-new-game" onclick="newGame()">New</button>
        </div>
    </header>

    <div class="status-area" id="message"></div>

    <div class="game-wrapper" id="game-wrapper">
        <div class="sudoku-board" id="board">
            <!-- JS generates cells here -->
        </div>
    </div>

    <div class="numpad">
        <button class="num-btn" onclick="inputNumber(1)">1</button>
        <button class="num-btn" onclick="inputNumber(2)">2</button>
        <button class="num-btn" onclick="inputNumber(3)">3</button>
        <button class="num-btn" onclick="inputNumber(4)">4</button>
        <button class="num-btn" onclick="inputNumber(5)">5</button>
        <button class="num-btn" onclick="inputNumber(6)">6</button>
        <button class="num-btn" onclick="inputNumber(7)">7</button>
        <button class="num-btn" onclick="inputNumber(8)">8</button>
        <button class="num-btn" onclick="inputNumber(9)">9</button>
        <button class="num-btn delete" onclick="inputNumber(null)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
        </button>
    </div>

    <script>
        // State
        let solution = [];
        let puzzle = [];
        let selectedCellIndex = null;
        let isGameActive = true;
        
        // Stats
        let playerLevel = 1;
        let playerScore = 0;

        const boardElement = document.getElementById('board');
        const messageElement = document.getElementById('message');
        const difficultySelect = document.getElementById('difficulty');
        const levelDisplay = document.getElementById('level-display');
        const scoreDisplay = document.getElementById('score-display');
        const statsContainer = document.getElementById('stats-container');
        const gameWrapper = document.getElementById('game-wrapper');

        function isValid(board, row, col, num) {
            for (let i = 0; i < 9; i++) {
                if (board[row][i] === num && i !== col) return false;
                if (board[i][col] === num && i !== row) return false;
                
                const boxRow = 3 * Math.floor(row / 3) + Math.floor(i / 3);
                const boxCol = 3 * Math.floor(col / 3) + i % 3;
                if (board[boxRow][boxCol] === num && (boxRow !== row || boxCol !== col)) return false;
            }
            return true;
        }

        function solveSudoku(board) {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] === 0) {
                        const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                        nums.sort(() => Math.random() - 0.5);

                        for (let num of nums) {
                            if (isValid(board, row, col, num)) {
                                board[row][col] = num;
                                if (solveSudoku(board)) return true;
                                board[row][col] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        function generateBoard() {
            const board = Array.from({ length: 9 }, () => Array(9).fill(0));
            
            for (let i = 0; i < 9; i = i + 3) {
                fillBox(board, i, i);
            }

            solveSudoku(board);
            solution = board.map(row => [...row]);

            puzzle = board.map(row => [...row]);
            let attempts = 0;
            const difficulty = difficultySelect.value;
            
            if (difficulty === 'easy') attempts = 30;
            else if (difficulty === 'medium') attempts = 45;
            else attempts = 58;

            while (attempts > 0) {
                let row = Math.floor(Math.random() * 9);
                let col = Math.floor(Math.random() * 9);
                while (puzzle[row][col] === 0) {
                    row = Math.floor(Math.random() * 9);
                    col = Math.floor(Math.random() * 9);
                }
                puzzle[row][col] = 0;
                attempts--;
            }
        }

        function fillBox(board, row, col) {
            let num;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    do {
                        num = Math.floor(Math.random() * 9) + 1;
                    } while (!isSafeInBox(board, row, col, num));
                    board[row + i][col + j] = num;
                }
            }
        }

        function isSafeInBox(board, rowStart, colStart, num) {
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[rowStart + i][colStart + j] === num) return false;
                }
            }
            return true;
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let i = 0; i < 81; i++) {
                const row = Math.floor(i / 9);
                const col = i % 9;
                const value = puzzle[row][col];
                
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                
                // 元のボード（初期配置）の判定は、solutionと一致し、かつ生成時のロジックを知っている必要がある
                // 簡易化のため、puzzleの非0の値のうち、ユーザーが入力したものでないものを区別する必要があるが
                // ロード機能を追加したため、puzzle配列だけでは初期配置かユーザー入力か判別できない
                // そのため、描画時に判定は行わず、クラス付与はDOM操作時に行うか、
                // saveデータに「初期配置マスク」を含めるのがベストだが、
                // ここでは「fixed」クラスを維持するロジックを工夫する。
                // 解決策: ロード時、既にDOMがある場合は良いが、再描画時は情報が足りない。
                // したがって、generateBoard時に「initialMask」を作るのが正しいが、
                // 今回は既存コードへの影響を最小限にするため、
                // 0以外のセルはすべて描画し、後からfixedかどうかを判定する...のは難しい。
                // よって、今回は「0以外」かつ「ロードデータがない場合は初期配置とみなす」が基本だが
                // save/loadのために、puzzle配列だけでなく、initialPuzzle配列も持つように拡張するほうが安全。
                // しかし、もっと単純に: 「saveGame」でDOMのクラス情報（fixedかuser-inputか）は保存されないため、
                // ロード時に困る。
                // 修正方針: saveデータに puzzle配列 と "initialBoard" 配列を含める。

                // 初期描画（New Game時）
                // puzzleにある数値はすべてfixed扱い。
                
                if (value !== 0) {
                    cell.innerHTML = `<span>${value}</span>`;
                    // ロード機能対応: 
                    // 通常のNewGame直後はすべてFixedだが、ロード時はUser-inputが混ざっている可能性がある。
                    // 簡易的なハックとして、initialBoardと比較する。
                    if (typeof initialPuzzle !== 'undefined' && initialPuzzle[row][col] !== 0) {
                         cell.classList.add('fixed');
                    } else if (typeof initialPuzzle !== 'undefined' && initialPuzzle[row][col] === 0) {
                        cell.classList.add('user-input');
                        // エラーチェック
                         if (!isValid(puzzle, row, col, value)) {
                            // isValidは自分自身を除くチェックが必要だが、現在のisValidは単純チェック
                            // ここでは簡易的に色だけつける、あるいはinputNumberと同じロジックを通す
                            // ただしロード時はエラー表示しないほうが美しいかもしれないが、
                            // inputNumberのロジックに合わせるならエラークラスも復元すべき
                            // 複雑になるため、ロード時はクラス付与のみ行う
                        }
                    } else {
                        // initialPuzzle未定義（初回生成時）はすべてFixed
                        cell.classList.add('fixed');
                    }
                }

                cell.addEventListener('click', () => selectCell(i));
                boardElement.appendChild(cell);
            }
        }

        // 初期配置を記録するための変数
        let initialPuzzle = [];

        function selectCell(index) {
            if (!isGameActive) return;

            const prevSelected = document.querySelector('.cell.selected');
            if (prevSelected) prevSelected.classList.remove('selected');
            
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('same-number'));

            selectedCellIndex = index;
            const cell = boardElement.children[index];
            cell.classList.add('selected');

            const val = cell.textContent;
            if (val) {
                document.querySelectorAll('.cell').forEach(c => {
                    if (c.textContent === val) c.classList.add('same-number');
                });
            }
        }

        function inputNumber(num) {
            if (selectedCellIndex === null || !isGameActive) return;

            const row = Math.floor(selectedCellIndex / 9);
            const col = selectedCellIndex % 9;
            const cell = boardElement.children[selectedCellIndex];

            if (cell.classList.contains('fixed')) return;

            if (num === null) {
                cell.textContent = '';
                cell.classList.remove('user-input', 'error');
                puzzle[row][col] = 0;
            } else {
                cell.innerHTML = `<span>${num}</span>`;
                cell.classList.add('user-input');
                puzzle[row][col] = num;

                if (!isValid(puzzle, row, col, num)) {
                    cell.classList.add('error');
                } else {
                    cell.classList.remove('error');
                }
                
                document.querySelectorAll('.cell').forEach(c => c.classList.remove('same-number'));
                document.querySelectorAll('.cell').forEach(c => {
                    if (c.textContent == num) c.classList.add('same-number');
                });
            }

            checkWin();
        }

        function checkWin() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (puzzle[r][c] === 0) return;
                }
            }

            let isCorrect = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (puzzle[r][c] !== solution[r][c]) {
                        isCorrect = false;
                        boardElement.children[r * 9 + c].classList.add('error');
                    }
                }
            }

            if (isCorrect) {
                handleWin();
            } else {
                showMessage("Check your numbers!", true);
            }
        }

        function handleWin() {
            isGameActive = false;
            
            const diff = difficultySelect.value;
            let pointsEarned = 0;
            if (diff === 'easy') pointsEarned = 100;
            else if (diff === 'medium') pointsEarned = 200;
            else pointsEarned = 300;

            playerScore += pointsEarned;
            playerLevel++;
            
            updateStatsUI();
            
            showMessage(`Complete! +${pointsEarned}pts`, false);
            
            document.body.classList.add('win-state');
            
            statsContainer.classList.remove('animate-pop');
            void statsContainer.offsetWidth;
            statsContainer.classList.add('animate-pop');
            
            // 勝ったときはセーブデータを消す（次のゲームのため）
            localStorage.removeItem('sudoku_save_data');
        }

        function updateStatsUI() {
            levelDisplay.textContent = playerLevel;
            scoreDisplay.textContent = playerScore;
        }

        function showMessage(text, isError) {
            messageElement.textContent = text;
            messageElement.style.color = isError ? 'var(--color-error)' : 'var(--color-success)';
            messageElement.classList.add('visible');
            setTimeout(() => {
                // ゲームがまだアクティブまたはメッセージが表示されてから時間が経ったら消す
                messageElement.classList.remove('visible');
            }, 3000);
        }

        function newGame() {
            isGameActive = true;
            document.body.classList.remove('win-state');
            messageElement.classList.remove('visible');
            generateBoard();
            
            // initialPuzzleをディープコピーして保存（fixed判定用）
            initialPuzzle = puzzle.map(row => [...row]);
            
            renderBoard();
            selectedCellIndex = null;
        }

        // --- Save / Load Logic ---

        function saveGame() {
            if (!isGameActive) {
                showMessage("Cannot save finished game", true);
                return;
            }
            const saveData = {
                puzzle: puzzle,
                solution: solution,
                initialPuzzle: initialPuzzle,
                playerLevel: playerLevel,
                playerScore: playerScore,
                difficulty: difficultySelect.value
            };
            try {
                localStorage.setItem('sudoku_save_data', JSON.stringify(saveData));
                showMessage("Game Saved!", false);
            } catch (e) {
                showMessage("Save failed...", true);
            }
        }

        function loadGame() {
            const savedJSON = localStorage.getItem('sudoku_save_data');
            if (!savedJSON) {
                showMessage("No saved game found", true);
                return;
            }

            try {
                const data = JSON.parse(savedJSON);
                
                // Restore state
                puzzle = data.puzzle;
                solution = data.solution;
                initialPuzzle = data.initialPuzzle;
                playerLevel = data.playerLevel;
                playerScore = data.playerScore;
                difficultySelect.value = data.difficulty;
                
                isGameActive = true;
                document.body.classList.remove('win-state');
                
                updateStatsUI();
                renderBoard();
                
                // エラー表示の再計算（ユーザー入力がある場合）
                // 簡易的に全セルチェックして間違っていれば赤くする
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        const val = puzzle[r][c];
                        // initialPuzzleが0（空）で、現在値が入っている場合＝ユーザー入力
                        if (initialPuzzle[r][c] === 0 && val !== 0) {
                            if (!isValid(puzzle, r, c, val)) {
                                const index = r * 9 + c;
                                boardElement.children[index].classList.add('error');
                            }
                        }
                    }
                }

                showMessage("Game Loaded!", false);
                selectedCellIndex = null;

            } catch (e) {
                console.error(e);
                showMessage("Load failed (Data corrupted)", true);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!isGameActive) return;
            
            const key = e.key;
            if (key >= '1' && key <= '9') {
                inputNumber(parseInt(key));
            } else if (key === 'Backspace' || key === 'Delete') {
                inputNumber(null);
            } else if (selectedCellIndex !== null) {
                let row = Math.floor(selectedCellIndex / 9);
                let col = selectedCellIndex % 9;
                
                if (key === 'ArrowUp') row = Math.max(0, row - 1);
                if (key === 'ArrowDown') row = Math.min(8, row + 1);
                if (key === 'ArrowLeft') col = Math.max(0, col - 1);
                if (key === 'ArrowRight') col = Math.min(8, col + 1);

                const newIndex = row * 9 + col;
                selectCell(newIndex);
            }
        });

        // Initialize
        // ページ読み込み時にセーブデータがあればロードするか？
        // 今回はユーザーが明示的に操作できるようにボタンのみとするが、
        // もしセーブデータがあれば「Load」ボタンを強調するなどのUIも考えられる。
        // ここではデフォルトでNew Gameを開始する。
        newGame();

    </script>
</body>
