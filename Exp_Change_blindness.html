        const GAS_CODE = `function doPost(e) {

        const DEFAULT_CONFIG = {
            trialsPerCondition: 5,
            imageDuration: 240,
            blankDuration: 80,
            itemsCount: 16,
            saveMode: 'csv',
            gasUrl: ''
        };

        const getRandomColor = () => {
            const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899'];
            return colors[Math.floor(Math.random() * colors.length)];
        };

        const generateItems = (width, height, count) => {
            const items = [];
            const padding = 50;
            
            for (let i = 0; i < count; i++) {
                let x, y, overlap;
                let attempts = 0;
                do {
                    x = padding + Math.random() * (width - padding * 2);
                    y = padding + Math.random() * (height - padding * 2);
                    overlap = items.some(item => {
                        const dx = item.x - x;
                        const dy = item.y - y;
                        return Math.sqrt(dx * dx + dy * dy) < 60;
                    });
                    attempts++;
                } while (overlap && attempts < 100);

                items.push({
                    id: i,
                    x,
                    y,
                    color: getRandomColor(),
                    shape: Math.random() > 0.5 ? 'circle' : 'rect',
                    size: 40
                });
            }
            return items;
        };

        // --- Main Component ---
        function ChangeBlindnessApp() {
            const [gameState, setGameState] = useState('intro');
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [activeTab, setActiveTab] = useState('params');
            const [results, setResults] = useState([]);
            const [currentTrialIndex, setCurrentTrialIndex] = useState(0);
            const [trialList, setTrialList] = useState([]);
            const [feedback, setFeedback] = useState(null); 
            const [lang, setLang] = useState('ja');
            const t = TRANSLATIONS[lang];

            const [participantInfo, setParticipantInfo] = useState({
                id: '',
                age: '',
                gender: ''
            });

            const [copyStatus, setCopyStatus] = useState('idle');
            const [saveStatus, setSaveStatus] = useState('idle');
            
            const [user, setUser] = useState(null);
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);

            const canvasRef = useRef(null);
            const loopRef = useRef(null);
            const startTimeRef = useRef(0);

            const currentTrial = trialList[currentTrialIndex];

            // Firebase Initialization
            useEffect(() => {
                if (typeof firebase === 'undefined') {
                    console.log("Firebase SDK not loaded");
                    return;
                }
                
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined') {
                    try {
                        firebaseConfig = JSON.parse(__firebase_config);
                    } catch(e) { console.error("Config parse error", e); }
                }

                if (firebaseConfig) {
                    try {
                        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
                        const authInstance = firebase.auth();
                        const dbInstance = firebase.firestore();
                        
                        setAuth(authInstance);
                        setDb(dbInstance);
                        setFirebaseReady(true);

                        const initAuth = async () => {
                            try {
                                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                    await authInstance.signInWithCustomToken(__initial_auth_token);
                                } else {
                                    await authInstance.signInAnonymously();
                                }
                            } catch (error) {
                                console.error("Auth failed:", error);
                            }
                        };
                        initAuth();
                        authInstance.onAuthStateChanged(setUser);
                    } catch (e) {
                        console.error("Firebase initialization failed:", e);
                    }
                } else {
                    console.log("Firebase config not found.");
                }
            }, []);

            // Experiment Logic
            const startExperiment = () => {
                const trials = [];
                const width = 600;
                const height = 400;

                for (let i = 0; i < config.trialsPerCondition; i++) {
                    const items = generateItems(width, height, config.itemsCount);
                    const targetIndex = Math.floor(Math.random() * items.length);
                    trials.push({
                        id: `flicker-${i}`,
                        condition: 'flicker',
                        items: items,
                        targetIndex: targetIndex,
                        targetChange: 'color', 
                        newColor: getRandomColor()
                    });
                }

                for (let i = 0; i < config.trialsPerCondition; i++) {
                    const items = generateItems(width, height, config.itemsCount);
                    const targetIndex = Math.floor(Math.random() * items.length);
                    trials.push({
                        id: `no-flicker-${i}`,
                        condition: 'no-flicker',
                        items: items,
                        targetIndex: targetIndex,
                        targetChange: 'color',
                        newColor: getRandomColor()
                    });
                }

                setTrialList(trials.sort(() => Math.random() - 0.5));
                setCurrentTrialIndex(0);
                setResults([]);
                setSaveStatus('idle');
                setGameState('playing');
            };

            useEffect(() => {
                if (gameState !== 'playing' || !currentTrial) return;

                let lastSwitchTime = null;
                let phase = 0;
                let isFirstFrame = true;

                const render = (timestamp) => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');

                    if (lastSwitchTime === null) {
                        lastSwitchTime = timestamp;
                        if (isFirstFrame) {
                            startTimeRef.current = timestamp;
                            isFirstFrame = false;
                        }
                    }

                    const elapsed = timestamp - lastSwitchTime;
                    
                    if (currentTrial.condition === 'flicker') {
                        if ((phase === 0 || phase === 2) && elapsed > config.imageDuration) {
                            phase = (phase + 1) % 4;
                            lastSwitchTime = timestamp;
                        } else if ((phase === 1 || phase === 3) && elapsed > config.blankDuration) {
                            phase = (phase + 1) % 4;
                            lastSwitchTime = timestamp;
                        }
                    } else {
                        if (elapsed > config.imageDuration) {
                            phase = phase === 0 ? 2 : 0;
                            lastSwitchTime = timestamp;
                        }
                    }

                    ctx.fillStyle = '#f3f4f6';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    if (currentTrial.condition === 'flicker' && (phase === 1 || phase === 3)) {
                        loopRef.current = requestAnimationFrame(render);
                        return;
                    }

                    const isModified = (phase === 2);
                    
                    currentTrial.items.forEach((item, index) => {
                        let drawColor = item.color;
                        if (index === currentTrial.targetIndex && isModified) {
                            drawColor = currentTrial.newColor;
                            if (drawColor === item.color) drawColor = '#000000';
                        }

                        ctx.fillStyle = drawColor;
                        ctx.beginPath();
                        if (item.shape === 'circle') {
                            ctx.arc(item.x, item.y, item.size / 2, 0, Math.PI * 2);
                        } else {
                            ctx.fillRect(item.x - item.size / 2, item.y - item.size / 2, item.size, item.size);
                        }
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    });

                    loopRef.current = requestAnimationFrame(render);
                };

                loopRef.current = requestAnimationFrame(render);
                return () => {
                    if (loopRef.current) cancelAnimationFrame(loopRef.current);
                };
            }, [gameState, currentTrial, config]);

            const handleCanvasClick = (e) => {
                if (gameState !== 'playing' || !currentTrial) return;

                const clickTime = performance.now(); 
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const targetItem = currentTrial.items[currentTrial.targetIndex];
                const dist = Math.sqrt(Math.pow(x - targetItem.x, 2) + Math.pow(y - targetItem.y, 2));

                if (dist < targetItem.size) {
                    const reactionTime = clickTime - startTimeRef.current;
                    handleTrialEnd(true, reactionTime);
                }
            };

            const handleTrialEnd = (success, time) => {
                const newResult = {
                    trialId: currentTrial.id,
                    condition: currentTrial.condition,
                    time: time,
                    success: success
                };
                
                setResults([...results, newResult]);
                setFeedback({ success, time: time.toFixed(1) });
                setGameState('feedback');

                setTimeout(() => {
                    if (currentTrialIndex < trialList.length - 1) {
                        setFeedback(null);
                        setCurrentTrialIndex(prev => prev + 1);
                        setGameState('playing');
                    } else {
                        setGameState('finished');
                    }
                }, 1500);
            };

            const handleSaveData = async () => {
                setSaveStatus('saving');
                
                // Prepare data inside handleSaveData to ensure latest participantInfo is used
                const date = new Date().toLocaleString();
                const data = results.map(row => ({
                    ParticipantID: participantInfo.id || 'Anonymous',
                    Age: participantInfo.age,
                    Gender: participantInfo.gender,
                    TrialID: row.trialId,
                    Condition: row.condition,
                    ReactionTime: Number(row.time).toFixed(3),
                    Success: row.success ? 1 : 0,
                    Date: date,
                    ImageDuration: config.imageDuration,
                    BlankDuration: config.blankDuration,
                    ItemsCount: config.itemsCount
                }));

                try {
                    if (config.saveMode === 'csv') {
                        let csvContent = `ParticipantID,Age,Gender,TrialID,Condition,ReactionTime(ms),Success,Date,ImageDuration,BlankDuration,ItemsCount\n`;
                        data.forEach(row => {
                            csvContent += `${row.ParticipantID},${row.Age},${row.Gender},${row.TrialID},${row.Condition},${row.ReactionTime},${row.Success},"${row.Date}",${row.ImageDuration},${row.BlankDuration},${row.ItemsCount}\n`;
                        });
                        
                        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                        const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        const filename = participantInfo.id ? `${participantInfo.id}_results.csv` : `results.csv`;
                        link.download = filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setSaveStatus('success');
                    } else if (config.saveMode === 'gas') {
                        if (!config.gasUrl) throw new Error("GAS URL Not Set");
                        await fetch(config.gasUrl, {
                            method: 'POST',
                            mode: 'no-cors', 
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        setSaveStatus('success');
                        alert(t.alerts.saveSuccess);
                    } else if (config.saveMode === 'firebase') {
                        if (!user || !db) throw new Error("Firebase not ready");
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';
                        
                        // Compat API usage
                        // Path: artifacts/{appId}/users/{uid}/changeBlindnessResults
                        const colRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('changeBlindnessResults');
                        await colRef.add({
                            participantInfo: participantInfo,
                            experimentDate: new Date(),
                            config: config,
                            results: data
                        });
                        setSaveStatus('success');
                    }
                } catch (error) {
                    console.error("Save error:", error);
                    setSaveStatus('error');
                    alert(`${t.alerts.saveError}: ${error.message}`);
                }
            };

            const handleConfigChange = (e) => {
                const { name, value } = e.target;
                setConfig(prev => ({
                    ...prev,
                    [name]: (name === 'saveMode' || name === 'gasUrl') ? value : parseInt(value, 10)
                }));
            };

            const handleParticipantInfoChange = (e) => {
                const { name, value } = e.target;
                console.log(`Input change: ${name} = ${value}`); // Debug log
                setParticipantInfo(prev => ({ ...prev, [name]: value }));
            };

            const copyGasCode = () => {
                const textArea = document.createElement("textarea");
                textArea.value = GAS_CODE;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        setCopyStatus('copied');
                        setTimeout(() => setCopyStatus('idle'), 2000);
                    } else {
                        alert(t.alerts.copyFailed);
                    }
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            };

            const calculateStats = () => {
                const flickerResults = results.filter(r => r.condition === 'flicker');
                const noFlickerResults = results.filter(r => r.condition === 'no-flicker');
                const getAvg = (arr) => arr.length ? (arr.reduce((a, b) => a + b.time, 0) / arr.length).toFixed(1) : 0;
                return { flickerAvg: getAvg(flickerResults), noFlickerAvg: getAvg(noFlickerResults) };
            };

            const LangSwitcher = () => (
                <div className="absolute top-4 right-4 flex gap-2">
                    <button onClick={() => setLang('ja')} className={`px-2 py-1 text-xs rounded border ${lang === 'ja' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600'}`}>JP</button>
                    <button onClick={() => setLang('en')} className={`px-2 py-1 text-xs rounded border ${lang === 'en' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600'}`}>EN</button>
                    <button onClick={() => setLang('sv')} className={`px-2 py-1 text-xs rounded border ${lang === 'sv' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600'}`}>SV</button>
                </div>
            );

            // Settings Screen
            if (gameState === 'settings') {
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col items-center p-4 font-sans text-gray-800 relative">
                        <LangSwitcher />
                        <div className="max-w-4xl w-full bg-white rounded-xl shadow-lg overflow-hidden">
                            <div className="bg-white border-b px-8 py-6 flex items-center justify-between sticky top-0 z-10">
                                <div className="flex items-center gap-3">
                                    <Settings className="w-8 h-8 text-gray-600" />
                                    <h2 className="text-2xl font-bold text-gray-800">{t.settingsTitle}</h2>
                                </div>
                                <button onClick={() => setGameState('intro')} className="text-gray-500 hover:text-gray-800 flex items-center gap-1">
                                    <ArrowLeft className="w-5 h-5" /> {t.back}
                                </button>
                            </div>

                            <div className="flex border-b bg-gray-50">
                                {[{ id: 'params', icon: Settings, label: t.tabs.params }, { id: 'save', icon: Database, label: t.tabs.save }, { id: 'info', icon: FileText, label: t.tabs.info }].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex-1 py-4 flex items-center justify-center gap-2 font-medium transition-colors ${activeTab === tab.id ? 'bg-white text-indigo-600 border-t-2 border-indigo-600' : 'text-gray-500 hover:bg-gray-100'}`}
                                    >
                                        <tab.icon className="w-4 h-4" />
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <div className="p-8 min-h-[400px]">
                                {activeTab === 'params' && (
                                    <div className="space-y-6 max-w-lg mx-auto animate-in fade-in duration-300">
                                        <div className="space-y-4">
                                            <h3 className="text-lg font-bold text-gray-800 border-b pb-2">{t.params.basic}</h3>
                                            <div>
                                                <label className="block text-gray-700 font-medium mb-1">{t.params.trials}</label>
                                                <input type="number" name="trialsPerCondition" value={config.trialsPerCondition} onChange={handleConfigChange} className="w-full p-2 border rounded" min="1" max="20" />
                                            </div>
                                            <div>
                                                <label className="block text-gray-700 font-medium mb-1">{t.params.items}</label>
                                                <input type="number" name="itemsCount" value={config.itemsCount} onChange={handleConfigChange} className="w-full p-2 border rounded" min="2" max="30" />
                                            </div>
                                            
                                            <h3 className="text-lg font-bold text-gray-800 border-b pb-2 mt-8">{t.params.time}</h3>
                                            <div>
                                                <label className="block text-gray-700 font-medium mb-1">{t.params.imageDuration}</label>
                                                <input type="number" name="imageDuration" value={config.imageDuration} onChange={handleConfigChange} className="w-full p-2 border rounded" min="100" step="10" />
                                            </div>
                                            <div>
                                                <label className="block text-gray-700 font-medium mb-1">{t.params.blankDuration}</label>
                                                <input type="number" name="blankDuration" value={config.blankDuration} onChange={handleConfigChange} className="w-full p-2 border rounded" min="0" step="10" />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'save' && (
                                    <div className="space-y-8 animate-in fade-in duration-300">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {[{ id: 'csv', label: t.save.modes.csv.label, desc: t.save.modes.csv.desc }, { id: 'gas', label: t.save.modes.gas.label, desc: t.save.modes.gas.desc }, { id: 'firebase', label: t.save.modes.firebase.label, desc: t.save.modes.firebase.desc }].map(mode => (
                                                <label key={mode.id} className={`relative flex flex-col p-4 border-2 rounded-xl cursor-pointer transition-all ${config.saveMode === mode.id ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 hover:border-indigo-300'}`}>
                                                    <input type="radio" name="saveMode" value={mode.id} checked={config.saveMode === mode.id} onChange={handleConfigChange} className="absolute top-4 right-4" />
                                                    <span className="font-bold text-gray-800">{mode.label}</span>
                                                    <span className="text-xs text-gray-500 mt-1">{mode.desc}</span>
                                                </label>
                                            ))}
                                        </div>

                                        <div className="bg-gray-50 p-6 rounded-xl border">
                                            {config.saveMode === 'csv' && (
                                                <div className="text-center text-gray-600">
                                                    <FileText className="w-12 h-12 mx-auto mb-2 text-gray-400" />
                                                    <p>{t.save.csvInfo}</p>
                                                </div>
                                            )}

                                            {config.saveMode === 'gas' && (
                                                <div className="space-y-6">
                                                    <div>
                                                        <label className="block text-gray-700 font-bold mb-2">{t.save.gasLabel}</label>
                                                        <input type="text" name="gasUrl" value={config.gasUrl} onChange={handleConfigChange} placeholder="https://script.google.com/macros/s/..." className="w-full p-3 border rounded-lg font-mono text-sm focus:ring-2 focus:ring-indigo-500" />
                                                        <p className="text-xs text-gray-500 mt-1">{t.save.gasDesc}</p>
                                                    </div>
                                                    <div className="border-t pt-4">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <h4 className="font-bold text-gray-700 text-sm">{t.save.gasCodeTitle}</h4>
                                                            <button onClick={copyGasCode} className="flex items-center gap-1 text-xs px-3 py-1 bg-white border rounded hover:bg-gray-100 transition">
                                                                {copyStatus === 'copied' ? <Check className="w-3 h-3 text-green-600" /> : <Copy className="w-3 h-3" />}
                                                                {copyStatus === 'copied' ? t.save.copied : t.save.copy}
                                                            </button>
                                                        </div>
                                                        <div className="relative">
                                                            <pre className="bg-gray-800 text-gray-100 p-4 rounded-lg text-xs overflow-x-auto h-48 font-mono leading-relaxed">{GAS_CODE}</pre>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {config.saveMode === 'firebase' && (
                                                <div className="text-center">
                                                    <Database className="w-12 h-12 mx-auto mb-2 text-orange-400" />
                                                    <h4 className="font-bold text-gray-800 mb-2">{t.save.firebaseStatus}</h4>
                                                    {firebaseReady ? (
                                                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-green-100 text-green-700 rounded-full text-sm font-bold">
                                                            <CheckCircle className="w-4 h-4" /> {t.save.connected}
                                                        </div>
                                                    ) : (
                                                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-red-100 text-red-700 rounded-full text-sm font-bold">
                                                            <AlertCircle className="w-4 h-4" /> {t.save.notFound}
                                                        </div>
                                                    )}
                                                    <p className="text-sm text-gray-600 mt-4 max-w-md mx-auto">{t.save.firebaseDesc}</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'info' && (
                                    <div className="space-y-6 text-sm text-gray-700 animate-in fade-in duration-300">
                                        <div className="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">
                                            <h4 className="font-bold text-blue-900 mb-2">{t.info.summaryTitle}</h4>
                                            <p>{t.info.summary}</p>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-gray-900 mb-2">{t.info.varsTitle}</h4>
                                            <ul className="list-disc list-inside space-y-1 pl-4">
                                                <li>{t.info.iv}</li>
                                                <li>{t.info.dv}</li>
                                            </ul>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-gray-900 mb-2">{t.info.specsTitle}</h4>
                                            <ul className="list-disc list-inside space-y-1 pl-4 text-gray-600">
                                                <li>{t.info.specs}</li>
                                            </ul>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // Intro Screen
            if (gameState === 'intro') {
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4 font-sans text-gray-800 relative">
                        <LangSwitcher />
                        <div className="max-w-xl bg-white p-8 rounded-xl shadow-lg w-full text-center">
                            <h1 className="text-3xl font-bold mb-2 text-indigo-700 flex items-center justify-center gap-3">
                                <Eye className="w-10 h-10" />
                                {t.title}
                            </h1>
                            <p className="text-gray-500 mb-8">{t.subtitle}</p>
                            
                            <div className="space-y-4 text-left max-w-sm mx-auto mb-8">
                                <div className="bg-indigo-50 p-4 rounded-lg mb-4">
                                    <h3 className="font-bold text-indigo-800 text-sm mb-2 border-b border-indigo-200 pb-1">{t.participantInfo}</h3>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-xs text-gray-600 mb-1" htmlFor="input-participant-id">{t.id}</label>
                                            <input
                                                id="input-participant-id"
                                                name="id"
                                                type="text"
                                                value={participantInfo.id}
                                                onChange={handleParticipantInfoChange}
                                                placeholder={t.placeholderId}
                                                className="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs text-gray-600 mb-1" htmlFor="input-participant-age">{t.age}</label>
                                                <input
                                                    id="input-participant-age"
                                                    name="age"
                                                    type="number"
                                                    value={participantInfo.age}
                                                    onChange={handleParticipantInfoChange}
                                                    placeholder={t.placeholderAge}
                                                    className="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs text-gray-600 mb-1" htmlFor="input-participant-gender">{t.gender}</label>
                                                <select
                                                    id="input-participant-gender"
                                                    name="gender"
                                                    value={participantInfo.gender}
                                                    onChange={handleParticipantInfoChange}
                                                    className="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-white"
                                                >
                                                    <option value="">{t.genderOptions.select}</option>
                                                    <option value="male">{t.genderOptions.male}</option>
                                                    <option value="female">{t.genderOptions.female}</option>
                                                    <option value="other">{t.genderOptions.other}</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <button onClick={startExperiment} className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition flex items-center justify-center gap-2 text-xl cursor-pointer">
                                    <Play className="w-6 h-6" /> {t.startExperiment}
                                </button>
                                
                                <button onClick={() => setGameState('settings')} className="w-full py-2 text-gray-500 hover:text-indigo-600 text-sm font-medium flex items-center justify-center gap-1">
                                    <Settings className="w-4 h-4" /> {t.settings}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Finished Screen
            if (gameState === 'finished') {
                const stats = calculateStats();
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4 font-sans text-gray-800 relative">
                        <LangSwitcher />
                        <div className="max-w-2xl w-full bg-white p-8 rounded-xl shadow-lg">
                            <h2 className="text-3xl font-bold mb-6 text-center text-gray-800">{t.finished.title}</h2>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-red-50 p-4 rounded text-center border border-red-100">
                                    <div className="text-sm text-red-800 mb-1">{t.finished.flicker}</div>
                                    <div className="text-3xl font-bold text-red-600">{stats.flickerAvg} ms</div>
                                </div>
                                <div className="bg-green-50 p-4 rounded text-center border border-green-100">
                                    <div className="text-sm text-green-800 mb-1">{t.finished.noFlicker}</div>
                                    <div className="text-3xl font-bold text-green-600">{stats.noFlickerAvg} ms</div>
                                </div>
                            </div>

                            <div className="flex flex-col gap-3">
                                <button 
                                    onClick={handleSaveData}
                                    disabled={saveStatus === 'saving' || saveStatus === 'success'}
                                    className={`w-full py-3 font-bold rounded-lg shadow transition flex items-center justify-center gap-2 ${saveStatus === 'success' ? 'bg-green-600 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}
                                >
                                    {saveStatus === 'saving' ? (
                                        <span>{t.finished.saving}</span>
                                    ) : saveStatus === 'success' ? (
                                        <> <Check className="w-5 h-5" /> {t.finished.saveComplete} ({config.saveMode.toUpperCase()}) </>
                                    ) : (
                                        <> 
                                            {config.saveMode === 'csv' ? <Download className="w-5 h-5"/> : <Server className="w-5 h-5"/>}
                                            {config.saveMode === 'csv' ? t.finished.downloadCsv : `${t.finished.sendTo} ${config.saveMode.toUpperCase()}`}
                                        </>
                                    )}
                                </button>

                                <button 
                                    onClick={() => { setGameState('intro'); setParticipantInfo({id:'', age:'', gender:''}); setSaveStatus('idle'); }}
                                    className="w-full py-3 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-lg shadow transition flex items-center justify-center gap-2"
                                >
                                    <RotateCcw className="w-5 h-5" /> {t.finished.backToTitle}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Playing Screen
            return (
                <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4 font-sans relative">
                    <LangSwitcher />
                    <div className="bg-white p-4 rounded-xl shadow-xl flex flex-col items-center relative">
                        <div className="w-full flex justify-between items-center mb-4 px-2">
                            <div className="text-gray-500 font-medium text-sm">
                                {participantInfo.id || t.playing.guest} | {t.playing.trial}: {currentTrialIndex + 1}/{config.trialsPerCondition * 2}
                            </div>
                            <div className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600">
                                {t.playing.instruction}
                            </div>
                        </div>

                        <div className="relative border-2 border-gray-200 rounded-lg overflow-hidden cursor-crosshair bg-[#f3f4f6]">
                            <canvas
                                ref={canvasRef}
                                width={600}
                                height={400}
                                onClick={handleCanvasClick}
                                className="block w-full max-w-[600px] h-auto"
                            />
                            {gameState === 'feedback' && feedback && (
                                <div className="absolute inset-0 bg-white/80 flex flex-col items-center justify-center animate-in fade-in duration-200">
                                    <CheckCircle className="w-12 h-12 text-green-500 mb-2" />
                                    <p className="text-xl font-bold text-gray-800">{feedback.time} ms</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChangeBlindnessApp />);
    </script>
</body>
</html>
