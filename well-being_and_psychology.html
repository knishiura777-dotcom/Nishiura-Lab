<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Well-being & Psychology | Nishiura Lab</title>
    <meta name="description" content="西浦和樹研究室のウェルビーイング研究とICTツール紹介。Stockholm School of Economics (CWWH) との連携による幸福感の科学的アプローチ。">
    
    <!-- Fonts: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                        serif: ['"Cinzel"', '"Noto Serif JP"', 'serif'],
                        body: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Sky blue for Well-being theme
                            600: '#0284c7',
                            900: '#0c4a6e',
                        },
                        accent: {
                            500: '#f59e0b', // Amber for warmth
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'hover': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.01)',
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            background-color: #f8fafc;
            color: #334155;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Sweden Flag colors gradient text */
        .text-gradient-sweden {
            background: linear-gradient(90deg, #006AA7 0%, #FECC00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons (Lucide-like SVG) ---
        const Icon = ({ path, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const icons = {
            arrowLeft: <><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></>,
            search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
            play: <><polygon points="5 3 19 12 5 21 5 3"/></>,
            heart: <><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></>,
            sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>,
            brain: <><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></>,
            smile: <><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></>,
            messageCircle: <><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></>,
            activity: <><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></>,
            leaf: <><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.77 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></>,
            globe: <><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>,
            users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
            check: <><polyline points="20 6 9 17 4 12"/></>,
            externalLink: <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>
        };

        // --- Translations ---
        const translations = {
            ja: {
                pageTitle: "Well-being & Psychology",
                heroTitle: "Science of Well-being",
                heroSub: "幸福の科学とデザイン",
                heroDesc: "北欧スウェーデンの知見と、最新の心理学・ICTを融合。\n個人のウェルビーイングを高め、より良い社会システムを構築するための研究と実践。",
                cwwhTitle: "Stockholm School of Economics",
                cwwhSub: "Center for Well-being, Welfare and Happiness (CWWH)",
                cwwhDesc: "ストックホルム商科大学にあるCWWHは、経済的指標だけでなく「幸福」を社会の重要な指標として研究する世界的な拠点です。当研究室はCWWHと連携し、エビデンスに基づいたウェルビーイング向上メソッドの教育応用を探求しています。",
                toolsTitle: "ICT Tools for Well-being",
                toolsDesc: "心理学的な知見に基づき開発された、セルフケアやメンタルヘルス支援のためのWebアプリケーション。",
                startBtn: "ツールを開く",
                readMore: "詳細を見る",
                footerRights: "Nishiura Laboratory. All rights reserved.",
                cat_Counseling: "カウンセリング",
                cat_Mindfulness: "マインドフルネス",
                cat_Assessment: "アセスメント",
                diff_Easy: "誰でも",
                diff_Medium: "対話型",
                comingSoon: "準備中",
                alertMsg: "現在開発中です。公開をお待ちください。",
            },
            en: {
                pageTitle: "Well-being & Psychology",
                heroTitle: "Science of Well-being",
                heroSub: "Science & Design of Happiness",
                heroDesc: "Fusing Nordic/Swedish insights with modern psychology and ICT.\nResearch and practice to enhance individual well-being and build better social systems.",
                cwwhTitle: "Stockholm School of Economics",
                cwwhSub: "Center for Well-being, Welfare and Happiness (CWWH)",
                cwwhDesc: "The CWWH at the Stockholm School of Economics is a global hub researching 'happiness' as a key societal indicator beyond economic metrics. Our lab collaborates with CWWH to explore educational applications of evidence-based well-being methods.",
                toolsTitle: "ICT Tools for Well-being",
                toolsDesc: "Web applications for self-care and mental health support, developed based on psychological insights.",
                startBtn: "Open Tool",
                readMore: "Read More",
                footerRights: "Nishiura Laboratory. All rights reserved.",
                cat_Counseling: "Counseling",
                cat_Mindfulness: "Mindfulness",
                cat_Assessment: "Assessment",
                diff_Easy: "Easy",
                diff_Medium: "Interactive",
                comingSoon: "Coming Soon",
                alertMsg: "Currently under development.",
            },
            se: {
                pageTitle: "Välbefinnande & Psykologi",
                heroTitle: "Science of Well-being",
                heroSub: "Vetenskap & Design av Lycka",
                heroDesc: "Förenar nordiska insikter med modern psykologi och IKT.\nForskning och praktik för att öka individens välbefinnande och bygga bättre sociala system.",
                cwwhTitle: "Handelshögskolan i Stockholm",
                cwwhSub: "Center for Well-being, Welfare and Happiness (CWWH)",
                cwwhDesc: "CWWH vid Handelshögskolan i Stockholm är ett globalt nav som forskar om 'lycka' som en viktig samhällsindikator utöver ekonomiska mått. Vårt labb samarbetar med CWWH för att utforska pedagogiska tillämpningar av evidensbaserade välbefinnandemetoder.",
                toolsTitle: "IKT-verktyg för Välbefinnande",
                toolsDesc: "Webbapplikationer för egenvård och mentalt stöd, utvecklade baserat på psykologiska insikter.",
                startBtn: "Öppna Verktyg",
                readMore: "Läs Mer",
                footerRights: "Nishiura Laboratory. Med ensamrätt.",
                cat_Counseling: "Rådgivning",
                cat_Mindfulness: "Mindfulness",
                cat_Assessment: "Bedömning",
                diff_Easy: "Lätt",
                diff_Medium: "Interaktiv",
                comingSoon: "Kommer snart",
                alertMsg: "Under utveckling.",
            }
        };

        // --- Data ---
        const toolsData = [
            { 
                id: 1, 
                title: { ja: "AI心理相談ロールプレイ", en: "AI Counseling Roleplay", se: "AI Rådgivning Rollspel" },
                category: "cat_Counseling", 
                type: "Interactive AI", 
                difficulty: "diff_Medium", 
                description: {
                    ja: "ロジャーズやユングなど、著名な心理療法家のペルソナを持つAIとの対話を通じて、悩み相談やカウンセリングの練習を行うことができます。",
                    en: "Practice counseling or discuss worries through dialogue with AI personas of famous psychotherapists like Rogers and Jung.",
                    se: "Öva rådgivning eller diskutera bekymmer genom dialog med AI-personligheter av kända psykoterapeuter som Rogers och Jung."
                },
                icon: "messageCircle", 
                link: "./AI_counceling_roleplay.html" 
            },
            { 
                id: 2, 
                title: { ja: "毎日の感謝ジャーナル", en: "Gratitude Journal", se: "Tacksamhetsdagbok" },
                category: "cat_Mindfulness", 
                type: "Self-Care", 
                difficulty: "diff_Easy", 
                description: {
                    ja: "「Three Good Things」の実践。1日の終わりに良かったことを3つ記録し、ポジティブな感情への注意を向けるトレーニングです。（デモ版）",
                    en: "Practice 'Three Good Things'. Record three good things at the end of the day to train attention towards positive emotions. (Demo)",
                    se: "Öva 'Tre bra saker'. Registrera tre bra saker i slutet av dagen för att träna uppmärksamhet mot positiva känslor. (Demo)"
                },
                icon: "sun", 
                link: null 
            },
            { 
                id: 3, 
                title: { ja: "SOC・レジリエンス測定", en: "SOC & Resilience Check", se: "SOC & Resilienscheck" },
                category: "cat_Assessment", 
                type: "Survey", 
                difficulty: "diff_Easy", 
                description: {
                    ja: "首尾一貫感覚（Sense of Coherence）とストレス対処力を測定する簡易チェックツール。自分のストレス耐性の特徴を知ることができます。（準備中）",
                    en: "A simple check tool to measure Sense of Coherence (SOC) and stress coping skills. Understand your stress tolerance characteristics. (Coming Soon)",
                    se: "Ett enkelt verktyg för att mäta känsla av sammanhang (KASAM) och stresshanteringsförmåga. Förstå dina stresstoleransegenskaper. (Kommer snart)"
                },
                icon: "activity", 
                link: null 
            }
        ];

        // --- Components ---
        const LanguageSwitcher = ({ currentLang, setLang }) => (
            <div className="flex items-center gap-2 text-xs font-bold tracking-widest">
                <button 
                    onClick={() => setLang('en')} 
                    className={`hover:text-brand-600 transition-colors ${currentLang === 'en' ? 'text-brand-600 underline underline-offset-4' : 'text-slate-400'}`}
                >
                    EN
                </button>
                <span className="text-slate-300">|</span>
                <button 
                    onClick={() => setLang('ja')} 
                    className={`hover:text-brand-600 transition-colors ${currentLang === 'ja' ? 'text-brand-600 underline underline-offset-4' : 'text-slate-400'}`}
                >
                    JP
                </button>
                <span className="text-slate-300">|</span>
                <button 
                    onClick={() => setLang('se')} 
                    className={`hover:text-brand-600 transition-colors ${currentLang === 'se' ? 'text-brand-600 underline underline-offset-4' : 'text-slate-400'}`}
                >
                    SE
                </button>
            </div>
        );

        const ToolCard = ({ data, index, lang, t }) => {
            const delayStyle = { animationDelay: `${index * 0.1}s` };
            
            const content = (
                <>
                    {/* Icon & Tag */}
                    <div className="flex justify-between items-start mb-6">
                        <div className={`p-3 rounded-xl transition-colors duration-500 ${data.link ? 'bg-brand-50 text-brand-600 group-hover:bg-brand-100 group-hover:text-brand-700' : 'bg-slate-50 text-slate-300'}`}>
                            <Icon path={icons[data.icon]} size={28} />
                        </div>
                        <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 bg-slate-50 px-2 py-1 rounded-md">
                            {t[data.category]}
                        </span>
                    </div>

                    {/* Text */}
                    <div className="flex-grow">
                        <h3 className="text-xl font-serif font-semibold text-slate-900 mb-3 leading-tight group-hover:text-brand-700 transition-colors">
                            {data.title[lang]}
                        </h3>
                        <p className="text-sm text-slate-500 leading-relaxed font-body mb-6 line-clamp-3 whitespace-pre-wrap">
                            {data.description[lang]}
                        </p>
                    </div>

                    {/* Footer */}
                    <div className="pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                        <div className="flex items-center gap-4">
                            <span className="flex items-center gap-1.5">
                                <Icon path={icons.leaf} size={14} />
                                {data.type}
                            </span>
                        </div>
                        
                        <div className={`flex items-center gap-1 font-bold uppercase tracking-wider transition-all duration-300 ${data.link ? 'text-brand-600 opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0' : 'hidden'}`}>
                            {t.startBtn} <Icon path={icons.play} size={10} className="fill-current" />
                        </div>
                         <div className={`flex items-center gap-1 font-bold uppercase tracking-wider transition-all duration-300 ${!data.link ? 'text-slate-300' : 'hidden'}`}>
                            {t.comingSoon}
                        </div>
                    </div>
                    
                    {/* Hover Line */}
                    <div className={`absolute bottom-0 left-0 w-full h-1 bg-brand-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left ${!data.link && 'hidden'}`}></div>
                </>
            );

            if (data.link) {
                return (
                    <a href={data.link} style={delayStyle} className="group relative bg-white rounded-2xl p-6 border border-slate-100 shadow-soft hover:shadow-hover transition-all duration-500 cursor-pointer animate-fade-up hover:-translate-y-1 flex flex-col h-full overflow-hidden block text-left">
                        {content}
                    </a>
                );
            }
            return (
                <div onClick={() => alert(t.alertMsg)} style={delayStyle} className="group relative bg-white rounded-2xl p-6 border border-slate-100 shadow-soft transition-all duration-500 cursor-not-allowed animate-fade-up flex flex-col h-full overflow-hidden block text-left opacity-80">
                    {content}
                </div>
            );
        };

        function WellbeingPage() {
            const [lang, setLang] = useState("ja");
            
            useEffect(() => {
                const browserLang = navigator.language || navigator.userLanguage;
                if (browserLang.startsWith('en')) setLang('en');
                else if (browserLang.startsWith('sv')) setLang('se');
                else setLang('ja');
            }, []);

            useEffect(() => {
                document.documentElement.lang = lang === 'se' ? 'sv' : lang;
            }, [lang]);

            const t = translations[lang];

            return (
                <div className="min-h-screen pb-24 font-sans bg-slate-50 selection:bg-brand-100 selection:text-brand-900">
                    
                    {/* Header */}
                    <header className="glass sticky top-0 z-50 transition-all duration-300">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <a href="./index.html" className="flex items-center gap-3 text-slate-500 hover:text-slate-900 transition-colors group">
                                <div className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center group-hover:border-slate-400 transition-colors bg-white">
                                    <Icon path={icons.arrowLeft} size={14} />
                                </div>
                                <span className="text-xs font-bold tracking-widest uppercase font-serif">Nishiura Lab.</span>
                            </a>
                            
                            <div className="flex items-center gap-6">
                                <h1 className="text-sm font-serif font-bold tracking-wider text-slate-900 hidden sm:block">
                                    {t.pageTitle.toUpperCase()}
                                </h1>
                                <LanguageSwitcher currentLang={lang} setLang={setLang} />
                            </div>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="relative px-6 py-20 md:py-28 overflow-hidden">
                        {/* Background Decoration */}
                        <div className="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-brand-100/40 to-transparent pointer-events-none"></div>
                        <div className="absolute top-20 right-20 w-64 h-64 bg-accent-500/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div className="max-w-5xl mx-auto relative">
                            <div className="flex flex-col md:flex-row items-center gap-12">
                                <div className="flex-1 text-left">
                                    <span className="inline-block py-1 px-3 rounded-full bg-brand-50 text-brand-600 text-[10px] font-bold tracking-[0.2em] uppercase mb-6 animate-fade-up border border-brand-100">
                                        {t.heroSub}
                                    </span>
                                    <h2 className="text-5xl md:text-7xl font-serif text-slate-900 mb-8 leading-[1.1] animate-fade-up" style={{animationDelay: '0.1s'}}>
                                        {t.heroTitle}
                                    </h2>
                                    <p className="text-slate-600 text-lg leading-loose font-body animate-fade-up whitespace-pre-wrap max-w-lg" style={{animationDelay: '0.2s'}}>
                                        {t.heroDesc}
                                    </p>
                                </div>
                                <div className="flex-1 w-full max-w-md animate-fade-up" style={{animationDelay: '0.3s'}}>
                                    {/* Abstract Visual Representation of Well-being */}
                                    <div className="aspect-square rounded-full border border-slate-200 relative flex items-center justify-center bg-white/50 backdrop-blur-sm">
                                        <div className="absolute inset-4 rounded-full border border-slate-100 animate-[spin_60s_linear_infinite]"></div>
                                        <div className="absolute inset-12 rounded-full border border-slate-100 animate-[spin_40s_linear_infinite_reverse]"></div>
                                        <div className="text-center p-6">
                                            <div className="w-16 h-16 bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                                <Icon path={icons.smile} size={32} />
                                            </div>
                                            <p className="text-sm font-serif italic text-slate-400">"Welfare is not just wealth,<br/>but the quality of life."</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* CWWH Collaboration Section */}
                    <section className="bg-white py-20 border-y border-slate-100">
                        <div className="max-w-5xl mx-auto px-6">
                             <div className="flex flex-col md:flex-row gap-12 items-start animate-fade-up">
                                <div className="md:w-1/3">
                                    <div className="bg-slate-50 p-8 rounded-2xl border border-slate-100 text-center">
                                        <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm text-brand-600">
                                            <Icon path={icons.globe} size={32} />
                                        </div>
                                        <h3 className="font-serif font-bold text-lg mb-2">SSE</h3>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Partner Institute</p>
                                        <div className="w-8 h-1 bg-brand-500 mx-auto rounded-full"></div>
                                    </div>
                                </div>
                                <div className="md:w-2/3">
                                    <h3 className="text-2xl font-serif font-bold text-slate-900 mb-2">
                                        {t.cwwhTitle}
                                    </h3>
                                    <h4 className="text-sm font-bold text-brand-600 uppercase tracking-wider mb-6">
                                        {t.cwwhSub}
                                    </h4>
                                    <p className="text-slate-600 leading-relaxed text-justify mb-6">
                                        {t.cwwhDesc}
                                    </p>
                                    <a href="https://www.hhs.se/en/research/centers/cwwh/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-sm font-bold text-slate-900 hover:text-brand-600 transition-colors border-b border-slate-300 pb-0.5 hover:border-brand-600">
                                        Visit SSE CWWH <Icon path={icons.externalLink} size={14} />
                                    </a>
                                </div>
                             </div>
                        </div>
                    </section>

                    {/* Tools Grid Section */}
                    <section className="max-w-7xl mx-auto px-6 py-20">
                        <div className="text-center mb-16 animate-fade-up">
                            <span className="text-brand-600 text-xs font-bold tracking-[0.2em] uppercase mb-3 block">Applications</span>
                            <h2 className="text-3xl md:text-4xl font-serif text-slate-900 mb-4">{t.toolsTitle}</h2>
                            <p className="text-slate-500 max-w-2xl mx-auto">{t.toolsDesc}</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {toolsData.map((tool, index) => (
                                <ToolCard key={tool.id} data={tool} index={index} lang={lang} t={t} />
                            ))}
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-6 pt-12 border-t border-slate-200 flex flex-col md:flex-row justify-between items-center text-xs text-slate-400 font-sans">
                        <p>&copy; {new Date().getFullYear()} {t.footerRights}</p>
                        <div className="flex gap-6 mt-4 md:mt-0">
                            <a href="#" className="hover:text-slate-600 transition-colors">Privacy</a>
                            <a href="mailto:nishiura@mgu.ac.jp" className="hover:text-slate-600 transition-colors">Contact</a>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WellbeingPage />);
    </script>
</body>
</html>
