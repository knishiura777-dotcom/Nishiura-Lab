          api_key_link: 'Hämta API-nyckel (Google AI Studio)',

          ethics_title: 'Etik & Villkor',
          ethics_desc: 'Denna app är endast för rollspel. Det är INTE medicinsk rådgivning.',
          ethics_agree: 'Godkänn & Starta',

          freud: { name: 'Freud', fullName: 'Sigmund Freud', title: 'Psykoanalys', desc: 'Det förflutna & Omedvetna', prompt: 'Fokusera på hur nuvarande problem relaterar till tidigare erfarenheter och dolda känslor. Använd en något analytisk och intellektuell ton.' },
          default: { name: 'Standard AI', fullName: 'Standard AI', title: 'Integrerad', desc: 'Balanserad metod', prompt: 'Baserat på empati och aktivt lyssnande, föreslå perspektiv vid behov. Tala i en balanserad, artig och vänlig ton.' }

        clients: [
          { name: 'Lina', age: '20-årsåldern', type: 'Instabil', intro: 'Ehm... ingen förstår mig... Du kommer bara att ignorera mig också, eller hur?', prompt: 'Personlighet: Känslomässigt instabil, beroende. Situation: Panik för att pojkvännen inte svarar. Beteende: Misstänksam först, men blir överdrivet beroende om hon behandlas vänligt.' },

          { name: 'Tatsuya', age: '30-årsåldern', type: 'Robotliknande', intro: '...Min fru lämnade mig. Det är inte ett rationellt beslut. Det finns inget kontraktsbrott. Varför?', prompt: 'Personlighet: Hyperlogisk, låg empati. Situation: Skilsmässokris men kan inte förstå känslomässiga skäl. Beteende: Platt ton. Använder ord som "effektivitet" och "definition".' },
          { name: 'Momoko', age: '20-årsåldern', type: 'Andlig', intro: 'Jag såg en lila aura igår. Det sitter en liten älva på din rygg också...', prompt: 'Personlighet: Andlig, unik världsbild. Situation: Flyr verkligheten till andliga förklaringar. Beteende: Använder ord som "vibrationer" och "universum".' }

    // ----------------------------------------
    // コンポーネント本体
    // ----------------------------------------

    function CounselingBotMultilingual() {
      const [apiKey, setApiKey] = useState('');
      
      // 状態管理
      const [mode, setMode] = useState(MODE.COUNSELOR);
      const [lang, setLang] = useState('ja'); // 'ja' | 'en' | 'sv'
      
      const [hasAgreedToEthics, setHasAgreedToEthics] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [showEthicsModal, setShowEthicsModal] = useState(false);
      const [showModeSwitchModal, setShowModeSwitchModal] = useState(false);
      const [showSummaryModal, setShowSummaryModal] = useState(false);
      const [summaryText, setSummaryText] = useState('');
      const [isSummarizing, setIsSummarizing] = useState(false);
      
      const [settingsTab, setSettingsTab] = useState('settings');

      // 選択中の設定
      const [selectedCounselorId, setSelectedCounselorId] = useState('rogers');
      const [currentClientIndex, setCurrentClientIndex] = useState(null);
      
      // チャット履歴
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [showSafetyModal, setShowSafetyModal] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const messagesEndRef = useRef(null);

      // ヘルパー: 現在の言語のリソースを取得
      const t = RESOURCES[lang].ui;
      const counselorData = RESOURCES[lang].counselors;
      const clientData = RESOURCES[lang].clients;

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      // 初期メッセージ設定（初回のみ）
      useEffect(() => {
        if (messages.length === 0 && mode === MODE.COUNSELOR) {
          setMessages([{
            role: 'model',
            text: t.initial_greeting
          }]);
        } else if (messages.length === 0 && mode === MODE.CLIENT) {
          pickRandomClient();
        }
      }, [mode]);

      // 言語変更時に初期挨拶を即座に書き換える
      useEffect(() => {
        setMessages(prev => {
          if (prev.length === 0) return prev;
          
          const firstMsg = prev[0];
          // 全言語のinitial_greetingリストを作成
          const allGreetings = Object.values(RESOURCES).map(r => r.ui.initial_greeting);
          
          // もし先頭のメッセージがいずれかの言語の挨拶と一致すれば、現在の言語に置換
          if (allGreetings.includes(firstMsg.text)) {
            const newMessages = [...prev];
            newMessages[0] = { ...firstMsg, text: RESOURCES[lang].ui.initial_greeting };
            return newMessages;
          }
          return prev;
        });
      }, [lang]);

      // 同意状態監視
      useEffect(() => {
        if (hasAgreedToEthics && !apiKey) {
          setShowSettings(true);
        }
      }, [hasAgreedToEthics, apiKey]);

      // クライエント選出
      const pickRandomClient = () => {
        const randomIndex = Math.floor(Math.random() * clientData.length);
        setCurrentClientIndex(randomIndex);
        const client = clientData[randomIndex];
        setMessages([{
          role: 'model',
          text: `${t.room_entry} ${client.name} (${client.age} / ${client.type})\n\n「${client.intro}」`
        }]);
      };

      // 言語切り替えハンドラ
      const cycleLanguage = () => {
        const langs = ['ja', 'en', 'sv'];
        const nextIdx = (langs.indexOf(lang) + 1) % langs.length;
        setLang(langs[nextIdx]);
      };

      const EMERGENCY_PATTERNS = [
        /死にたい|消えたい|自殺|希死念慮|もう終わり|楽になりたい|いなくなりたい/,
        /殺したい|他人を傷つけたい|暴力|刺す|殴る/,
        /DV|虐待|性暴力|レイプ|オーバードーズ|OD/,
        /kill myself|suicide|want to die|hurt myself/,
        /döda mig|självmord|vill dö|skada mig/
      ];

      const looksEmergency = (text) => {
        return EMERGENCY_PATTERNS.some((re) => re.test(text));
      };

      const handleModeSwitchClick = () => {
        setShowModeSwitchModal(true);
      };

      const executeModeSwitch = () => {
        const newMode = mode === MODE.COUNSELOR ? MODE.CLIENT : MODE.COUNSELOR;
        setMode(newMode);
        setMessages([]); // 履歴クリア
        setShowModeSwitchModal(false);
      };

      // プロンプト生成
      const generateSystemPrompt = () => {
        const langName = LANGUAGES[lang]; // '日本語', 'English', etc.
        
        if (mode === MODE.COUNSELOR) {
          const persona = counselorData[selectedCounselorId];
          return `
You are an AI assistant performing a "roleplay" of psychological counseling.
Please act as the counselor "${persona.fullName}".
The user is the client.

[Language Requirement]
You MUST respond in ${langName}.

[Role & Rules]
- Listen to the user and respond based on the selected theory: ${persona.title}.
- Specific Instruction: ${persona.prompt}
- You are NOT a medical professional. Do NOT give medical diagnosis.
- Keep the environment safe and supportive.
          `;
        } else {
          const client = (currentClientIndex !== null) ? clientData[currentClientIndex] : clientData[0];
          return `
You are an AI performing a "roleplay" of psychological counseling as the CLIENT.
Act as a character named "${client.name}".
The user is the counselor.

[Language Requirement]
You MUST respond in ${langName}.

[Role & Rules]
- Character: ${client.prompt}
- Respond to the counselor's questions based on your character (${client.type}).
- If the counselor shows empathy, open up gradually.
- If the counselor is judgmental, close off or get defensive.
- Since this is a roleplay, you may express instability, but avoid overly graphic content.
- Keep responses conversational length.
          `;
        }
      };

      // API呼び出し
      const callGemini = async (history, newText) => {
        try {
          setErrorMessage('');

          if (!apiKey) {
            throw new Error(t.input_placeholder_no_key);
          }

          const contents = history.filter(m => m.role !== 'system').map(msg => ({
            role: msg.role === 'model' ? 'model' : 'user',
            parts: [{ text: msg.text }]
          }));
          
          contents.push({
            role: 'user',
            parts: [{ text: newText }]
          });

          const systemPrompt = generateSystemPrompt();

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: contents,
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error?.message || `HTTP ${response.status}`);
          }

          return data?.candidates?.[0]?.content?.parts?.[0]?.text || "(No response)";
        } catch (error) {
          console.error(error);
          throw error;
        }
      };

      const handleSendMessage = async () => {
        if (!inputText.trim()) return;
        
        const userMsg = inputText.trim();
        setInputText('');
        setErrorMessage('');
        
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setIsLoading(true);

        if (mode === MODE.COUNSELOR && looksEmergency(userMsg)) {
          setTimeout(() => {
            setMessages(prev => [...prev, { role: 'model', text: t.safety_message }]);
            setIsLoading(false);
            setShowSafetyModal(true);
          }, 1000);
          return;
        }

        try {
          const aiResponse = await callGemini(messages, userMsg);
          
          let isEmergencyResponse = false;
          if (mode === MODE.CLIENT && looksEmergency(aiResponse)) {
            isEmergencyResponse = true;
          }

          setMessages(prev => {
            const newMsgs = [...prev, { role: 'model', text: aiResponse }];
            if (isEmergencyResponse) {
              newMsgs.push({ role: 'system', text: t.emergency_warning });
            }
            return newMsgs;
          });

        } catch (e) {
          setErrorMessage(e.message);
          setMessages(prev => [...prev, { role: 'system', text: `⚠️ ${e.message}` }]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      };

      // 要約生成機能
      const handleSummarize = async () => {
        if (!apiKey) {
          alert(t.input_placeholder_no_key);
          return;
        }
        
        setIsSummarizing(true);
        setShowSummaryModal(true);
        setSummaryText(''); // リセット

        try {
          // 要約用のAPIコール
          const historyText = messages.map(m => `${m.role}: ${m.text}`).join('\n');
          const langName = LANGUAGES[lang];
          
          const summaryPrompt = `
以下の会話ログは、AIを用いたカウンセリングのロールプレイ記録です。
カウンセラー視点で、以下の項目を含む簡潔な要約を作成してください。
出力言語: ${langName}

1. 主訴 (Main Complaint)
2. 感情・認知の傾向 (Emotional/Cognitive Patterns)
3. セッションの振り返り (Session Review)

[会話ログ]
${historyText}
          `;

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: summaryPrompt }] }]
            })
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.error?.message || 'Error generating summary');
          
          const result = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          setSummaryText(result || "Failed to generate summary.");

        } catch (e) {
          setSummaryText(`Error: ${e.message}`);
        } finally {
          setIsSummarizing(false);
        }
      };

      const downloadLogs = () => {
        const logData = {
          timestamp: new Date().toISOString(),
          language: lang,
          mode: mode,
          persona: mode === MODE.COUNSELOR ? counselorData[selectedCounselorId].name : clientData[currentClientIndex || 0].name,
          messages: messages
        };
        
        const blob = new Blob([JSON.stringify(logData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `counseling-log-${lang}-${new Date().getTime()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // 背景色の決定
      const bgColor = mode === MODE.COUNSELOR ? 'bg-stone-50' : 'bg-slate-50';
      const headerColor = mode === MODE.COUNSELOR ? 'bg-teal-700' : 'bg-indigo-700';

      return (
        <div className={`flex flex-col h-screen ${bgColor} text-stone-800 font-sans relative`}>
          
          {/* ヘッダー */}
          <header className={`${headerColor} text-white p-3 shadow-sm z-20 transition-colors duration-500`}>
            <div className="flex justify-between items-center mb-1">
              <div className="flex items-center gap-2">
                <HeartHandshake className="w-6 h-6" />
                <h1 className="font-bold text-lg hidden md:block">
                  {mode === MODE.COUNSELOR ? t.title_counselor : t.title_client}
                </h1>
                <h1 className="font-bold text-lg md:hidden">
                  {mode === MODE.COUNSELOR ? t.mode_counselor : t.mode_client}
                </h1>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={cycleLanguage}
                  className="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-2 rounded-full flex items-center gap-1 transition-colors border border-white/40"
                  title="Change Language"
                >
                  <Globe size={12} />
                  <span className="font-bold ml-1">{LANGUAGES[lang].substring(0,2).toUpperCase()}</span>
                </button>

                <button 
                  onClick={handleSummarize}
                  className="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-2 rounded-full flex items-center gap-1 transition-colors border border-white/40"
                  title={t.summarize_btn}
                >
                  <ClipboardList size={14} />
                  <span className="hidden lg:inline ml-1">{t.summarize_btn}</span>
                </button>

                <button 
                  onClick={handleModeSwitchClick}
                  className="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-2 rounded-full flex items-center gap-1 transition-colors border border-white/40"
                  title={mode === MODE.COUNSELOR ? t.switch_to_practice : t.switch_to_counsel}
                >
                  <ArrowRightLeft size={14} />
                  <span className="hidden lg:inline ml-1">
                    {mode === MODE.COUNSELOR ? t.switch_to_practice : t.switch_to_counsel}
                  </span>
                </button>
                <button 
                  onClick={() => setShowSettings(true)}
                  className="bg-black/20 hover:bg-black/30 text-white p-2 rounded-full transition-colors relative"
                  title={t.settings}
                >
                  <Settings size={20} />
                </button>
                <button 
                  onClick={() => setShowEthicsModal(true)}
                  className="bg-black/20 hover:bg-black/30 text-white p-2 rounded-full transition-colors"
                  title={t.ethics}
                >
                  <ShieldCheck size={20} />
                </button>
              </div>
            </div>
            
            {/* サブヘッダー情報 */}
            <div className="flex justify-between items-center text-xs text-white/90 px-1">
              <div className="flex items-center gap-1">
                <UserCheck size={14} />
                {mode === MODE.COUNSELOR ? (
                  <span>{t.role_you_client}</span>
                ) : (
                  <span>{t.role_you_counselor}</span>
                )}
              </div>
              <div className="flex items-center gap-1">
                <Bot size={14} />
                {mode === MODE.COUNSELOR ? (
                  <span>{t.partner}: {counselorData[selectedCounselorId].fullName}</span>
                ) : (
                  <span>{t.partner}: {currentClientIndex !== null ? clientData[currentClientIndex].name : t.preparing}</span>
                )}
              </div>
            </div>
          </header>

          {/* ペルソナ選択バー (COUNSELORモード時) */}
          {mode === MODE.COUNSELOR && (
            <div className="bg-stone-200 p-2 overflow-x-auto z-10 shadow-inner flex gap-2 no-scrollbar">
              <span className="text-xs font-bold text-stone-500 self-center whitespace-nowrap mr-1">{t.designate}</span>
              {Object.entries(counselorData).map(([key, persona]) => {
                const isActive = selectedCounselorId === key;
                return (
                  <button
                    key={key}
                    onClick={() => {
                       setSelectedCounselorId(key);
                    }}
                    className={`
                      flex items-center gap-2 px-3 py-2 rounded-full text-xs font-bold transition-all whitespace-nowrap
                      ${isActive ? 'bg-teal-600 text-white shadow-md scale-105' : 'bg-white text-stone-600 border border-stone-300 hover:bg-stone-50'}
                    `}
                  >
                    {persona.name}
                  </button>
                );
              })}
            </div>
          )}

          {/* クライエント操作バー (CLIENTモード時) */}
          {mode === MODE.CLIENT && (
            <div className="bg-slate-200 p-2 z-10 shadow-inner flex justify-between items-center">
              <div className="text-xs text-slate-600 font-bold flex items-center gap-2">
                <Users size={14} />
                <span>{t.partner}: {currentClientIndex !== null ? clientData[currentClientIndex].name : ''}</span>
              </div>
              <button 
                onClick={() => pickRandomClient()}
                className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-full shadow-sm flex items-center gap-1"
              >
                <RefreshCw size={12} /> {t.next_client}
              </button>
            </div>
          )}

          {/* エラー表示バー */}
          {errorMessage && (
            <div className="bg-red-100 text-red-700 p-2 text-sm text-center border-b border-red-200 flex justify-between items-center px-4">
              <span>{errorMessage}</span>
              <button onClick={() => setErrorMessage('')}><X size={16} /></button>
            </div>
          )}

          {/* チャットエリア */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-stone-100/50">
            {messages.map((msg, index) => (
              <div 
                key={index} 
                className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
              >
                 {msg.role === 'system' ? (
                   <div className="w-full flex justify-center my-2">
                     <div className="text-xs text-stone-600 bg-stone-200 px-3 py-1 rounded-full flex items-center gap-1 shadow-sm border border-stone-300">
                       <Sparkles size={12} />
                       {msg.text}
                     </div>
                   </div>
                 ) : (
                  <div className={`flex max-w-[85%] md:max-w-[70%] gap-2 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-1 shadow-sm ${
                      msg.role === 'user' 
                        ? (mode === MODE.COUNSELOR ? 'bg-teal-600 text-white' : 'bg-indigo-600 text-white') 
                        : 'bg-white text-stone-600 border border-stone-200'
                    }`}>
                      {msg.role === 'user' ? <User size={16} /> : <Bot size={18} />}
                    </div>
                    <div className={`p-3.5 rounded-2xl shadow-sm text-sm md:text-base leading-relaxed whitespace-pre-wrap ${
                      msg.role === 'user' 
                        ? (mode === MODE.COUNSELOR ? 'bg-teal-600 text-white rounded-tr-none' : 'bg-indigo-600 text-white rounded-tr-none')
                        : 'bg-white text-stone-800 rounded-tl-none border border-stone-200'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                 )}
              </div>
            ))}
            
            {isLoading && (
              <div className="flex justify-start">
                <div className="flex gap-2 max-w-[80%]">
                  <div className="w-8 h-8 rounded-full bg-white text-stone-500 border border-stone-200 flex items-center justify-center mt-1">
                    <Bot size={18} />
                  </div>
                  <div className="bg-white p-3 rounded-2xl rounded-tl-none border border-stone-200 flex items-center gap-1">
                    <span className="w-2 h-2 bg-stone-400 rounded-full animate-bounce"></span>
                    <span className="w-2 h-2 bg-stone-400 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></span>
                    <span className="w-2 h-2 bg-stone-400 rounded-full animate-bounce" style={{ animationDelay: '0.4s' }}></span>
                  </div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* 入力エリア */}
          <div className="bg-white p-3 border-t border-stone-200 shadow-lg z-10">
            <div className="max-w-4xl mx-auto flex items-end gap-2">
              <textarea
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder={
                  !apiKey ? t.input_placeholder_no_key :
                  mode === MODE.COUNSELOR 
                    ? t.input_placeholder_counselor 
                    : t.input_placeholder_client
                }
                disabled={!apiKey}
                className={`flex-1 bg-stone-100 border-0 rounded-xl p-3 focus:ring-2 focus:outline-none resize-none min-h-[50px] max-h-[120px] disabled:bg-stone-200 disabled:text-stone-400 transition-colors ${
                  mode === MODE.COUNSELOR ? 'focus:ring-teal-500' : 'focus:ring-indigo-500'
                }`}
                rows={1}
              />
              <button
                onClick={handleSendMessage}
                disabled={!inputText.trim() || isLoading || !apiKey}
                className={`p-3 rounded-full text-white shadow-md disabled:bg-stone-300 disabled:cursor-not-allowed transition-all ${
                  mode === MODE.COUNSELOR 
                    ? 'bg-teal-600 hover:bg-teal-700' 
                    : 'bg-indigo-600 hover:bg-indigo-700'
                }`}
              >
                <Send size={20} />
              </button>
            </div>
          </div>

          {/* モード切替確認モーダル */}
          {showModeSwitchModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[80] p-4 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden">
                <div className={`p-4 text-white text-center ${mode === MODE.COUNSELOR ? 'bg-indigo-600' : 'bg-teal-600'}`}>
                  <RefreshCw className="w-8 h-8 mx-auto mb-2 opacity-90" />
                  <h3 className="font-bold text-lg">{t.confirm_switch_title}</h3>
                </div>
                
                <div className="p-6 text-center">
                  <p className="text-stone-700 mb-4">
                    {mode === MODE.COUNSELOR 
                      ? t.confirm_switch_desc_to_client
                      : t.confirm_switch_desc_to_counselor
                    }
                  </p>
                  <p className="text-xs text-red-500 bg-red-50 p-2 rounded border border-red-100">
                    {t.confirm_reset_warn}
                  </p>
                </div>

                <div className="flex border-t border-stone-100">
                  <button 
                    onClick={() => setShowModeSwitchModal(false)}
                    className="flex-1 py-4 text-stone-500 hover:bg-stone-50 font-bold transition-colors border-r border-stone-100"
                  >
                    {t.cancel}
                  </button>
                  <button 
                    onClick={executeModeSwitch}
                    className={`flex-1 py-4 text-white font-bold transition-colors ${mode === MODE.COUNSELOR ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-teal-600 hover:bg-teal-700'}`}
                  >
                    {t.switch}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 要約モーダル */}
          {showSummaryModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[90] p-4 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                <div className="bg-stone-100 p-4 border-b border-stone-200 flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <div className="bg-teal-600 p-1.5 rounded-lg text-white">
                      <ClipboardList size={18} />
                    </div>
                    <h3 className="font-bold text-stone-800">{t.summary_title}</h3>
                  </div>
                  <button onClick={() => setShowSummaryModal(false)} className="text-stone-500 hover:text-stone-700">
                    <X size={20} />
                  </button>
                </div>
                
                <div className="p-6 flex-1 overflow-y-auto bg-stone-50">
                  {isSummarizing ? (
                    <div className="flex flex-col items-center justify-center h-48 gap-3 text-stone-500">
                      <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-teal-600"></div>
                      <p>{t.summary_generating}</p>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <p className="text-sm text-stone-500">{t.summary_intro}</p>
                      <div className="bg-white border border-stone-200 rounded-lg p-4 text-sm leading-relaxed whitespace-pre-wrap font-sans text-stone-800 shadow-sm">
                        {summaryText}
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-4 border-t border-stone-200 bg-white flex justify-between items-center">
                  <button 
                    onClick={() => setShowSummaryModal(false)}
                    className="text-stone-500 hover:text-stone-700 text-sm font-bold px-4"
                  >
                    {t.summary_close}
                  </button>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(summaryText);
                      alert('Copied!');
                    }}
                    disabled={isSummarizing || !summaryText}
                    className="bg-teal-600 hover:bg-teal-700 disabled:bg-stone-300 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors"
                  >
                    <Copy size={16} />
                    {t.summary_copy}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 初期同意画面 */}
          {!hasAgreedToEthics && (
            <div className="fixed inset-0 bg-stone-900/95 z-[100] flex items-center justify-center p-4 animate-in fade-in duration-300">
              <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-gradient-to-r from-teal-600 to-indigo-600 p-6 text-center text-white relative">
                  
                  <div className="absolute top-4 right-4">
                    <button 
                      onClick={cycleLanguage}
                      className="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1 transition-colors border border-white/40"
                    >
                      <Globe size={12} />
                      <span className="ml-1">{LANGUAGES[lang]}</span>
                    </button>
                  </div>

                  <BookOpen className="w-10 h-10 mx-auto mb-3 opacity-90" />
                  <h1 className="text-2xl font-bold mb-1">AI Therapy Roleplay</h1>
                  <p className="opacity-90 text-sm">Roleplay Tool</p>
                </div>
                
                <div className="p-6 space-y-5 overflow-y-auto flex-1 text-sm text-stone-700 leading-relaxed">
                  <p className="font-bold text-center text-lg text-stone-800">
                    {t.ethics_title}
                  </p>

                  <div className="bg-amber-50 border border-amber-200 p-4 rounded-lg text-amber-900">
                    <h4 className="font-bold mb-2 flex items-center gap-2">
                      <Info size={18} /> Roleplay Only
                    </h4>
                    <p>{t.ethics_desc}</p>
                  </div>
                </div>

                <div className="p-6 border-t border-stone-100 bg-stone-50">
                  <button 
                    onClick={() => setHasAgreedToEthics(true)}
                    className="w-full bg-gradient-to-r from-teal-600 to-indigo-600 hover:from-teal-700 hover:to-indigo-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2"
                  >
                    <CheckCircle size={20} />
                    {t.ethics_agree}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 設定・管理モーダル */}
          {showSettings && (
            <div className="absolute inset-0 bg-stone-100/95 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4 animate-in fade-in duration-200">
              <div className="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full border border-stone-200 flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-start mb-4">
                  <h2 className="text-xl font-bold text-stone-800 flex items-center gap-2">
                    <Settings className="text-stone-500" /> {t.settings}
                  </h2>
                  {apiKey && (
                    <button onClick={() => setShowSettings(false)} className="text-stone-400 hover:text-stone-600">
                      <X size={24} />
                    </button>
                  )}
                </div>

                <div className="flex border-b border-stone-200 mb-4">
                  <button 
                    onClick={() => setSettingsTab('settings')}
                    className={`flex-1 py-2 text-sm font-bold border-b-2 transition-colors ${settingsTab === 'settings' ? 'border-teal-600 text-teal-700' : 'border-transparent text-stone-400 hover:text-stone-600'}`}
                  >
                    {t.tab_basic}
                  </button>
                  <button 
                    onClick={() => setSettingsTab('admin')}
                    className={`flex-1 py-2 text-sm font-bold border-b-2 transition-colors ${settingsTab === 'admin' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-stone-400 hover:text-stone-600'}`}
                  >
                    {t.tab_admin}
                  </button>
                </div>

                <div className="space-y-6 flex-1 overflow-y-auto pr-1">
                  {settingsTab === 'settings' && (
                    <>
                      <p className="text-sm text-stone-600">{t.api_key_desc}</p>
                      
                      <a 
                        href="https://aistudio.google.com/app/apikey" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-xs text-teal-600 hover:text-teal-800 flex items-center gap-1 w-fit hover:underline mb-2"
                      >
                        {t.api_key_link} <ExternalLink size={12} />
                      </a>

                      <div>
                        <label className="text-xs font-bold text-stone-500 mb-1 block">Gemini API Key</label>
                        <input
                          type="password"
                          value={apiKey}
                          onChange={(e) => setApiKey(e.target.value)}
                          placeholder={t.api_key_placeholder}
                          className="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none font-mono text-sm bg-stone-50"
                        />
                      </div>
                      <button
                        onClick={() => setShowSettings(false)}
                        disabled={!apiKey}
                        className="w-full bg-stone-800 hover:bg-stone-900 disabled:bg-stone-300 text-white font-bold py-3 rounded-lg transition-colors"
                      >
                        {apiKey ? t.save_settings : t.enter_key}
                      </button>
                    </>
                  )}

                  {settingsTab === 'admin' && (
                    <div className="space-y-4">
                      <div className="bg-indigo-50 border border-indigo-100 p-3 rounded-lg text-indigo-900 text-sm">
                        <h4 className="font-bold flex items-center gap-1 mb-1">
                          <Activity size={14} /> {t.admin_dashboard}
                        </h4>
                        <p className="text-xs opacity-80">{t.admin_desc}</p>
                      </div>

                      <div className="space-y-2">
                        <button 
                          onClick={downloadLogs}
                          className="w-full flex items-center justify-between p-3 bg-white border border-stone-200 rounded-lg hover:bg-stone-50 transition-colors text-sm text-stone-700"
                        >
                          <span className="flex items-center gap-2"><Download size={16} /> {t.download_log}</span>
                          <FileText size={14} className="text-stone-400" />
                        </button>
                        <button 
                          onClick={() => {
                            if (window.confirm('Reset?')) {
                              setMessages([]);
                              setShowSettings(false);
                            }
                          }}
                          className="w-full flex items-center justify-between p-3 bg-white border border-red-200 rounded-lg hover:bg-red-50 transition-colors text-sm text-red-600"
                        >
                          <span className="flex items-center gap-2"><Trash2 size={16} /> {t.clear_history}</span>
                        </button>
                      </div>

                      <div className="space-y-2">
                        <label className="text-xs font-bold text-stone-500 block">{t.debug_info}</label>
                        <div className="relative">
                          <pre className="w-full h-32 p-3 bg-stone-800 text-green-400 text-xs font-mono rounded-lg overflow-auto border border-stone-700 whitespace-pre-wrap">
                            {generateSystemPrompt()}
                          </pre>
                          <Code size={14} className="absolute top-2 right-2 text-stone-500" />
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
          
          {/* 倫理ガイドモーダル */}
          {showEthicsModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
               <div className="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden animate-in fade-in zoom-in duration-200">
                <div className="bg-stone-100 p-4 border-b border-stone-200 flex justify-between items-center">
                  <h3 className="text-stone-800 font-bold flex items-center gap-2">
                    <ShieldCheck size={20} /> {t.ethics}
                  </h3>
                  <button onClick={() => setShowEthicsModal(false)} className="text-stone-500 hover:text-stone-700">
                    <X size={20} />
                  </button>
                </div>
                <div className="p-5 space-y-4 max-h-[70vh] overflow-y-auto text-sm text-stone-700">
                  <p>{t.ethics_desc}</p>
                </div>
               </div>
            </div>
          )}

          {/* 緊急連絡先モーダル */}
          {showSafetyModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[70] p-4 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden">
                <div className="bg-red-50 p-4 border-b border-red-100 flex justify-between items-center">
                  <h3 className="text-red-700 font-bold flex items-center gap-2">
                    <AlertTriangle size={20} /> {t.emergency}
                  </h3>
                  <button onClick={() => setShowSafetyModal(false)} className="text-stone-500 hover:text-stone-700">
                    <X size={20} />
                  </button>
                </div>
                <div className="p-5 space-y-4">
                  <p className="text-sm text-stone-600">{t.safety_message}</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CounselingBotMultilingual />);
  </script>
</body>
</html>
