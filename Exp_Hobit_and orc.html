        const gasSampleCode = `function doPost(e) {
  // スプレッドシートを取得
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  
  // 送信されたデータをパース
  // text/plainで送られてくるため、postData.contentsをそのままパース
  var data = JSON.parse(e.postData.contents);
  
  // ヘッダー行がない場合は作成
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(["Timestamp", "ParticipantID", "Date", "MoveCount", "LastAction", "FullLog_JSON"]);
  }
  
  // 履歴から最終状態を取得
  var moveCount = 0;
  var lastAction = "";
  if (data.history && data.history.length > 0) {
    var lastEntry = data.history[data.history.length - 1];
    moveCount = lastEntry.moveCount;
    lastAction = lastEntry.action; // クライアント側で翻訳済みのテキストが送られてくる想定
  }

  // 行を追加
  sheet.appendRow([
    new Date(),               // 受信時刻
    data.participantId,       // 被験者ID
    data.date,                // 実験日時
    moveCount,                // 総手数
    lastAction,               // 最終行動
    JSON.stringify(data.history) // 行動履歴の生JSON
  ]);
  
  // レスポンスを返す
  return ContentService.createTextOutput(JSON.stringify({status: "success"}))
    .setMimeType(ContentService.MimeType.JSON);
}`;

        const HobbitsAndOrcs = () => {
            // 言語設定 ('ja', 'en', 'sv')
            const [language, setLanguage] = useState('ja');
            
            // 画面管理 ('initial', 'playing', 'settings')
            const [screen, setScreen] = useState('initial');
            const [previousScreen, setPreviousScreen] = useState('initial');

            // 設定管理
            const [participantId, setParticipantId] = useState('');
            const [saveConfig, setSaveConfig] = useState({
                method: 'csv', // 'csv', 'gas', 'firebase'
                gasUrl: '',
                firebaseConfig: ''
            });

            // ゲームの状態管理
            const [leftBank, setLeftBank] = useState({ hobbits: 3, orcs: 3 });
            const [rightBank, setRightBank] = useState({ hobbits: 0, orcs: 0 });
            const [boat, setBoat] = useState({ hobbits: 0, orcs: 0 });
            const [boatPosition, setBoatPosition] = useState('left'); 
            
            // メッセージ管理
            const [messageKey, setMessageKey] = useState('status_initial');
            const [messageParams, setMessageParams] = useState({});
            const [tempMessage, setTempMessage] = useState(null);
            
            // 保存中のローディング状態
            const [isSaving, setIsSaving] = useState(false);

            const [gameState, setGameState] = useState('playing'); // 'playing', 'won', 'lost'
            const [moveCount, setMoveCount] = useState(0);
            const [showRules, setShowRules] = useState(false);
            const [showPsychology, setShowPsychology] = useState(false);
            
            // ログ管理
            const [history, setHistory] = useState([]);
            const [showLog, setShowLog] = useState(false);

            // 翻訳ヘルパー
            const t = (key, params = {}) => {
                let text = translations[language][key] || key;
                Object.keys(params).forEach(param => {
                text = text.replace(`{${param}}`, params[param]);
                });
                return text;
            };

            // パラメータ自体も翻訳するアクション解決ヘルパー
            const resolveAction = (key, params) => {
                const translatedParams = { ...params };
                // 'char'パラメータがある場合、それを現在の言語設定で翻訳する
                if (translatedParams.char) {
                translatedParams.char = t(translatedParams.char);
                }
                return t(key, translatedParams);
            };

            // UI用: 短いキャラ名取得 (ボタン等)
            const getCharShortName = (type) => t(type === 'hobbits' ? 'hobbit_short' : 'orc_short');

            const displayMessage = () => {
                if (tempMessage) return t(tempMessage);
                return t(messageKey, messageParams);
            };

            const setTemporaryMessage = (key, msg = "") => {
                if (msg) {
                    setTempMessage(msg);
                } else {
                    setTempMessage(key);
                }
                setTimeout(() => {
                setTempMessage(null);
                }, 4000);
            };

            // 初期化
            const resetGame = () => {
                setLeftBank({ hobbits: 3, orcs: 3 });
                setRightBank({ hobbits: 0, orcs: 0 });
                setBoat({ hobbits: 0, orcs: 0 });
                setBoatPosition('left');
                setMessageKey('status_initial');
                setMessageParams({});
                setTempMessage(null);
                setGameState('playing');
                setMoveCount(0);
                setHistory([]);
                setScreen('playing');
            };

            // タイトル画面へ戻る処理（完全リセット）
            const exitToTitle = () => {
                setLeftBank({ hobbits: 3, orcs: 3 });
                setRightBank({ hobbits: 0, orcs: 0 });
                setBoat({ hobbits: 0, orcs: 0 });
                setBoatPosition('left');
                setMessageKey('status_initial');
                setMessageParams({});
                setTempMessage(null);
                setGameState('playing');
                setMoveCount(0);
                setHistory([]);
                setParticipantId(''); // IDリセット
                setShowLog(false);
                setScreen('initial');
            };

            // 実験終了・ログ保存画面へ誘導
            const finishExperiment = () => {
                setShowLog(true);
                setTemporaryMessage('savePrompt');
            };

            // ゲーム開始
            const startGame = () => {
                resetGame();
            };

            // 設定画面へ
            const openSettings = () => {
                setPreviousScreen(screen);
                setScreen('settings');
            };

            // 設定保存して戻る
            const saveSettingsAndBack = () => {
                setTemporaryMessage('settingsSaved');
                setScreen(previousScreen);
            };

            // ゲームオーバー判定
            useEffect(() => {
                if (gameState !== 'playing') return;

                const checkSafety = (h, o) => {
                if (h > 0 && o > h) return false;
                return true;
                };

                const leftSafe = checkSafety(leftBank.hobbits, leftBank.orcs);
                const rightSafe = checkSafety(rightBank.hobbits, rightBank.orcs);

                if (!leftSafe || !rightSafe) {
                setGameState('lost');
                setMessageKey('status_lost');
                addLog('log_gameover', {}, { leftBank, rightBank, boat, boatPosition, moveCount });
                } else if (rightBank.hobbits === 3 && rightBank.orcs === 3 && boat.hobbits === 0 && boat.orcs === 0) {
                setGameState('won');
                setMessageKey('status_won');
                setMessageParams({ count: moveCount });
                addLog('log_clear', {}, { leftBank, rightBank, boat, boatPosition, moveCount });
                }
            }, [leftBank, rightBank, gameState, moveCount, boat]); 

            // ログ記録用関数
            const addLog = (key, params, newState) => {
                setHistory(prev => {
                    // 重複チェック
                    if (prev.length > 0 && prev[prev.length - 1].actionKey === key && prev[prev.length - 1].moveCount === newState.moveCount) {
                        return prev;
                    }

                    const timestamp = new Date().toLocaleTimeString();
                    return [...prev, {
                        id: prev.length + 1,
                        time: timestamp,
                        moveCount: newState.moveCount,
                        actionKey: key,       // 翻訳キーを保存
                        actionParams: params, // パラメータを保存
                        left: { ...newState.leftBank },
                        right: { ...newState.rightBank },
                        boat: { ...newState.boat },
                        boatPosition: newState.boatPosition
                    }];
                });
            };

            // データエクスポート用に現在の言語で履歴データを変換するヘルパー
            const getExportData = () => {
                return history.map(log => ({
                    ...log,
                    action: resolveAction(log.actionKey, log.actionParams) // 現在の言語でAction列を生成
                }));
            };

            // CSVデータ生成
            const generateCSV = () => {
                const metaData = `ParticipantID,${participantId}\nDate,${new Date().toLocaleString()}\nMethod,${saveConfig.method}\n\n`;
                const header = `Time,MoveCount,Action,Left_Hobbits,Left_Orcs,Right_Hobbits,Right_Orcs,Boat_Hobbits,Boat_Orcs,Boat_Position\n`;
                
                const exportHistory = getExportData();
                const rows = exportHistory.map(row => 
                `${row.time},${row.moveCount},"${row.action}",${row.left.hobbits},${row.left.orcs},${row.right.hobbits},${row.right.orcs},${row.boat.hobbits},${row.boat.orcs},${row.boatPosition}`
                ).join("\n");
                return metaData + header + rows;
            };
            
            const copyLogToClipboard = () => {
                const csvContent = generateCSV();
                const textArea = document.createElement("textarea");
                textArea.value = csvContent;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                document.execCommand('copy');
                setTemporaryMessage('copySuccess');
                } catch (err) {
                setTemporaryMessage('copyFail');
                }
                document.body.removeChild(textArea);
            };

            const downloadLogAsCSV = () => {
                const csvContent = generateCSV();
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                const dateStr = new Date().toISOString().slice(0,19).replace(/T|:/g, '-');
                const pId = participantId ? `_${participantId}` : '';
                link.setAttribute('download', `hobbits_orcs${pId}_${dateStr}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTemporaryMessage('saveSuccess');
            };

            // GASへの送信
            const sendToGAS = async () => {
                if (!saveConfig.gasUrl) {
                setTemporaryMessage('', "Error: GAS URL not configured");
                return;
                }
                
                setIsSaving(true); 

                try {
                const payload = {
                    participantId,
                    date: new Date().toISOString(),
                    history: getExportData() // 翻訳済みの履歴データを送信
                };
                
                await fetch(saveConfig.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain' 
                    },
                    body: JSON.stringify(payload)
                });
                setTemporaryMessage('saveSuccess');
                } catch (error) {
                console.error(error);
                setTemporaryMessage('saveFail', `Error: ${error.message}`);
                } finally {
                setIsSaving(false);
                }
            };

            // Firebaseへの保存
            const saveToFirebase = async () => {
                if (!saveConfig.firebaseConfig) {
                    setTemporaryMessage('', "Error: Firebase Config not set");
                    return;
                }
                
                setIsSaving(true);

                try {
                    const firebaseConfig = JSON.parse(saveConfig.firebaseConfig);
                    
                    let app;
                    if (getApps().length === 0) {
                        app = initializeApp(firebaseConfig);
                    } else {
                        app = getApp(); 
                    }

                    const db = getFirestore(app);
                    
                    await addDoc(collection(db, "experiments"), {
                        participantId,
                        date: new Date().toISOString(),
                        history: getExportData(), // 翻訳済みの履歴データを保存
                        result: gameState,
                        totalMoves: moveCount
                    });
                    
                    setTemporaryMessage('saveSuccess');
                } catch (error) {
                    console.error(error);
                    setTemporaryMessage('saveFail', `Error: ${error.message}`);
                } finally {
                    setIsSaving(false);
                }
            };

            // 保存実行ハンドラ
            const executeSave = () => {
                if (saveConfig.method === 'csv') {
                    downloadLogAsCSV();
                } else if (saveConfig.method === 'gas') {
                    sendToGAS();
                } else if (saveConfig.method === 'firebase') {
                    saveToFirebase();
                }
            };

            const copyGasSample = () => {
                const textArea = document.createElement("textarea");
                textArea.value = gasSampleCode;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                document.execCommand('copy');
                setTemporaryMessage('codeCopied');
                } catch (err) {
                setTemporaryMessage('copyFail');
                }
                document.body.removeChild(textArea);
            };

            // キャラクター移動
            const moveCharacter = (type, direction) => {
                if (gameState !== 'playing') return;

                const nextLeft = { ...leftBank };
                const nextRight = { ...rightBank };
                const nextBoat = { ...boat };
                
                const isLeft = boatPosition === 'left';
                let actionKey = "";
                
                // パラメータとして「翻訳キー」を渡す ('hobbit' または 'orc')
                let charKey = type === 'hobbits' ? 'hobbit' : 'orc';
                let actionParams = { char: charKey };

                if (direction === 'toBoat') {
                if (nextBoat.hobbits + nextBoat.orcs >= 2) {
                    setTemporaryMessage('err_boatFull');
                    return;
                }
                
                if (isLeft && nextLeft[type] > 0) {
                    nextLeft[type]--;
                    nextBoat[type]++;
                    actionKey = 'action_boardLeft';
                } else if (!isLeft && nextRight[type] > 0) {
                    nextRight[type]--;
                    nextBoat[type]++;
                    actionKey = 'action_boardRight';
                } else {
                    return; 
                }
                } else {
                if (nextBoat[type] > 0) {
                    nextBoat[type]--;
                    if (isLeft) {
                    nextLeft[type]++;
                    actionKey = 'action_disembarkLeft';
                    } else {
                    nextRight[type]++;
                    actionKey = 'action_disembarkRight';
                    }
                } else {
                    return;
                }
                }

                setLeftBank(nextLeft);
                setRightBank(nextRight);
                setBoat(nextBoat);
                setTempMessage(null); 

                addLog(actionKey, actionParams, {
                leftBank: nextLeft,
                rightBank: nextRight,
                boat: nextBoat,
                boatPosition: boatPosition,
                moveCount: moveCount
                });
            };

            // ボート移動
            const moveBoat = () => {
                if (gameState !== 'playing') return;

                const totalOnBoat = boat.hobbits + boat.orcs;
                if (totalOnBoat === 0) {
                setTemporaryMessage('err_needsDriver');
                return;
                }

                const nextPosition = boatPosition === 'left' ? 'right' : 'left';
                const nextMoveCount = moveCount + 1;
                const actionKey = boatPosition === 'left' ? 'action_moveRight' : 'action_moveLeft';

                setBoatPosition(nextPosition);
                setMoveCount(nextMoveCount);
                setTempMessage(null);

                addLog(actionKey, {}, {
                leftBank: leftBank,
                rightBank: rightBank,
                boat: boat,
                boatPosition: nextPosition, 
                moveCount: nextMoveCount
                });
            };

            const changeLanguage = (lang) => {
                setLanguage(lang);
            };

            const CharacterIcon = ({ type, count, onClick }) => {
                const icons = [];
                for (let i = 0; i < count; i++) {
                icons.push(
                    <div 
                    key={`${type}-${i}`} 
                    onClick={onClick}
                    className={`
                        cursor-pointer transition-all duration-300 transform hover:scale-110 active:scale-95
                        flex flex-col items-center justify-center m-1 p-2 rounded-lg shadow-sm
                        ${type === 'hobbits' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200'}
                        border-2
                    `}
                    >
                    {type === 'hobbits' ? <User size={24} /> : <Skull size={24} />}
                    <span className="text-xs font-bold mt-1">{getCharShortName(type)}</span>
                    </div>
                );
                }
                return <div className="flex flex-wrap justify-center min-h-[60px]">{icons}</div>;
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
                
                {/* 画面コンテナ：初期画面 */}
                {screen === 'initial' && (
                    <div className="flex items-center justify-center min-h-[80vh] animate-fadeIn">
                    <div className="bg-white max-w-md w-full rounded-xl shadow-xl p-8 space-y-8">
                        <div className="text-center space-y-2">
                        <div className="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Ship className="text-blue-600" size={32} />
                        </div>
                        <h1 className="text-2xl font-bold text-slate-800">{t('title')}</h1>
                        <p className="text-slate-500">{t('initialScreenTitle')}</p>
                        </div>

                        <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">
                            {t('participantId')}
                            </label>
                            <input
                            type="text"
                            value={participantId}
                            onChange={(e) => setParticipantId(e.target.value)}
                            className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            placeholder="ID12345"
                            />
                        </div>
                        
                        <button
                            onClick={startGame}
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition transform hover:scale-105"
                        >
                            <Play size={20} /> {t('startBtn')}
                        </button>
                        </div>

                        <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                        <button
                            onClick={openSettings}
                            className="text-slate-500 hover:text-slate-800 flex items-center gap-1 text-sm"
                        >
                            <Settings size={16} /> {t('settingsBtn')}
                        </button>
                        <div className="flex gap-2">
                            {['ja', 'en', 'sv'].map(lang => (
                                <button 
                                    key={lang}
                                    onClick={() => changeLanguage(lang)}
                                    className={`text-xs px-2 py-1 rounded ${language === lang ? 'bg-slate-200 font-bold' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    {lang.toUpperCase()}
                                </button>
                            ))}
                        </div>
                        </div>
                    </div>
                    </div>
                )}

                {/* 画面コンテナ：設定画面 */}
                {screen === 'settings' && (
                    <div className="flex items-center justify-center min-h-[80vh] animate-fadeIn">
                    <div className="bg-white max-w-lg w-full rounded-xl shadow-xl p-8 space-y-6 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <Settings size={24} className="text-slate-500" />
                            {t('settingsTitle')}
                        </h2>
                        <button onClick={saveSettingsAndBack} className="text-slate-400 hover:text-slate-600">
                            <X size={24} />
                        </button>
                        </div>
                        
                        {tempMessage && (
                        <div className="bg-blue-100 text-blue-700 px-4 py-2 rounded mb-4 text-center text-sm font-bold flex items-center justify-center gap-2">
                            {tempMessage === 'codeCopied' ? <Check size={16} /> : <Info size={16} />}
                            {t(tempMessage)}
                        </div>
                        )}

                        <div className="space-y-4">
                        <label className="block text-sm font-medium text-slate-700">{t('saveMethod')}</label>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <button
                                onClick={() => setSaveConfig({ ...saveConfig, method: 'csv' })}
                                className={`p-3 rounded-lg border flex flex-col items-center justify-center gap-2 transition h-24 ${
                                    saveConfig.method === 'csv' ? 'border-blue-500 bg-blue-50 text-blue-700 ring-1 ring-blue-500' : 'border-slate-200 hover:bg-slate-50 text-slate-600'
                                }`}
                            >
                                <Download size={24} className="mb-1"/>
                                <div className="text-center leading-tight">
                                    <div className="font-bold text-xs">{t('methodCsv')}</div>
                                </div>
                            </button>

                            <button
                                onClick={() => setSaveConfig({ ...saveConfig, method: 'gas' })}
                                className={`p-3 rounded-lg border flex flex-col items-center justify-center gap-2 transition h-24 ${
                                    saveConfig.method === 'gas' ? 'border-green-500 bg-green-50 text-green-700 ring-1 ring-green-500' : 'border-slate-200 hover:bg-slate-50 text-slate-600'
                                }`}
                            >
                                <FileJson size={24} className="mb-1"/>
                                <div className="text-center leading-tight">
                                    <div className="font-bold text-xs">{t('methodGas')}</div>
                                </div>
                            </button>

                            <button
                                onClick={() => setSaveConfig({ ...saveConfig, method: 'firebase' })}
                                className={`p-3 rounded-lg border flex flex-col items-center justify-center gap-2 transition h-24 ${
                                    saveConfig.method === 'firebase' ? 'border-orange-500 bg-orange-50 text-orange-700 ring-1 ring-orange-500' : 'border-slate-200 hover:bg-slate-50 text-slate-600'
                                }`}
                            >
                                <Database size={24} className="mb-1"/>
                                <div className="text-center leading-tight">
                                    <div className="font-bold text-xs">{t('methodFirebase')}</div>
                                </div>
                            </button>
                        </div>

                        <div className="mt-4 pt-4 border-t border-slate-100 space-y-3">
                            {saveConfig.method === 'gas' && (
                                <div className="animate-fadeIn space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-green-700 mb-1">GAS URL</label>
                                        <input
                                            type="text"
                                            value={saveConfig.gasUrl}
                                            onChange={(e) => setSaveConfig({...saveConfig, gasUrl: e.target.value.trim()})}
                                            placeholder={t('gasUrlPlaceholder')}
                                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded focus:ring-1 focus:ring-green-500 outline-none"
                                        />
                                        <p className="text-xs text-red-500 mt-1 font-bold">
                                            重要：デプロイ時の「アクセスできるユーザー」を「全員 (Anyone)」に設定してください。
                                        </p>
                                        <p className="text-xs text-slate-400 mt-1">
                                            * '/exec' で終わるURLを入力してください。<br/>
                                            * CORS制限回避のため 'no-cors' モードで送信されます。
                                        </p>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-3 rounded border border-slate-200">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-xs font-bold text-slate-600 flex items-center gap-1">
                                                <Code size={12}/> {t('gasSampleLabel')}
                                            </label>
                                            <button 
                                            onClick={copyGasSample} 
                                            className="text-xs bg-white border border-slate-300 px-2 py-1 rounded hover:bg-slate-100 flex items-center gap-1 transition active:scale-95"
                                            >
                                                {tempMessage === 'codeCopied' ? <Check size={12} className="text-green-600"/> : <Copy size={12}/>}
                                                {tempMessage === 'codeCopied' ? <span className="text-green-600 font-bold">{t('codeCopied')}</span> : t('copyCode')}
                                            </button>
                                        </div>
                                        <pre className="text-[10px] bg-slate-800 text-slate-300 p-2 rounded overflow-x-auto whitespace-pre-wrap font-mono h-32">
                                            {gasSampleCode}
                                        </pre>
                                    </div>
                                </div>
                            )}

                            {saveConfig.method === 'firebase' && (
                                <div className="animate-fadeIn">
                                    <label className="block text-xs font-bold text-orange-700 mb-1">Firebase Config (JSON)</label>
                                    <textarea
                                        value={saveConfig.firebaseConfig}
                                        onChange={(e) => setSaveConfig({...saveConfig, firebaseConfig: e.target.value})}
                                        placeholder={t('firebaseConfigPlaceholder')}
                                        className="w-full h-32 px-3 py-2 text-xs font-mono border border-slate-300 rounded focus:ring-1 focus:ring-orange-500 outline-none"
                                    />
                                </div>
                            )}
                        </div>
                        </div>

                        <div className="pt-4">
                        <button
                            onClick={saveSettingsAndBack}
                            className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-lg transition"
                        >
                            {t('saveSettings')}
                        </button>
                        </div>
                    </div>
                    </div>
                )}

                {/* 画面コンテナ：ゲーム本編 */}
                {screen === 'playing' && (
                    <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden animate-fadeIn">
                    
                    <header className="bg-slate-800 text-white p-6 flex justify-between items-center flex-wrap gap-4">
                        <div>
                        <h1 className="text-2xl font-bold flex items-center gap-2">
                            <Ship className="text-blue-300" />
                            {t('title')}
                        </h1>
                        <div className="flex gap-2 items-center mt-1">
                            <p className="text-slate-400 text-sm">{t('subtitle')}</p>
                            {participantId && (
                                <span className="text-xs bg-slate-700 px-2 py-0.5 rounded text-blue-200">ID: {participantId}</span>
                            )}
                        </div>
                        </div>
                        <div className="flex flex-col items-end gap-2">
                        <div className="flex bg-slate-700 rounded p-1 gap-1">
                            {['ja', 'en', 'sv'].map(lang => (
                                <button 
                                    key={lang}
                                    onClick={() => changeLanguage(lang)}
                                    className={`px-2 py-1 text-xs rounded transition ${language === lang ? 'bg-blue-500 text-white font-bold' : 'text-slate-300 hover:text-white'}`}
                                >
                                    {lang === 'ja' ? '日本語' : lang === 'en' ? 'English' : 'Svenska'}
                                </button>
                            ))}
                        </div>

                        <div className="flex gap-2 flex-wrap justify-end">
                            <button 
                            onClick={() => setShowRules(!showRules)}
                            className="flex items-center gap-1 bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-sm transition"
                            >
                            <HelpCircle size={16} /> {t('rulesBtn')}
                            </button>
                            <button 
                            onClick={() => setShowPsychology(!showPsychology)}
                            className="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded text-sm transition"
                            >
                            <Info size={16} /> {t('bgBtn')}
                            </button>
                            <button 
                            onClick={() => setShowLog(!showLog)}
                            className={`flex items-center gap-1 px-3 py-2 rounded text-sm transition ${showLog ? 'bg-teal-600 text-white' : 'bg-teal-700 hover:bg-teal-600'}`}
                            >
                            <ClipboardList size={16} /> {t('logBtn')}
                            </button>
                        </div>
                        </div>
                    </header>

                    {showRules && (
                        <div className="bg-yellow-50 p-4 border-b border-yellow-100 animate-fadeIn">
                        <h3 className="font-bold text-yellow-800 mb-2">{t('rulesTitle')}</h3>
                        <ul className="list-disc list-inside text-sm text-yellow-900 space-y-1">
                            {translations[language].rulesList.map((rule, idx) => (
                            <li key={idx}>{rule}</li>
                            ))}
                        </ul>
                        </div>
                    )}

                    {showLog && (
                        <div className="bg-slate-100 p-4 border-b border-slate-200 animate-fadeIn max-h-96 overflow-hidden flex flex-col">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="font-bold text-slate-700 flex items-center gap-2"><FileText size={16}/> {t('logTitle')}</h3>
                            <div className="flex gap-2 flex-wrap justify-end">
                            <button onClick={copyLogToClipboard} className="text-xs bg-white border border-slate-300 px-2 py-1 rounded flex items-center gap-1 hover:bg-slate-50">
                                <Copy size={12}/> {t('copyCsv')}
                            </button>
                            
                            <button 
                                onClick={executeSave} 
                                disabled={isSaving}
                                className={`text-xs px-3 py-1 rounded flex items-center gap-1 text-white font-bold shadow-sm transition-all
                                    ${isSaving ? 'bg-slate-400 cursor-not-allowed' :
                                        saveConfig.method === 'csv' ? 'bg-blue-600 hover:bg-blue-500' :
                                        saveConfig.method === 'gas' ? 'bg-green-600 hover:bg-green-500' :
                                        'bg-orange-600 hover:bg-orange-500'}
                                `}
                            >
                                {isSaving ? <Loader size={12} className="animate-spin"/> : 
                                (saveConfig.method === 'csv' ? <Download size={12}/> : 
                                saveConfig.method === 'gas' ? <FileJson size={12}/> : <Cloud size={12}/>)}
                                
                                {isSaving ? t('sending') :
                                (saveConfig.method === 'csv' ? t('saveCsv') : 
                                saveConfig.method === 'gas' ? t('sendGas') : t('saveFirebase'))}
                            </button>

                            <button onClick={exitToTitle} className="text-xs bg-slate-200 border border-slate-300 px-2 py-1 rounded flex items-center gap-1 hover:bg-slate-300 text-slate-700 ml-2">
                                <LogOut size={12}/> {t('exitToTitle')}
                            </button>

                            <button onClick={() => setShowLog(false)} className="text-slate-500 hover:text-slate-800 ml-2">
                                <X size={16}/>
                            </button>
                            </div>
                        </div>
                        
                        <div className="mb-2 text-xs text-slate-500 font-mono bg-slate-50 p-2 rounded border border-slate-200">
                            ID: {participantId || 'Guest'} | Method: {saveConfig.method.toUpperCase()}
                        </div>

                        <div className="overflow-y-auto bg-white rounded border border-slate-200 text-xs font-mono">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-slate-50 sticky top-0">
                                    <tr>
                                        {translations[language].tableHeader.map((h, i) => (
                                            <th key={i} className={`p-2 border-b ${i > 1 ? 'text-center' : ''}`}>{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {history.length === 0 ? (
                                        <tr><td colSpan="5" className="p-4 text-center text-slate-400">{t('noHistory')}</td></tr>
                                    ) : (
                                        history.map((log) => (
                                            <tr key={log.id} className="border-b last:border-0 hover:bg-slate-50">
                                                <td className="p-2 text-slate-500">{log.id}</td>
                                                <td className="p-2">{resolveAction(log.actionKey, log.actionParams)}</td>
                                                <td className="p-2 text-center text-slate-600">{log.left.hobbits} / {log.left.orcs}</td>
                                                <td className="p-2 text-center text-slate-600">{log.right.hobbits} / {log.right.orcs}</td>
                                                <td className="p-2 text-center text-slate-600">{log.boat.hobbits} / {log.boat.orcs}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                        </div>
                    )}

                    <div className="p-6">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-6 bg-slate-100 p-3 rounded-lg gap-3">
                        <div className="font-mono text-slate-600 whitespace-nowrap">{t('moves')}: <span className="text-xl font-bold text-slate-900">{moveCount}</span></div>
                        
                        <div className={`text-center font-bold px-4 py-1 rounded w-full md:flex-1 mx-2 text-sm md:text-base transition-colors duration-300 ${
                            tempMessage ? 'text-orange-600 bg-orange-100' :
                            gameState === 'playing' ? 'text-blue-600' :
                            gameState === 'won' ? 'text-green-600 bg-green-100' : 'text-red-600 bg-red-100'
                        }`}>
                            {displayMessage()}
                        </div>

                        <div className="flex gap-2">
                            <button 
                            onClick={finishExperiment}
                            className="flex items-center gap-1 bg-teal-600 hover:bg-teal-500 text-white px-3 py-2 rounded text-sm whitespace-nowrap transition shadow-sm"
                            >
                            <Save size={16} /> {t('finishBtn')}
                            </button>
                            <button 
                            onClick={resetGame}
                            className="flex items-center gap-1 text-slate-500 hover:text-slate-800 bg-white border border-slate-300 px-3 py-2 rounded transition text-sm whitespace-nowrap hover:bg-slate-50"
                            >
                            <RotateCcw size={16} /> {t('resetBtn')}
                            </button>
                        </div>
                        </div>

                        <div className="relative flex justify-between items-stretch h-64 md:h-80 border-2 border-slate-300 rounded-xl overflow-hidden bg-blue-50">
                        <div className={`flex-1 p-4 flex flex-col items-center justify-start border-r-2 border-dashed border-slate-300 transition-colors ${boatPosition === 'left' ? 'bg-green-50' : 'bg-slate-100'}`}>
                            <h3 className="font-bold text-slate-500 mb-4 text-sm md:text-base text-center">{t('leftBank')}</h3>
                            <div className="w-full space-y-2">
                            <CharacterIcon 
                                type="hobbits" 
                                count={leftBank.hobbits} 
                                onClick={() => boatPosition === 'left' && moveCharacter('hobbits', 'toBoat')} 
                            />
                            <CharacterIcon 
                                type="orcs" 
                                count={leftBank.orcs} 
                                onClick={() => boatPosition === 'left' && moveCharacter('orcs', 'toBoat')} 
                            />
                            </div>
                        </div>

                        <div className="flex-[1.5] bg-blue-400 relative flex flex-col items-center justify-center overflow-hidden">
                            <div className="absolute inset-0 opacity-20 bg-[radial-gradient(circle,_#ffffff_1px,_transparent_1px)] bg-[length:20px_20px]"></div>
                            
                            <div 
                            className={`
                                relative w-48 h-32 bg-amber-800 rounded-b-3xl rounded-t-md shadow-2xl 
                                flex flex-col items-center justify-center border-4 border-amber-900
                                transition-all duration-700 ease-in-out
                                ${boatPosition === 'left' ? '-translate-x-12 md:-translate-x-24' : 'translate-x-12 md:translate-x-24'}
                            `}
                            >
                            <div className="absolute -top-3 text-white text-xs font-bold bg-amber-900 px-2 rounded">{t('boatLabel')}</div>
                            <div className="flex items-center justify-center gap-2 w-full h-full p-2">
                                {boat.hobbits > 0 && (
                                <CharacterIcon type="hobbits" count={boat.hobbits} onClick={() => moveCharacter('hobbits', 'toBank')} />
                                )}
                                {boat.orcs > 0 && (
                                <CharacterIcon type="orcs" count={boat.orcs} onClick={() => moveCharacter('orcs', 'toBank')} />
                                )}
                                {boat.hobbits === 0 && boat.orcs === 0 && (
                                <span className="text-amber-200 text-sm opacity-50">{t('emptySeat')}</span>
                                )}
                            </div>
                            </div>

                            <button
                            onClick={moveBoat}
                            disabled={gameState !== 'playing'}
                            className={`
                                mt-8 px-6 py-2 rounded-full font-bold shadow-lg z-10 transition-all text-sm md:text-base
                                ${gameState !== 'playing' ? 'bg-gray-400 cursor-not-allowed' : 'bg-white hover:bg-yellow-100 text-blue-600 hover:scale-105 active:scale-95'}
                            `}
                            >
                            {boatPosition === 'left' ? (
                                <span className="flex items-center gap-1">{t('boatBtn_right')} <ChevronRight /></span>
                            ) : (
                                <span className="flex items-center gap-1"><ChevronLeft /> {t('boatBtn_left')}</span>
                            )}
                            </button>
                        </div>

                        <div className={`flex-1 p-4 flex flex-col items-center justify-start border-l-2 border-dashed border-slate-300 transition-colors ${boatPosition === 'right' ? 'bg-green-50' : 'bg-slate-100'}`}>
                            <h3 className="font-bold text-slate-500 mb-4 text-sm md:text-base text-center">{t('rightBank')}</h3>
                            <div className="w-full space-y-2">
                            <CharacterIcon 
                                type="hobbits" 
                                count={rightBank.hobbits} 
                                onClick={() => boatPosition === 'right' && moveCharacter('hobbits', 'toBoat')} 
                            />
                            <CharacterIcon 
                                type="orcs" 
                                count={rightBank.orcs} 
                                onClick={() => boatPosition === 'right' && moveCharacter('orcs', 'toBoat')} 
                            />
                            </div>
                        </div>
                        </div>
                    </div>

                    {showPsychology && (
                        <div className="bg-indigo-50 p-6 border-t border-indigo-100 animate-slideUp">
                        <h3 className="text-lg font-bold text-indigo-900 mb-2 flex items-center gap-2">
                            <Info size={20} />
                            {t('psyTitle')}
                        </h3>
                        <div className="text-sm text-slate-700 space-y-3 leading-relaxed">
                            <p>{t('psyIntro')}</p>
                            <div className="grid md:grid-cols-2 gap-4 mt-4">
                            <div className="bg-white p-3 rounded shadow-sm">
                                <h4 className="font-bold text-indigo-700 mb-1">{t('psyWhyDiffTitle')}</h4>
                                <p>{t('psyWhyDiffText')}</p>
                            </div>
                            <div className="bg-white p-3 rounded shadow-sm">
                                <h4 className="font-bold text-indigo-700 mb-1">{t('psyLearnTitle')}</h4>
                                <p>{t('psyLearnText')}</p>
                            </div>
                            </div>
                        </div>
                        </div>
                    )}
                    </div>
                )}

                <footer className="text-center text-slate-400 mt-8 text-sm">
                    © 2024 Psychology Logic Lab
                </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HobbitsAndOrcs />);
    </script>
</body>
</html>
