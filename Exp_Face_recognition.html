<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情認知実験プログラム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // GlobalにFirebase関数を公開してReactから使えるようにする
        window.FirebaseApp = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, addDoc, serverTimestamp };
    </script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6; user-select: none; }
        /* カーソルを隠すクラス (実験中用) */
        .cursor-hidden { cursor: none; }
        /* レイヤー制御用のスタイル */
        .canvas-container { position: relative; width: 300px; height: 300px; margin: 0 auto; background: white; border: 1px solid #ccc; overflow: hidden; }
        .stimulus-layer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; visibility: hidden; }
        .stimulus-layer.visible { visibility: visible; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- 定数と設定 ---
        const CONDITIONS = {
            DURATION: { SHORT: 100, LONG: 1000 }, // ms
            EMOTIONS: ['Happy', 'Angry', 'Sad', 'Neutral']
        };

        const TRIALS_PER_CONDITION = 5; 

        // --- GAS サンプルコード (完全版) ---
        const GAS_SAMPLE_CODE = `/**
 * 表情認知実験プログラム用 データ受信スクリプト
 * このスクリプトは、実験プログラムからのPOSTリクエストを受け取り、
 * 紐付けられたGoogleスプレッドシートの「ExperimentData」シートに行を追加します。
 */

/**
 * ブラウザでURLにアクセスした時の動作 (稼働確認用)
 */
function doGet(e) {
  return ContentService.createTextOutput("GAS Web App is active. Please use POST method to send data.");
}

/**
 * データ受信時の動作 (POSTリクエスト)
 */
function doPost(e) {
  // ロックを取得して同時書き込みによる競合を防ぐ
  const lock = LockService.getScriptLock();
  try {
    // 10秒間ロックの取得を試みる
    lock.waitLock(10000); 

    // 1. 受信データのパース
    const rawData = e.postData.contents;
    if (!rawData) {
      throw new Error("No data received");
    }
    const data = JSON.parse(rawData);

    // 2. スプレッドシートとシートの取得
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sheetName = 'ExperimentData';
    let sheet = ss.getSheetByName(sheetName);

    // 3. シートが存在しない場合は作成し、ヘッダーを設定
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
      // ヘッダー行の定義
      const headers = [
        "Timestamp (ISO)",    // 送信時刻
        "Participant ID",     // 被験者名
        "Age",                // 年齢
        "Vision",             // 視力
        "Exp Date ID",        // 実験日時ID
        "Mode",               // モード (Practice/Main)
        "Trial ID",           // 試行ID
        "Target Duration",    // 設定提示時間
        "Actual Duration",    // 実測提示時間 (New)
        "Stimulus Emotion",   // 正解の感情
        "Response Emotion",   // 回答した感情
        "Is Correct",         // 正誤 (1/0)
        "Confidence"          // 確信度
      ];
      sheet.appendRow(headers);
      sheet.setFrozenRows(1);
      sheet.getRange(1, 1, 1, headers.length).setFontWeight("bold");
    }

    // 4. 書き込み用データの整形
    const rows = data.results.map(result => {
      return [
        data.timestamp,
        data.participant.name,
        data.participant.age,
        data.participant.vision,
        data.date,
        data.mode,
        result.id,
        result.duration,
        result.actualDuration, // 実測値
        result.emotion,
        result.responseEmotion,
        result.isCorrect,
        result.confidence
      ];
    });

    // 5. データ書き込み
    if (rows.length > 0) {
      const lastRow = sheet.getLastRow();
      sheet.getRange(lastRow + 1, 1, rows.length, rows[0].length).setValues(rows);
    }

    // 6. 成功レスポンス
    return ContentService.createTextOutput(JSON.stringify({ status: "success", count: rows.length }))
      .setMimeType(ContentService.MimeType.JSON);

  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: error.toString() }))
      .setMimeType(ContentService.MimeType.JSON);

  } finally {
    lock.releaseLock();
  }
}

/**
 * テスト用関数
 * デプロイ前にこの関数を実行して、シートへの書き込み権限を承認してください。
 */
function testDoPost() {
  const mockData = {
    timestamp: new Date().toISOString(),
    date: "20230101_120000",
    participant: { name: "test_user", age: "20", vision: "normal" },
    mode: "test",
    results: [
      {
        id: "test-trial-1",
        duration: 100,
        actualDuration: 102.5,
        emotion: "Happy",
        responseEmotion: "Happy",
        isCorrect: 1,
        confidence: 4
      }
    ]
  };
  
  const e = { postData: { contents: JSON.stringify(mockData) } };
  doPost(e);
}`;

        // --- デフォルトの実験計画テキスト ---
        const DEFAULT_CONFIG = {
            title: "表情認知実験プログラム",
            purpose: "提示時間（情報の利用可能性）が表情認知の正確性と確信度に及ぼす影響を検討する。",
            iv: "提示時間（100ms / 1000ms）、感情カテゴリ（4種）",
            dv: "正答率、確信度（1-4）",
            saveCSV: true,
            saveFirebase: false,
            saveGAS: false,
            gasURL: "",
            // 追加された設定項目
            enableITI: true,
            enableFullscreen: true,
            enableBeforeUnload: true
        };

        // --- ユーティリティ関数 ---
        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        // --- 高精度タイマー群 ---

        // 1. 描画完了待ち (Next Paint)
        // ブラウザがDOM変更を画面に反映するのを待つ。
        // ダブルRAFパターンを使用。
        const waitForNextPaint = () => {
            return new Promise(resolve => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        resolve(performance.now());
                    });
                });
            });
        };

        // 2. 時間指定待機 (ms)
        const waitMs = (ms) => {
            return new Promise(resolve => {
                const start = performance.now();
                const loop = (now) => {
                    if (now - start >= ms) resolve(now);
                    else requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            });
        };

        // 3. フレーム数指定待機 (Frames)
        // 60Hz前提で100ms = 6 frames
        const waitFrames = (frames) => {
            return new Promise(resolve => {
                let count = 0;
                const loop = (now) => {
                    count++;
                    if (count >= frames) resolve(now);
                    else requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            });
        };

        const formatDate = (date) => {
            if (!date) return "";
            const y = date.getFullYear();
            const m = ('0' + (date.getMonth() + 1)).slice(-2);
            const d = ('0' + date.getDate()).slice(-2);
            const h = ('0' + date.getHours()).slice(-2);
            const min = ('0' + date.getMinutes()).slice(-2);
            const s = ('0' + date.getSeconds()).slice(-2);
            return `${y}${m}${d}_${h}${min}${s}`;
        };

        function normSInv(p) {
            if (p <= 0) p = 0.001; if (p >= 1) p = 0.999; 
            const a1 = -39.6968302866538, a2 = 220.946098424521, a3 = -275.928510446969;
            const a4 = 138.357751867269, a5 = -30.6647980661472, a6 = 2.50662827745924;
            const b1 = -54.4760987982241, b2 = 161.585836858041, b3 = -155.698979859887;
            const b4 = 66.8013118877197, b5 = -13.2806815528857, c1 = -7.78489400243029e-03;
            const c2 = -3.22396458041136e-01, c3 = -2.40075827716184, c4 = -2.54973253934373;
            const c5 = 4.37466414146497, c6 = 2.93816398269878, d1 = 7.78469570904146e-03;
            const d2 = 3.22467129070040e-01, d3 = 2.445134137143, d4 = 3.75440866190742;
            const p_low = 0.02425, p_high = 1 - p_low;
            let q, r;
            if (p < p_low) {
                q = Math.sqrt(-2 * Math.log(p));
                return (((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) / ((((d1 * q + d2) * q + d3) * q + d4) * q + 1);
            }
            if (p <= p_high) {
                q = p - 0.5; r = q * q;
                return (((((a1 * r + a2) * r + a3) * r + a4) * r + a5) * r + a6) * q / (((((b1 * r + b2) * r + b3) * r + b4) * r + b5) * r + 1);
            }
            q = Math.sqrt(-2 * Math.log(1 - p));
            return -(((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) / ((((d1 * q + d2) * q + d3) * q + d4) * q + 1);
        }

        // --- コンポーネント: 顔刺激 (SVG) - メモ化 ---
        const FaceStimulus = React.memo(({ emotion }) => {
            const faceBase = <circle cx="100" cy="100" r="80" fill="#FFCC80" stroke="#000" strokeWidth="3" />;
            const leftEye = <circle cx="70" cy="80" r="8" fill="#000" />;
            const rightEye = <circle cx="130" cy="80" r="8" fill="#000" />;
            
            const angryEyebrows = (<><line x1="60" y1="65" x2="85" y2="75" stroke="#000" strokeWidth="4" /><line x1="140" y1="65" x2="115" y2="75" stroke="#000" strokeWidth="4" /></>);
            const sadEyebrows = (<><line x1="60" y1="70" x2="85" y2="60" stroke="#000" strokeWidth="3" /><line x1="140" y1="70" x2="115" y2="60" stroke="#000" strokeWidth="3" /></>);

            let mouth, extras = null;
            switch (emotion) {
                case 'Happy': mouth = <path d="M 60 130 Q 100 170 140 130" fill="none" stroke="#000" strokeWidth="4" />; break;
                case 'Angry': mouth = <path d="M 60 150 Q 100 120 140 150" fill="none" stroke="#000" strokeWidth="4" />; extras = angryEyebrows; break;
                case 'Sad': mouth = <path d="M 60 150 Q 100 120 140 150" fill="none" stroke="#000" strokeWidth="4" />; extras = sadEyebrows; break;
                case 'Neutral': default: mouth = <line x1="60" y1="140" x2="140" y2="140" stroke="#000" strokeWidth="4" />; break;
            }
            return (
                <svg className="stimulus" viewBox="0 0 200 200">
                    {faceBase}{leftEye}{rightEye}{mouth}{extras}
                </svg>
            );
        });

        // --- コンポーネント: ノイズマスク (SVG) - メモ化 ---
        const PatternMask = React.memo(() => {
            const elements = useMemo(() => {
                const els = [];
                for (let i = 0; i < 50; i++) {
                    const x1 = Math.random() * 200; const y1 = Math.random() * 200;
                    const x2 = Math.random() * 200; const y2 = Math.random() * 200;
                    els.push(<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#000" strokeWidth={Math.random() * 3 + 1} />);
                    els.push(<circle key={`c${i}`} cx={Math.random()*200} cy={Math.random()*200} r={Math.random()*10} fill={Math.random() > 0.5 ? "#000" : "none"} stroke="#000" />);
                }
                return els;
            }, []); // 空依存配列＝初回のみ生成

            return (
                <svg className="stimulus" viewBox="0 0 200 200" style={{background: '#ddd'}}>
                    {elements}
                </svg>
            );
        });

        // --- 設定画面コンポーネント ---
        const SetupScreen = ({ config, setConfig, onNext }) => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [copyStatus, setCopyStatus] = useState('');
            const ADMIN_PASSWORD = 'admin';

            const handleLogin = () => {
                if (password === ADMIN_PASSWORD) {
                    setIsAuthenticated(true);
                    setErrorMsg('');
                } else {
                    setErrorMsg('パスワードが違います');
                }
            };
            
            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    if (document.execCommand('copy')) {
                        setCopyStatus('copied');
                        setTimeout(() => setCopyStatus(''), 2000);
                    } else {
                        setCopyStatus('error');
                        setTimeout(() => setCopyStatus(''), 2000);
                    }
                } catch (err) {
                    setCopyStatus('error');
                    setTimeout(() => setCopyStatus(''), 2000);
                }
                document.body.removeChild(textArea);
            };

            if (!isAuthenticated) {
                return (
                    <div className="max-w-md mx-auto p-8 bg-white shadow-lg rounded-lg mt-20">
                        <h1 className="text-xl font-bold mb-4 text-gray-800 text-center">管理者認証</h1>
                        <div className="mb-4">
                            <label className="block text-gray-700 text-sm font-bold mb-2">パスワード</label>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleLogin()} className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" autoFocus />
                        </div>
                        {errorMsg && <p className="text-red-500 text-xs italic mb-4">{errorMsg}</p>}
                        <div className="flex items-center justify-between">
                            <button onClick={handleLogin} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">ログイン</button>
                            <button onClick={onNext} className="inline-block align-baseline font-bold text-sm text-blue-600 hover:text-blue-800">キャンセル</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto p-8 bg-white shadow-lg rounded-lg mt-6">
                    <h1 className="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">実験設定 (管理者用)</h1>
                    <div className="space-y-6">
                        <div className="bg-gray-50 p-4 rounded border">
                            <h3 className="font-bold text-lg mb-3">1. 実験計画情報</h3>
                            <div className="space-y-3 text-sm">
                                <div><span className="font-bold">実験タイトル:</span> {config.title}</div>
                                <div><span className="font-bold">目的:</span> {config.purpose}</div>
                                <div><span className="font-bold">独立変数:</span> {config.iv}</div>
                                <div><span className="font-bold">従属変数:</span> {config.dv}</div>
                            </div>
                        </div>
                        
                        <div className="bg-blue-50 p-4 rounded border border-blue-200">
                            <h3 className="font-bold text-lg mb-3">2. データ保存設定</h3>
                            <div className="space-y-4">
                                <label className="flex items-center space-x-2 cursor-pointer"><input type="checkbox" checked={config.saveCSV} onChange={e => setConfig({...config, saveCSV: e.target.checked})} className="w-5 h-5 text-blue-600" /><span className="font-semibold">CSVダウンロード (推奨)</span></label>
                                <div className="pl-6 border-l-4 border-gray-300">
                                    <label className="flex items-center space-x-2 cursor-pointer mb-2"><input type="checkbox" checked={config.saveFirebase} onChange={e => setConfig({...config, saveFirebase: e.target.checked})} className="w-5 h-5 text-orange-600" /><span className="font-semibold">Firebase (Firestore) に保存</span></label>
                                </div>
                                <div className="pl-6 border-l-4 border-gray-300">
                                    <label className="flex items-center space-x-2 cursor-pointer mb-2"><input type="checkbox" checked={config.saveGAS} onChange={e => setConfig({...config, saveGAS: e.target.checked})} className="w-5 h-5 text-green-600" /><span className="font-semibold">Google Apps Script (GAS) に送信</span></label>
                                    {config.saveGAS && (
                                        <div className="space-y-3">
                                            <input type="text" placeholder="GASのWeb App URLを入力" value={config.gasURL} onChange={e => setConfig({...config, gasURL: e.target.value})} className="w-full text-sm border p-2 rounded" />
                                            <div className="bg-white p-3 rounded border border-gray-200">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-xs font-bold text-gray-700">GAS側スクリプト (code.gs)</span>
                                                    <button onClick={() => copyToClipboard(GAS_SAMPLE_CODE)} disabled={copyStatus === 'copied'} className={`text-xs px-3 py-1 rounded transition flex items-center gap-1 border ${copyStatus === 'copied' ? 'bg-green-100 text-green-700 border-green-300 font-bold' : copyStatus === 'error' ? 'bg-red-100 text-red-700 border-red-300' : 'bg-gray-100 hover:bg-gray-200 text-gray-700 border-gray-300'}`}>{copyStatus === 'copied' ? <>✓ コピーしました！</> : copyStatus === 'error' ? '❌ 失敗しました' : '📋 コードをコピー'}</button>
                                                </div>
                                                <textarea className="w-full h-32 p-2 border rounded font-mono text-xs bg-gray-50 text-gray-600" readOnly value={GAS_SAMPLE_CODE} onClick={(e) => e.target.select()} />
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* 実験環境・制御設定 (追加) */}
                        <div className="bg-green-50 p-4 rounded border border-green-200">
                            <h3 className="font-bold text-lg mb-3">3. 実験環境・制御設定 (修正・改善項目)</h3>
                            <div className="space-y-3">
                                <label className="flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" checked={config.enableITI} onChange={e => setConfig({...config, enableITI: e.target.checked})} className="w-5 h-5 text-green-600" />
                                    <span className="font-semibold text-gray-800">試行間間隔 (ITI: 800ms) を入れる</span>
                                </label>
                                <p className="text-xs text-gray-500 pl-7 -mt-2 mb-2">前の試行の影響を減らすため、回答後に空白画面を挟みます。</p>

                                <label className="flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" checked={config.enableFullscreen} onChange={e => setConfig({...config, enableFullscreen: e.target.checked})} className="w-5 h-5 text-green-600" />
                                    <span className="font-semibold text-gray-800">実験開始時にフルスクリーン化する</span>
                                </label>
                                <p className="text-xs text-gray-500 pl-7 -mt-2 mb-2">ブラウザの枠などを隠し、注意の逸脱を防ぎます。</p>

                                <label className="flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" checked={config.enableBeforeUnload} onChange={e => setConfig({...config, enableBeforeUnload: e.target.checked})} className="w-5 h-5 text-green-600" />
                                    <span className="font-semibold text-gray-800">誤操作による離脱を防止する (BeforeUnload)</span>
                                </label>
                                <p className="text-xs text-gray-500 pl-7 -mt-2 mb-2">実験中に「戻る」や「閉じる」を押した際に警告を表示します。</p>

                                <div className="flex items-center space-x-2 pl-1 mt-4 pt-4 border-t border-green-200">
                                    <span className="text-xl">🎨</span>
                                    <span className="font-semibold text-gray-800">描画制御: レイヤー切替 + NextPaint待機 + フレームロック</span>
                                </div>
                                <p className="text-xs text-gray-500 pl-8">DOMの出し入れを廃止し、レイヤー表示切替に変更。100ms条件は6フレーム固定、それ以外は時間計測。実測値を記録します。</p>
                            </div>
                        </div>

                        <div className="text-center pt-4">
                            <button onClick={onNext} className="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-8 rounded">設定完了して戻る</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- メインアプリケーション ---
        const App = () => {
            const [phase, setPhase] = useState('intro');
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [participantName, setParticipantName] = useState('');
            const [participantAge, setParticipantAge] = useState('');
            const [participantVision, setParticipantVision] = useState('normal');
            const [trials, setTrials] = useState([]);
            const [currentTrialIndex, setCurrentTrialIndex] = useState(0);
            const [currentResponse, setCurrentResponse] = useState(null);
            const [results, setResults] = useState([]);
            const [experimentDate, setExperimentDate] = useState(null);
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [statusMsg, setStatusMsg] = useState('');
            const [experimentMode, setExperimentMode] = useState('practice');
            
            // 実測時間記録用
            const [measuredDuration, setMeasuredDuration] = useState(null);

            // Firebase Initialization
            useEffect(() => {
                if (window.FirebaseApp && typeof __firebase_config !== 'undefined' && __firebase_config) {
                    try {
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseApp;
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = window.FirebaseApp.initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        const initAuth = async () => {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                            else await signInAnonymously(auth);
                        };
                        initAuth();
                        onAuthStateChanged(auth, (user) => setFirebaseUser(user));
                    } catch (e) { console.error("Firebase Init Error:", e); }
                }
            }, []);

            // 誤操作防止 (BeforeUnload)
            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    // 設定で有効かつ、実験中のみアラートを出す
                    if (config.enableBeforeUnload && phase !== 'intro' && phase !== 'results') {
                        e.preventDefault();
                        e.returnValue = ''; // Chrome requires returnValue to be set
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [phase, config.enableBeforeUnload]);
            
            const generateTrials = (mode) => {
                let tempTrials = [];
                if (mode === 'practice') {
                    for(let i=0; i<10; i++) {
                        const emotion = CONDITIONS.EMOTIONS[Math.floor(Math.random() * CONDITIONS.EMOTIONS.length)];
                        const duration = Math.random() > 0.5 ? CONDITIONS.DURATION.SHORT : CONDITIONS.DURATION.LONG;
                        tempTrials.push({ id: `practice-${i}`, emotion, duration, conditionLabel: duration === 100 ? '短時間(100ms)' : '長時間(1000ms)' });
                    }
                } else {
                    CONDITIONS.EMOTIONS.forEach(emotion => {
                        Object.values(CONDITIONS.DURATION).forEach(duration => {
                            for (let i = 0; i < TRIALS_PER_CONDITION; i++) {
                                tempTrials.push({ id: `${emotion}-${duration}-${i}`, emotion, duration, conditionLabel: duration === 100 ? '短時間(100ms)' : '長時間(1000ms)' });
                            }
                        });
                    });
                    tempTrials = shuffleArray(tempTrials);
                }
                return tempTrials;
            };

            const toggleFullScreen = () => {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }
            };

            const startExperiment = () => {
                if (config.enableFullscreen) {
                    toggleFullScreen(); // 実験開始時にフルスクリーン化 (設定で有効な場合)
                }
                const t = generateTrials(experimentMode);
                setTrials(t);
                setCurrentTrialIndex(0);
                setResults([]);
                setExperimentDate(new Date());
                runTrial(t[0]);
            };

            const runTrial = async (trial) => {
                let actualDur = 0;

                // ITI (空白): 800ms
                if (config.enableITI) {
                    setPhase('iti');
                    await waitForNextPaint(); // 描画待機
                    await waitMs(800);
                }

                // 注視点 (Fixation): 800ms
                setPhase('fixation');
                await waitForNextPaint(); // 描画待機
                await waitMs(800);

                // 刺激呈示 (Stimulus): 100ms(6 frames) or 1000ms
                setPhase('stimulus');
                // DOM書き換え直後にブラウザが描画するのを待ってから計測開始
                const t0 = await waitForNextPaint(); 
                
                if (trial.duration === 100) {
                    // 100ms条件はフレーム数ロック (60Hz想定で6フレーム)
                    await waitFrames(6); 
                } else {
                    // それ以外は時間計測
                    await waitMs(trial.duration);
                }
                
                // 次の描画（マスク）への切り替え直前の時刻
                const t1 = performance.now(); 
                actualDur = t1 - t0;
                setMeasuredDuration(actualDur); // 一時保存

                // マスク (Mask): 500ms
                setPhase('mask');
                await waitForNextPaint(); // 確実にマスクが出たことを確認
                await waitMs(500);

                // 反応 (Response)
                setPhase('response');
            };

            const handleEmotionResponse = (selectedEmotion) => {
                setCurrentResponse({ emotion: selectedEmotion });
                setPhase('confidence');
            };

            const handleConfidenceResponse = (rating) => {
                const trial = trials[currentTrialIndex];
                const trialResult = {
                    ...trial,
                    actualDuration: measuredDuration ? parseFloat(measuredDuration.toFixed(2)) : 0, // 実測値を記録
                    responseEmotion: currentResponse.emotion,
                    isCorrect: currentResponse.emotion === trial.emotion ? 1 : 0,
                    confidence: rating
                };

                const newResults = [...results, trialResult];
                setResults(newResults);

                if (currentTrialIndex < trials.length - 1) {
                    const nextIndex = currentTrialIndex + 1;
                    setCurrentTrialIndex(nextIndex);
                    runTrial(trials[nextIndex]);
                } else {
                    if (document.fullscreenElement) document.exitFullscreen().catch(e=>console.log(e));
                    setPhase('results');
                }
            };

            const handleSaveData = async () => {
                setStatusMsg('保存処理中...');
                const dateStr = formatDate(experimentDate);
                const safeName = participantName.trim() || 'guest';
                const dataToSave = {
                    experimentConfig: config,
                    participant: { name: participantName, age: participantAge, vision: participantVision },
                    mode: experimentMode, date: dateStr, timestamp: new Date().toISOString(), results: results
                };

                const messages = [];
                if (config.saveCSV) {
                    try {
                        const header = "Participant,Age,Vision,Date,Mode,TrialID,TargetDuration_ms,ActualDuration_ms,CorrectEmotion,ResponseEmotion,IsCorrect,Confidence\n";
                        const rows = results.map(r => `${participantName},${participantAge},${participantVision},${dateStr},${experimentMode},${r.id},${r.duration},${r.actualDuration},${r.emotion},${r.responseEmotion},${r.isCorrect},${r.confidence}`).join("\n");
                        const blob = new Blob([header + rows], { type: 'text/csv' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = `exp_data_${safeName}_${experimentMode}_${dateStr}.csv`; a.click();
                        messages.push("✅ CSVダウンロード完了");
                    } catch (e) { messages.push("❌ CSV保存エラー"); }
                }
                if (config.saveFirebase && firebaseUser && window.FirebaseApp) {
                    try {
                        const { getFirestore, collection, addDoc, serverTimestamp } = window.FirebaseApp;
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = window.FirebaseApp.initializeApp(firebaseConfig);
                        const db = getFirestore(app);
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'experiment_results');
                        await addDoc(colRef, { ...dataToSave, serverTimestamp: serverTimestamp() });
                        messages.push("✅ Firebase保存完了");
                    } catch (e) { console.error(e); messages.push(`❌ Firebase保存エラー: ${e.message}`); }
                }
                if (config.saveGAS && config.gasURL) {
                    try {
                        await fetch(config.gasURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dataToSave) });
                        messages.push("✅ GASへ送信完了(no-cors)");
                    } catch (e) { console.error(e); messages.push("❌ GAS送信エラー"); }
                }
                setStatusMsg(messages.join('\n'));
                alert(messages.join('\n'));
            };

            if (phase === 'setup') return <SetupScreen config={config} setConfig={setConfig} onNext={() => setPhase('intro')} />;

            if (phase === 'intro') {
                return (
                    <div className="max-w-2xl mx-auto p-8 bg-white shadow-lg rounded-lg mt-10 relative">
                        <button onClick={() => setPhase('setup')} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition p-2 rounded-full hover:bg-gray-100" title="管理者設定">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        </button>
                        <h1 className="text-2xl font-bold mb-6 text-center">{config.title}</h1>
                        <p className="mb-6 text-center text-gray-600">以下の実験説明を読み、必要事項を入力して実験を開始してください。</p>
                        
                        {/* モード選択 & 被験者情報 (省略せず記述) */}
                        <div className="mb-6 p-4 border border-blue-200 rounded-lg bg-blue-50">
                            <h3 className="font-bold text-blue-800 mb-3 border-b border-blue-200 pb-2">モード選択</h3>
                            <div className="flex gap-6 justify-center">
                                <label className="inline-flex items-center cursor-pointer p-2 rounded hover:bg-blue-100 transition"><input type="radio" name="mode" value="practice" checked={experimentMode === 'practice'} onChange={(e) => setExperimentMode(e.target.value)} className="form-radio h-5 w-5 text-blue-600" /><span className="ml-2 text-gray-800 font-bold">練習試行 (10回)</span></label>
                                <label className="inline-flex items-center cursor-pointer p-2 rounded hover:bg-blue-100 transition"><input type="radio" name="mode" value="main" checked={experimentMode === 'main'} onChange={(e) => setExperimentMode(e.target.value)} className="form-radio h-5 w-5 text-blue-600" /><span className="ml-2 text-gray-800 font-bold">本番試行 (40回)</span></label>
                            </div>
                        </div>
                        <div className="mb-6 p-4 border border-gray-300 rounded-lg bg-gray-50">
                            <h3 className="font-bold text-gray-700 mb-3 border-b border-gray-200 pb-2">被験者情報</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div><label className="block text-gray-700 text-sm font-bold mb-2">被験者名 (ID) <span className="font-normal text-xs">(任意)</span></label><input type="text" value={participantName} onChange={(e) => setParticipantName(e.target.value)} placeholder="例: yamada01" className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" /></div>
                                <div><label className="block text-gray-700 text-sm font-bold mb-2">年齢 <span className="font-normal text-xs">(任意)</span></label><input type="number" value={participantAge} onChange={(e) => setParticipantAge(e.target.value)} placeholder="例: 20" className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" /></div>
                            </div>
                            <div>
                                <span className="block text-gray-700 text-sm font-bold mb-2">視力の状態 <span className="font-normal text-xs">(任意)</span></span>
                                <div className="flex gap-6">
                                    <label className="inline-flex items-center cursor-pointer"><input type="radio" name="vision" value="normal" checked={participantVision === 'normal'} onChange={(e) => setParticipantVision(e.target.value)} className="form-radio h-4 w-4 text-blue-600" /><span className="ml-2 text-gray-700">裸眼 (Normal)</span></label>
                                    <label className="inline-flex items-center cursor-pointer"><input type="radio" name="vision" value="corrected" checked={participantVision === 'corrected'} onChange={(e) => setParticipantVision(e.target.value)} className="form-radio h-4 w-4 text-blue-600" /><span className="ml-2 text-gray-700">矯正 (Corrected)</span></label>
                                </div>
                            </div>
                        </div>
                        <div className="bg-gray-100 p-4 rounded mb-6 text-sm">
                            <h3 className="font-bold mb-2">実験の流れ:</h3>
                            <ol className="list-decimal pl-5 space-y-1">
                                <li>画面中央に「+」が表示されます（注視してください）。</li>
                                <li>顔画像が一瞬（短時間または長時間）表示されます。</li>
                                <li>すぐにマスクが表示され、顔が消えます。</li>
                                <li>どの表情だったか、ボタンで選択してください。</li>
                                <li>その回答にどれくらい自信があるか、4段階で評価してください。</li>
                            </ol>
                        </div>
                        <button onClick={startExperiment} className="w-full font-bold py-3 px-4 rounded transition bg-blue-600 hover:bg-blue-700 text-white">実験を開始する ({experimentMode === 'practice' ? '練習モード' : '本番モード'})</button>
                    </div>
                );
            }

            // 実験画面系: レイヤー切替方式 (visibility制御)
            if (['iti', 'fixation', 'stimulus', 'mask'].includes(phase)) {
                const trial = trials[currentTrialIndex];
                return (
                    <div className="flex flex-col items-center justify-center h-screen cursor-hidden">
                        <div className="canvas-container shadow-sm border-none">
                            {/* ITI (Blank) Layer */}
                            <div className={`stimulus-layer bg-white ${phase === 'iti' ? 'visible' : ''}`} style={{zIndex: 10}}></div>
                            
                            {/* Fixation Layer */}
                            <div className={`stimulus-layer bg-white ${phase === 'fixation' ? 'visible' : ''}`} style={{zIndex: 20}}>
                                <div className="text-4xl text-gray-800">+</div>
                            </div>

                            {/* Stimulus Layer */}
                            <div className={`stimulus-layer bg-white ${phase === 'stimulus' ? 'visible' : ''}`} style={{zIndex: 30}}>
                                <FaceStimulus emotion={trial.emotion} />
                            </div>

                            {/* Mask Layer */}
                            <div className={`stimulus-layer bg-white ${phase === 'mask' ? 'visible' : ''}`} style={{zIndex: 40}}>
                                <PatternMask key={currentTrialIndex} /> {/* keyを指定して試行ごとに再生成 */}
                            </div>
                        </div>
                        <p className="mt-4 text-gray-400 text-xs">Trial {currentTrialIndex + 1} / {trials.length}</p>
                    </div>
                );
            }

            if (phase === 'response') {
                return (
                    <div className="flex flex-col items-center justify-center h-screen">
                        <h2 className="text-xl font-bold mb-6">どの表情でしたか？</h2>
                        <div className="grid grid-cols-2 gap-4">
                            {CONDITIONS.EMOTIONS.map(emo => (
                                <button key={emo} onClick={() => handleEmotionResponse(emo)} className="w-40 h-20 bg-white border-2 border-blue-500 hover:bg-blue-50 text-blue-700 font-semibold rounded-lg shadow transition">{emo}</button>
                            ))}
                        </div>
                    </div>
                );
            }

            if (phase === 'confidence') {
                return (
                    <div className="flex flex-col items-center justify-center h-screen">
                        <h2 className="text-xl font-bold mb-6">その回答にどれくらい自信がありますか？</h2>
                        <div className="flex gap-4">
                            {[1, 2, 3, 4].map(rating => (
                                <button key={rating} onClick={() => handleConfidenceResponse(rating)} className="flex flex-col items-center justify-center w-24 h-24 bg-white border-2 border-indigo-500 hover:bg-indigo-50 rounded-lg shadow transition">
                                    <span className="text-2xl font-bold text-indigo-700">{rating}</span>
                                    <span className="text-xs text-gray-500 mt-1">{rating === 1 ? '自信なし' : rating === 4 ? '確信あり' : ''}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            if (phase === 'results') {
                // ... (results logic same as before) ...
                const summary = {}; const dPrimeData = [];
                [CONDITIONS.DURATION.SHORT, CONDITIONS.DURATION.LONG].forEach(dur => {
                    const durLabel = dur === 100 ? '短時間(100ms)' : '長時間(1000ms)';
                    const trialsInCond = results.filter(r => r.duration === dur);
                    if(trialsInCond.length === 0) { summary[durLabel] = { accuracy: 0, avgConf: 0, count: 0 }; return; }
                    const accuracy = trialsInCond.reduce((acc, cur) => acc + cur.isCorrect, 0) / trialsInCond.length;
                    const avgConf = trialsInCond.reduce((acc, cur) => acc + cur.confidence, 0) / trialsInCond.length;
                    summary[durLabel] = { accuracy, avgConf, count: trialsInCond.length };
                    const target = 'Angry'; const noise = 'Neutral';
                    const signalTrials = trialsInCond.filter(r => r.emotion === target);
                    const noiseTrials = trialsInCond.filter(r => r.emotion === noise);
                    if (signalTrials.length > 0 && noiseTrials.length > 0) {
                        const hits = signalTrials.filter(r => r.responseEmotion === target).length;
                        const fas = noiseTrials.filter(r => r.responseEmotion === target).length; 
                        const hitRate = hits / signalTrials.length; const faRate = fas / noiseTrials.length;
                        dPrimeData.push({ condition: durLabel, target, hitRate: hitRate.toFixed(2), faRate: faRate.toFixed(2), dPrime: (normSInv(hitRate) - normSInv(faRate)).toFixed(2), cBias: (-0.5 * (normSInv(hitRate) + normSInv(faRate)).toFixed(2)) });
                    }
                });

                return (
                    <div className="max-w-4xl mx-auto p-8 bg-white shadow-lg rounded-lg my-10">
                        <div className="flex justify-between items-center mb-6">
                            <div><h1 className="text-2xl font-bold">実験結果</h1><span className="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded mt-1">{experimentMode === 'practice' ? '練習モード (10試行)' : '本番モード (40試行)'}</span></div>
                            <div className="text-sm text-gray-500 text-right"><p>被験者: <span className="font-bold text-gray-800">{participantName}</span></p><p>日時: {experimentDate.toLocaleString()}</p></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                            <div className="bg-blue-50 p-6 rounded-lg"><h3 className="text-lg font-bold mb-4 text-blue-900">条件別成績</h3><table className="w-full text-left"><thead><tr className="border-b border-blue-200"><th className="py-2">条件</th><th className="py-2">正答率</th><th className="py-2">平均確信度</th></tr></thead><tbody>{Object.entries(summary).map(([cond, data]) => (data.count > 0 && (<tr key={cond} className="border-b border-blue-100"><td className="py-2">{cond}</td><td className="py-2 font-bold">{(data.accuracy * 100).toFixed(1)}%</td><td className="py-2">{data.avgConf.toFixed(2)}</td></tr>)))}</tbody></table></div>
                            <div className="bg-green-50 p-6 rounded-lg">
                                <h3 className="text-lg font-bold mb-2 text-green-900">信号検出理論 (Angry/Neutral)</h3>
                                <div className="text-xs text-green-800 bg-white p-2 rounded mb-3 border border-green-200 space-y-1">
                                    <p><strong>d' (感度):</strong> 区別する能力。高いほど優秀。</p>
                                    <ul className="list-disc pl-4 text-gray-600">
                                        <li>0: 区別不可 (当てずっぽう)</li>
                                        <li>1.0: 普通 〜 3.0: 非常に高い</li>
                                    </ul>
                                    <p className="mt-1"><strong>C (バイアス):</strong> 回答の偏り。</p>
                                    <ul className="list-disc pl-4 text-gray-600">
                                        <li>正 (+): 慎重 (確信がないとNoと言う)</li>
                                        <li>0: 中立</li>
                                        <li>負 (-): 積極的 (迷ったらYesと言う)</li>
                                    </ul>
                                </div>
                                <table className="w-full text-left text-sm"><thead><tr className="border-b border-green-200"><th className="py-2">条件</th><th className="py-2">d' (感度)</th><th className="py-2">C (バイアス)</th></tr></thead><tbody>{dPrimeData.map((d, i) => (<tr key={i} className="border-b border-green-100"><td className="py-2">{d.condition}</td><td className="py-2 font-bold">{d.dPrime}</td><td className="py-2">{d.cBias}</td></tr>))}</tbody></table>
                            </div>
                        </div>
                        <div className="text-center bg-gray-50 p-6 rounded border border-gray-200">
                            <h3 className="font-bold text-gray-700 mb-4">データ保存オプション</h3>
                            <div className="flex flex-wrap justify-center gap-4"><button onClick={handleSaveData} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded shadow">全データ保存を実行</button></div>
                            <div className="mt-4 text-left text-sm text-gray-600 max-w-md mx-auto"><p><strong>現在の設定:</strong></p><ul className="list-disc pl-5"><li>CSV: {config.saveCSV ? 'ON' : 'OFF'}</li><li>Firebase: {config.saveFirebase ? (firebaseUser ? 'Ready' : 'Enabled/Pending') : 'OFF'}</li><li>GAS: {config.saveGAS ? 'ON' : 'OFF'}</li></ul>{statusMsg && <pre className="mt-2 bg-black text-white p-2 rounded whitespace-pre-wrap">{statusMsg}</pre>}</div>
                        </div>
                        <div className="text-center mt-6"><button onClick={() => window.location.reload()} className="text-blue-600 hover:underline">最初に戻る (リロード)</button></div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
