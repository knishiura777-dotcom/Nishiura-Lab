<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>表情認知実験 stable noCDN</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#182033;--muted:#667085;--line:#d8dee9;--brand:#4f46e5;--brand2:#0f766e;--danger:#dc2626;--ok:#059669;--warn:#d97706;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.6} button,input,select,textarea{font:inherit} button{cursor:pointer} .wrap{max-width:980px;margin:0 auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.08);padding:28px}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.title{font-size:clamp(26px,4vw,42px);line-height:1.1;margin:0 0 10px;font-weight:850}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;text-align:left}.field label{font-weight:700;font-size:13px;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12)}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:#e5e7eb;color:#111827;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.primary{background:var(--brand);color:#fff}.btn.dark{background:#111827;color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#344054}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800}.note{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;color:#475467}.hidden{display:none!important}.muted{color:var(--muted)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--brand);width:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{background:#f8fafc;color:#475467;font-size:12px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.stat b{display:block;font-size:28px}.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:720px){.g2,.g3{grid-template-columns:1fr}.card{padding:20px}.wrap{padding:14px}.center{padding:14px}.row{align-items:stretch}.btn{width:100%}}

.stage{height:360px;display:flex;align-items:center;justify-content:center;background:white;border:1px solid var(--line);border-radius:20px;margin:18px 0}.face svg{width:210px;height:210px}.fix{font-size:70px;font-weight:300}.mask{width:220px;height:220px;background:repeating-linear-gradient(37deg,#111 0 6px,#ddd 6px 13px,#fff 13px 19px);border-radius:12px}.respgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:720px){.respgrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="app"></div><script>
const EMOTIONS=['Happy','Angry','Sad','Neutral']; let config={saveCSV:true,saveGAS:false,gasURL:localStorage.getItem('face_gas_url')||'',trialsPerCondition:5,short:100,long:1000,iti:600}; let s={phase:'intro',mode:'practice',name:'',age:'',vision:'normal',trials:[],i:0,results:[],current:null,stimStart:0,actual:0,response:null,status:''};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); function set(p){s={...s,...p};render();}
function faceSvg(e){let mouth=e==='Happy'?'<path d="M60 130 Q100 170 140 130" fill="none" stroke="#111" stroke-width="5"/>':e==='Neutral'?'<line x1="60" y1="140" x2="140" y2="140" stroke="#111" stroke-width="5"/>':'<path d="M60 152 Q100 120 140 152" fill="none" stroke="#111" stroke-width="5"/>';let brow=e==='Angry'?'<line x1="58" y1="63" x2="88" y2="76" stroke="#111" stroke-width="5"/><line x1="142" y1="63" x2="112" y2="76" stroke="#111" stroke-width="5"/>':e==='Sad'?'<line x1="58" y1="75" x2="88" y2="62" stroke="#111" stroke-width="4"/><line x1="142" y1="75" x2="112" y2="62" stroke="#111" stroke-width="4"/>':'';return `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="82" fill="#ffcc80" stroke="#111" stroke-width="4"/><circle cx="70" cy="85" r="8"/><circle cx="130" cy="85" r="8"/>${brow}${mouth}</svg>`}
function intro(){return `<div class="center"><div class="card" style="max-width:800px;width:100%"><div class="topbar"><div><h1 class="title">表情認知実験プログラム</h1><p class="sub">提示時間が表情認知の正確性と確信度に与える影響を測定します。</p></div><button class="btn ghost" onclick="set({phase:'settings'})">設定</button></div><div class="grid g2"><div class="field"><label>被験者ID（任意）</label><input id="name" value="${esc(s.name)}" placeholder="sub001"></div><div class="field"><label>年齢（任意）</label><input id="age" type="number" value="${esc(s.age)}"></div><div class="field"><label>視力</label><select id="vision"><option value="normal" ${s.vision==='normal'?'selected':''}>裸眼・通常</option><option value="corrected" ${s.vision==='corrected'?'selected':''}>矯正</option></select></div><div class="field"><label>モード</label><select id="mode"><option value="practice" ${s.mode==='practice'?'selected':''}>練習10試行</option><option value="main" ${s.mode==='main'?'selected':''}>本番40試行</option></select></div></div><div class="note" style="margin-top:18px"><b>流れ：</b>注視点 → 顔刺激 → マスク → 表情回答 → 確信度回答</div><div class="footer-actions"><button class="btn primary" onclick="start()">実験を開始する</button></div></div></div>`}
function settings(){return `<div class="center"><div class="card" style="max-width:820px;width:100%"><h1 class="title">実験設定</h1><div class="grid g2"><div class="field"><label>短時間提示(ms)</label><input id="short" type="number" value="${config.short}"></div><div class="field"><label>長時間提示(ms)</label><input id="long" type="number" value="${config.long}"></div><div class="field"><label>各条件試行数</label><input id="tpc" type="number" value="${config.trialsPerCondition}"></div><div class="field"><label>GAS URL</label><input id="gas" value="${esc(config.gasURL)}" placeholder="https://script.google.com/macros/s/.../exec"></div></div><div class="note" style="margin-top:18px"><label><input id="csv" type="checkbox" ${config.saveCSV?'checked':''}> CSVを保存可能にする</label><br><label><input id="gascheck" type="checkbox" ${config.saveGAS?'checked':''}> GAS送信ボタンを有効にする</label></div><div class="footer-actions"><button class="btn primary" onclick="saveSettings()">保存して戻る</button><button class="btn ghost" onclick="set({phase:'intro'})">戻る</button></div></div></div>`}
function running(){let content=''; if(s.phase==='iti') content=''; if(s.phase==='fixation') content='<div class="fix">+</div>'; if(s.phase==='stimulus') content=`<div class="face">${faceSvg(s.current.emotion)}</div>`; if(s.phase==='mask') content='<div class="mask"></div>'; return `<div class="center"><div class="card" style="max-width:680px;width:100%;text-align:center"><span class="pill">Trial ${s.i+1} / ${s.trials.length}</span><div class="stage">${content}</div><p class="muted">画面中央を見てください</p></div></div>`}
function response(){return `<div class="center"><div class="card" style="max-width:760px;width:100%;text-align:center"><h1 class="title">どの表情でしたか？</h1><div class="respgrid">${EMOTIONS.map(e=>`<button class="btn ghost" onclick="answerEmotion('${e}')">${e}</button>`).join('')}</div></div></div>`}
function confidence(){return `<div class="center"><div class="card" style="max-width:700px;width:100%;text-align:center"><h1 class="title">回答への自信</h1><div class="grid g4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">${[1,2,3,4].map(n=>`<button class="btn ghost" onclick="answerConfidence(${n})"><b style="font-size:26px">${n}</b><br>${n===1?'低い':n===4?'高い':''}</button>`).join('')}</div></div></div>`}
function results(){const acc=s.results.length?Math.round(s.results.filter(r=>r.isCorrect).length/s.results.length*1000)/10:0; const short=s.results.filter(r=>r.duration===config.short); const long=s.results.filter(r=>r.duration===config.long); const avg=a=>a.length?Math.round(a.filter(r=>r.isCorrect).length/a.length*1000)/10:0; return `<div class="center"><div class="card" style="max-width:900px;width:100%"><h1 class="title">実験終了</h1><div class="grid g3"><div class="stat"><span>全体正答率</span><b>${acc}%</b></div><div class="stat"><span>短時間</span><b>${avg(short)}%</b></div><div class="stat"><span>長時間</span><b>${avg(long)}%</b></div></div><div class="footer-actions"><button class="btn ok" onclick="downloadCsv()">CSVダウンロード</button><button class="btn ghost" onclick="copyCsv()">コピー</button>${config.saveGAS?'<button class="btn warn" onclick="sendGas()">GASへ送信</button>':''}<button class="btn dark" onclick="set({phase:'intro',results:[]})">最初へ戻る</button></div><p id="status" class="muted">${esc(s.status)}</p></div></div>`}
function render(){document.getElementById('app').innerHTML=s.phase==='intro'?intro():s.phase==='settings'?settings():['iti','fixation','stimulus','mask'].includes(s.phase)?running():s.phase==='response'?response():s.phase==='confidence'?confidence():results(); if(s.phase==='intro') ['name','age','vision','mode'].forEach(id=>{let el=document.getElementById(id); if(el)el.oninput=()=>{s[id]=el.value}})}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildTrials(){if(s.mode==='practice')return shuffle(Array.from({length:10},(_,i)=>{let e=EMOTIONS[Math.floor(Math.random()*EMOTIONS.length)], d=Math.random()>.5?config.short:config.long;return{id:'p'+i,emotion:e,duration:d}}));let out=[];for(const e of EMOTIONS)for(const d of [config.short,config.long])for(let i=0;i<config.trialsPerCondition;i++)out.push({id:`${e}-${d}-${i}`,emotion:e,duration:d});return shuffle(out)}
async function wait(ms){return new Promise(r=>setTimeout(r,ms))} async function start(){s.trials=buildTrials();s.i=0;s.results=[];render();runTrial()}
async function runTrial(){s.current=s.trials[s.i]; set({phase:'iti'}); await wait(config.iti); set({phase:'fixation'}); await wait(700); set({phase:'stimulus'}); const t0=performance.now(); await wait(s.current.duration); s.actual=performance.now()-t0; set({phase:'mask'}); await wait(450); set({phase:'response'})}
function answerEmotion(e){s.response=e;set({phase:'confidence'})} function answerConfidence(c){const tr=s.current; s.results.push({participant:s.name||'guest',age:s.age,vision:s.vision,mode:s.mode,trialId:tr.id,duration:tr.duration,actualDuration:Math.round(s.actual*100)/100,emotion:tr.emotion,responseEmotion:s.response,isCorrect:s.response===tr.emotion?1:0,confidence:c}); if(s.i<s.trials.length-1){s.i++;runTrial()}else set({phase:'results'})}
function csv(){
  const h=['Participant','Age','Vision','Mode','TrialID','TargetDuration_ms','ActualDuration_ms','CorrectEmotion','ResponseEmotion','IsCorrect','Confidence'];
  const rows=s.results.map(r=>[r.participant,r.age,r.vision,r.mode,r.trialId,r.duration,r.actualDuration,r.emotion,r.responseEmotion,r.isCorrect,r.confidence].map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(','));
  return '\ufeff'+h.join(',')+'\n'+rows.join('\n');
}
function downloadCsv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv;charset=utf-8;'}));a.download=`face_results_${s.name||'guest'}.csv`;a.click();URL.revokeObjectURL(a.href)} async function copyCsv(){await navigator.clipboard.writeText(csv()).catch(()=>{});document.getElementById('status').textContent='コピーしました'}
async function sendGas(){if(!config.gasURL){alert('GAS URLが未設定です');return};try{await fetch(config.gasURL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({timestamp:new Date().toISOString(),participant:{name:s.name,age:s.age,vision:s.vision},mode:s.mode,results:s.results})});document.getElementById('status').textContent='送信しました'}catch(e){alert(e.message)}}
function saveSettings(){config.short=parseInt(document.getElementById('short').value)||100;config.long=parseInt(document.getElementById('long').value)||1000;config.trialsPerCondition=parseInt(document.getElementById('tpc').value)||5;config.gasURL=document.getElementById('gas').value.trim();config.saveCSV=document.getElementById('csv').checked;config.saveGAS=document.getElementById('gascheck').checked;localStorage.setItem('face_gas_url',config.gasURL);set({phase:'intro'})} render();
</script></body></html>
